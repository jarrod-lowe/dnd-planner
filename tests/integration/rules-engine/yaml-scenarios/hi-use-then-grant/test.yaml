name: 'Heroic Inspiration - Use Then Grant Same Turn'
description: 'Add use-hi first (errors), then grant-hi clears the error'
ruleGroups:
  - dnd-5e-2024/core-events
  - dnd-5e-2024/heroic-inspiration
steps:
  # No HI initially
  - evaluate:
      assert:
        facts:
          heroicInspiration.remaining: 0
        offers:
          illegal:
            - use-hi
  # Add use-hi — should have errors (no HI)
  - addOffer:
      id: use-hi
      assert:
        facts:
          heroicInspiration.remaining: 0
        offers:
          illegal:
            - use-hi
        planErrors:
          - id: use-hi
            index: 0
            errors:
              - rule.dnd-5e-2024.heroic-inspiration.use-hi-offer.no_inspiration
  # Grant HI — should clear use-hi errors
  - addOffer:
      id: grant-hi
      assert:
        facts:
          heroicInspiration.remaining: 0
        planErrors:
          - id: use-hi
            index: 0
            errors: []
          - id: grant-hi
            index: 0
            errors: []
