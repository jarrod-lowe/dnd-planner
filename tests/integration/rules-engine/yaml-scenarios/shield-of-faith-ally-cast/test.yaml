name: 'Shield of Faith Ally Cast'
description: 'Casting Shield of Faith on an ally spends the bonus action, spellcasting, concentration, and a spell slot, but grants no self AC — the +2 lives on the ally (untracked)'
ruleGroups:
  - dnd-5e-2024/prepared-spells
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/concentration
  - dnd-5e-2024/core-events
  - dnd-5e-2024/ac
  - class-paladin/class-paladin-level1
  - spells/spell-shield-of-faith
steps:
  - evaluate:
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: shield-of-faith
            level: 1
            nameKey: rule.spell-shield-of-faith.offer-shield-of-faith.name
            preparedFact: spell.l1.shieldOfFaith.prepared
            alwaysPreparedFact: spell.l1.shieldOfFaith.alwaysPrepared
  - evaluate:
      assert:
        facts:
          ac.value: 10
  # Cast with the target control set to ally (0).
  - addOffer:
      id: cast-shield-of-faith
      selections:
        target: 0
      assert:
        facts:
          bonusActions.remaining: 0
          spellcasting.remaining: 0
          concentration.remaining: 0
          spellcasting.slots.level1.remaining: 1
          # No ac.miscBonus: the ward is on the ally, so self AC is unchanged.
          ac.value: 10
  - endTurn:
      assert:
        effects:
          exists:
            - effect-shield-of-faith
        facts:
          # The concentration-holding ward persists; self AC stays flat.
          ac.value: 10
          concentration.remaining: 0
