name: 'Demon Grinder - Fuel And Boost Are Helm-Gated, Boost Needs A Soul Coin'
description: >-
  The fuel and boost records are the HELM's to set: the offers are
  structurally gated on the acquire AND the helm seat (`when` — nobody at
  the Helm, no offers), but the RECORDS themselves are vehicle state no seat
  change touches. Boost carries the stat block's own second leg — a boost
  only burns while the machine runs on a SOUL COIN — illegal-but-COMMITTABLE
  like every leg: the row still records, the derived speed projecting the
  bonus the rules would not have allowed.
ruleGroups:
  - vehicles/demon-grinder
  - dnd-5e-2024/action-economy
steps:
  - addOffer:
      id: acquire-demon-grinder
  - addOffer:
      id: take-demon-grinder-helm-seat
  - addOffer:
      id: set-demon-grinder-fuel
      selections:
        fuel: 1
  - endTurn:
      assert:
        facts:
          companion.demonGrinder.seats.helm: 1
          companion.demonGrinder.fuel.current: 1
  # A fresh turn, the bonus back: the boost lands beside the soul coin.
  - addOffer:
      id: set-demon-grinder-boost
      selections:
        boost: 1
      assert:
        facts:
          companion.demonGrinder.boost.current: 1
          companion.demonGrinder.speed.effective: 130
        planErrors:
          - id: set-demon-grinder-boost
            index: 0
            errors: []
  - endTurn:
      assert:
        facts:
          companion.demonGrinder.boost.current: 1
          companion.demonGrinder.speed.effective: 130
  # Leaving the Helm: both offers go with the seat, the state stays.
  - addOffer:
      id: leave-demon-grinder-helm-seat
      assert:
        facts:
          companion.demonGrinder.fuel.current: 1
          companion.demonGrinder.boost.current: 1
          companion.demonGrinder.speed.effective: 130
        offers:
          notExists:
            - set-demon-grinder-fuel
            - set-demon-grinder-boost
  - endTurn:
      assert:
        facts:
          companion.demonGrinder.fuel.recorded: 1
          companion.demonGrinder.boost.recorded: 1
          companion.demonGrinder.speed.effective: 130
  # Re-taking the Helm: the offers return, pre-showing the CURRENT fuel and
  # boost (the capture defaults read the derived currents).
  - addOffer:
      id: take-demon-grinder-helm-seat
  - evaluate:
      assert:
        offers:
          exists:
            - set-demon-grinder-fuel
            - set-demon-grinder-boost
        offerVars:
          - id: set-demon-grinder-fuel
            vars:
              fuel:
                capture: true
                default:
                  fact: companion.demonGrinder.fuel.current
          - id: set-demon-grinder-boost
            vars:
              boost:
                capture: true
                default:
                  fact: companion.demonGrinder.boost.current
  # Drop the fuel to NONE (committed here so the bonus reopens): an unfuelled
  # machine cannot boost — the row is ILLEGAL-but-COMMITTABLE, and the record
  # still lands (the projection shows the over-commit).
  - addOffer:
      id: set-demon-grinder-fuel
      selections:
        fuel: 0
  - endTurn:
      assert:
        facts:
          companion.demonGrinder.fuel.current: 0
          companion.demonGrinder.boost.current: 1
          companion.demonGrinder.speed.effective: 30
  - evaluate:
      assert:
        offers:
          illegal:
            - set-demon-grinder-boost
  # The override path: the row still commits — the boost record lands beside
  # the standing one (keyed replacement), and the derived speed projects the
  # 30 ft. the rules would not have allowed.
  - addOffer:
      id: set-demon-grinder-boost
      selections:
        boost: 1
      assert:
        facts:
          companion.demonGrinder.fuel.recorded: 0
          companion.demonGrinder.boost.recorded: 1
          companion.demonGrinder.speed.effective: 30
        planErrors:
          - id: set-demon-grinder-boost
            index: 0
            errors:
              - rule.demon-grinder.boost.without_soul_coin
