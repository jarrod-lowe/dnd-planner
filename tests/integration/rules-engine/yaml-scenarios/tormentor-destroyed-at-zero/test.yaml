name: 'Tormentor (Damage Control) - Destroyed At Zero HP'
description: >-
  When recorded damage brings hp.current to exactly 0, the damage apply ALSO
  advertises a permanent keyed effect writing destroyed = 1 (the steed
  lethal-check placement, but NO auto-abandon: the acquire effect persists so the
  wreck stays inspectable and the crew can abandon). A NOTICE gated on the
  destroyed fact carries the state. A long rest ages out the untilLongRest HP
  records (the pool reads full again) but the destroyed wreck is PERMANENT —
  only re-acquiring clears it.
ruleGroups:
  - vehicles/tormentor
steps:
  - addOffer:
      id: acquire-tormentor
  # Exactly 0: destroyed lands beside the damage record, the acquire persists.
  - addOffer:
      id: record-tormentor-damage
      selections:
        amount: 60
      assert:
        facts:
          companion.tormentor.hp.current: 0
          companion.tormentor.destroyed: 1
          companion.tormentor.active: 1
        annotations:
          exists:
            - rule.tormentor.destroyed-notice
          targets:
            - key: rule.tormentor.destroyed-notice
              targets: [notice]
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-acquire
            - effect-tormentor-hp-damage
            - effect-tormentor-destroyed
        facts:
          companion.tormentor.destroyed: 1
  # Long rest: the HP records age out (the pool reads full again) but the
  # destroyed wreck is permanent, notice standing — a rest does not un-burn a
  # war machine.
  - endTurn:
      longRest: true
      assert:
        effects:
          exists:
            - effect-tormentor-acquire
            - effect-tormentor-destroyed
          notExists:
            - effect-tormentor-hp-damage
        facts:
          companion.tormentor.hp.current: 60
          companion.tormentor.destroyed: 1
        annotations:
          exists:
            - rule.tormentor.destroyed-notice
