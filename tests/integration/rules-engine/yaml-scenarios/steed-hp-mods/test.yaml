name: 'Steed HP Modifications'
description: 'Steed can record damage and healing, modifying companion.steed.hp.current with persistent effects'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-find-steed
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
  - addOffer:
      id: prepare-find-steed
  # Verify Find Steed is available
  - evaluate:
      assert:
        offers:
          exists:
            - cast-find-steed
  # Cast Find Steed
  - addOffer:
      id: cast-find-steed
  - endTurn:
      assert:
        facts:
          companion.steed.hp.max: 25
          companion.steed.hp.current: 25
  # Next turn: damage and heal offers available
  - evaluate:
      assert:
        offers:
          exists:
            - steed-record-damage
            - steed-record-heal
  # Record 10 damage
  - addOffer:
      id: steed-record-damage
      selections:
        amount: 10
      assert:
        facts:
          companion.steed.hp.current: 15
  # Record 5 healing
  - addOffer:
      id: steed-record-heal
      selections:
        amount: 5
      assert:
        facts:
          companion.steed.hp.current: 20
  # End turn: HP mods persist
  - endTurn:
      assert:
        facts:
          companion.steed.hp.max: 25
          companion.steed.hp.current: 20
