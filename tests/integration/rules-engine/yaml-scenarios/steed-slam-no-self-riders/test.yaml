name: 'Steed Slam - Self-Only Riders Do Not Reach the Steed'
description: >-
  Divine Smite, Thunderous Smite and Savage Attacker all trigger on a hit YOU
  make, so the steed's Otherworldly Slam must neither enable them (the engine
  half) nor advertise them (the view half). The slam advertises no
  attack.last.melee / attack.last.weapon, so all three stay illegal after a slam;
  and its panel carries only `.companion`-scoped labels, so when the paladin's
  OWN melee attack does light the reminders up, they target the bare
  attack.melee / attack.unarmed the steed's panel does not carry.
ruleGroups:
  - dnd-5e-2024/prepared-spells
  - species-human/species-human
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/feat-savage-attacker
  - class-paladin/class-paladin-level1
  - class-paladin/class-paladin-level2
  - class-paladin/class-paladin-level3
  - class-paladin/class-paladin-level4
  - class-paladin/class-paladin-level5
  - class-paladin/class-paladin-paladin-find-steed
  - class-paladin/class-paladin-paladin-smite
  - spells/spell-find-steed
  - spells/spell-divine-smite
  - spells/spell-thunderous-smite
steps:
  - evaluate: {}
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: thunderous-smite
            level: 1
            nameKey: rule.spell-thunderous-smite.offer-thunderous-smite.name
            preparedFact: spell.l1.thunderousSmite.prepared
            alwaysPreparedFact: spell.l1.thunderousSmite.alwaysPrepared
  # Free Faithful Steed cast (level 0), so no slot is spent and both smites keep
  # a full cascade to draw on below.
  - addOffer:
      id: cast-find-steed
      selections:
        slotLevel: 0
  - endTurn: {}
  # Fresh turn: the steed is out and the paladin has not attacked yet.
  - evaluate:
      assert:
        facts:
          companion.steed.summoned: 1
          attack.last.melee: 0
          attack.last.weapon: 0
        offers:
          exists:
            - steed-slam
        # Every label on the steed's attack panel is `.companion`-scoped. This is
        # the whole guard: the UI matches panel labels against annotation targets
        # by plain string intersection, with no notion of whose panel it is.
        offerUi:
          - id: steed-slam
            ui:
              annotationLabels:
                - attack.any.companion
                - attack.melee.companion
                - dice.any.companion
          - id: steed-slam-reaction
            ui:
              annotationLabels:
                - attack.any.companion
                - attack.melee.companion
                - dice.any.companion
  # The steed slams. This must not arm any of the paladin's own riders.
  - addOffer:
      id: steed-slam
      assert:
        facts:
          companion.steed.actions.remaining: 0
          # The slam is the STEED's melee attack, not the paladin's.
          attack.last.melee: 0
          attack.last.weapon: 0
        offers:
          illegal:
            - cast-divine-smite
            - cast-thunderous-smite
            - savage-attacker-use
        annotations:
          notExists:
            - rule.spell-divine-smite.annotation
            - rule.spell-thunderous-smite.annotation
            - rule.dnd-5e-2024.feat-savage-attacker.annotation
  # Now the paladin swings for themselves. The riders arm, as they should — and
  # the targets they arm on are the bare labels, which the steed panel above does
  # not carry. Before the labels were scoped, `attack.melee` sat on both sides of
  # this pair and the smite reminders rendered on the steed's slam panel.
  - addOffer:
      id: unarmed-strike-use-action
      assert:
        facts:
          attack.last.melee: 1
        offers:
          legal:
            - cast-divine-smite
            - cast-thunderous-smite
        annotations:
          exists:
            - rule.spell-divine-smite.annotation
            - rule.spell-thunderous-smite.annotation
          targets:
            - key: rule.spell-divine-smite.annotation
              targets:
                - attack.melee
                - attack.unarmed
            - key: rule.spell-thunderous-smite.annotation
              targets:
                - attack.melee
                - attack.unarmed
