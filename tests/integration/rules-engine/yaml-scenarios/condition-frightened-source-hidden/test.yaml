name: 'Condition Frightened - Source Hidden'
description: >-
  The out-of-sight SEED: with the source of fear marked hidden, the keyed
  frightened.sourceHidden fact reads 1 — the value newly added rows CAPTURE as
  their per-row sight state (capture-at-add), and the value the dice-line
  chip's tap writes through the follow-up channel. The shared flags stay 0 in
  every Frightened state (the chip carries the disadvantage per row). The
  standing notice stays (can't-approach is sight-independent) and flips to its
  hidden body, and the LoS toggle annotation persists so chips render to flip
  back. The attribution chip PERSISTS unchanged: a single standing-qualified
  sentence, never a seed-flipped variant — rows capture their own sight value
  while the seed feeds forward, and a flipped key would contradict rows whose
  capture differs from the seed (the per-row truth stays the LoS chip's job).
  Seeded as committed effects; the chip's tap path is unit-pinned.
ruleGroups:
  - dnd-5e-2024/condition-frightened
initialEffects:
  # Real committed translations in tests/integration/rules-engine/initial-effects.ts.
  - id: effect-frightened
  - id: effect-frightened-source-hidden
steps:
  - evaluate:
      assert:
        facts:
          condition.frightened: 1
          frightened.sourceHidden: 1
          attack.str.disadvantage: 0
          attack.dex.disadvantage: 0
          initiative.disadvantage: 0
          check.disadvantage: 0
          skill.athletics.disadvantage: 0
          skill.stealth.disadvantage: 0
          skill.perception.disadvantage: 0
        annotations:
          exists:
            - rule.dnd-5e-2024.condition-frightened.notice
            - rule.dnd-5e-2024.condition-frightened.los
            - rule.dnd-5e-2024.condition-frightened.disadvantage
          notExists:
            - rule.dnd-5e-2024.condition-frightened.disadvantage-hidden
          targets:
            - key: rule.dnd-5e-2024.condition-frightened.los
              targets: [attack.any, dice.any]
            - key: rule.dnd-5e-2024.condition-frightened.disadvantage
              targets: [attack.any, check.any]
          riders:
            - key: rule.dnd-5e-2024.condition-frightened.disadvantage
              rider:
                label: rule.dnd-5e-2024.condition-frightened.rider
                type: modifier
          toggles:
            - key: rule.dnd-5e-2024.condition-frightened.los
              toggle:
                fact: frightened.sourceHidden
                onWhen: 0
                appliesTo: [to-hit, check]
