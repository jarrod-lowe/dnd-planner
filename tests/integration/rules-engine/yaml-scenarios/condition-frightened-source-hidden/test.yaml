name: 'Condition Frightened - Source Hidden'
description: >-
  FLAGS OFF MEANS OFF (user-directed 2026-09-25): the SRD scopes the ENTIRE
  disadvantage clause to "while the source of fear is within line of sight",
  and source-hidden is the common mid-fight state — so marking the source out
  of sight zeroes the flags, not merely some of them. v2 (user-directed
  2026-09-29): the toggle is COMMITTED directly (the dice-line chip's tap goes
  through the store's follow-up channel — a keyed effect writing
  frightened.sourceHidden, key 'frightened-source' DISTINCT from the
  condition's 'frightened'); the yaml grammar has no commit step, so the
  scenario seeds exactly that committed set (see INITIAL_EFFECTS) and asserts
  the derives against it. The notice STILL stands (the can't-approach channel
  survives sight), its body flipping to the hidden variant (pinned in
  condition-frightened-notice.test.ts — yaml cannot assert bodies).
ruleGroups:
  - dnd-5e-2024/condition-frightened
steps:
  - evaluate:
      assert:
        facts:
          condition.frightened: 1
          frightened.sourceHidden: 1
          # Flags off is OFF — no Disadvantage anywhere from Frightened.
          attack.str.disadvantage: 0
          attack.dex.disadvantage: 0
          initiative.disadvantage: 0
          check.disadvantage: 0
          skill.athletics.disadvantage: 0
          skill.stealth.disadvantage: 0
          skill.perception.disadvantage: 0
        effects:
          exists:
            - effect-frightened
            - frightened-source-hidden
        # The notice stands on the can't-approach channel while hidden, and the
        # strip shows the LoS state as the toggle effect's own chip.
        annotations:
          exists:
            - rule.dnd-5e-2024.condition-frightened.notice
          targets:
            - key: rule.dnd-5e-2024.condition-frightened.notice
              targets: [notice, dice.any]
