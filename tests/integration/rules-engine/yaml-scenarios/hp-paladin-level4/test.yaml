name: 'HP from paladin level 4'
description: 'HP calculated from paladin levels 1-4 using d10 max at level 1 and average d10 at levels 2-4'
ruleGroups:
  - dnd-5e-2024/hp
  - dnd-5e-2024/ability-scores
  - class-paladin/class-paladin-level1
  - class-paladin/class-paladin-level2
  - class-paladin/class-paladin-level3
  - class-paladin/class-paladin-level4
steps:
  # Without CON set: 10 (L1) + 6 (L2) + 6 (L3) + 6 (L4) = 28
  - evaluate:
      assert:
        facts:
          hp.max: 28
          hp.current: 28

  # CON set after class levels are present:
  # level 1 uses current CON, levels 2-4 keep captured CON-at-level (0)
  - addOffer:
      id: set-constitution
      selections:
        score: 16
      assert:
        facts:
          con.modifier: 3
          hp.max: 31
          hp.current: 31
