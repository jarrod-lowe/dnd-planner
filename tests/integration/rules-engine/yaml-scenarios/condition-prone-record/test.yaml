name: 'Condition Prone - Record'
description: >-
  Recording being knocked Prone commits a keyed effect setting condition.prone
  plus the STR/DEX attack-roll disadvantage flags (the weapon and unarmed
  dice-lines already read those facts, so the rollers default to disadvantage
  with zero roller changes), and a NOTICE carries the condition's standing
  effects while it is live. The recorder models BEING KNOCKED prone, so it is
  free and ungated (dropping prone voluntarily is unmodelled), and any rest
  clears it (untilShortRest covers both rest kinds; see
  condition-prone-rest-clears).
ruleGroups:
  - dnd-5e-2024/condition-prone
steps:
  - evaluate:
      assert:
        facts:
          condition.prone: 0
        offers:
          exists:
            - record-prone
        annotations:
          notExists:
            - rule.dnd-5e-2024.condition-prone.notice
  - addOffer:
      id: record-prone
      assert:
        facts:
          condition.prone: 1
          attack.str.disadvantage: 1
          attack.dex.disadvantage: 1
        annotations:
          exists:
            - rule.dnd-5e-2024.condition-prone.notice
          targets:
            - key: rule.dnd-5e-2024.condition-prone.notice
              targets: [notice]
