name: 'Tormentor - Helm Dash Tracks No Per-Encounter Counter (the Rule Text Informs)'
description: >-
  The app has no encounter tracking: it cannot know where the player sits in
  the stat block's fine print (3 Dashes plus the vehicle's Constitution
  modifier each encounter), so it counts NOTHING — no dashes.taken record, no
  dashes.allowance derive, no chip. What the row carries instead is the WHOLE
  rule as an unconditional informational note (the player counts at the
  table): every planned Dash row, the first included and across turns, shows
  the risk note, and no dash fact or effect ever appears. The bonus-action
  economy and the doubling are unchanged, and abandon still clears the
  dashed/movement state with the acquire.
ruleGroups:
  - vehicles/tormentor
  - dnd-5e-2024/action-economy
steps:
  - addOffer:
      id: acquire-tormentor
  - addOffer:
      id: take-tormentor-helm-seat
  - endTurn: {}
  # No counter facts stand on a fresh vehicle — the allowance derive is gone
  # with the count.
  - evaluate:
      assert:
        facts:
          companion.tormentor.dashes.taken: 0
          companion.tormentor.dashes.allowance: 0
  # The FIRST Dash carries the note (unconditional — there is no count to be
  # within), spends the bonus action, doubles the pool, and writes NOTHING
  # durable beside the spend.
  - addOffer:
      id: dash-tormentor
      assert:
        facts:
          companion.tormentor.dashes.taken: 0
          companion.tormentor.movement.total: 200
        planErrors:
          - id: dash-tormentor
            index: 0
            errors:
              - rule.tormentor.dash.risk
        status:
          legal: true
  # The override path (the bonus action spent): the row still executes,
  # error and note together.
  - addOffer:
      id: dash-tormentor
      assert:
        facts:
          companion.tormentor.dashes.taken: 0
        planErrors:
          - id: dash-tormentor
            index: 1
            errors:
              - rule.tormentor.dash.no_bonus_action
              - rule.tormentor.dash.risk
  # End of turn: the spends and the doubling age away; NO count record
  # persists (there is nothing to persist).
  - endTurn:
      assert:
        effects:
          notExists:
            - effect-tormentor-dash-count
        facts:
          bonusActions.remaining: 1
          companion.tormentor.movement.total: 100
          companion.tormentor.movement.remaining: 100
          companion.tormentor.dashes.taken: 0
  # Turn 2: a fresh, LEGAL Dash — the note rides it exactly as it did the
  # first (nothing accumulates across turns).
  - addOffer:
      id: dash-tormentor
      assert:
        facts:
          companion.tormentor.dashes.taken: 0
        planErrors:
          - id: dash-tormentor
            index: 0
            errors:
              - rule.tormentor.dash.risk
        status:
          legal: true
  - endTurn: {}
  # Abandon: the acquire lifecycle still clears the vehicle's state — no
  # dash-count eviction exists to advertise (none was ever written), and the
  # movement economy settles to nothing with the acquire gone.
  - addOffer:
      id: abandon-tormentor
      assert:
        effects:
          notExists:
            - evict-tormentor-dash-count
  - endTurn:
      assert:
        effects:
          notExists:
            - effect-tormentor-dash-count
        facts:
          companion.tormentor.movement.total: 0
          companion.tormentor.dashes.taken: 0
  # A re-acquired vehicle starts fresh — which now means simply that the
  # next Dash carries the note and nothing else.
  - addOffer:
      id: acquire-tormentor
  - addOffer:
      id: take-tormentor-helm-seat
  - endTurn:
      assert:
        facts:
          companion.tormentor.dashes.taken: 0
          companion.tormentor.dashes.allowance: 0
  - addOffer:
      id: dash-tormentor
      assert:
        facts:
          companion.tormentor.dashes.taken: 0
        planErrors:
          - id: dash-tormentor
            index: 0
            errors:
              - rule.tormentor.dash.risk
        status:
          legal: true
