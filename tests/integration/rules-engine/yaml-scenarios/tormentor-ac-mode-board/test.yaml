name: 'Tormentor (Damage Control) - Board AC Mode Selection'
description: >-
  The acquire offer carries a [Moving | Motionless] segmented secondary control
  (the find-steed creature-type precedent) defaulting to Moving. The acquire
  effect bakes the selection as the 0/1 acMotionless mode fact and NO LONGER
  bakes a flat ac.value — AC is derived from here on (ac.effective: 21 moving,
  19 motionless), which is what lets a legacy persisted acquire's stale ac.value
  sit inert instead of two-writer conflicting.
ruleGroups:
  - vehicles/tormentor
steps:
  # Unacquired: no derived AC (the pool derives settle to 0; the panel gates on
  # active) and no mode facts at all.
  - evaluate:
      assert:
        facts:
          companion.tormentor.ac.effective: 0
          companion.tormentor.acMotionless: 0
        offers:
          exists:
            - acquire-tormentor
  # The segmented control on the acquire offer: two options, Moving (0) default.
  - evaluate:
      assert:
        offerUi:
          - id: acquire-tormentor
            ui:
              secondaryControl:
                type: segmented
                var: mode
                prefix: play.choices.tormentor.mode
                options:
                  - value: 0
                    label: rule.tormentor.mode.moving
                  - value: 1
                    label: rule.tormentor.mode.motionless
        offerVars:
          - id: acquire-tormentor
            vars:
              mode:
                capture: true
                default:
                  number: 0
  # Acquire with the default (no selection): Moving — derived AC 21, and the flat
  # ac.value is NOT baked (0 == absent; the derive owns AC from here on).
  - addOffer:
      id: acquire-tormentor
      assert:
        facts:
          companion.tormentor.active: 1
          companion.tormentor.acMotionless: 0
          companion.tormentor.acMotionless.current: 0
          companion.tormentor.ac.effective: 21
          companion.tormentor.ac.value: 0
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-acquire
        facts:
          companion.tormentor.ac.effective: 21
          companion.tormentor.ac.value: 0
  # Re-acquire with Motionless selected (the keyed replacement): derived AC 19.
  - addOffer:
      id: acquire-tormentor
      selections:
        mode: 1
      assert:
        facts:
          companion.tormentor.acMotionless: 1
          companion.tormentor.acMotionless.current: 1
          companion.tormentor.ac.effective: 19
  - endTurn:
      assert:
        facts:
          companion.tormentor.ac.effective: 19
