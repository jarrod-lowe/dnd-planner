name: 'Spear 2H error with pre-existing equipment effects'
description: >
  When dagger and spear are equipped via pre-existing effects (committed from previous turns),
  planning a spear attack with extraHands: 1 (2H mode) should produce an error because
  hands.remaining is 0 after effects run. This tests that planned rules run AFTER effects.

ruleGroups:
  - dnd-5e-2024/hands
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spear
  - dnd-5e-2024/dagger

initialEffects:
  - id: effect-dagger
    phase: normal
    group: [equipment-state]
    activities:
      - type: numberSet
        target:
          fact: weapon.dagger.equipped
        source:
          number: 1
      - type: numberIncrement
        target:
          fact: hands.remaining
        source:
          number: 1
        subtract: true
      - type: advertiseEffect
        self: true

  - id: effect-spear
    phase: normal
    group: [equipment-state]
    activities:
      - type: numberSet
        target:
          fact: weapon.spear.equipped
        source:
          number: 1
      - type: numberIncrement
        target:
          fact: hands.remaining
        source:
          number: 1
        subtract: true
      - type: advertiseEffect
        self: true

steps:
  - evaluate:
      assert:
        facts:
          hands.remaining: 0
          weapon.dagger.equipped: 1
          weapon.spear.equipped: 1
        offers:
          exists:
            - spear-use-action

  - addOffer:
      id: spear-use-action
      assert:
        planErrors:
          - id: spear-use-action
            errors: []

  - updateSelections:
      id: spear-use-action
      selections:
        extraHands: 1
      assert:
        planErrors:
          - id: spear-use-action
            errors:
              - rule.dnd-5e-2024.attacks.versatile.no-free-hand
