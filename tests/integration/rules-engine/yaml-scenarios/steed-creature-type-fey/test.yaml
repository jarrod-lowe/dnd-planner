name: 'Find Steed Creature Type Fey'
description: 'Casting Find Steed with Fey creature type sets damage type facts to psychic, persists across turns'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-find-steed
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
  - addOffer:
      id: prepare-find-steed
  - evaluate:
      assert:
        offers:
          exists:
            - cast-find-steed
  # Cast Find Steed with Fey creature type (selection value 1)
  - addOffer:
      id: cast-find-steed
      selections:
        creatureType: 1
      assert:
        facts:
          companion.steed.creatureType: 1
          companion.steed.damageType: psychic
          companion.steed.damageTypeLabel: damage-type.psychic
  # End turn: commit effects, facts persist
  - endTurn:
      assert:
        effects:
          exists:
            - effect-steed
            - effect-steed-slot-l2
        facts:
          companion.steed.summoned: 1
          companion.steed.creatureType: 1
          companion.steed.damageType: psychic
          companion.steed.damageTypeLabel: damage-type.psychic
  # Next turn: creature type facts still set by the persistent effect
  - evaluate:
      assert:
        facts:
          companion.steed.summoned: 1
          companion.steed.creatureType: 1
          companion.steed.damageType: psychic
          companion.steed.damageTypeLabel: damage-type.psychic
