name: 'Tormentor (Damage Control) - AC Mode Rides the Board Lifecycle'
description: >-
  The AC-mode record never outlives the acquire that justifies it: a re-acquire
  (a keyed replacement of the acquire effect, which does not fire dependents)
  explicitly evicts the record with an empty same-key marker, so the mode
  resets to the fresh acquire SELECTION, and abandon clears it with everything
  else. The record OVERRIDES the acquire bake in both directions — a Motionless
  acquire with a recorded Moving reads 21 — which is why the record is a distinct
  fact the derive prefers: the engine sum-combines two live effects writing one
  fact, so a record writing acMotionless itself could never flip a Motionless
  acquire back to Moving.
ruleGroups:
  - vehicles/tormentor
steps:
  # Acquire MOTIONLESS via the acquire selection, then record MOVING from the
  # vehicle: the record wins — 21, not the acquire bake's 19.
  - addOffer:
      id: acquire-tormentor
      selections:
        mode: 1
      assert:
        facts:
          companion.tormentor.ac.effective: 19
  - addOffer:
      id: set-tormentor-ac-mode
      selections:
        mode: 0
      assert:
        facts:
          companion.tormentor.ac.effective: 21
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-acquire
            - effect-tormentor-ac-mode
        facts:
          companion.tormentor.ac.effective: 21
  # Re-acquire with the DEFAULT selection: the eviction resets the mode to Moving
  # — a fresh acquire, not a persisted one.
  - addOffer:
      id: acquire-tormentor
      assert:
        facts:
          companion.tormentor.acMotionless: 0
          companion.tormentor.acMotionless.recorded: 0
          companion.tormentor.ac.effective: 21
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-acquire
          notExists:
            - effect-tormentor-ac-mode
        facts:
          companion.tormentor.ac.effective: 21
  # Record Motionless again, commit, then re-acquire SELECTING Motionless: the
  # fresh acquire selection stands (the record goes with the old acquire).
  - addOffer:
      id: set-tormentor-ac-mode
      selections:
        mode: 1
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-ac-mode
        facts:
          companion.tormentor.ac.effective: 19
  - addOffer:
      id: acquire-tormentor
      selections:
        mode: 1
      assert:
        facts:
          companion.tormentor.acMotionless: 1
          companion.tormentor.acMotionless.recorded: 0
          companion.tormentor.ac.effective: 19
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-acquire
          notExists:
            - effect-tormentor-ac-mode
        facts:
          companion.tormentor.ac.effective: 19
  # Abandon: the record and the acquire go together; the derived AC reads 0.
  - addOffer:
      id: abandon-tormentor
      assert:
        facts:
          companion.tormentor.ac.effective: 0
          companion.tormentor.acMotionless: 0
  - endTurn:
      assert:
        effects:
          notExists:
            - effect-tormentor-acquire
            - effect-tormentor-ac-mode
        facts:
          companion.tormentor.ac.effective: 0
