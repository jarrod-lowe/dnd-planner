name: 'Tormentor (Damage Control) - HP Records and Destroyed Ride the Board Lifecycle'
description: >-
  The HP records and the destroyed wreck never outlive the acquire that
  justifies them: a re-acquire (a keyed replacement of the acquire effect, which
  does not fire dependents) explicitly evicts all three records with empty
  same-key markers — a fresh acquire starts whole — and abandon does the same
  while clearing every baked fact, so the derived pool reads 0/0 and the
  vehicle's recorders go with the panel. No notice stands on a fresh acquire.
ruleGroups:
  - vehicles/tormentor
steps:
  - addOffer:
      id: acquire-tormentor
      assert:
        # Acquireed and whole: no destroyed notice.
        annotations:
          notExists:
            - rule.tormentor.destroyed-notice
  # Wreck it: 60 damage destroys the vehicle outright.
  - addOffer:
      id: record-tormentor-damage
      selections:
        amount: 60
      assert:
        facts:
          companion.tormentor.destroyed: 1
          companion.tormentor.hp.current: 0
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-hp-damage
            - effect-tormentor-destroyed
  # Re-acquiring REPLACES the acquire effect and evicts the HP records and the
  # destroyed wreck with it: a fresh acquire starts whole and un-noticed.
  - addOffer:
      id: acquire-tormentor
      assert:
        facts:
          companion.tormentor.active: 1
          companion.tormentor.hp.max: 60
          companion.tormentor.hp.current: 60
          companion.tormentor.destroyed: 0
        annotations:
          notExists:
            - rule.tormentor.destroyed-notice
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-acquire
          notExists:
            - effect-tormentor-hp-damage
            - effect-tormentor-hp-heal
            - effect-tormentor-destroyed
        facts:
          companion.tormentor.hp.current: 60
  # Damage again, commit, then abandon: the keyed replacement clears every
  # baked fact INCLUDING the HP records and the wreck, and the recorders' gate
  # closes with the panel.
  - addOffer:
      id: record-tormentor-damage
      selections:
        amount: 15
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-hp-damage
  - addOffer:
      id: abandon-tormentor
      assert:
        facts:
          companion.tormentor.active: 0
          companion.tormentor.hp.max: 0
          companion.tormentor.hp.current: 0
          companion.tormentor.hp.damageRecorded: 0
        offers:
          notExists:
            - record-tormentor-damage
            - record-tormentor-heal
        annotations:
          notExists:
            - rule.tormentor.destroyed-notice
  - endTurn:
      assert:
        effects:
          notExists:
            - effect-tormentor-acquire
            - effect-tormentor-hp-damage
            - effect-tormentor-hp-heal
            - effect-tormentor-destroyed
