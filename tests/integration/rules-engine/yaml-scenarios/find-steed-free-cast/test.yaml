name: 'Find Steed - Free Cast per Long Rest'
description: >-
  Paladin L5 Faithful Steed feature grants one free Find Steed cast per Long
  Rest. The cast offer is available even with no L2+ slots, and consuming the
  free use decrements the resource without touching spell slots.
ruleGroups:
  - species-human/species-human
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spellcasting
  - class-paladin/class-paladin-level1
  - class-paladin/class-paladin-level2
  - class-paladin/class-paladin-level3
  - class-paladin/class-paladin-level4
  - class-paladin/class-paladin-level5
  - class-paladin/class-paladin-paladin-find-steed
  - spells/spell-find-steed
steps:
  # With L2 slots available (from level5), free-use resource is initialised
  - evaluate:
      assert:
        facts:
          paladinFindSteed.total: 1
          paladinFindSteed.remaining: 1
          spell.l2.findSteed.prepared: 1
          spell.l2.findSteed.alwaysPrepared: 1
          # Free use + L2 slots = at least 3 resources
          find-steed.anyResourceRemaining: 3
        offers:
          exists:
            - cast-find-steed
  # Consume the free cast (slotLevel 0 = free use, no slot)
  - addOffer:
      id: cast-find-steed
      selections:
        slotLevel: 0
  - evaluate:
      assert:
        facts:
          paladinFindSteed.remaining: 0
          # L2 slots should be untouched (2 from level5)
          spellcasting.slots.level2.remaining: 2
