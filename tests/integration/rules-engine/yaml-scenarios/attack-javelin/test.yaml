name: 'Javelin Attack'
description: >
  Javelin offer appears in action-attack section, consumes an action
  when added to plan. Attack facts (hitBonus, damageBonus) are computed
  from STR modifier + proficiency. damageDie is 6 (1d6). After endTurn,
  actions reset and attack is available again.

ruleGroups:
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/attacks
  - dnd-5e-2024/javelin

steps:
  - evaluate:
      assert:
        facts:
          actions.max: 1
          actions.remaining: 1
        offers:
          exists:
            - set-strength
            - javelin-use-action
          notExists: []
        offerVars:
          - id: javelin-use-action
            vars:
              ranges:
                default:
                  array:
                    - distance: 5
                      type: melee
                    - distance: 30
                      type: thrown
                    - distance: 120
                      type: thrown
                      disadvantage: true

  - addOffer:
      id: set-strength
      selections:
        score: 16
      assert:
        facts:
          str.value: 16
          str.modifier: 3
          attack.javelin.hitBonus: 3
          attack.javelin.damageBonus: 3

  - addOffer:
      id: javelin-use-action
      assert:
        facts:
          actions.remaining: 0
        offers:
          exists:
            - free-action
          illegal:
            - help-action
            - javelin-use-action

  - endTurn:
      assert:
        facts:
          actions.max: 1
          actions.remaining: 1
        offers:
          exists:
            - free-action
            - help-action
            - javelin-use-action
