name: 'Javelin Attack'
description: >
  Javelin offer appears in action-attack section, consumes an action
  when added to plan. Attack facts (hitBonus, damageBonus) are computed
  from STR modifier + proficiency. damageDie is 6 (1d6). After endTurn,
  actions reset and attack is available again.

ruleGroups:
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/attacks
  - dnd-5e-2024/javelin

initialEffects:
  - id: effect-javelin
    phase: normal
    group: [equipment-state]
    activities:
      - type: numberSet
        target:
          fact: weapon.javelin.equipped
        source:
          number: 1
      - type: advertiseEffect
        self: true

steps:
  - evaluate:
      assert:
        facts:
          actions.max: 1
          actions.remaining: 1
        offers:
          exists:
            - set-strength
            - javelin-use-action
          notExists: []
        offerVars:
          - id: javelin-use-action
            vars:
              ranges:
                default:
                  array:
                    # Each band states whether it is a melee weapon attack: a
                    # melee-only rider (Great Weapon Fighting) is gated on the
                    # band, since the rules engine cannot see which one is picked.
                    - distance: 5
                      type: melee
                      meleeAttack: true
                    - distance: 30
                      type: thrown
                      meleeAttack: false
                    - distance: 120
                      type: thrown
                      meleeAttack: false
                      disadvantage: true

  - addOffer:
      id: set-strength
      selections:
        score: 16
      assert:
        facts:
          str.value: 16
          str.modifier: 3
          attack.javelin.hitBonus: 3
          attack.javelin.damageBonus: 3

  - addOffer:
      id: javelin-use-action
      assert:
        facts:
          actions.remaining: 0
        offers:
          exists:
            - free-action
          illegal:
            - help-action
            - javelin-use-action

  - endTurn:
      assert:
        facts:
          actions.max: 1
          actions.remaining: 1
        offers:
          exists:
            - free-action
            - help-action
            - javelin-use-action
