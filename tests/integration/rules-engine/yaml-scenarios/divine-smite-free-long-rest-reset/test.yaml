name: 'Divine Smite - Free Use Long Rest Reset'
description: 'Long Rest restores the once-per-long-rest free Divine Smite'
ruleGroups:
  - species-human/species-human
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spellcasting
  - class-paladin/class-paladin-level1
  - class-paladin/class-paladin-level2
  - class-paladin/class-paladin-paladin-smite
  - spells/spell-divine-smite
steps:
  # Turn 1: attack then spend the free smite
  - evaluate:
      assert:
        facts:
          paladinSmite.remaining: 1
  - addOffer:
      id: unarmed-strike-use-action
  - addOffer:
      id: cast-divine-smite
      selections:
        slotLevel: 0
      assert:
        facts:
          paladinSmite.remaining: 0
  - endTurn:
      assert:
        facts:
          paladinSmite.remaining: 0
  # Turn 2: still spent, then take a long rest
  - evaluate:
      assert:
        facts:
          paladinSmite.remaining: 0
  - addOffer:
      id: record-long-rest
      assert:
        facts:
          paladinSmite.remaining: 1
  - endTurn:
      assert:
        facts:
          paladinSmite.remaining: 1
  # Turn 3: free smite available again
  - evaluate:
      assert:
        facts:
          paladinSmite.total: 1
          paladinSmite.remaining: 1
