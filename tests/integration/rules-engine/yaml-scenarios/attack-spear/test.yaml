name: 'Spear Attack'
description: >
  Spear offer appears in action-attack section, consumes an action
  when added to plan. Attack facts (hitBonus, damageBonus) are computed
  from STR modifier + proficiency. damageDie is 6 (1d6). Ranges include
  1H/2H melee and thrown options with damage die override for 2H.

ruleGroups:
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spear

initialEffects:
  - id: effect-spear
    phase: normal
    group: [equipment-state]
    activities:
      - type: numberSet
        target:
          fact: weapon.spear.equipped
        source:
          number: 1
      - type: advertiseEffect
        self: true

steps:
  - evaluate:
      assert:
        facts:
          actions.max: 1
          actions.remaining: 1
        offers:
          exists:
            - set-strength
            - spear-use-action
          notExists: []
        offerVars:
          - id: spear-use-action
            vars:
              # The grip lives in the loadout, so there is ONE melee band whose
              # die follows weapon.spear.twoHanded; the thrown bands pin d6.
              ranges:
                default:
                  array:
                    - distance: 5
                      type: melee
                    - distance: 20
                      type: thrown
                      damageDie: 6
                    - distance: 60
                      type: thrown
                      damageDie: 6
                      disadvantage: true

  - addOffer:
      id: set-strength
      selections:
        score: 16
      assert:
        facts:
          str.value: 16
          str.modifier: 3
          attack.spear.hitBonus: 3
          attack.spear.damageBonus: 3

  - addOffer:
      id: spear-use-action
      assert:
        facts:
          actions.remaining: 0
        offers:
          exists:
            - free-action
          illegal:
            - help-action
            - spear-use-action

  - endTurn:
      assert:
        facts:
          actions.max: 1
          actions.remaining: 1
        offers:
          exists:
            - free-action
            - help-action
            - spear-use-action
