name: 'Passive Investigation'
description: 'Passive investigation equals 10 plus investigation skill modifier'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/passive-skills
steps:
  - evaluate:
      assert:
        facts:
          passive.investigation.value: 10
  - addOffer:
      id: set-intelligence
      selections:
        score: 12
      assert:
        facts:
          skill.investigation.value: 1
          passive.investigation.value: 11
  - addOffer:
      id: proficiency-investigation
      selections:
        level: 1
      assert:
        facts:
          skill.investigation.proficiency: 1
          skill.investigation.value: 1
          passive.investigation.value: 11
