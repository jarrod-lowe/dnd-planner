name: 'Tormentor - Helm Drive Movement'
description: >-
  Drive is the vehicle's MOVEMENT offer (the steed's move rows, the PC-parity
  house rule): acquiring derives companion.tormentor.movement.base/total/
  remaining in the steed's shape — base a derivation of the speed facts (the
  PR-D seam), total doubling while Dashed, remaining = total − spent and
  resetting each turn — and the Helm's Drive row spends the player's ACTION
  (the economy ruling: a vehicle activity is the player's full slot, never
  attack accounting) beside the captured distance against that pool, the
  distance defaulting to all remaining (the steed idiom). Over-distance rows
  carry the steed's out-of-movement diagnostic while still committing, and
  abandoning settles the pool to 0.
ruleGroups:
  - vehicles/tormentor
  - dnd-5e-2024/action-economy
steps:
  - addOffer:
      id: acquire-tormentor
  - addOffer:
      id: take-tormentor-helm-seat
  - endTurn:
      assert:
        facts:
          companion.tormentor.seats.helm: 1
  # PR-D: the pool is the FUEL's — a soul coin in the burner (the Helm's
  # bonus-action record, committed here so the bonus reopens below).
  - addOffer:
      id: set-tormentor-fuel
      selections:
        fuel: 1
  - endTurn: {}
  # The movement economy exists the moment the vehicle does (the steed's
  # derives): base derives from the baked speed (100), total undoubled,
  # nothing spent — and Drive is the steed move-offer shape (MOVE section,
  # distance slider defaulting to remaining).
  - evaluate:
      assert:
        facts:
          companion.tormentor.movement.base: 100
          companion.tormentor.movement.total: 100
          companion.tormentor.movement.remaining: 100
        offers:
          legal:
            - drive-tormentor
        offerUi:
          - id: drive-tormentor
            ui:
              section: move
              primaryControl:
                type: slider
                var: distance
                max:
                  fact: companion.tormentor.movement.total
                step: 5
                unit: ft
        offerVars:
          - id: drive-tormentor
            vars:
              distance:
                capture: true
                min: 0
                default:
                  fact: companion.tormentor.movement.remaining
  # Drive 40 ft: the player's ACTION and exactly 40 ft of the vehicle's pool
  # (the Crushing Wheels note riding the row — PR-7).
  - addOffer:
      id: drive-tormentor
      selections:
        distance: 40
      assert:
        facts:
          actions.remaining: 0
          companion.tormentor.movement.remaining: 60
        planErrors:
          - id: drive-tormentor
            index: 0
            errors:
              - rule.tormentor.drive.crushing_wheels
  # No action left (60 ft still in the pool — the failing leg is the action
  # alone): Drive stays visible but ILLEGAL…
  - evaluate:
      assert:
        offers:
          illegal:
            - drive-tormentor
  # …and the override row still moves, its distance DEFAULTING to all
  # remaining (the steed idiom) while carrying the no-action diagnostic
  # (the wheels note after it).
  - addOffer:
      id: drive-tormentor
      assert:
        facts:
          actions.remaining: -1
          companion.tormentor.movement.remaining: 0
        planErrors:
          - id: drive-tormentor
            index: 1
            errors:
              - rule.tormentor.drive.no_action
              - rule.tormentor.drive.crushing_wheels
  # The turn ends: the spends age away and the pool resets (the steed reset).
  - endTurn:
      assert:
        facts:
          actions.remaining: 1
          companion.tormentor.movement.total: 100
          companion.tormentor.movement.remaining: 100
  # Over-distance (the steed partial-distance pin): selecting more than
  # remains must error rather than drive the pool silently — the row still
  # commits, the pool reading the over-commit (the wheels note after the
  # error).
  - addOffer:
      id: drive-tormentor
      selections:
        distance: 150
      assert:
        facts:
          companion.tormentor.movement.remaining: -50
        planErrors:
          - id: drive-tormentor
            index: 0
            errors:
              - rule.tormentor.drive.out_of_movement
              - rule.tormentor.drive.crushing_wheels
  # Abandoning settles the pool to 0 with every baked fact (the derives stay
  # registered, gated on the acquire).
  - endTurn: {}
  - addOffer:
      id: abandon-tormentor
      assert:
        facts:
          companion.tormentor.movement.base: 0
          companion.tormentor.movement.total: 0
          companion.tormentor.movement.remaining: 0
