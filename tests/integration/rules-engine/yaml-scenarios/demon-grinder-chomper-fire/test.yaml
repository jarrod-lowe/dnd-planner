name: 'Demon Grinder - Bite With The Chomper'
description: >-
  The Chomper's attack offer exists only while the chomper seat is held (the
  `when` gate is the acquire AND the station's seat fact — a driver at the
  Helm does not work the jaws), and while it exists it is a plan-row ACTION
  attack filed like one: ATTACK 'weapons', action cost, a dice-line reading
  the module derives (d20 + 9 to hit, 6d6+4 piercing — the grinding teeth
  behind every bite). Reach 5 ft. and one target are offer copy and detail
  text, not range machinery. The stat block's one rider — a target reduced
  to 0 hit points by this damage is destroyed beyond normal recovery, its
  nonmagical items destroyed with it — rides EVERY bite row as an
  unconditional 'notice' diagnostic (the dash-risk idiom: informational
  only, never the error path — the row stays legal — and never a mechanic;
  the GM adjudicates), while a free record row planned beside it carries
  nothing. The ECONOMY is the generic action spend (the flinger's ruling):
  biting consumes the player's full ACTION and nothing else, the seat stays
  taken, and on a wreck the shared wrecked leg composes with the note beside
  it.
ruleGroups:
  - vehicles/demon-grinder
  - dnd-5e-2024/action-economy
steps:
  # Acquired but unseated: no bite offer — the attack is the station's, and
  # with no bite row there is no note anywhere.
  - addOffer:
      id: acquire-demon-grinder
  - evaluate:
      assert:
        offers:
          notExists:
            - fire-demon-grinder-chomper
  # A driver at the Helm does not work the jaws either.
  - addOffer:
      id: take-demon-grinder-helm-seat
  - evaluate:
      assert:
        offers:
          notExists:
            - fire-demon-grinder-chomper
  # Seated at the chomper: the offer exists with the full attack shape.
  - addOffer:
      id: leave-demon-grinder-helm-seat
  - addOffer:
      id: take-demon-grinder-chomper-seat
  - evaluate:
      assert:
        offers:
          exists:
            - fire-demon-grinder-chomper
          legal:
            - fire-demon-grinder-chomper
        offerUi:
          - id: fire-demon-grinder-chomper
            ui:
              section: action-attack
              subject: demon-grinder
              name: rule.demon-grinder.fire-chomper.name
              description: rule.demon-grinder.fire-chomper.description
              detailKey: vehicle/demon-grinder-chomper
              actionCost:
                - action
              annotationLabels:
                - dice.any.companion
              intents:
                ATTACK: weapons
              primaryControl:
                type: dice-line
                dice:
                  - sides: 20
                    bonus:
                      var: hitBonus
                    purpose: to-hit
                  - sides: 6
                    count: 6
                    bonus:
                      var: damageBonus
                    purpose: damage
                    damageType:
                      string: piercing
        offerVars:
          - id: fire-demon-grinder-chomper
            vars:
              hitBonus:
                capture: true
                default:
                  fact: companion.demonGrinder.chomper.hitBonus
              damageDie:
                default:
                  number: 6
              damageBonus:
                capture: true
                default:
                  fact: companion.demonGrinder.chomper.damageBonus
  # The derives the dice-line reads: +9 to hit, +4 damage, while acquired.
  - evaluate:
      assert:
        facts:
          companion.demonGrinder.chomper.hitBonus: 9
          companion.demonGrinder.chomper.damageBonus: 4
  # Bite: the generic action spend alone — the player's ACTION, never attack
  # accounting — and nothing else moves (the seat stays taken). The rider
  # rides the row unconditionally and the row stays LEGAL (a notice is
  # informational, never the error path).
  - addOffer:
      id: fire-demon-grinder-chomper
      assert:
        facts:
          actions.remaining: 0
          companion.demonGrinder.seats.chomper: 1
        planErrors:
          - id: fire-demon-grinder-chomper
            index: 0
            errors:
              - rule.demon-grinder.fire-chomper.rider
        status:
          legal: true
  # A free record row planned beside the bite carries NOTHING (a per-row
  # note is not a panel truth).
  - addOffer:
      id: set-demon-grinder-occupancy
      selections:
        occupancy: 2
      assert:
        planErrors:
          - id: set-demon-grinder-occupancy
            index: 0
            errors: []
  # A second bite the same turn is ILLEGAL-but-COMMITTABLE: the offer stays
  # with its no-action diagnostic and the row still spends — the note beside
  # the error, the dash risk's order.
  - addOffer:
      id: fire-demon-grinder-chomper
      assert:
        planErrors:
          - id: fire-demon-grinder-chomper
            index: 1
            errors:
              - rule.demon-grinder.fire-chomper.no_action
              - rule.demon-grinder.fire-chomper.rider
  # End of turn: the spend ages away, the seat stands.
  - endTurn:
      assert:
        facts:
          actions.remaining: 1
          companion.demonGrinder.seats.chomper: 1
  # Wrecked: destroy the vehicle while seated at the chomper (one
  # pool-emptying blow); the bite goes illegal on the shared wrecked leg, and
  # a planned-anyway row still spends carrying the diagnostic with the note
  # beside it.
  - addOffer:
      id: record-demon-grinder-damage
      selections:
        amount: 200
      assert:
        facts:
          companion.demonGrinder.destroyed: 1
  - evaluate:
      assert:
        offers:
          illegal:
            - fire-demon-grinder-chomper
  - addOffer:
      id: fire-demon-grinder-chomper
      assert:
        planErrors:
          - id: fire-demon-grinder-chomper
            index: 0
            errors:
              - rule.demon-grinder.wrecked
              - rule.demon-grinder.fire-chomper.rider
  - endTurn:
      assert:
        facts:
          companion.demonGrinder.seats.chomper: 1
