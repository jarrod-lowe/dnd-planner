name: 'Command Prepare'
description: 'Cast offer requires preparation first; prepare/unprepare lifecycle works'
ruleGroups:
  - dnd-5e-2024/prepared-spells
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-command
steps:
  # TC1: Before preparing, cast-command is absent; prepare offer exists
  - evaluate:
      assert:
        facts:
          spell.l1.command.prepared: 0
        offers:
          notExists:
            - cast-command
          exists:
            - set-prepared-spells
  # TC2: After preparing, cast-command becomes available
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: command
            level: 1
            nameKey: rule.spell-command.offer-command.name
            preparedFact: spell.l1.command.prepared
            alwaysPreparedFact: spell.l1.command.alwaysPrepared
      assert:
        facts:
          spell.l1.command.prepared: 1
          spellcasting.prepared.count: 1
  - evaluate:
      assert:
        offers:
          exists:
            - cast-command
