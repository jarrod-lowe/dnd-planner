name: 'Hands - Weapon Hand Usage Persists Across Turns'
description: >
  The loadout effect is permanent, so after setting a dagger loadout and ending
  the turn the weapon is still held and hands.remaining stays at 1 next turn.

ruleGroups:
  - dnd-5e-2024/hands
  - dnd-5e-2024/loadout
  - dnd-5e-2024/core-events
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/attacks
  - dnd-5e-2024/dagger

steps:
  - evaluate:
      assert:
        facts:
          hands.remaining: 2
  - addOffer:
      id: set-loadout
      selections:
        loadout:
          id: dagger
          hands: 1
          handsFree: 1
          items:
            - id: dagger
              nameKey: rule.dnd-5e-2024.attacks.dagger.name
              hands: 1
              twoHanded: false
              state:
                weapon.dagger.equipped: 1
      assert:
        facts:
          weapon.dagger.equipped: 1
          hands.remaining: 1
  - endTurn:
      assert:
        facts:
          weapon.dagger.equipped: 1
          hands.remaining: 1
        effects:
          exists:
            - effect-loadout
