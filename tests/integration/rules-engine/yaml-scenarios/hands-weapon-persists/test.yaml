name: 'Hands - Weapon Hand Usage Persists Across Turns'
description: >
  After donning a dagger and ending the turn, the hand usage persists.
  hands.remaining stays at 1 on the next turn.

ruleGroups:
  - dnd-5e-2024/hands
  - dnd-5e-2024/core-events
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/attacks
  - dnd-5e-2024/dagger

steps:
  - evaluate:
      assert:
        facts:
          hands.remaining: 2
  - addOffer:
      id: don-dagger
      assert:
        facts:
          weapon.dagger.equipped: 1
          hands.remaining: 1
  - endTurn:
      assert:
        facts:
          weapon.dagger.equipped: 1
          hands.remaining: 1
