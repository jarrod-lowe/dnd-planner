name: 'Divine Smite - Always Prepared at L2'
description: 'Paladin L2 grants Divine Smite always-prepared without spending a prepared-spell slot, and it cannot be unprepared'
ruleGroups:
  - species-human/species-human
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spellcasting
  - class-paladin/class-paladin-level1
  - class-paladin/class-paladin-level2
  - class-paladin/class-paladin-paladin-smite
  - spells/spell-divine-smite
steps:
  - evaluate:
      assert:
        facts:
          spell.l1.divineSmite.prepared: 1
          spell.l1.divineSmite.alwaysPrepared: 1
          # Granted for free — does not consume a prepared-spell slot
          spellcasting.prepared.count: 0
          paladinSmite.remaining: 1
        offers:
          # Cannot unprepare an always-prepared spell
          illegal:
            - unprepare-divine-smite
