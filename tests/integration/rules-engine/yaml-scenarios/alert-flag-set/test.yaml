name: 'Alert Feat - Flag Set'
description: >
  When feat-alert is assigned, feat.alert.active is set to 1 and
  both Alert annotations appear on initiative panels.

ruleGroups:
  - dnd-5e-2024/initiative
  - dnd-5e-2024/feat-alert

steps:
  - evaluate:
      assert:
        facts:
          feat.alert.active: 1
        annotations:
          exists:
            - rule.dnd-5e-2024.feat-alert.annotation-swap
            - rule.dnd-5e-2024.feat-alert.annotation-proficiency
