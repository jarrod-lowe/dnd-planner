name: 'Heroic Inspiration - Use'
description: 'Using HI sets remaining to 0 and effect does not self-advertise'
ruleGroups:
  - dnd-5e-2024/core-events
  - dnd-5e-2024/heroic-inspiration
initialEffects:
  - id: effect-hi
    phase: early
    after:
      - group: hi-consume
    group:
      - hi-settle
    ui:
      name: rule.dnd-5e-2024.heroic-inspiration.effect-hi.name
    activities:
      - type: numberSet
        source:
          number: 1
        target:
          fact: heroicInspiration.remaining
        when:
          - fact: heroicInspiration.consumed
            operator: equals
            value: 0
      - type: advertiseEffect
        self: true
        when:
          - fact: heroicInspiration.consumed
            operator: equals
            value: 0
steps:
  - evaluate:
      assert:
        facts:
          heroicInspiration.max: 1
          heroicInspiration.remaining: 1
        offers:
          exists:
            - use-hi
  - addOffer:
      id: use-hi
      assert:
        facts:
          heroicInspiration.remaining: 0
          heroicInspiration.consumed: 1
  - endTurn:
      assert:
        facts:
          heroicInspiration.remaining: 0
        effects:
          notExists:
            - effect-hi
