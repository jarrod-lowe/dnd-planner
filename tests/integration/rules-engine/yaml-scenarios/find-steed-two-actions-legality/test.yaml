name: 'Find Steed Two Actions Legality'
description: 'First steed action should be legal (no errors), second should be illegal (has errors)'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-find-steed
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
  - addOffer:
      id: prepare-find-steed
  # Cast Find Steed and commit
  - evaluate:
      assert:
        offers:
          exists:
            - cast-find-steed
  - addOffer:
      id: cast-find-steed
  - endTurn:
      assert:
        effects:
          exists:
            - effect-steed
        facts:
          companion.steed.summoned: 1
          companion.steed.actions.remaining: 1
  # Next turn: add first steed action
  - evaluate:
      assert:
        offers:
          exists:
            - steed-dodge
  - addOffer:
      id: steed-dodge
      assert:
        facts:
          companion.steed.actions.remaining: 0
        # First action should have no errors (legal)
        planErrors:
          - id: steed-dodge
            index: 0
            errors: []
  # Add second steed action - should be illegal with error reason
  - addOffer:
      id: steed-dodge
      assert:
        facts:
          companion.steed.actions.remaining: -1
        # Second action should have error (illegal)
        planErrors:
          - id: steed-dodge
            index: 0
            errors: []
          - id: steed-dodge
            index: 1
            errors:
              - rule.spell-find-steed.steed-dodge.no_actions
