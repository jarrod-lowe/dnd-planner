name: 'Greataxe Attack'
description: >
  Greataxe offer appears in action-attack section, consumes an action
  when added to plan. Attack facts (hitBonus, damageBonus) are computed
  from STR modifier + proficiency. damageDie is 12 (1d12). After endTurn,
  actions reset and attack is available again.

ruleGroups:
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/turn-rest
  - dnd-5e-2024/attacks
  - dnd-5e-2024/greataxe

steps:
  - evaluate:
      assert:
        facts:
          actions.max: 1
          actions.remaining: 1
        offers:
          exists:
            - set-strength
            - greataxe-use-action
          notExists: []
        offerVars:
          - id: greataxe-use-action
            vars:
              ranges:
                default:
                  array:
                    - distance: 5
                      type: melee

  - addOffer:
      id: set-strength
      selections:
        score: 16
      assert:
        facts:
          str.value: 16
          str.modifier: 3
          attack.greataxe.hitBonus: 3
          attack.greataxe.damageBonus: 3

  - addOffer:
      id: greataxe-use-action
      assert:
        facts:
          actions.remaining: 0
        offers:
          exists:
            - free-action
          illegal:
            - help-action
            - greataxe-use-action

  - endTurn:
      assert:
        facts:
          actions.max: 1
          actions.remaining: 1
        offers:
          exists:
            - free-action
            - help-action
            - greataxe-use-action
