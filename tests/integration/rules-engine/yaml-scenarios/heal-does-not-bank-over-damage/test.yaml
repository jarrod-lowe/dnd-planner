name: 'Heal Does Not Bank Over Damage'
description: >-
  Healing beyond the HP missing at record time is lost (5e: regained HP cannot
  exceed the max) — it must not persist as a positive modifier that pre-cancels
  damage taken LATER. The hp.current clamp only hides a surplus; the recorded
  heal itself has to cap.
ruleGroups:
  - dnd-5e-2024/hp
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - class-paladin/class-paladin-level1
  - dnd-5e-2024/core-events
steps:
  # CON 14 → hp.max = 10 + 2 = 12.
  - addOffer:
      id: set-constitution
      selections:
        score: 14
      assert:
        facts:
          hp.max: 12
          hp.current: 12
  - addOffer:
      id: record-damage
      selections:
        amount: 10
      assert:
        facts:
          hp.current: 2
  # Heal 15: only the 10 missing HP are regained — back to max, surplus lost.
  - addOffer:
      id: record-heal
      selections:
        amount: 15
      assert:
        facts:
          hp.current: 12
  - endTurn: {}
  # The NEXT damage lands in full: 12 − 7 = 5 (a banked +5 would leave 10).
  - addOffer:
      id: record-damage
      selections:
        amount: 7
      assert:
        facts:
          hp.current: 5
  - endTurn:
      assert:
        facts:
          hp.current: 5
