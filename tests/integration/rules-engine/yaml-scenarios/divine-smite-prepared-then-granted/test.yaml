name: 'Divine Smite - Manual Prepare Then Granted Always-Prepared'
description: >-
  A leftover manual-preparation effect must stop consuming a prepared-spell slot
  once Divine Smite is granted always-prepared at Paladin L2 (it should not count
  against the prepared-spell limit).
ruleGroups:
  - dnd-5e-2024/prepared-spells
  - species-human/species-human
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/spellcasting
  - class-paladin/class-paladin-level1
  - class-paladin/class-paladin-level2
  - class-paladin/class-paladin-paladin-smite
  - spells/spell-divine-smite
steps:
  # Inject a leftover L1 manual preparation: committing the set picker with
  # Divine Smite selected persists the keyed prepared-spells effect carrying its
  # prepared fact.
  - evaluate: {}
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: divine-smite
            level: 1
            nameKey: rule.spell-divine-smite.offer-divine-smite.name
            preparedFact: spell.l1.divineSmite.prepared
            alwaysPreparedFact: spell.l1.divineSmite.alwaysPrepared
  - endTurn: {}
  # With the always-prepared grant active, the leftover effect must NOT keep
  # contributing to the prepared count.
  - evaluate:
      assert:
        facts:
          spell.l1.divineSmite.prepared: 1
          spell.l1.divineSmite.alwaysPrepared: 1
          spellcasting.prepared.count: 0
