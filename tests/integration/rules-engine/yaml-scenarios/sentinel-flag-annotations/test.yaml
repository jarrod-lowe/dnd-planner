name: 'Sentinel Feat - Flag and Annotations'
description: >
  When feat-sentinel is assigned, feat.sentinel.active is set to 1 and
  all three Sentinel annotations appear.

ruleGroups:
  - dnd-5e-2024/attacks
  - dnd-5e-2024/feat-sentinel

steps:
  - evaluate:
      assert:
        facts:
          feat.sentinel.active: 1
        annotations:
          exists:
            - rule.dnd-5e-2024.feat-sentinel.notice-disengage
            - rule.dnd-5e-2024.feat-sentinel.notice-retaliate
            - rule.dnd-5e-2024.feat-sentinel.notice-speed
          # Disengage and ally-hit retaliation are standing notices; the
          # speed-to-0 rider is post-hoc (matters only after an Opportunity
          # Attack is planned), so it targets the reaction panels' label.
          targets:
            - key: rule.dnd-5e-2024.feat-sentinel.notice-disengage
              targets: [notice]
            - key: rule.dnd-5e-2024.feat-sentinel.notice-retaliate
              targets: [notice]
            - key: rule.dnd-5e-2024.feat-sentinel.notice-speed
              targets: [attack.reaction]
