name: 'HP from paladin level 3'
description: 'HP calculated from paladin levels 1-3 using d10 max at level 1 and average d10 at levels 2 and 3'
ruleGroups:
  - dnd-5e-2024/hp
  - dnd-5e-2024/ability-scores
  - class-paladin/class-paladin-level1
  - class-paladin/class-paladin-level2
  - class-paladin/class-paladin-level3
steps:
  # Without CON set: 10 (L1) + 6 (L2 average) + 6 (L3 average) = 22
  - evaluate:
      assert:
        facts:
          hp.max: 22
          hp.current: 22

  # CON set after the class levels are present: every level reads the LIVE
  # CON modifier (2024 rules — retroactive recalculation), so L1-L3 each gain +3.
  - addOffer:
      id: set-constitution
      selections:
        score: 16
      assert:
        facts:
          con.modifier: 3
          hp.max: 31
          hp.current: 31

  # The recalculated max survives the turn boundary.
  - endTurn:
      assert:
        facts:
          con.modifier: 3
          hp.max: 31
          hp.current: 31
