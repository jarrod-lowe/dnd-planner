name: 'Find Steed Celestial variant offers only Healing Touch'
description: 'A Celestial (default) Otherworldly Steed offers Healing Touch, not Fey Step or Fell Glare, both on the cast turn and on later turns'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-find-steed
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  - evaluate: {}
  - addOffer:
      id: prepare-find-steed
  - evaluate:
      assert:
        offers:
          exists:
            - cast-find-steed
  # Cast Find Steed (default creature type 0 = Celestial)
  - addOffer:
      id: cast-find-steed
  # Same turn: only Healing Touch is offered
  - evaluate:
      assert:
        offers:
          exists:
            - steed-healing-touch
          notExists:
            - steed-fey-step
            - steed-fell-glare
  # Later turn: still only Healing Touch (persistent offer)
  - endTurn: {}
  - evaluate:
      assert:
        offers:
          exists:
            - steed-healing-touch
          notExists:
            - steed-fey-step
            - steed-fell-glare
