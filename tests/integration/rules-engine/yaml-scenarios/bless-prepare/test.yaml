name: 'Bless Prepare'
description: 'Cast offer requires preparation first; prepare/unprepare lifecycle works'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/concentration
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-bless
steps:
  # TC1: Before preparing, cast-bless is absent; prepare offer exists
  - evaluate:
      assert:
        facts:
          spell.l1.bless.prepared: 0
        offers:
          notExists:
            - cast-bless
          exists:
            - prepare-bless
  # TC2: After preparing, cast-bless becomes available
  - addOffer:
      id: prepare-bless
      assert:
        facts:
          spell.l1.bless.prepared: 1
          spellcasting.prepared.count: 1
  - evaluate:
      assert:
        offers:
          exists:
            - cast-bless
