name: 'Thunderous Smite - Usage'
description: 'Using Thunderous Smite consumes a bonus action, spellcasting resource, and a spell slot'
ruleGroups:
  - species-human/species-human
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spellcasting
  - class-paladin/class-paladin-level1
  - spells/spell-thunderous-smite
steps:
  - evaluate:
  - addOffer:
      id: prepare-thunderous-smite
  - evaluate:
      assert:
        facts:
          actions.remaining: 1
          bonusActions.remaining: 1
          spellcasting.remaining: 1
          spellcasting.slots.level1.remaining: 2
        offers:
          exists:
            - cast-thunderous-smite
        offerUi:
          - id: cast-thunderous-smite
            ui:
              # The target makes a Strength save (matches the ui.saveType flag)
              information:
                - type: text
                  label: play.information.saveDc
                  labelValues:
                    saveType: { string: STR }
                    dc: { fact: spellcasting.saveDC }
  - addOffer:
      id: unarmed-strike-use-action
      assert:
        facts:
          attack.last.activation.action: 1
  - addOffer:
      id: cast-thunderous-smite
      selections:
        slotLevel: 1
      assert:
        facts:
          bonusActions.remaining: 0
          spellcasting.remaining: 0
          spellcasting.slots.level1.remaining: 1
