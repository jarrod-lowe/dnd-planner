name: 'Tormentor (Damage Control) - Occupancy Lifecycle'
description: >-
  The occupancy record never outlives the board that justifies it: a re-board
  (keyed replacement of the board effect) evicts the occupancy effect with an
  empty same-key marker so used resets to the board default of 1, and de-board
  does the same while clearing every baked fact. Unboarded, the station's
  occupancy offer is gone with the rest of the panel (structural gate on
  active). The raw mount-chip removal path declares the same eviction via the
  board effect's dependents (unit-pinned, not assertible here).
ruleGroups:
  - vehicles/tormentor
steps:
  - addOffer:
      id: board-tormentor
  # Record a full vehicle: 4 of 4.
  - addOffer:
      id: set-tormentor-occupancy
      selections:
        occupancy: 4
      assert:
        facts:
          companion.tormentorDamageControl.creatureCapacity.used: 4
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-damage-control
            - effect-tormentor-occupancy
        facts:
          companion.tormentorDamageControl.creatureCapacity.used: 4
  # Re-boarding REPLACES the board effect and evicts the occupancy record with
  # it: the boarder counts again, so used reads the fresh default of 1.
  - addOffer:
      id: board-tormentor
      assert:
        facts:
          companion.tormentorDamageControl.creatureCapacity.used: 1
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-damage-control
          notExists:
            - effect-tormentor-occupancy
        facts:
          companion.tormentorDamageControl.creatureCapacity.used: 1
  # Occupy again, commit, then de-board: the keyed replacement clears every
  # baked fact INCLUDING the occupancy record, and the station offer's gate
  # closes with them.
  - addOffer:
      id: set-tormentor-occupancy
      selections:
        occupancy: 2
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-occupancy
  - addOffer:
      id: deboard-tormentor
      assert:
        facts:
          companion.tormentorDamageControl.active: 0
          companion.tormentorDamageControl.creatureCapacity.max: 0
          companion.tormentorDamageControl.creatureCapacity.used: 0
          companion.tormentorDamageControl.creatureCapacity.occupancy: 0
        offers:
          notExists:
            - set-tormentor-occupancy
  - endTurn:
      assert:
        effects:
          notExists:
            - effect-tormentor-damage-control
            - effect-tormentor-occupancy
        facts:
          companion.tormentorDamageControl.creatureCapacity.used: 0
        offers:
          exists:
            - board-tormentor
          notExists:
            - set-tormentor-occupancy
