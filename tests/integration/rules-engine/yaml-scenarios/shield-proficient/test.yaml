name: 'Shield Proficient'
description: 'No warning or disadvantages when proficient with shields'
ruleGroups:
  - dnd-5e-2024/hands
  - dnd-5e-2024/loadout
  - dnd-5e-2024/ac
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/shield
initialEffects:
  - id: test-shield-proficiency
    phase: early
    activities:
      - type: numberSet
        target:
          fact: armor.shield.proficient
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
      assert:
        facts:
          armor.shield.proficient: 1
        offers:
          exists:
            - set-loadout
  - addOffer:
      id: set-loadout
      selections:
        loadout:
          id: shield
          hands: 1
          handsFree: 1
          items:
            - id: shield
              nameKey: rule.dnd-5e-2024.shield.effect-shield.name
              hands: 1
              twoHanded: false
              state:
                armor.shield.equipped: 1
                ac.shieldBonus: 2
      assert:
        facts:
          ac.shieldBonus: 2
          ac.value: 12
          armor.shield.equipped: 1
          attack.str.disadvantage: 0
          attack.dex.disadvantage: 0
          skill.stealth.disadvantage: 0
        planErrors:
          - id: set-loadout
            errors: []
        offers:
          legal:
            - set-loadout
