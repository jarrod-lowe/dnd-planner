name: 'Shield Proficient'
description: 'No non-proficiency penalties when proficient with shield'
ruleGroups:
  - dnd-5e-2024/ac
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/shield
  - dnd-5e-2024/spellcasting
initialEffects:
  - id: test-shield-proficiency
    phase: early
    activities:
      - type: numberSet
        target:
          fact: armor.shield.proficient
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
      assert:
        facts:
          armor.shield.proficient: 1
          spellcasting.max: 1
          spellcasting.remaining: 1
  - addOffer:
      id: don-shield
      assert:
        facts:
          ac.shieldBonus: 2
          ac.value: 12
          armor.shield.equipped: 1
          attack.str.disadvantage: 0
          attack.dex.disadvantage: 0
          initiative.disadvantage: 0
          skill.acrobatics.disadvantage: 0
          skill.athletics.disadvantage: 0
          skill.sleight-of-hand.disadvantage: 0
          skill.stealth.disadvantage: 0
          spellcasting.max: 1
          spellcasting.remaining: 1
