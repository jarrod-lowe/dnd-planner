name: 'Long Rest - Sets Flag'
description: 'Adding a long-rest offer sets the rest.long flag'
ruleGroups:
  - dnd-5e-2024/core-events
steps:
  - evaluate:
      assert:
        facts:
          rest.long: 0
        offers:
          exists:
            - record-long-rest
  - addOffer:
      id: record-long-rest
      assert:
        facts:
          rest.long: 1
