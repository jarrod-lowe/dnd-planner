name: 'Prayer of Healing Upcast'
description: 'Casting Prayer of Healing with a higher-level slot consumes that slot and persists it (per-level blocks above the base work)'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-prayer-of-healing
initialEffects:
  - id: test-grant-level3-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level3.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level3.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
  - addOffer:
      id: prepare-prayer-of-healing
  - evaluate:
      assert:
        facts:
          spellcasting.slots.level3.remaining: 1
  # Cast using the L3 slot
  - addOffer:
      id: cast-prayer-of-healing
      selections:
        slotLevel: 3
      assert:
        facts:
          actions.remaining: 0
          spellcasting.remaining: 0
          spellcasting.slots.level3.remaining: 0
  - endTurn:
      assert:
        effects:
          exists:
            - effect-prayer-of-healing-slot-l3
        facts:
          spellcasting.slots.level3.remaining: 0
