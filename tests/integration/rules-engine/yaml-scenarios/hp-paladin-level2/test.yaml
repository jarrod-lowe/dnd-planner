name: 'HP from paladin level 2'
description: 'HP calculated from paladin levels 1 and 2 using d10 max at level 1 and average d10 at level 2'
ruleGroups:
  - dnd-5e-2024/hp
  - dnd-5e-2024/ability-scores
  - class-paladin/class-paladin-level1
  - class-paladin/class-paladin-level2
steps:
  # Without CON set: 10 (L1) + 6 (L2 average) = 16
  - evaluate:
      assert:
        facts:
          hp.max: 16
          hp.current: 16

  # CON set after the class levels are present: every level reads the LIVE
  # CON modifier (2024 rules — max HP recalculates retroactively when the
  # modifier changes), so L1 and L2 each gain +2.
  - addOffer:
      id: set-constitution
      selections:
        score: 14
      assert:
        facts:
          con.modifier: 2
          hp.max: 20
          hp.current: 20

  # The recalculated max survives the turn boundary.
  - endTurn:
      assert:
        facts:
          con.modifier: 2
          hp.max: 20
          hp.current: 20
