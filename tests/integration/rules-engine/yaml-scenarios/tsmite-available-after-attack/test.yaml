name: 'Thunderous Smite - Available After Attack'
description: 'Thunderous Smite is legal after taking an Attack action'
ruleGroups:
  - species-human/species-human
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spellcasting
  - class-paladin/class-paladin-level1
  - spells/spell-thunderous-smite
steps:
  - evaluate:
      assert:
        facts:
          actions.remaining: 1
          bonusActions.remaining: 1
          spellcasting.remaining: 1
          spellcasting.slots.level1.remaining: 2
        offers:
          illegal:
            - cast-thunderous-smite
  - addOffer:
      id: unarmed-strike-use-action
      assert:
        facts:
          actions.remaining: 0
          attack.last.activation.action: 1
          bonusActions.remaining: 1
          spellcasting.remaining: 1
        offers:
          legal:
            - cast-thunderous-smite
