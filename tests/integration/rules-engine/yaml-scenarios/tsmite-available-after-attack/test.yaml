name: 'Thunderous Smite - Available After Attack'
description: >
  Thunderous Smite is legal after an Unarmed Strike. The gate is the melee
  attack, not the Attack action - and an Unarmed Strike is a melee attack the
  spell names explicitly, so it qualifies even though it is not a weapon.
ruleGroups:
  - species-human/species-human
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spellcasting
  - class-paladin/class-paladin-level1
  - spells/spell-thunderous-smite
steps:
  - evaluate:
  - addOffer:
      id: prepare-thunderous-smite
  - evaluate:
      assert:
        facts:
          actions.remaining: 1
          bonusActions.remaining: 1
          spellcasting.remaining: 1
          spellcasting.slots.level1.remaining: 2
        offers:
          illegal:
            - cast-thunderous-smite
  - addOffer:
      id: unarmed-strike-use-action
      assert:
        facts:
          actions.remaining: 0
          attack.last.melee: 1
          attack.last.weapon: 0
          attack.last.activation.action: 1
          bonusActions.remaining: 1
          spellcasting.remaining: 1
        offers:
          legal:
            - cast-thunderous-smite
        # The reminder the legacy group carried, back on the same gate as the
        # cast offer, so tapping it can always plan the smite.
        annotations:
          exists:
            - rule.spell-thunderous-smite.annotation
          addsToPlan:
            - key: rule.spell-thunderous-smite.annotation
              adds: { offer: cast-thunderous-smite }
