name: 'Extra Attack - Paladin Level 5 Grant'
description: >
  The class-paladin-level5 rule group grants Extra Attack via the shared
  extraAttacks.max budget. A Level 5 Paladin with a greataxe equipped can make
  two melee attacks off a single action, and the Extra Attack annotation shows
  on attack choices.

ruleGroups:
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/attacks
  - dnd-5e-2024/greataxe
  - class-paladin/class-paladin-level5

initialEffects:
  - id: effect-greataxe
    phase: normal
    group: [equipment-state]
    activities:
      - type: numberSet
        target:
          fact: weapon.greataxe.equipped
        source:
          number: 1
      - type: advertiseEffect
        self: true

steps:
  - evaluate:
      assert:
        facts:
          extraAttacks.max: 1
        offers:
          legal:
            - greataxe-use-action
        annotations:
          notExists:
            - rule.dnd-5e-2024.attacks.extra-attack.annotation

  - addOffer:
      id: greataxe-use-action
      assert:
        facts:
          actions.remaining: 0
          attackAction.extraRemaining: 1
        offers:
          legal:
            - greataxe-use-action
        annotations:
          exists:
            - rule.dnd-5e-2024.attacks.extra-attack.annotation

  - addOffer:
      id: greataxe-use-action
      assert:
        facts:
          attackAction.extraRemaining: 0
        offers:
          illegal:
            - greataxe-use-action
        annotations:
          notExists:
            - rule.dnd-5e-2024.attacks.extra-attack.annotation
