name: 'Searing Smite - Burning Notice'
description: >-
  Once a Searing Smite burn is live (ssmite.burnDice > 0), a NOTICE reminds the
  player of the burning target's turn-start ritual: roll its fire dice, then a
  CON save against the spell save DC ends the spell. The DC is interpolated
  from spellcasting.saveDC; the dice are deliberately NOT in the string (the
  summed burnDice fact would read as one wrong number with burns on several
  targets — per-target dice live on each effect chip). No burn committed, no
  notice; the notice persists across turns while the burn marker lives.
ruleGroups:
  - dnd-5e-2024/prepared-spells
  - species-human/species-human
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spellcasting
  - class-paladin/class-paladin-level1
  - spells/spell-searing-smite
steps:
  - evaluate:
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: searing-smite
            level: 1
            nameKey: rule.spell-searing-smite.offer-searing-smite.name
            preparedFact: spell.l1.searingSmite.prepared
            alwaysPreparedFact: spell.l1.searingSmite.alwaysPrepared
  - evaluate:
      assert:
        annotations:
          # Prepared but nothing burning: no notice.
          notExists:
            - rule.spell-searing-smite.notice-burning
  - addOffer:
      id: unarmed-strike-use-action
  - addOffer:
      id: cast-searing-smite
      selections:
        slotLevel: 1
      assert:
        facts:
          ssmite.burnDice: 1
        annotations:
          exists:
            - rule.spell-searing-smite.notice-burning
          targets:
            - key: rule.spell-searing-smite.notice-burning
              targets: [notice]
          # The slot-1 burn's per-turn fire dice as the roll the player makes
          # each burning turn; count = the scenario's burnDice.
          rolls:
            - key: rule.spell-searing-smite.notice-burning
              roll: { sides: 6, count: 1, damageType: fire, purpose: damage }
  - endTurn:
      assert:
        facts:
          ssmite.burnDice: 1
        annotations:
          # The burn marker survives the turn boundary, and so does the notice.
          exists:
            - rule.spell-searing-smite.notice-burning
