name: 'Steed Movement Fly L4'
description: 'Steed can fly at L4+ but not at L2'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-find-steed
initialEffects:
  - id: test-grant-level4-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level4.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level4.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  # Verify Find Steed is available
  - evaluate:
      assert:
        offers:
          exists:
            - cast-find-steed
  # Cast Find Steed at L4
  - addOffer:
      id: cast-find-steed
      selections:
        slotLevel: 4
  - endTurn:
      assert:
        facts:
          companion.steed.summoned: 1
          companion.steed.fly.can: 1
          companion.steed.movement.total: 60
  # Next turn: fly offer should be available
  - evaluate:
      assert:
        offers:
          exists:
            - steed-move-fly
  # Fly 30 feet
  - addOffer:
      id: steed-move-fly
      selections:
        distance: 30
      assert:
        facts:
          companion.steed.movement.remaining: 30
