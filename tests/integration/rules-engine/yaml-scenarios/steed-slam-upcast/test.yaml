name: 'Steed Otherworldly Slam Upcast'
description: 'Slam damage bonus scales with spell level when upcast'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-find-steed
initialEffects:
  - id: test-grant-level3-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level3.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level3.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  - evaluate: {}
  - addOffer:
      id: prepare-find-steed
  # Cast Find Steed at L3
  - evaluate:
      assert:
        offers:
          exists:
            - cast-find-steed
  - addOffer:
      id: cast-find-steed
      selections:
        slotLevel: 3
  - endTurn: {}
  # Next turn: slam offer available with L3 stats
  - evaluate:
      assert:
        facts:
          companion.steed.hp.max: 35
        offers:
          exists:
            - steed-slam
  - addOffer:
      id: steed-slam
      assert:
        facts:
          companion.steed.actions.remaining: 0
