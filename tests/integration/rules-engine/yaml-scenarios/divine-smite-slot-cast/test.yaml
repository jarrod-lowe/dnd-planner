name: 'Divine Smite - Slot Cast'
description: 'A prepared Divine Smite (no free use) consumes a bonus action, spellcasting, and a spell slot'
ruleGroups:
  - species-human/species-human
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spellcasting
  - class-paladin/class-paladin-level1
  - spells/spell-divine-smite
steps:
  # Prepare first
  - evaluate: {}
  - addOffer:
      id: prepare-divine-smite
      assert:
        facts:
          spell.l1.divineSmite.prepared: 1
          bonusActions.remaining: 1
          spellcasting.remaining: 1
          spellcasting.slots.level1.remaining: 2
          paladinSmite.remaining: 0
  # Attack first (prerequisite for smite)
  - addOffer:
      id: unarmed-strike-use-action
      assert:
        facts:
          attack.last.activation.action: 1
        offers:
          legal:
            - cast-divine-smite
  # Cast with a level 1 slot
  - addOffer:
      id: cast-divine-smite
      selections:
        slotLevel: 1
      assert:
        facts:
          bonusActions.remaining: 0
          spellcasting.remaining: 0
          spellcasting.slots.level1.remaining: 1
          paladinSmite.remaining: 0
