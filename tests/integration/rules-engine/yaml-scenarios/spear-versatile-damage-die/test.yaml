name: 'Spear Versatile Damage Die'
description: >
  A versatile weapon's grip is part of the LOADOUT, not the attack, so the dice
  line carries one melee band and its damage die is a live fact of the equipped
  grip (attack.spear.damageDie: d6 one-handed, d8 two-handed). The thrown bands
  pin the one-handed die — the grip changes what you swing with, not what you
  throw.

ruleGroups:
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spear

initialEffects:
  - id: effect-spear
    phase: normal
    group: [equipment-state]
    activities:
      - type: numberSet
        target:
          fact: weapon.spear.equipped
        source:
          number: 1
      - type: advertiseEffect
        self: true

steps:
  - evaluate:
      assert:
        facts:
          weapon.spear.equipped: 1
          weapon.spear.twoHanded: 0
          attack.spear.damageDie: 6
        offerVars:
          - id: spear-use-action
            vars:
              ranges:
                default:
                  array:
                    - distance: 5
                      type: melee
                      label:
                        fact: weapon.spear.twoHanded
                        map:
                          '0': rule.dnd-5e-2024.loadout.grip.one-handed
                          '1': rule.dnd-5e-2024.loadout.grip.two-handed
                    - distance: 20
                      type: thrown
                      damageDie: 6
                    - distance: 60
                      type: thrown
                      damageDie: 6
                      disadvantage: true
              damageDie:
                default:
                  fact: attack.spear.damageDie
