name: 'Calm Emotions - Illegal When No Free Slots Remain'
description: >-
  When the only spell slot has already been consumed (remaining 0), planning a
  Calm Emotions cast must flag the planned choice illegal with a no_slots error,
  not silently appear legal. The planned-item legality is driven by
  varsRuntime.errors, so the cast must record no_slots even when no per-level
  slot subtraction fires (selectedLevel resolves to 0).
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/concentration
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-calm-emotions
initialEffects:
  - id: test-grant-depleted-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 0
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
  - addOffer:
      id: prepare-calm-emotions
  # Offer itself is illegal (no slots at all)
  - evaluate:
      assert:
        facts:
          spellcasting.slots.level2.remaining: 0
        offers:
          illegal:
            - cast-calm-emotions
  # Planning it anyway must surface a no_slots error on the planned choice
  - addOffer:
      id: cast-calm-emotions
      assert:
        planErrors:
          - id: cast-calm-emotions
            index: 0
            errors:
              - rule.spell-calm-emotions.offer-calm-emotions.no_slots
