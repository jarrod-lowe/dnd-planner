name: 'Heroic Inspiration - Effect Active Grant Plus Use'
description: 'Effect active, grant-hi + use-hi planned → grant errors, use no error'
ruleGroups:
  - dnd-5e-2024/core-events
  - dnd-5e-2024/heroic-inspiration
initialEffects:
  - id: effect-hi-set
    phase: early
    group:
      - hi-set
    ui:
      name: rule.dnd-5e-2024.heroic-inspiration.effect-hi.name
    activities:
      - type: numberSet
        source:
          number: 1
        target:
          fact: heroicInspiration.remaining
        when:
          - fact: heroicInspiration.consumed
            operator: equals
            value: 0
  - id: effect-hi-persist
    phase: early
    after:
      - group: hi-consume
    group:
      - hi-settle
    ui:
      name: rule.dnd-5e-2024.heroic-inspiration.effect-hi.name
      hidden: true
    activities:
      - type: advertiseEffect
        self: true
        when:
          - fact: heroicInspiration.consumed
            operator: equals
            value: 0
      - type: advertiseEffect
        rule:
          id: effect-hi-set
          phase: early
          group:
            - hi-set
          ui:
            name: rule.dnd-5e-2024.heroic-inspiration.effect-hi.name
          activities:
            - type: numberSet
              source:
                number: 1
              target:
                fact: heroicInspiration.remaining
              when:
                - fact: heroicInspiration.consumed
                  operator: equals
                  value: 0
        when:
          - fact: heroicInspiration.consumed
            operator: equals
            value: 0
steps:
  # Effect active, use-hi legal, grant-hi illegal
  - evaluate:
      assert:
        facts:
          heroicInspiration.remaining: 1
        offers:
          legal:
            - use-hi
          illegal:
            - grant-hi
  # Add use-hi first — should have no errors
  - addOffer:
      id: use-hi
      assert:
        facts:
          heroicInspiration.remaining: 0
          heroicInspiration.consumed: 1
        planErrors:
          - id: use-hi
            index: 0
            errors: []
  # Force grant-hi into plan — should have already_has error
  # use-hi should still have no errors (remaining was set by effect before use-hi consumed it)
  - addOffer:
      id: grant-hi
      assert:
        planErrors:
          - id: use-hi
            index: 0
            errors: []
          - id: grant-hi
            index: 0
            errors:
              - rule.dnd-5e-2024.heroic-inspiration.grant-hi-offer.already_has
