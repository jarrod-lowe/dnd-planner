name: 'Hands - Dagger Uses 1 Hand'
description: >
  Donning a dagger decrements hands.remaining by 1.

ruleGroups:
  - dnd-5e-2024/hands
  - dnd-5e-2024/core-events
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/attacks
  - dnd-5e-2024/dagger

steps:
  - evaluate:
      assert:
        facts:
          hands.max: 2
          hands.remaining: 2
        offers:
          exists:
            - don-dagger
  - addOffer:
      id: don-dagger
      assert:
        facts:
          weapon.dagger.equipped: 1
          hands.remaining: 1
