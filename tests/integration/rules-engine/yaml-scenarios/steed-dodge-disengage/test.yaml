name: 'Steed Dodge and Disengage'
description: 'Steed can dodge and disengage, consuming its action. Both become illegal when action spent.'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-find-steed
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  # Verify Find Steed is available
  - evaluate:
      assert:
        offers:
          exists:
            - cast-find-steed
  # Cast Find Steed
  - addOffer:
      id: cast-find-steed
  - endTurn: {}
  # Next turn: dodge and disengage available
  - evaluate:
      assert:
        offers:
          exists:
            - steed-dodge
            - steed-disengage
  # Dodge: consumes steed action
  - addOffer:
      id: steed-dodge
      assert:
        facts:
          companion.steed.actions.remaining: 0
  # Dodge and disengage now illegal (no steed action)
  - evaluate:
      assert:
        offers:
          illegal:
            - steed-dodge
            - steed-disengage
