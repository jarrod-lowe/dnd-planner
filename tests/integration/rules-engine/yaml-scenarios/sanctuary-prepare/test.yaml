name: 'Sanctuary Prepare'
description: 'Cast offer requires preparation first; prepare/unprepare lifecycle works'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-sanctuary
steps:
  # TC1: Before preparing, cast-sanctuary is absent; prepare offer exists
  - evaluate:
      assert:
        facts:
          spell.l1.sanctuary.prepared: 0
        offers:
          notExists:
            - cast-sanctuary
          exists:
            - prepare-sanctuary
  # TC2: After preparing, cast-sanctuary becomes available
  - addOffer:
      id: prepare-sanctuary
      assert:
        facts:
          spell.l1.sanctuary.prepared: 1
          spellcasting.prepared.count: 1
  - evaluate:
      assert:
        offers:
          exists:
            - cast-sanctuary
