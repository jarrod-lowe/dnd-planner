name: 'Heroic Inspiration - Grant'
description: 'Granting HI sets remaining to 1 and creates a persistent effect'
ruleGroups:
  - dnd-5e-2024/core-events
  - dnd-5e-2024/heroic-inspiration
steps:
  # HI resource initialized: max=1, remaining=0 (no auto-reset)
  - evaluate:
      assert:
        facts:
          heroicInspiration.max: 1
          heroicInspiration.remaining: 0
        offers:
          exists:
            - grant-hi
  # Grant HI
  - addOffer:
      id: grant-hi
      assert:
        facts:
          heroicInspiration.max: 1
          heroicInspiration.remaining: 1
