name: 'Condition Frightened - Skill Flags'
description: >-
  The flags-exclusion regression under co-writers: the untrained-armor
  derives write their facts and Frightened adds NOTHING to them (the per-row
  model — the chip carries Frightened's disadvantage, so the shared max-combined
  flags stay source-pure and per-row subtraction is never needed). Don leather
  untrained, then record Frightened: the armor-derived flags stay 1 (armor's
  own contribution), the armor-untouched perception flag stays 0 (nothing but
  Frightened would have written it, and Frightened no longer does).
ruleGroups:
  - dnd-5e-2024/leather-armor
  - dnd-5e-2024/condition-frightened
initialFacts:
  armor.light.proficient: 0
steps:
  # Don leather armor without Light-armor training: the untrained penalties
  # derive the STR/DEX attack flags, initiative, and 4 skill flags at 1
  # (combine: max on the armor side).
  - addOffer:
      id: don-leather-armor
      assert:
        facts:
          armor.leather.equipped: 1
          attack.str.disadvantage: 1
          attack.dex.disadvantage: 1
          initiative.disadvantage: 1
          skill.athletics.disadvantage: 1
          skill.stealth.disadvantage: 1
  # Now be frightened on top: a second SOURCE on the shared facts — but the
  # per-row model keeps Frightened out of them entirely. Armor flags stay 1
  # (armor's alone), perception stays 0, and check.disadvantage never arrives
  # (the chip supplies it per row instead).
  - addOffer:
      id: record-frightened
      assert:
        facts:
          condition.frightened: 1
          attack.str.disadvantage: 1
          attack.dex.disadvantage: 1
          initiative.disadvantage: 1
          check.disadvantage: 0
          skill.athletics.disadvantage: 1
          skill.stealth.disadvantage: 1
          skill.perception.disadvantage: 0
        annotations:
          exists:
            - rule.dnd-5e-2024.condition-frightened.notice
