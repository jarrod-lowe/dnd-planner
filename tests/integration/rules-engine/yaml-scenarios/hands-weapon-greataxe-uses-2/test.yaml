name: 'Hands - Greataxe Uses 2 Hands'
description: >
  A loadout holding a greataxe spends both hands, leaving none free.

ruleGroups:
  - dnd-5e-2024/hands
  - dnd-5e-2024/loadout
  - dnd-5e-2024/core-events
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/attacks
  - dnd-5e-2024/greataxe

steps:
  - evaluate:
      assert:
        facts:
          hands.max: 2
          hands.remaining: 2
        offers:
          exists:
            - set-loadout
  - addOffer:
      id: set-loadout
      selections:
        loadout:
          id: greataxe
          hands: 2
          handsFree: 0
          items:
            - id: greataxe
              nameKey: rule.dnd-5e-2024.attacks.greataxe.name
              hands: 2
              twoHanded: false
              state:
                weapon.greataxe.equipped: 1
      assert:
        facts:
          weapon.greataxe.equipped: 1
          hands.remaining: 0
