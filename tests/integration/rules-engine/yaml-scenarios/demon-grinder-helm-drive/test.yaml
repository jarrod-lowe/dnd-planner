name: 'Demon Grinder - Drive From The Helm'
description: >-
  Drive is the HELM's movement offer, the factory's generic machinery on the
  Grinder's numbers: it exists only while the Helm seat is held, it captures
  a DISTANCE bounded by the derived movement total (the pool is the FUEL's —
  a soul coin opens 100 ft.), and apply spends the player's ACTION and the
  distance against the SHARED player-level movement spend
  (companion.vehicle.movement.spent) in ONE endOfTurn effect. Leaving the
  seat hides the offer while the vehicle's state (the fuel record) stands —
  re-taking brings it back.
ruleGroups:
  - vehicles/demon-grinder
  - dnd-5e-2024/action-economy
steps:
  - addOffer:
      id: acquire-demon-grinder
  - addOffer:
      id: take-demon-grinder-helm-seat
  # Unfuelled: the pool is empty — Drive exists (the seat is held) but is
  # illegal on the out-of-movement leg.
  - evaluate:
      assert:
        offers:
          exists:
            - drive-demon-grinder
          illegal:
            - drive-demon-grinder
  - addOffer:
      id: set-demon-grinder-fuel
      selections:
        fuel: 1
  - endTurn:
      assert:
        facts:
          companion.demonGrinder.speed.effective: 100
          companion.demonGrinder.movement.total: 100
          companion.demonGrinder.movement.remaining: 100
  # Drive 40 ft.: the action and the distance land in ONE endOfTurn effect,
  # the distance on the SHARED player-level spend.
  - addOffer:
      id: drive-demon-grinder
      selections:
        distance: 40
      assert:
        facts:
          actions.remaining: 0
          companion.vehicle.movement.spent: 40
          companion.demonGrinder.movement.total: 100
          companion.demonGrinder.movement.remaining: 60
        planErrors:
          - id: drive-demon-grinder
            index: 0
            errors: []
  - endTurn:
      assert:
        facts:
          companion.demonGrinder.movement.remaining: 100
          companion.demonGrinder.seats.helm: 1
  # Leave the Helm: the offer goes with the seat, the fuel record stays, and
  # the pool keeps reading off it.
  - addOffer:
      id: leave-demon-grinder-helm-seat
      assert:
        facts:
          companion.demonGrinder.fuel.current: 1
          companion.demonGrinder.movement.remaining: 100
        offers:
          notExists:
            - drive-demon-grinder
  - endTurn:
      assert:
        facts:
          companion.demonGrinder.fuel.recorded: 1
          companion.demonGrinder.speed.effective: 100
  # Re-take: the offer returns.
  - addOffer:
      id: take-demon-grinder-helm-seat
  - evaluate:
      assert:
        offers:
          exists:
            - drive-demon-grinder
