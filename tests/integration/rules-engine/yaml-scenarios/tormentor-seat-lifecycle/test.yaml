name: 'Tormentor - Seat Lifecycle'
description: >-
  The seat effect rides the acquire lifecycle like every other vehicle
  record: the seat key joins the acquire effect's dependents, and the
  acquire/abandon applies advertise the empty same-key eviction beside their
  replacement — a re-acquired vehicle starts with NO seat (used 0/4 until one
  is taken). Capacity math along the way: recorded occupancy 3 plus the
  seated player reads used 4 of 4, and leaving the seat drops it to 3.
ruleGroups:
  - vehicles/tormentor
steps:
  - addOffer:
      id: acquire-tormentor
  - addOffer:
      id: take-tormentor-passenger-seat
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-acquire
            - effect-tormentor-seat-passenger
        facts:
          companion.tormentor.seats.passenger: 1
          companion.tormentor.creatureCapacity.used: 1
  # Capacity math: 3 recorded occupants + the seated player = 4 of 4.
  - addOffer:
      id: set-tormentor-occupancy
      selections:
        occupancy: 3
      assert:
        facts:
          companion.tormentor.creatureCapacity.used: 4
  # Leaving frees the seat: used falls to the recorded occupancy alone (3).
  - addOffer:
      id: leave-tormentor-passenger-seat
      assert:
        facts:
          companion.tormentor.seats.passenger: 0
          companion.tormentor.creatureCapacity.used: 3
  - endTurn:
      assert:
        effects:
          notExists:
            - effect-tormentor-seat-passenger
        facts:
          companion.tormentor.creatureCapacity.used: 3
  # Take it again and commit: the one keyed seat effect returns.
  - addOffer:
      id: take-tormentor-passenger-seat
      assert:
        facts:
          companion.tormentor.creatureCapacity.used: 4
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-seat-passenger
        facts:
          companion.tormentor.seats.passenger: 1
  # Abandon evicts the seat with everything else: the seat fact, the capacity
  # and the offers' structural gate all go.
  - addOffer:
      id: abandon-tormentor
      assert:
        facts:
          companion.tormentor.active: 0
          companion.tormentor.seats.passenger: 0
          companion.tormentor.creatureCapacity.used: 0
        offers:
          notExists:
            - take-tormentor-passenger-seat
            - leave-tormentor-passenger-seat
  - endTurn:
      assert:
        effects:
          notExists:
            - effect-tormentor-acquire
            - effect-tormentor-seat-passenger
        facts:
          companion.tormentor.seats.passenger: 0
  # Re-acquire starts FRESH: no seat stands, used reads 0/4, and the take
  # offer is legal again.
  - addOffer:
      id: acquire-tormentor
      assert:
        facts:
          companion.tormentor.seats.passenger: 0
          companion.tormentor.creatureCapacity.used: 0
        offers:
          legal:
            - take-tormentor-passenger-seat
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-acquire
          notExists:
            - effect-tormentor-seat-passenger
        facts:
          companion.tormentor.seats.passenger: 0
          companion.tormentor.creatureCapacity.used: 0
