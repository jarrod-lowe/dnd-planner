name: 'Steed Dash Action'
description: 'Steed can dash to gain extra movement, consuming its action'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-find-steed
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  # Verify Find Steed is available
  - evaluate:
      assert:
        offers:
          exists:
            - cast-find-steed
  # Cast Find Steed
  - addOffer:
      id: cast-find-steed
  - endTurn: {}
  # Next turn: dash offer available
  - evaluate:
      assert:
        facts:
          companion.steed.movement.total: 60
          companion.steed.movement.remaining: 60
          companion.steed.actions.remaining: 1
        offers:
          exists:
            - steed-dash
  # Dash: adds 60 movement, consumes steed action
  - addOffer:
      id: steed-dash
      assert:
        facts:
          companion.steed.movement.total: 120
          companion.steed.movement.remaining: 120
          companion.steed.actions.remaining: 0
  # Dash should now be illegal (no steed actions)
  - evaluate:
      assert:
        offers:
          illegal:
            - steed-dash
