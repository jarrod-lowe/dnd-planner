name: 'Divinity - Short Rest Reset'
description: 'Short Rest recovers 1 Divinity point, Long Rest recovers all'
ruleGroups:
  - class-paladin/class-paladin-level1
  - class-paladin/class-paladin-level2
  - class-paladin/class-paladin-divinity
  - class-paladin/class-paladin-level3
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/core-events
steps:
  # Use both Divinity points
  - evaluate:
      assert:
        facts:
          divinity.remaining: 2
  - addOffer:
      id: divine-sense
      assert:
        facts:
          divinity.remaining: 1
  - endTurn:
      assert:
        facts:
          divinity.remaining: 1
  - evaluate:
      assert:
        facts:
          divinity.remaining: 1
  - addOffer:
      id: divine-sense
      assert:
        facts:
          divinity.remaining: 0
  - endTurn:
      assert:
        facts:
          divinity.remaining: 0
  # Short Rest - recover 1 point
  - evaluate:
      assert:
        facts:
          divinity.remaining: 0
        offers:
          illegal:
            - divine-sense
  - addOffer:
      id: record-short-rest
      assert:
        facts:
          divinity.remaining: 1
  - endTurn:
      assert:
        facts:
          divinity.remaining: 1
  # Recovery persists after short rest
  - evaluate:
      assert:
        facts:
          divinity.remaining: 1
        offers:
          exists:
            - divine-sense
  # Use the recovered point
  - addOffer:
      id: divine-sense
      assert:
        facts:
          divinity.remaining: 0
  - endTurn:
      assert:
        facts:
          divinity.remaining: 0
  # Short Rest again - recover 1 more point
  - evaluate:
      assert:
        facts:
          divinity.remaining: 0
  - addOffer:
      id: record-short-rest
      assert:
        facts:
          divinity.remaining: 1
  - endTurn:
      assert:
        facts:
          divinity.remaining: 1
  # Long Rest - recover all
  - evaluate:
      assert:
        facts:
          divinity.remaining: 1
  - addOffer:
      id: record-long-rest
      assert:
        facts:
          divinity.remaining: 2
  - endTurn:
      assert:
        facts:
          divinity.remaining: 2
  # Verify full pool after Long Rest
  - evaluate:
      assert:
        facts:
          divinity.total: 2
          divinity.remaining: 2
