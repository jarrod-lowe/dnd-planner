name: 'Steed Damage Threshold Bounces the Recorder'
description: >-
  The steed's damage recorder consults the shared factory's threshold gate on
  the steed's natural fact name, companion.steed.damageThreshold. No module
  derives it, so today it is unset (reads 0, never gates — the recorder's
  existing behaviour is pinned by steed-damage-accumulates); this scenario
  seeds it as a committed effect beside the summon, and the recorder adapts on
  its own (threshold model v2: sub-threshold damage is LEGAL to attempt): a
  Use-Threshold blow BELOW the fact records NOTHING and commits the hidden
  bounce marker whose annotate pass surfaces the informational
  below-threshold annotation on the STEED damage panel — never a diagnostic —
  while an Ignore-Threshold blow records the RAW amount in full, and a blow AT
  the threshold records the running total like an ungated recorder.
ruleGroups:
  - dnd-5e-2024/prepared-spells
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-find-steed
steps:
  - evaluate: {}
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: find-steed
            level: 2
            nameKey: rule.spell-find-steed.offer-find-steed.name
            preparedFact: spell.l2.findSteed.prepared
            alwaysPreparedFact: spell.l2.findSteed.alwaysPrepared
  - evaluate:
      assert:
        offers:
          exists:
            - cast-find-steed
  - addOffer:
      id: cast-find-steed
  - endTurn:
      assert:
        facts:
          companion.steed.hp.current: 25
  # IGNORE THRESHOLD first (before any bounce exists): the GM-correction mode
  # records the RAW amount in full — no marker, no annotation, no error.
  - addOffer:
      id: steed-record-damage
      selections:
        amount: 9
        thresholdMode: 1
      assert:
        facts:
          companion.steed.hp.damageRecorded: 9
          companion.steed.hp.current: 16
        planErrors:
          - id: steed-record-damage
            index: 0
            errors: []
        annotations:
          notExists:
            - rule.spell-find-steed.steed-record-damage.below_threshold
  - endTurn:
      assert:
        effects:
          exists:
            - effect-steed-hp-damage
          notExists:
            - effect-steed-hp-bounce
  # Sub-threshold (9 < the seeded 10) in USE mode: the blow bounces — no
  # record, no fact change, no planErrors — and the annotation carries the
  # feedback on the steed's damage panel (the .companion-scoped label).
  - addOffer:
      id: steed-record-damage
      selections:
        amount: 9
      assert:
        facts:
          companion.steed.hp.damageRecorded: 9
          companion.steed.hp.current: 16
        planErrors:
          - id: steed-record-damage
            index: 0
            errors: []
        annotations:
          exists:
            - rule.spell-find-steed.steed-record-damage.below_threshold
          targets:
            - key: rule.spell-find-steed.steed-record-damage.below_threshold
              targets:
                - damage.steed.companion
  # The marker commits with the turn and the annotation stands while it does.
  - endTurn:
      assert:
        effects:
          exists:
            - effect-steed-hp-bounce
        facts:
          companion.steed.hp.current: 16
        annotations:
          exists:
            - rule.spell-find-steed.steed-record-damage.below_threshold
  # USE mode at the threshold: the running-total record lands exactly as the
  # ungated corpus pins it.
  - evaluate:
      assert:
        offers:
          legal:
            - steed-record-damage
  - addOffer:
      id: steed-record-damage
      selections:
        amount: 10
      assert:
        facts:
          companion.steed.hp.damageRecorded: 19
          companion.steed.hp.current: 6
        planErrors:
          - id: steed-record-damage
            index: 0
            errors: []
  - endTurn:
      assert:
        effects:
          exists:
            - effect-steed-hp-damage
        facts:
          companion.steed.hp.current: 6
