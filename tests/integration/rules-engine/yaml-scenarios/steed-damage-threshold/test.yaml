name: 'Steed Damage Threshold Bounces the Recorder'
description: >-
  The steed's damage recorder consults the shared factory's threshold gate on
  the steed's natural fact name, companion.steed.damageThreshold. No module
  derives it, so today it is unset (reads 0, never gates — the recorder's
  existing behaviour is pinned by steed-damage-accumulates); this scenario
  seeds it as a committed effect beside the summon, and the recorder adapts
  on its own (threshold model v2: sub-threshold damage is LEGAL to attempt):
  a Use-Threshold blow BELOW the fact records NOTHING and returns a 'notice'
  diagnostic that rides THAT planned row alone (never an error, never an
  annotation), while an Ignore-Threshold blow records the RAW amount in full,
  and a blow AT the threshold records the running total like an ungated
  recorder.
ruleGroups:
  - dnd-5e-2024/prepared-spells
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-find-steed
steps:
  - evaluate: {}
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: find-steed
            level: 2
            nameKey: rule.spell-find-steed.offer-find-steed.name
            preparedFact: spell.l2.findSteed.prepared
            alwaysPreparedFact: spell.l2.findSteed.alwaysPrepared
  - evaluate:
      assert:
        offers:
          exists:
            - cast-find-steed
  - addOffer:
      id: cast-find-steed
  - endTurn:
      assert:
        facts:
          companion.steed.hp.current: 25
        # The steed's recorder surface, pinned UNCHANGED beside the vehicle
        # immunities note (PR-9): the steed configures no immunities option,
        # so its damage row is exactly the row it has always been (the
        # no-annotationLabels pin is unit-level — the yaml ui assert compares
        # expected keys only and cannot pin an absent key).
        offerUi:
          - id: steed-record-damage
            ui:
              subject: steed
              name: rule.spell-find-steed.steed-record-damage.name
  # IGNORE THRESHOLD first (before any bounce exists): the GM-correction mode
  # records the RAW amount in full — no bounce note, no error.
  - addOffer:
      id: steed-record-damage
      selections:
        amount: 9
        thresholdMode: 1
      assert:
        facts:
          companion.steed.hp.damageRecorded: 9
          companion.steed.hp.current: 16
        planErrors:
          - id: steed-record-damage
            index: 0
            errors: []
  - endTurn:
      assert:
        effects:
          exists:
            - effect-steed-hp-damage
  # THE USER REPRO: TWO damage rows planned — one sub-threshold in Use mode,
  # one landing at the threshold. The bounce note is a per-row 'notice'
  # diagnostic: ONLY the bounced row carries it, the landing row never does,
  # and the plan stays legal.
  - addOffer:
      id: steed-record-damage
      selections:
        amount: 10
      assert:
        planErrors:
          - id: steed-record-damage
            index: 0
            errors: []
  - addOffer:
      id: steed-record-damage
      selections:
        amount: 9
      assert:
        facts:
          # 9 (committed ignore-mode) + 10 (the landing row): the bounced row
          # adds nothing.
          companion.steed.hp.damageRecorded: 19
          companion.steed.hp.current: 6
        planErrors:
          - id: steed-record-damage
            index: 0
            errors: []
          - id: steed-record-damage
            index: 1
            errors:
              - rule.spell-find-steed.steed-record-damage.below_threshold
        status:
          legal: true
  # The bounced row commits NOTHING at end of turn — no marker effect, no
  # record. The note lived on the planned row and leaves with it.
  - endTurn:
      assert:
        effects:
          exists:
            - effect-steed-hp-damage
          notExists:
            - effect-steed-hp-bounce
        facts:
          companion.steed.hp.current: 6
