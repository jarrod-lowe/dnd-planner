name: 'Steed Damage Threshold Gates the Recorder'
description: >-
  The steed's damage recorder consults the builder's generic threshold gate on
  the steed's natural fact name, companion.steed.damageThreshold. No module
  derives it, so today it is unset (reads 0, never gates — the recorder's
  existing behaviour is pinned by steed-damage-accumulates); this scenario
  seeds it as a committed effect beside the summon, and the recorder adapts on
  its own: a blow BELOW the fact records NOTHING and flags the row with the
  find-steed below-threshold diagnostic while the offer stays legal, and a blow
  AT the threshold records the running total like an ungated recorder.
ruleGroups:
  - dnd-5e-2024/prepared-spells
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-find-steed
steps:
  - evaluate: {}
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: find-steed
            level: 2
            nameKey: rule.spell-find-steed.offer-find-steed.name
            preparedFact: spell.l2.findSteed.prepared
            alwaysPreparedFact: spell.l2.findSteed.alwaysPrepared
  - evaluate:
      assert:
        offers:
          exists:
            - cast-find-steed
  - addOffer:
      id: cast-find-steed
  - endTurn:
      assert:
        facts:
          companion.steed.hp.current: 25
  # Sub-threshold (9 < the seeded 10): the blow bounces — no record, no fact
  # change, the row carries the find-steed diagnostic.
  - addOffer:
      id: steed-record-damage
      selections:
        amount: 9
      assert:
        facts:
          companion.steed.hp.current: 25
          companion.steed.hp.damageRecorded: 0
        planErrors:
          - id: steed-record-damage
            index: 0
            errors:
              - rule.spell-find-steed.steed-record-damage.below_threshold
  - endTurn:
      assert:
        effects:
          notExists:
            - effect-steed-hp-damage
        facts:
          companion.steed.hp.current: 25
  # The recorder stays LEGAL — and at the threshold the running-total record
  # lands exactly as the ungated corpus pins it.
  - evaluate:
      assert:
        offers:
          legal:
            - steed-record-damage
  - addOffer:
      id: steed-record-damage
      selections:
        amount: 10
      assert:
        facts:
          companion.steed.hp.damageRecorded: 10
          companion.steed.hp.current: 15
        planErrors:
          - id: steed-record-damage
            index: 0
            errors: []
  - endTurn:
      assert:
        effects:
          exists:
            - effect-steed-hp-damage
        facts:
          companion.steed.hp.current: 15
