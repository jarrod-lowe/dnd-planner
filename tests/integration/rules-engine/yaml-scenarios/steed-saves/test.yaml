name: 'Steed Saving Throws'
description: 'Steed has save rollers for all 6 abilities with correct modifiers from stat block'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-find-steed
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  # Verify Find Steed is available
  - evaluate:
      assert:
        offers:
          exists:
            - cast-find-steed
  # Cast Find Steed
  - addOffer:
      id: cast-find-steed
  - endTurn:
      assert:
        facts:
          companion.steed.str.modifier: 4
          companion.steed.dex.modifier: 1
          companion.steed.con.modifier: 2
          companion.steed.int.modifier: -2
          companion.steed.wis.modifier: 1
          companion.steed.cha.modifier: -1
  # Next turn: all save offers available
  - evaluate:
      assert:
        offers:
          exists:
            - steed-save-str
            - steed-save-dex
            - steed-save-con
            - steed-save-int
            - steed-save-wis
            - steed-save-cha
