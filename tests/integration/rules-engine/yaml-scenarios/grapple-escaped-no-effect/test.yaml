name: 'Grapple - target saves, no hand consumed, no Grappling effect'
description: >
  When the target SUCCEEDS on its STR/DEX save (passed=1) the grapple does not
  take hold: no Grappling effect is created and the hand is NOT consumed for the
  attempt (the target slipped free), so the hand stays available this turn and
  no effect persists.

ruleGroups:
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/hands
  - dnd-5e-2024/grapple

steps:
  - evaluate:
      assert:
        facts:
          hands.remaining: 2
        offers:
          exists:
            - grapple-action

  # Attempt the grapple; the target saves (passed=1). The hand is not consumed
  # because the grapple did not take hold (no creature held).
  - addOffer:
      id: grapple-action
      selections:
        passed: 1
      assert:
        facts:
          hands.remaining: 2

  # No Grappling effect is created.
  - endTurn:
      assert:
        facts:
          hands.remaining: 2
        effects:
          notExists:
            - effect-grappling
