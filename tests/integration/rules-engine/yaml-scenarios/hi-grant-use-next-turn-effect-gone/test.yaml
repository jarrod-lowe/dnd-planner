name: 'Heroic Inspiration - Grant Use Next Turn Effect Gone'
description: 'Grant + use same turn, end turn, effect does not persist'
ruleGroups:
  - dnd-5e-2024/core-events
  - dnd-5e-2024/heroic-inspiration
steps:
  - evaluate:
      assert:
        facts:
          heroicInspiration.remaining: 0
        offers:
          legal:
            - grant-hi
          illegal:
            - use-hi
  - addOffer:
      id: grant-hi
      assert:
        facts:
          heroicInspiration.remaining: 1
        planErrors:
          - id: grant-hi
            index: 0
            errors: []
  - addOffer:
      id: use-hi
      assert:
        facts:
          heroicInspiration.remaining: 0
          heroicInspiration.consumed: 1
        planErrors:
          - id: grant-hi
            index: 0
            errors: []
          - id: use-hi
            index: 0
            errors: []
  - endTurn:
      assert:
        facts:
          heroicInspiration.remaining: 0
        effects:
          notExists:
            - effect-hi-set
