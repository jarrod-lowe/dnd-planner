name: 'Calm Emotions - Illegal When Selected Level Has No Remaining Slots'
description: >-
  If the player up-casts to L3 but only L2 slots remain, the planned action is
  illegal with a no_slots error. The overall offer is still legal (L2 available).
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/concentration
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-calm-emotions
initialEffects:
  - id: test-grant-slots
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level3.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level3.remaining
        source:
          number: 0
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
  - addOffer:
      id: prepare-calm-emotions
  - evaluate:
      assert:
        offers:
          legal:
            - cast-calm-emotions
  - addOffer:
      id: cast-calm-emotions
      selections:
        slotLevel: 3
      assert:
        planErrors:
          - id: cast-calm-emotions
            index: 0
            errors:
              - rule.spell-calm-emotions.offer-calm-emotions.no_slots
