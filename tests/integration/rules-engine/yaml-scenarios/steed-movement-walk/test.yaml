name: 'Steed Movement Walk'
description: 'Steed can walk using its own movement pool. Movement resets each turn.'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-find-steed
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  # Verify Find Steed is available
  - evaluate:
      assert:
        offers:
          exists:
            - cast-find-steed
  # Cast Find Steed
  - addOffer:
      id: cast-find-steed
  - endTurn:
      assert:
        facts:
          companion.steed.summoned: 1
          companion.steed.speed: 60
          companion.steed.movement.total: 60
          companion.steed.movement.remaining: 60
  # Next turn: movement reset, walk offer available
  - evaluate:
      assert:
        facts:
          companion.steed.movement.total: 60
          companion.steed.movement.remaining: 60
        offers:
          exists:
            - steed-move-walk
  # Walk 30 feet
  - addOffer:
      id: steed-move-walk
      selections:
        distance: 30
      assert:
        facts:
          companion.steed.movement.remaining: 30
  # Walk remaining 30 feet
  - addOffer:
      id: steed-move-walk
      assert:
        facts:
          companion.steed.movement.remaining: 0
  # Walk should be illegal now (no movement remaining)
  - evaluate:
      assert:
        offers:
          illegal:
            - steed-move-walk
  # End turn: movement resets
  - endTurn:
      assert:
        facts:
          companion.steed.movement.total: 60
          companion.steed.movement.remaining: 60
