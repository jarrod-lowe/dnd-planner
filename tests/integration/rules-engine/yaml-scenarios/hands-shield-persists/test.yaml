name: 'Hands - Shield Hand Usage Persists Across Turns'
description: >
  After setting a loadout that holds a shield and ending the turn, the hand usage
  persists: the loadout effect is permanent, so hands.remaining stays at 1 on the
  next turn.

ruleGroups:
  - dnd-5e-2024/hands
  - dnd-5e-2024/loadout
  - dnd-5e-2024/ac
  - dnd-5e-2024/shield

steps:
  - evaluate:
      assert:
        facts:
          hands.remaining: 2
  - addOffer:
      id: set-loadout
      selections:
        loadout:
          id: shield
          hands: 1
          handsFree: 1
          items:
            - id: shield
              nameKey: rule.dnd-5e-2024.shield.effect-shield.name
              hands: 1
              twoHanded: false
              state:
                armor.shield.equipped: 1
                ac.shieldBonus: 2
      assert:
        facts:
          armor.shield.equipped: 1
          hands.remaining: 1
  - endTurn:
      assert:
        facts:
          armor.shield.equipped: 1
          hands.remaining: 1
