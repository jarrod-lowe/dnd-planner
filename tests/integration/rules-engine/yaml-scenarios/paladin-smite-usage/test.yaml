name: 'Paladin Smite - Usage'
description: 'Using Paladin Smite consumes a bonus action but NOT a spell slot or spellcasting resource. paladinSmite.remaining goes to 0.'
ruleGroups:
  - species-human/species-human
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/turn-rest
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spellcasting
  - class-paladin/class-paladin-level1
  - class-paladin/class-paladin-level2
  - class-paladin/class-paladin-divine-smite
  - class-paladin/class-paladin-paladin-smite
steps:
  # Initially, paladinSmite.remaining should be 1
  - evaluate:
      assert:
        facts:
          bonusActions.remaining: 1
          spellcasting.remaining: 1
          spellcasting.slots.level1.remaining: 2
          paladinSmite.remaining: 1
        offers:
          exists:
            - unarmed-strike-use-action
          illegal:
            - paladin-smite
  # Attack first (prerequisite)
  - addOffer:
      id: unarmed-strike-use-action
      assert:
        facts:
          attack.last.activation.action: 1
          spellcasting.remaining: 1
          paladinSmite.remaining: 1
        offers:
          legal:
            - paladin-smite
  # Use Paladin Smite
  - addOffer:
      id: paladin-smite
      assert:
        facts:
          bonusActions.remaining: 0
          paladinSmite.remaining: 0
          spellcasting.remaining: 1
          spellcasting.slots.level1.remaining: 2
