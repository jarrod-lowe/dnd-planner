name: 'Loadout - sets the whole hand configuration'
description: >
  The set-loadout offer sets what is in BOTH hands at once. Choosing "Spear +
  Shield" spends both hands, equips the spear and the shield (the same
  weapon.<id>.equipped / armor.shield.equipped facts the attack gates and the AC
  rule already read), and commits a single permanent effect that survives the turn.

ruleGroups:
  - dnd-5e-2024/hands
  - dnd-5e-2024/loadout
  - dnd-5e-2024/ac
  - dnd-5e-2024/shield
  - dnd-5e-2024/core-events
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spear

steps:
  - evaluate:
      assert:
        facts:
          hands.remaining: 2
          weapon.spear.equipped: 0
          armor.shield.equipped: 0
        offers:
          legal:
            - set-loadout
          notExists:
            - spear-use-action

  - addOffer:
      id: set-loadout
      selections:
        loadout:
          id: spear+shield
          hands: 2
          handsFree: 0
          items:
            - id: spear
              nameKey: rule.dnd-5e-2024.attacks.spear.name
              hands: 1
              twoHanded: false
              state:
                weapon.spear.equipped: 1
            - id: shield
              nameKey: rule.dnd-5e-2024.shield.effect-shield.name
              hands: 1
              twoHanded: false
              state:
                armor.shield.equipped: 1
                ac.shieldBonus: 2
      assert:
        facts:
          hands.remaining: 0
          weapon.spear.equipped: 1
          armor.shield.equipped: 1
          ac.shieldBonus: 2
        # The shield-training WARNING inherited from the deleted don-shield offer:
        # this character has no shield proficiency, so the loadout is flagged. It
        # does not block — the shield is in hand and its +2 AC is already asserted
        # above.
        planErrors:
          - id: set-loadout
            errors:
              - rule.dnd-5e-2024.loadout.set-loadout-offer.not-proficient
        offers:
          exists:
            - spear-use-action

  # Permanent and keyed: the loadout survives end of turn as one committed effect.
  - endTurn:
      assert:
        facts:
          hands.remaining: 0
          weapon.spear.equipped: 1
          armor.shield.equipped: 1
        effects:
          exists:
            - effect-loadout
