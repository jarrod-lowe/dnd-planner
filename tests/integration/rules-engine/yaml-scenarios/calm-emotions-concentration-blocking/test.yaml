name: 'Calm Emotions Concentration Blocking'
description: 'Cannot cast Calm Emotions while already concentrating. Concentration resource prevents a second cast.'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/concentration
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-calm-emotions
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 2
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 2
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
      assert:
        facts:
          concentration.remaining: 1
        offers:
          exists:
            - prepare-calm-emotions
  - addOffer:
      id: prepare-calm-emotions
  - endTurn: {}
  - addOffer:
      id: set-charisma
      selections:
        score: 16
  # Cast Calm Emotions — consumes concentration
  - addOffer:
      id: cast-calm-emotions
      assert:
        facts:
          concentration.remaining: 0
          spellcasting.slots.level2.remaining: 1
  - endTurn:
      assert:
        effects:
          exists:
            - effect-calm-emotions
  # Turn 2: Calm Emotions should be illegal due to concentration being active
  - evaluate:
      assert:
        facts:
          concentration.remaining: 0
        offers:
          illegal:
            - cast-calm-emotions
