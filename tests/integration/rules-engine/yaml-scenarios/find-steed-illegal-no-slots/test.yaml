name: 'Find Steed - Illegal When Plan Consumes All Eligible Slots'
description: 'Find Steed should be illegal after the plan consumes all L2+ spell slots'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-find-steed
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
      assert:
        facts:
          spellcasting.slots.level2.remaining: 1
        offers:
          legal:
            - cast-find-steed
  - addOffer:
      id: cast-find-steed
      assert:
        facts:
          find-steed.eligibleSlotsRemaining: 0
          find-steed.lowestAvailableSlotLevel: 2
        offers:
          illegal:
            - cast-find-steed
