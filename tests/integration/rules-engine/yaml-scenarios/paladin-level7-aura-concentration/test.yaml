name: 'Paladin: Aura of the Guardian while concentrating'
description: >
  The damage Aura of the Guardian takes on is real damage to the paladin, so
  using it while concentrating (Bless is up, so `concentration.remaining` is 0)
  raises `concentration.damage-taken` — carrying the amount, so the save's DC
  is derived from it exactly like record-damage's — and puts the concentration
  check in front of the player.
ruleGroups:
  - dnd-5e-2024/prepared-spells
  - dnd-5e-2024/hp
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/core-events
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/concentration
  - spells/spell-bless
  - class-paladin/class-paladin-level1
  - class-paladin/class-paladin-level2
  - class-paladin/class-paladin-divinity
  - class-paladin/class-paladin-level3
  - class-paladin/class-paladin-oath-redemption-level3
  - class-paladin/class-paladin-level4
  - class-paladin/class-paladin-oath-redemption-level4
  - class-paladin/class-paladin-level5
  - class-paladin/class-paladin-oath-redemption-level5
  - class-paladin/class-paladin-level6
  - class-paladin/class-paladin-oath-redemption-level6
  - class-paladin/class-paladin-level7
  - class-paladin/class-paladin-oath-redemption-level7
steps:
  - evaluate:
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: bless
            level: 1
            nameKey: rule.spell-bless.offer-bless.name
            preparedFact: spell.l1.bless.prepared
            alwaysPreparedFact: spell.l1.bless.alwaysPrepared
  - evaluate:
      assert:
        facts:
          concentration.remaining: 1
        offers:
          exists:
            - cast-bless
  - addOffer:
      id: cast-bless
      assert:
        facts:
          concentration.remaining: 0
  - endTurn:
      assert:
        effects:
          exists:
            - effect-bless

  # Next turn, still concentrating on Bless.
  - evaluate:
      assert:
        facts:
          concentration.remaining: 0
          reactions.remaining: 1
          hp.current: 46
        offers:
          exists:
            - aura-of-the-guardian

  # Adding the row with the slider still at its default 0 transfers no damage,
  # so it must NOT put a concentration check in front of the player.
  - addOffer:
      id: aura-of-the-guardian
      selections:
        amount: 0
      assert:
        facts:
          hp.current: 46
          concentration.damage-taken: 0
        offers:
          notExists:
            - concentration-check
  - removeFromPlan:
      id: aura-of-the-guardian

  # Taking 8 for an ally is damage to the paladin: concentration is now at risk.
  # The marker carries the amount (the record-damage idiom), so the save's DC is
  # derived from it — half of 8 is 4, under the DC 10 floor.
  - addOffer:
      id: aura-of-the-guardian
      selections:
        amount: 8
      assert:
        facts:
          reactions.remaining: 0
          hp.current: 38
          concentration.damage-taken: 1
          concentration.last-damage: 8
          concentration.dc: 10
        # The aura row carries the recorder's damage label, so the post-hoc
        # save-to-keep-the-spell reminder (with the computed DC) rides THIS
        # panel too, not only the record-damage row.
        offerUi:
          - id: aura-of-the-guardian
            ui:
              annotationLabels:
                - damage.any
        annotations:
          exists:
            - planner.concentration.annotation
          targets:
            - key: planner.concentration.annotation
              targets: [damage.any]
  - removeFromPlan:
      id: aura-of-the-guardian

  # A big transfer — 40 — takes the interesting branch: half of 40 is 20, above
  # the DC 10 floor and below the DC 30 cap, so the save demands DC 20 rather
  # than the floor 10 a marker without an amount collapses to.
  - addOffer:
      id: aura-of-the-guardian
      selections:
        amount: 40
      assert:
        facts:
          reactions.remaining: 0
          hp.current: 6
          concentration.damage-taken: 1
          concentration.last-damage: 40
          concentration.dc: 20
