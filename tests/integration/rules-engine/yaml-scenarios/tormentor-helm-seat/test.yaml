name: 'Tormentor - Take The Helm Seat'
description: >-
  The Helm station (the seat infrastructure's third seat): the same TAKE/LEAVE
  offer pair in the vehicle's +ADD, free and gated structurally on the
  acquire, filed with the acquire/abandon EQUIP 'vehicle' family. Taking the
  seat advertises ONE permanent KEYED effect writing
  companion.tormentor.seats.helm = 1 — a chip under the vehicle panel like
  the passenger's — and the derived creature capacity counts it like any
  seat. The station's offers (Drive, Dash, Juke) exist only while the seat is
  held: leaving evicts by key and the offers go with the seat.
ruleGroups:
  - vehicles/tormentor
steps:
  # Unacquired: the seat offers and the station's actions do not exist at all
  # (structural gate on the acquire — there is no vehicle to sit in).
  - evaluate:
      assert:
        offers:
          notExists:
            - take-tormentor-helm-seat
            - leave-tormentor-helm-seat
            - drive-tormentor
            - dash-tormentor
            - juke-tormentor
  # Acquire: fresh vehicle reads 0/4, and without the seat the station's
  # actions do not exist either.
  - addOffer:
      id: acquire-tormentor
      assert:
        facts:
          companion.tormentor.creatureCapacity.used: 0
  - evaluate:
      assert:
        offers:
          exists:
            - take-tormentor-helm-seat
          legal:
            - take-tormentor-helm-seat
          illegal:
            - leave-tormentor-helm-seat
          notExists:
            - drive-tormentor
            - dash-tormentor
            - juke-tormentor
        offerUi:
          - id: take-tormentor-helm-seat
            ui:
              section: free
              subject: tormentor
              actionCost: []
  # Take the seat: the station fact lands, the capacity derive counts it
  # (0 + 1), and the station's three offers now exist.
  - addOffer:
      id: take-tormentor-helm-seat
      assert:
        facts:
          companion.tormentor.seats.helm: 1
          companion.tormentor.creatureCapacity.used: 1
        planErrors:
          - id: take-tormentor-helm-seat
            index: 0
            errors: []
        offers:
          exists:
            - drive-tormentor
            - dash-tormentor
            - juke-tormentor
  # Commit: the seat effect persists beside the acquire (the chip on the strip).
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-acquire
            - effect-tormentor-seat-helm
        facts:
          companion.tormentor.seats.helm: 1
          companion.tormentor.creatureCapacity.used: 1
  # Leave the seat: the eviction clears the fact the moment the row is merely
  # planned (newest-wins), the capacity falls with it, and the station's
  # offers go with the seat — there is nobody at the Helm.
  - addOffer:
      id: leave-tormentor-helm-seat
      assert:
        facts:
          companion.tormentor.seats.helm: 0
          companion.tormentor.creatureCapacity.used: 0
        offers:
          notExists:
            - drive-tormentor
            - dash-tormentor
            - juke-tormentor
