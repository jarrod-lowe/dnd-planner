name: 'Steed Fell Glare'
description: 'Steed can use Fell Glare (bonus action, 1/LR); offer exists, consumes bonus action, tracks 1/LR, illegal when used up, resets on long rest'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-find-steed
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  - evaluate: {}
  - addOffer:
      id: prepare-find-steed
  # Cast Find Steed
  - evaluate:
      assert:
        offers:
          exists:
            - cast-find-steed
  - addOffer:
      id: cast-find-steed
  - endTurn: {}
  # Next turn: fell glare offer available
  - evaluate:
      assert:
        facts:
          companion.steed.bonusActions.remaining: 1
          companion.steed.fellGlare.total: 1
          companion.steed.fellGlare.remaining: 1
        offers:
          exists:
            - steed-fell-glare
  # Use fell glare: consumes bonus action and fell glare use
  - addOffer:
      id: steed-fell-glare
      assert:
        facts:
          companion.steed.bonusActions.remaining: 0
          companion.steed.fellGlare.remaining: 0
  # Fell glare should now be illegal (no uses and no bonus action)
  - evaluate:
      assert:
        offers:
          illegal:
            - steed-fell-glare
  # End turn, next turn: still used up
  - endTurn: {}
  - evaluate:
      assert:
        facts:
          companion.steed.fellGlare.remaining: 0
        offers:
          illegal:
            - steed-fell-glare
  # Long rest: resets fell glare
  - addOffer:
      id: record-long-rest
  - endTurn: {}
  - evaluate:
      assert:
        facts:
          companion.steed.fellGlare.remaining: 1
        offers:
          exists:
            - steed-fell-glare
