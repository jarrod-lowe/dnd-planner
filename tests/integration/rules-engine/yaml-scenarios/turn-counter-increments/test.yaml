name: 'Turn Counter - Increments'
description: 'Turn counter increments each turn via committed effects'
ruleGroups:
  - dnd-5e-2024/turn-rest
steps:
  - evaluate:
      assert:
        facts:
          turn.counter: 1
  - endTurn:
      assert:
        facts:
          turn.counter: 2
  - endTurn:
      assert:
        facts:
          turn.counter: 3
