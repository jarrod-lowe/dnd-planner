name: 'Divine Smite - Free Cast'
description: 'Paladin L2 free Divine Smite (slot level 0) consumes the free use and a bonus action, but no spell slot'
ruleGroups:
  - species-human/species-human
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spellcasting
  - class-paladin/class-paladin-level1
  - class-paladin/class-paladin-level2
  - class-paladin/class-paladin-paladin-smite
  - spells/spell-divine-smite
steps:
  - evaluate:
      assert:
        facts:
          paladinSmite.remaining: 1
          spellcasting.slots.level1.remaining: 2
        offers:
          illegal:
            - cast-divine-smite
  # Attack first (prerequisite)
  - addOffer:
      id: unarmed-strike-use-action
      assert:
        facts:
          attack.last.activation.action: 1
        offers:
          legal:
            - cast-divine-smite
  # Cast the free smite (level 0)
  - addOffer:
      id: cast-divine-smite
      selections:
        slotLevel: 0
      assert:
        facts:
          bonusActions.remaining: 0
          paladinSmite.remaining: 0
          # No spell slot consumed by the free use
          spellcasting.slots.level1.remaining: 2
          # Casting Divine Smite still counts as your spell for the turn
          spellcasting.remaining: 0
