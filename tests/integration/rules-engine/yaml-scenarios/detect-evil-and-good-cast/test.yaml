name: 'Detect Evil and Good Cast'
description: >-
  Casting Detect Evil and Good consumes the action, spellcasting, concentration,
  and a spell slot. Everything it senses is untracked world state, so the effect
  is a pure concentration-holding marker — and a second concentration spell
  next turn is legal (SRD 5.2) and replaces it via the shared key.
ruleGroups:
  - dnd-5e-2024/prepared-spells
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/concentration
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-detect-evil-and-good
steps:
  - evaluate:
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: detect-evil-and-good
            level: 1
            nameKey: rule.spell-detect-evil-and-good.offer-detect-evil-and-good.name
            preparedFact: spell.l1.detectEvilAndGood.prepared
            alwaysPreparedFact: spell.l1.detectEvilAndGood.alwaysPrepared
  - evaluate:
      assert:
        facts:
          actions.remaining: 1
          spellcasting.remaining: 1
          concentration.remaining: 1
          spellcasting.slots.level1.remaining: 2
        offers:
          exists:
            - cast-detect-evil-and-good
  - addOffer:
      id: cast-detect-evil-and-good
      assert:
        facts:
          actions.remaining: 0
          spellcasting.remaining: 0
          concentration.remaining: 0
          spellcasting.slots.level1.remaining: 1
  - endTurn:
      assert:
        effects:
          exists:
            - effect-detect-evil-and-good
        facts:
          concentration.remaining: 0
  # Turn 2: legal while still sensing — SRD 5.2: starting a second
  # concentration spell dismisses the first (the shared key replaces it).
  - evaluate:
      assert:
        offers:
          legal:
            - cast-detect-evil-and-good
