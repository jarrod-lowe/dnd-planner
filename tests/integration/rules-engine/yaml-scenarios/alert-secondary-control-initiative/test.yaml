name: 'Alert Feat - Secondary Control on Initiative'
description: >
  When feat-alert is assigned, the Roll Initiative offer includes a
  secondaryControl for "With Proficiency" enabled by the Alert flag.
  The label is inline on the dice line (like range text), not a button.
  Also pins that feat-alert's annotations exist and that roll-initiative
  carries `dice.initiative` at the top-level `ui` (not nested inside a
  control, where it would never be matched) — the placement fix in
  cd9429a4 that made these annotations reach a real panel.

ruleGroups:
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/initiative
  - dnd-5e-2024/feat-alert

steps:
  - evaluate:
      assert:
        facts:
          feat.alert.active: 1
        offers:
          exists:
            - roll-initiative
        annotations:
          exists:
            - rule.dnd-5e-2024.feat-alert.annotation-swap
            - rule.dnd-5e-2024.feat-alert.annotation-proficiency
        offerUi:
          - id: roll-initiative
            ui:
              annotationLabels:
                - dice.any
                - dice.initiative
              secondaryControl:
                type: dice-line
                enabled:
                  condition:
                    fact: feat.alert.active
                    operator: equals
                    value: 1
                label: rule.dnd-5e-2024.feat-alert.initiative-proficiency.button
                dice:
                  - sides: 20
                    bonus:
                      var: alertBonus
                    purpose: check
