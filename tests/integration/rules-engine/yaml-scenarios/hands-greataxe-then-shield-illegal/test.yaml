name: 'Hands - Greataxe Then Shield Illegal'
description: >
  With a greataxe equipped (2 hands used), donning a shield should be illegal.
  0 hands remaining, shield needs 1.

ruleGroups:
  - dnd-5e-2024/hands
  - dnd-5e-2024/ac
  - dnd-5e-2024/shield
  - dnd-5e-2024/core-events
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/attacks
  - dnd-5e-2024/greataxe

initialEffects:
  - id: effect-greataxe
    phase: normal
    group: [equipment-state]
    activities:
      - type: numberSet
        target:
          fact: weapon.greataxe.equipped
        source:
          number: 1
      - type: numberIncrement
        target:
          fact: hands.remaining
        source:
          number: 2
        subtract: true
      - type: advertiseEffect
        self: true

steps:
  - evaluate:
      assert:
        facts:
          weapon.greataxe.equipped: 1
          hands.remaining: 0
        offers:
          illegal:
            - don-shield
