name: 'Hold Person Concentration Blocking'
description: 'Cannot cast Hold Person while already concentrating. Concentration resource prevents a second cast.'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/concentration
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-hold-person
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 2
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 2
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
      assert:
        facts:
          concentration.remaining: 1
        offers:
          exists:
            - prepare-hold-person
  - addOffer:
      id: prepare-hold-person
  - endTurn: {}
  - addOffer:
      id: set-charisma
      selections:
        score: 16
  # Cast Hold Person — consumes concentration
  - addOffer:
      id: cast-hold-person
      assert:
        facts:
          concentration.remaining: 0
          spellcasting.slots.level2.remaining: 1
  - endTurn:
      assert:
        effects:
          exists:
            - effect-hold-person
  # Turn 2: Hold Person should be illegal due to concentration being active
  - evaluate:
      assert:
        facts:
          concentration.remaining: 0
        offers:
          illegal:
            - cast-hold-person
