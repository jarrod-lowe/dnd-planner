name: 'Hold Person Prepare'
description: 'Preparing and unpreparing Hold Person with persistent effect lifecycle'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/concentration
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-hold-person
steps:
  # TC1: Initially both offers exist, unprepare is illegal (not prepared)
  - evaluate:
      assert:
        facts:
          spellcasting.prepared.max: 2
          spellcasting.prepared.count: 0
          spellcasting.prepared.remaining: 2
          spell.l2.holdPerson.prepared: 0
        offers:
          exists:
            - prepare-hold-person
            - unprepare-hold-person
          illegal:
            - unprepare-hold-person
  # TC2: Prepare Hold Person — both offers still exist, prepare now illegal
  - addOffer:
      id: prepare-hold-person
      assert:
        facts:
          spell.l2.holdPerson.prepared: 1
          spellcasting.prepared.count: 1
          spellcasting.prepared.remaining: 1
        offers:
          exists:
            - prepare-hold-person
            - unprepare-hold-person
          illegal:
            - prepare-hold-person
  # TC3: End turn to persist effects
  - endTurn:
      assert:
        effects:
          exists:
            - effect-hold-person-prepared
  # After preparing: prepare illegal, unprepare legal
  - evaluate:
      assert:
        facts:
          spell.l2.holdPerson.prepared: 1
          spellcasting.prepared.count: 1
          spellcasting.prepared.remaining: 1
        offers:
          exists:
            - prepare-hold-person
            - unprepare-hold-person
          illegal:
            - prepare-hold-person
  # TC4: Unprepare Hold Person — both offers still exist, unprepare now illegal
  - addOffer:
      id: unprepare-hold-person
      assert:
        facts:
          spell.l2.holdPerson.prepared: 0
          spell.l2.holdPerson.removing: 1
          spellcasting.prepared.count: 0
          spellcasting.prepared.remaining: 2
        offers:
          exists:
            - prepare-hold-person
            - unprepare-hold-person
          illegal:
            - unprepare-hold-person
  # End turn - persist removal effect into effects list
  - endTurn: {}
  # End turn again - removal effect fires, prepare effect expires
  - endTurn: {}
  # TC5: After unpreparing: unprepare illegal, prepare legal
  - evaluate:
      assert:
        facts:
          spell.l2.holdPerson.prepared: 0
          spellcasting.prepared.count: 0
          spellcasting.prepared.remaining: 2
        effects:
          notExists:
            - effect-hold-person-prepared
        offers:
          exists:
            - prepare-hold-person
            - unprepare-hold-person
          illegal:
            - unprepare-hold-person
