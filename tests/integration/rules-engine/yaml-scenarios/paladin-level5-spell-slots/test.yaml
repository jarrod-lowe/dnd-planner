name: 'Paladin: Spell slots at level 5'
description: 'A level 5 paladin has 4 level 1 spell slots and 2 level 2 spell slots'
ruleGroups:
  - dnd-5e-2024/spellcasting
  - class-paladin/class-paladin-level1
  - class-paladin/class-paladin-level2
  - class-paladin/class-paladin-level3
  - class-paladin/class-paladin-level4
  - class-paladin/class-paladin-level5
steps:
  - evaluate:
      assert:
        facts:
          spellcasting.slots.level1.total: 4
          spellcasting.slots.level1.remaining: 4
          spellcasting.slots.level2.total: 2
          spellcasting.slots.level2.remaining: 2
