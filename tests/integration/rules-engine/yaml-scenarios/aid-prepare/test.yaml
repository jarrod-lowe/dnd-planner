name: 'Aid Prepare'
description: 'The prepared-set picker prepares Aid; re-committing the set without it unprepares'
ruleGroups:
  - dnd-5e-2024/prepared-spells
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-aid
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
  # Prepare Aid
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: aid
            level: 2
            nameKey: rule.spell-aid.offer-aid.name
            preparedFact: spell.l2.aid.prepared
            alwaysPreparedFact: spell.l2.aid.alwaysPrepared
  # Aid prepared
  - evaluate:
      assert:
        facts:
          spell.l2.aid.prepared: 1
  # Unprepare Aid: re-commit the whole set WITHOUT it — the keyed effect is
  # replaced, so the spell's prepared fact drops with it.
  - updateSelections:
      id: set-prepared-spells
      selections:
        prepared: []
  # Aid unprepared
  - evaluate:
      assert:
        facts:
          spell.l2.aid.prepared: 0
