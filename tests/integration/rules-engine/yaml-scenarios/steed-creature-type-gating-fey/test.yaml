name: 'Find Steed Fey variant offers only Fey Step'
description: 'A Fey Otherworldly Steed offers Fey Step, not Healing Touch or Fell Glare, both on the cast turn and on later turns'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-find-steed
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  - evaluate: {}
  - addOffer:
      id: prepare-find-steed
  - evaluate:
      assert:
        offers:
          exists:
            - cast-find-steed
  # Cast Find Steed with Fey creature type (1)
  - addOffer:
      id: cast-find-steed
      selections:
        creatureType: 1
  # Same turn: only Fey Step is offered
  - evaluate:
      assert:
        offers:
          exists:
            - steed-fey-step
          notExists:
            - steed-healing-touch
            - steed-fell-glare
  # Later turn: still only Fey Step (persistent offer)
  - endTurn: {}
  - evaluate:
      assert:
        offers:
          exists:
            - steed-fey-step
          notExists:
            - steed-healing-touch
            - steed-fell-glare
