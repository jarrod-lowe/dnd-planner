name: 'Sleep Rest Dismissal'
description: 'Sleep effect and concentration are dismissed on short rest'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/concentration
  - dnd-5e-2024/turn-rest
  - class-paladin/class-paladin-level1
  - spells/spell-sleep
steps:
  - evaluate:
      assert:
        facts:
          concentration.remaining: 1
  # Cast Sleep
  - addOffer:
      id: cast-sleep
      assert:
        facts:
          concentration.remaining: 0
          spellcasting.slots.level1.remaining: 1
  - endTurn:
      assert:
        effects:
          exists:
            - effect-sleep
  # Short rest should dismiss the sleep effect and free concentration
  - addOffer:
      id: short-rest
      assert:
        facts:
          rest.short: 1
  - endTurn:
      assert:
        effects:
          notExists:
            - effect-sleep
        facts:
          concentration.remaining: 1
