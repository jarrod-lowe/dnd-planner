name: 'Sleep Cast'
description: 'Casting Sleep consumes a spell slot and concentration, creates a timed effect with countDown=10 and a concentration effect'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/concentration
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - class-paladin/paladin-spells-l1
  - spells/spell-sleep
steps:
  - evaluate:
      assert:
        facts:
          spellcasting.remaining: 1
          concentration.remaining: 1
          spellcasting.slots.level1.remaining: 2
        offers:
          notExists:
            - cast-sleep
          exists:
            - prepare-sleep
  # Prepare Sleep first
  - addOffer:
      id: prepare-sleep
  - endTurn: {}
  # Now set charisma and cast sleep
  - addOffer:
      id: set-charisma
      selections:
        score: 16
      assert:
        facts:
          spellcasting.saveDC: 13
  - addOffer:
      id: cast-sleep
      assert:
        facts:
          spellcasting.remaining: 0
          concentration.remaining: 0
          spellcasting.slots.level1.remaining: 1
  - endTurn:
      assert:
        effects:
          exists:
            - effect-sleep
