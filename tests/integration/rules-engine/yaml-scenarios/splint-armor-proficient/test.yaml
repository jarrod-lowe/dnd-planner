name: 'Splint Armor Proficient'
description: 'No non-proficiency disadvantage but Stealth still disadvantaged when proficient with heavy armor'
ruleGroups:
  - dnd-5e-2024/ac
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/splint-armor
  - dnd-5e-2024/spellcasting
initialEffects:
  # Simulate a class granting heavy armor proficiency
  - id: test-heavy-armor-proficiency
    phase: early
    activities:
      - type: numberSet
        target:
          fact: armor.heavy.proficient
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
      assert:
        facts:
          armor.heavy.proficient: 1
          spellcasting.max: 1
          spellcasting.remaining: 1
  - addOffer:
      id: don-splint-armor
      assert:
        facts:
          ac.base: 17
          ac.dexBonus: 0
          attack.str.disadvantage: 0
          attack.dex.disadvantage: 0
          initiative.disadvantage: 0
          skill.acrobatics.disadvantage: 0
          skill.athletics.disadvantage: 0
          skill.sleight-of-hand.disadvantage: 0
          skill.stealth.disadvantage: 1
          spellcasting.max: 1
          spellcasting.remaining: 1
