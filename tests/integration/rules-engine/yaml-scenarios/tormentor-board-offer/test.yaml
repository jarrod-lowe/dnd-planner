name: 'Tormentor (Damage Control) - Board Offer'
description: >-
  Loading the vehicle rule group surfaces an ungated free-section Acquire offer
  in the PLAYER's +ADD picker: acquiring is a player action, so the offer
  carries NO vehicle subject (the absence is pinned in the unit test — the
  runner can only assert keys an offer HAS), the detail link to the vehicle
  stat block, and no action cost. No legality checks this pass — multiple
  acquirings are illegal-but-possible (keyed replacement keeps the facts
  single; diagnostics deferred). Nothing subjects itself to the vehicle yet,
  so the vehicle's own +ADD panel has nothing to show: the abandon offer is
  absent while unacquired.
ruleGroups:
  - vehicles/tormentor
steps:
  - evaluate:
      assert:
        facts:
          companion.tormentor.active: 0
        offers:
          exists:
            - acquire-tormentor
          notExists:
            - abandon-tormentor
          legal:
            - acquire-tormentor
        offerUi:
          - id: acquire-tormentor
            ui:
              section: free
              detailKey: vehicle/tormentor
              actionCost: []
