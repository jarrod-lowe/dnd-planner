name: 'Tormentor (Damage Control) - Board Offer'
description: >-
  Loading the vehicle rule group surfaces an ungated free-section Board offer
  in the PLAYER's +ADD picker: boarding is a player action, so the offer
  carries NO station subject (the absence is pinned in the unit test — the
  runner can only assert keys an offer HAS), the detail link to the vehicle
  stat block, and no action cost. No legality checks this pass — multiple
  boardings are illegal-but-possible (keyed replacement keeps the facts
  single; diagnostics deferred). Nothing subjects itself to the station yet,
  so the station's own +ADD panel has nothing to show: the de-board offer is
  absent while unboarded.
ruleGroups:
  - vehicles/tormentor
steps:
  - evaluate:
      assert:
        facts:
          companion.tormentorDamageControl.active: 0
        offers:
          exists:
            - board-tormentor
          notExists:
            - deboard-tormentor
          legal:
            - board-tormentor
        offerUi:
          - id: board-tormentor
            ui:
              section: free
              detailKey: vehicle/tormentor-damage-control
              actionCost: []
