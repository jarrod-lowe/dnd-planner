name: 'Spear 2H Reaction No Free Hands Error'
description: >
  When effects already exist (dagger and spear equipped consuming hands),
  and a reaction spear attack is planned with extraHands: 1 (2H mode),
  the plan item should have an error in varsRuntime.errors indicating
  insufficient hands for two-handed attack.

ruleGroups:
  - dnd-5e-2024/hands
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spear
  - dnd-5e-2024/dagger

# capability.attack.reaction.weapon and reactions.remaining were legacy initial
# facts; the engine derives both (attacks, action-economy) and the sheet rejects
# inputs that overlap contributions.

initialEffects:
  - id: effect-dagger
    phase: normal
    group: [equipment-state]
    activities:
      - type: numberSet
        target:
          fact: weapon.dagger.equipped
        source:
          number: 1
      - type: numberIncrement
        target:
          fact: hands.remaining
        source:
          number: 1
        subtract: true
      - type: advertiseEffect
        self: true

  - id: effect-spear
    phase: normal
    group: [equipment-state]
    activities:
      - type: numberSet
        target:
          fact: weapon.spear.equipped
        source:
          number: 1
      - type: numberIncrement
        target:
          fact: hands.remaining
        source:
          number: 1
        subtract: true
      - type: advertiseEffect
        self: true

steps:
  - evaluate:
      assert:
        facts:
          hands.remaining: 0
          weapon.dagger.equipped: 1
          weapon.spear.equipped: 1
        offers:
          exists:
            - spear-use-reaction-weapon

  - addOffer:
      id: spear-use-reaction-weapon
      assert:
        planErrors:
          - id: spear-use-reaction-weapon
            errors: []

  - updateSelections:
      id: spear-use-reaction-weapon
      selections:
        extraHands: 1
      assert:
        planErrors:
          - id: spear-use-reaction-weapon
            errors:
              - rule.dnd-5e-2024.attacks.versatile.no-free-hand
