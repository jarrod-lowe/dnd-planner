name: 'Paladin: Prepared spells at level 4'
description: 'A level 4 paladin can prepare 5 spells (2 base + 1 from each level 2-4)'
ruleGroups:
  - dnd-5e-2024/spellcasting
  - class-paladin/class-paladin-level1
  - class-paladin/class-paladin-level2
  - class-paladin/class-paladin-level3
  - class-paladin/class-paladin-level4
steps:
  - evaluate:
      assert:
        facts:
          spellcasting.prepared.max: 5
