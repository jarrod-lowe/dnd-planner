name: 'Shove Action'
description: >
  Shove action offer appears in action-attack section, consumes an action
  when added to plan. Shove DC is computed as 8 + proficiency bonus + STR
  modifier. After endTurn, actions reset and shove is available again.

ruleGroups:
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/shove

steps:
  - evaluate:
      assert:
        facts:
          actions.max: 1
          actions.remaining: 1
          shove.dc: 8
        offers:
          exists:
            - set-strength
            - shove-action

  - addOffer:
      id: set-strength
      selections:
        score: 16
      assert:
        facts:
          str.value: 16
          str.modifier: 3
          shove.dc: 11

  # Shove is a target save vs the shover's DC, not an attack roll, so the row
  # shows the DC (no dice roller) plus a target-outcome marker, like Grapple.
  - evaluate:
      assert:
        offerUi:
          - id: shove-action
            ui:
              information:
                - type: text
                  label: play.information.saveDcStrDex
                  labelValues:
                    dc: { fact: shove.dc }
              secondaryControl:
                type: segmented
                var: passed
                prefix: play.choices.shove.target
                options:
                  - { value: -1, label: planner.record.outcome.none }
                  - { value: 1, label: planner.record.passed }
                  - { value: 0, label: planner.record.failed }

  - addOffer:
      id: shove-action
      assert:
        facts:
          actions.remaining: 0
        offers:
          illegal:
            - shove-action

  - endTurn:
      assert:
        facts:
          actions.max: 1
          actions.remaining: 1
          shove.dc: 11
        offers:
          exists:
            - shove-action
