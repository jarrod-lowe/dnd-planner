name: 'Heroic Inspiration - Human Long Rest No Duplicate'
description: 'Human long rest does not duplicate effect when HI already active'
ruleGroups:
  - species-human/species-human
  - dnd-5e-2024/core-events
  - dnd-5e-2024/heroic-inspiration
initialEffects:
  - id: effect-hi
    phase: early
    after:
      - group: hi-consume
    group:
      - hi-settle
    ui:
      name: rule.dnd-5e-2024.heroic-inspiration.effect-hi.name
    activities:
      - type: numberSet
        source:
          number: 1
        target:
          fact: heroicInspiration.remaining
        when:
          - fact: heroicInspiration.consumed
            operator: equals
            value: 0
      - type: advertiseEffect
        self: true
        when:
          - fact: heroicInspiration.consumed
            operator: equals
            value: 0
steps:
  # HI already active
  - evaluate:
      assert:
        facts:
          heroicInspiration.remaining: 1
  # Long rest - should not create duplicate effect
  - addOffer:
      id: record-long-rest
      assert:
        facts:
          heroicInspiration.remaining: 1
          rest.long: 1
  # End turn
  - endTurn:
      assert:
        facts:
          heroicInspiration.remaining: 1
  # Turn 2: still just 1, not duplicated
  - evaluate:
      assert:
        facts:
          heroicInspiration.max: 1
          heroicInspiration.remaining: 1
