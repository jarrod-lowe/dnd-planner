name: 'Skill Proficiency With Paladin'
description: 'Adding a skill proficiency with paladin class (proficiency bonus is 2)'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - class-paladin/class-paladin-level1
steps:
  - evaluate:
      assert:
        facts:
          proficiency.bonus: 2
  - addOffer:
      id: set-strength
      selections:
        score: 16
      assert:
        facts:
          skill.athletics.value: 3
  - addOffer:
      id: proficiency-athletics
      selections:
        level: 1
      assert:
        facts:
          skill.athletics.value: 5
