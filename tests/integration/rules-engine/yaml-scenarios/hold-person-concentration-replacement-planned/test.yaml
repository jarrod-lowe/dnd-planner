name: 'Hold Person - Planned Recast Legal and Replacing While Concentrating'
description: >-
  Casting Hold Person, then planning a second cast while concentration is
  still held, is legal (SRD 5.2) and replaces the hold: no plan errors, and the
  keyed concentration effect keeps concentration.spent at 1 instead of stacking.
ruleGroups:
  - dnd-5e-2024/prepared-spells
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/concentration
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-hold-person
initialEffects:
  - id: test-grant-level2-slots
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 2
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 2
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: hold-person
            level: 2
            nameKey: rule.spell-hold-person.offer-hold-person.name
            preparedFact: spell.l2.holdPerson.prepared
            alwaysPreparedFact: spell.l2.holdPerson.alwaysPrepared
  - endTurn: {}
  # Turn 1: cast Hold Person, starting concentration
  - addOffer:
      id: cast-hold-person
      assert:
        facts:
          concentration.remaining: 0
          spellcasting.slots.level2.remaining: 1
  - endTurn:
      assert:
        effects:
          exists:
            - effect-hold-person
  # Turn 2: still concentrating; planning a second cast is LEGAL (SRD 5.2 — the
  # recast dismisses the first hold) and a slot remains, so NO errors at all.
  - evaluate:
      assert:
        facts:
          concentration.remaining: 0
          spellcasting.slots.level2.remaining: 1
  - addOffer:
      id: cast-hold-person
      assert:
        planErrors:
          - id: cast-hold-person
            index: 0
            errors: []
        facts:
          concentration.spent: 1
          spellcasting.slots.level2.remaining: 0
