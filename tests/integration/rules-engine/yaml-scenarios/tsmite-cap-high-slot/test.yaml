name: 'Thunderous Smite - Cap Slider At Handled Level'
description: >-
  Thunderous Smite only implements slot levels 1-5, so its cast slider max is
  capped at 5 even when a level 6+ slot is available.
ruleGroups:
  - species-human/species-human
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spellcasting
  - class-paladin/class-paladin-level1
  - spells/spell-thunderous-smite
initialEffects:
  - id: test-grant-level6-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target: { fact: spellcasting.slots.level6.total }
        source: { number: 1 }
      - type: numberSet
        target: { fact: spellcasting.slots.level6.remaining }
        source: { number: 1 }
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
      assert:
        facts:
          spellcasting.maxSlotLevel: 6
          tsmite.maxCastLevel: 5
