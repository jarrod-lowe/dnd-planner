name: 'Condition Poisoned - Record'
description: >-
  Recording being Poisoned commits a keyed effect setting condition.poisoned plus
  the attack-disadvantage flags AND the ability-check flags: initiative (the
  roll-initiative dice-line reads it) and the generic check (record-check reads
  check.disadvantage), while the 18 skill rollers read the skill flags the
  effect also writes (see condition-poisoned-skill-flags). A NOTICE carries the
  condition's standing effect while it is live. The recorder models BEING
  POISONED (imposed by an enemy effect), so it is free and ungated (the prone
  "Knocked Prone" precedent), and any rest clears it (untilShortRest covers
  both rest kinds; see condition-poisoned-rest-clears). An attribution chip
  (a valueless rider, the GWF idiom) names WHY the affected dice-lines default
  to 2d20-take-low: attack.any (weapons + unarmed), check.any (the 18 skill
  rollers + record-check — never dice.any, which would leak onto saves), and
  dice.initiative.
ruleGroups:
  - dnd-5e-2024/condition-poisoned
steps:
  - evaluate:
      assert:
        facts:
          condition.poisoned: 0
        offers:
          exists:
            - record-poisoned
        annotations:
          notExists:
            - rule.dnd-5e-2024.condition-poisoned.notice
            - rule.dnd-5e-2024.condition-poisoned.disadvantage
  - addOffer:
      id: record-poisoned
      assert:
        facts:
          condition.poisoned: 1
          attack.str.disadvantage: 1
          attack.dex.disadvantage: 1
          initiative.disadvantage: 1
          check.disadvantage: 1
        annotations:
          exists:
            - rule.dnd-5e-2024.condition-poisoned.notice
            - rule.dnd-5e-2024.condition-poisoned.disadvantage
            - rule.dnd-5e-2024.condition-poisoned.disadvantage-checks
          targets:
            - key: rule.dnd-5e-2024.condition-poisoned.notice
              targets: [notice]
            - key: rule.dnd-5e-2024.condition-poisoned.disadvantage
              targets: [attack.any]
            - key: rule.dnd-5e-2024.condition-poisoned.disadvantage-checks
              targets: [check.any, dice.initiative]
          riders:
            - key: rule.dnd-5e-2024.condition-poisoned.disadvantage
              rider:
                label: rule.dnd-5e-2024.condition-poisoned.rider
                type: modifier
                appliesTo: to-hit
            - key: rule.dnd-5e-2024.condition-poisoned.disadvantage-checks
              rider:
                label: rule.dnd-5e-2024.condition-poisoned.rider
                type: modifier
                appliesTo: check
