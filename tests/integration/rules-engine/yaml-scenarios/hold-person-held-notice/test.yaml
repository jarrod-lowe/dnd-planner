name: 'Hold Person - Held Notice'
description: >-
  Once a target is held (holdPerson.active, written by the committed
  effect-hold-person marker alongside its concentration spend), a NOTICE
  reminds the player that each held target repeats a Wisdom save against the
  spell save DC at the end of its turn to end the spell. The DC is
  interpolated from spellcasting.saveDC. Dismissing the chip (un-committing
  the effect) removes the state delta — fact, notice, and the concentration
  hold all go with it; nothing held, no notice. The concentration damage-save
  reminder stays on the damage recorder (planner.concentration.annotation):
  one spell legitimately owns both surfaces.
ruleGroups:
  - dnd-5e-2024/prepared-spells
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/concentration
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - class-paladin/class-paladin-level5
  - spells/spell-hold-person
steps:
  - evaluate:
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: hold-person
            level: 2
            nameKey: rule.spell-hold-person.offer-hold-person.name
            preparedFact: spell.l2.holdPerson.prepared
            alwaysPreparedFact: spell.l2.holdPerson.alwaysPrepared
  # Set Charisma 16 so the save DC is a real number (8 + 3 prof incl. the L5
  # bump + 3 mod = 14). Level 5 supplies the L2 slots the L2 cast needs.
  - addOffer:
      id: set-charisma
      selections:
        score: 16
      assert:
        facts:
          spellcasting.saveDC: 14
          spellcasting.slots.level2.remaining: 2
        annotations:
          # Prepared but nothing held: no notice.
          notExists:
            - rule.spell-hold-person.notice
  - addOffer:
      id: cast-hold-person
      assert:
        facts:
          holdPerson.active: 1
          concentration.remaining: 0
        annotations:
          exists:
            - rule.spell-hold-person.notice
            - planner.concentration.annotation
          targets:
            - key: rule.spell-hold-person.notice
              targets: [notice]
  - endTurn:
      assert:
        facts:
          holdPerson.active: 1
          concentration.remaining: 0
        annotations:
          # The hold marker survives the turn boundary, and so does the notice.
          exists:
            - rule.spell-hold-person.notice
  - removeEffect:
      id: effect-hold-person
      assert:
        facts:
          holdPerson.active: 0
          # The concentration spend rode the same effect — dismissing the chip
          # releases the slot.
          concentration.remaining: 1
        annotations:
          notExists:
            - rule.spell-hold-person.notice
            - planner.concentration.annotation
