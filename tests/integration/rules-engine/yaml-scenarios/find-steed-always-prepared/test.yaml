name: 'Find Steed - Always Prepared at Paladin L5'
description: >-
  Paladin L5 grants Find Steed always-prepared without spending a prepared-spell
  slot, and it cannot be unprepared
ruleGroups:
  - species-human/species-human
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/prepared-spells
  - class-paladin/class-paladin-level1
  - class-paladin/class-paladin-level2
  - class-paladin/class-paladin-level3
  - class-paladin/class-paladin-level4
  - class-paladin/class-paladin-level5
  - class-paladin/class-paladin-paladin-find-steed
  - spells/spell-find-steed
steps:
  - evaluate:
      assert:
        facts:
          spell.l2.findSteed.prepared: 1
          spell.l2.findSteed.alwaysPrepared: 1
          # Granted for free — does not consume a prepared-spell slot
          spellcasting.prepared.count: 0
  # Cannot unprepare an always-prepared spell: re-committing a set that OMITS it
  # replaces the keyed set effect but cannot drop the grant's prepared fact.
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared: []
      assert:
        facts:
          spell.l2.findSteed.prepared: 1
          spell.l2.findSteed.alwaysPrepared: 1
          spellcasting.prepared.count: 0
