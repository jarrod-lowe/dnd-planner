name: 'Heroic Inspiration - Grant Illegal When Active'
description: 'Grant HI is illegal when HI is already active (remaining = 1)'
ruleGroups:
  - dnd-5e-2024/core-events
  - dnd-5e-2024/heroic-inspiration
initialEffects:
  - id: effect-hi
    phase: early
    after:
      - group: hi-consume
    group:
      - hi-settle
    ui:
      name: rule.dnd-5e-2024.heroic-inspiration.effect-hi.name
    activities:
      - type: numberSet
        source:
          number: 1
        target:
          fact: heroicInspiration.remaining
        when:
          - fact: heroicInspiration.consumed
            operator: equals
            value: 0
      - type: advertiseEffect
        self: true
        when:
          - fact: heroicInspiration.consumed
            operator: equals
            value: 0
steps:
  # HI already active from persistent effect
  - evaluate:
      assert:
        facts:
          heroicInspiration.max: 1
          heroicInspiration.remaining: 1
        offers:
          illegal:
            - grant-hi
