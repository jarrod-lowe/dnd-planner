name: 'Shield With Splint Armor'
description: >
  Shield +2 AC stacks with splint armor AC 17. Body armor is still a per-item don
  (it occupies no hands, so it is not part of the loadout); the shield comes from
  the loadout, and the two contributions compose.
ruleGroups:
  - dnd-5e-2024/hands
  - dnd-5e-2024/loadout
  - dnd-5e-2024/ac
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/splint-armor
  - dnd-5e-2024/shield
initialEffects:
  - id: test-armor-proficiencies
    phase: early
    activities:
      - type: numberSet
        target:
          fact: armor.heavy.proficient
        source:
          number: 1
      - type: numberSet
        target:
          fact: armor.shield.proficient
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
      assert:
        facts:
          ac.base: 10
          ac.value: 10
        offers:
          exists:
            - don-splint-armor
            - set-loadout
  - addOffer:
      id: don-splint-armor
      assert:
        facts:
          ac.base: 17
          ac.dexBonus: 0
          ac.value: 17
  - addOffer:
      id: set-loadout
      selections:
        loadout:
          id: shield
          hands: 1
          handsFree: 1
          items:
            - id: shield
              nameKey: rule.dnd-5e-2024.shield.effect-shield.name
              hands: 1
              twoHanded: false
              state:
                armor.shield.equipped: 1
                ac.shieldBonus: 2
      assert:
        facts:
          ac.shieldBonus: 2
          ac.value: 19
          armor.splint.equipped: 1
          armor.shield.equipped: 1
          hands.remaining: 1
