name: 'Shield With Splint Armor'
description: 'Shield +2 AC stacks with splint armor AC 17'
ruleGroups:
  - dnd-5e-2024/ac
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/splint-armor
  - dnd-5e-2024/shield
initialEffects:
  - id: test-armor-proficiencies
    phase: early
    activities:
      - type: numberSet
        target:
          fact: armor.heavy.proficient
        source:
          number: 1
      - type: numberSet
        target:
          fact: armor.shield.proficient
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
      assert:
        facts:
          ac.base: 10
          ac.value: 10
        offers:
          exists:
            - don-splint-armor
            - don-shield
  - addOffer:
      id: don-splint-armor
      assert:
        facts:
          ac.base: 17
          ac.dexBonus: 0
          ac.value: 17
  - addOffer:
      id: don-shield
      assert:
        facts:
          ac.shieldBonus: 2
          ac.value: 19
          armor.splint.equipped: 1
          armor.shield.equipped: 1
