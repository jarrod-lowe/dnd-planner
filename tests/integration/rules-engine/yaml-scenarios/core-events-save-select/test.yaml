name: 'Core Events - Save has dice-line and segmented controls'
description: 'per-stat save offers a dice roll with segmented pass/fail outcome'
ruleGroups:
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/core-events
steps:
  - evaluate:
      assert:
        offers:
          exists:
            - record-save-dex
        offerUi:
          - id: record-save-dex
            ui:
              primaryControl:
                type: dice-line
                dice:
                  - sides: 20
                    bonus:
                      var: saveBonus
              secondaryControl:
                type: segmented
                var: passed
                options:
                  - value: -1
                    label: planner.record.outcome.none
                  - value: 1
                    label: planner.record.passed
                  - value: 0
                    label: planner.record.failed
