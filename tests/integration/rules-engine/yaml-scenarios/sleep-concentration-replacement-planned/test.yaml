name: 'Sleep - Planned Recast Legal and Replacing While Concentrating'
description: >-
  Casting Sleep, then planning a second cast while concentration is still held,
  is legal (SRD 5.2) and replaces the hold: no plan errors, and the keyed
  concentration effect keeps concentration.spent at 1 instead of stacking.
ruleGroups:
  - dnd-5e-2024/prepared-spells
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/concentration
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-sleep
steps:
  - evaluate:
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: sleep
            level: 1
            nameKey: rule.spell-sleep.offer-sleep.name
            preparedFact: spell.l1.sleep.prepared
            alwaysPreparedFact: spell.l1.sleep.alwaysPrepared
  - endTurn: {}
  - addOffer:
      id: cast-sleep
      assert:
        facts:
          concentration.remaining: 0
          spellcasting.slots.level1.remaining: 1
  - endTurn:
      assert:
        effects:
          exists:
            - effect-sleep
  # Turn 2: still concentrating; planning a second cast is LEGAL (SRD 5.2 — the
  # recast dismisses the first hold) and a slot remains, so NO errors at all.
  - evaluate:
      assert:
        facts:
          concentration.remaining: 0
          spellcasting.slots.level1.remaining: 1
  - addOffer:
      id: cast-sleep
      assert:
        planErrors:
          - id: cast-sleep
            index: 0
            errors: []
        facts:
          concentration.spent: 1
          spellcasting.slots.level1.remaining: 0
