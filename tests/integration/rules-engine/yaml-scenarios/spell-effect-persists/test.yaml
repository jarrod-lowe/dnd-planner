name: 'Spell Effect Persists'
description: 'Spell effects persist across turns, continuing to consume spell slots'
ruleGroups:
  - dnd-5e-2024/prepared-spells
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - class-paladin/class-paladin-level1
  - spells/spell-create-and-destroy-water
steps:
  - evaluate:
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: create-and-destroy-water
            level: 1
            nameKey: rule.spell-create-and-destroy-water.cast-create-and-destroy-water.name
            preparedFact: spell.l1.createAndDestroyWater.prepared
            alwaysPreparedFact: spell.l1.createAndDestroyWater.alwaysPrepared
  - evaluate:
      assert:
        facts:
          spellcasting.slots.level1.remaining: 2
  - addOffer:
      id: cast-create-and-destroy-water
      assert:
        facts:
          spellcasting.slots.level1.remaining: 1
  - endTurn:
      assert:
        facts:
          spellcasting.slots.level1.remaining: 1
  - addOffer:
      id: cast-create-and-destroy-water
      assert:
        facts:
          spellcasting.slots.level1.remaining: 0
  - endTurn:
      assert:
        facts:
          spellcasting.slots.level1.remaining: 0
