name: 'Hands - Spear Uses 1 Hand'
description: >
  A spear is versatile, so its one-handed grip is a configuration of its own: 1
  hand spent, one free, and the two-handed grip fact left unset.

ruleGroups:
  - dnd-5e-2024/hands
  - dnd-5e-2024/loadout
  - dnd-5e-2024/core-events
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spear

steps:
  - evaluate:
      assert:
        facts:
          hands.max: 2
          hands.remaining: 2
        offers:
          exists:
            - set-loadout
  - addOffer:
      id: set-loadout
      selections:
        loadout:
          id: spear
          hands: 1
          handsFree: 1
          items:
            - id: spear
              nameKey: rule.dnd-5e-2024.attacks.spear.name
              hands: 1
              twoHanded: false
              gripKey: rule.dnd-5e-2024.loadout.grip.one-handed
              state:
                weapon.spear.equipped: 1
      assert:
        facts:
          weapon.spear.equipped: 1
          weapon.spear.twoHanded: 0
          hands.remaining: 1
