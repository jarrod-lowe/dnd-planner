name: 'Calm Emotions Concentration Replacement'
description: >-
  Casting Calm Emotions while already concentrating is legal (SRD 5.2): the
  moment the second concentration spell starts, the first is dismissed — the
  shared concentration key replaces the hold, so concentration.spent stays 1.
ruleGroups:
  - dnd-5e-2024/prepared-spells
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/concentration
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-calm-emotions
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 2
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 2
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
      assert:
        facts:
          concentration.remaining: 1
        offers:
          exists:
            - set-prepared-spells
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: calm-emotions
            level: 2
            nameKey: rule.spell-calm-emotions.offer-calm-emotions.name
            preparedFact: spell.l2.calmEmotions.prepared
            alwaysPreparedFact: spell.l2.calmEmotions.alwaysPrepared
  - endTurn: {}
  - addOffer:
      id: set-charisma
      selections:
        score: 16
  # Cast Calm Emotions — consumes concentration
  - addOffer:
      id: cast-calm-emotions
      assert:
        facts:
          concentration.remaining: 0
          spellcasting.slots.level2.remaining: 1
  - endTurn:
      assert:
        effects:
          exists:
            - effect-calm-emotions
  # Turn 2: the recast is LEGAL — SRD 5.2 "Another Concentration Effect" loses
  # the first concentration the moment the second cast starts.
  - evaluate:
      assert:
        facts:
          concentration.remaining: 0
        offers:
          legal:
            - cast-calm-emotions
  # Recast Calm Emotions: the keyed effect REPLACES the committed hold, so the
  # slot still reads as held once (not stacked) while the second slot spends.
  - addOffer:
      id: cast-calm-emotions
      assert:
        facts:
          concentration.spent: 1
          concentration.remaining: 0
          spellcasting.slots.level2.remaining: 0
  - endTurn:
      assert:
        effects:
          exists:
            - effect-calm-emotions
