name: 'Weapon Don Offer'
description: >
  When a weapon rule group is assigned and the weapon is stowed,
  a don offer appears in the configuration section.

ruleGroups:
  - dnd-5e-2024/core-events
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/attacks
  - dnd-5e-2024/dagger

steps:
  - evaluate:
      assert:
        facts:
          weapon.dagger.equipped: 0
        offers:
          exists:
            - don-dagger
