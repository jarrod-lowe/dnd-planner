name: 'Steed Skill Checks'
description: 'Steed has 18 skill check offers with correct ability modifiers'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-find-steed
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  # Cast Find Steed at L2
  - evaluate:
      assert:
        offers:
          exists:
            - cast-find-steed
  - addOffer:
      id: cast-find-steed
  - endTurn:
      assert:
        facts:
          companion.steed.summoned: 1
          # Verify ability modifiers computed correctly
          companion.steed.str.modifier: 4
          companion.steed.dex.modifier: 1
          companion.steed.con.modifier: 2
          companion.steed.int.modifier: -2
          companion.steed.wis.modifier: 1
          companion.steed.cha.modifier: -1
  # Next turn: all 18 skill check offers should exist
  - evaluate:
      assert:
        offers:
          exists:
            - steed-skill-acrobatics
            - steed-skill-animal-handling
            - steed-skill-arcana
            - steed-skill-athletics
            - steed-skill-deception
            - steed-skill-history
            - steed-skill-insight
            - steed-skill-intimidation
            - steed-skill-investigation
            - steed-skill-medicine
            - steed-skill-nature
            - steed-skill-perception
            - steed-skill-performance
            - steed-skill-persuasion
            - steed-skill-religion
            - steed-skill-sleight-of-hand
            - steed-skill-stealth
            - steed-skill-survival
