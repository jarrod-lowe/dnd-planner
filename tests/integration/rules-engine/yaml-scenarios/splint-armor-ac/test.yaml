name: 'Splint Armor AC'
description: 'AC becomes 17 with no Dex bonus when splint armor is donned'
ruleGroups:
  - dnd-5e-2024/ac
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/splint-armor
steps:
  - evaluate:
      assert:
        facts:
          ac.base: 10
          ac.value: 10
        offers:
          exists:
            - don-splint-armor
  - addOffer:
      id: don-splint-armor
      assert:
        facts:
          ac.base: 17
          ac.dexBonus: 0
          ac.value: 17
          armor.splint.equipped: 1
  # Set DEX to 8 (modifier -1) -- AC is STILL 17: heavy armor ignores Dex entirely,
  # even a negative modifier (a positive-only cap would wrongly show 16).
  - addOffer:
      id: set-dexterity
      selections:
        score: 8
      assert:
        facts:
          dex.modifier: -1
          ac.base: 17
          ac.dexBonus: 0
          ac.value: 17
  - endTurn:
      assert:
        facts:
          ac.base: 17
          ac.dexBonus: 0
          ac.value: 17
          armor.splint.equipped: 1
