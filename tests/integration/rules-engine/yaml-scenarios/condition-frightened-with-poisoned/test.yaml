name: 'Condition Frightened - With Poisoned'
description: >-
  Source separation: Poisoned effect-writes the shared flags (stateCombine
  max) and Frightened contributes none (the per-row chip model) — so with
  both conditions live the flags read exactly Poisoned's 1, and each
  condition fact stands on its own. The dice-line combines the legs per row:
  Poisoned's flag keeps Disadvantage on regardless of the row's sight value.
ruleGroups:
  - dnd-5e-2024/condition-poisoned
  - dnd-5e-2024/condition-frightened
steps:
  - addOffer:
      id: record-poisoned
      assert:
        facts:
          condition.poisoned: 1
          attack.str.disadvantage: 1
          attack.dex.disadvantage: 1
  - addOffer:
      id: record-frightened
      assert:
        facts:
          condition.poisoned: 1
          condition.frightened: 1
          attack.str.disadvantage: 1
          attack.dex.disadvantage: 1
          initiative.disadvantage: 1
          check.disadvantage: 1
        annotations:
          exists:
            - rule.dnd-5e-2024.condition-poisoned.notice
            - rule.dnd-5e-2024.condition-frightened.los
