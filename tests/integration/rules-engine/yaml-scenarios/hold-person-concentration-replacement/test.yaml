name: 'Hold Person Concentration Replacement'
description: >-
  Casting Hold Person while already concentrating is legal (SRD 5.2): the
  moment the second concentration spell starts, the first is dismissed — the
  shared concentration key replaces the hold, so concentration.spent stays 1.
ruleGroups:
  - dnd-5e-2024/prepared-spells
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/concentration
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-hold-person
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 2
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 2
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
      assert:
        facts:
          concentration.remaining: 1
        offers:
          exists:
            - set-prepared-spells
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: hold-person
            level: 2
            nameKey: rule.spell-hold-person.offer-hold-person.name
            preparedFact: spell.l2.holdPerson.prepared
            alwaysPreparedFact: spell.l2.holdPerson.alwaysPrepared
  - endTurn: {}
  - addOffer:
      id: set-charisma
      selections:
        score: 16
  # Cast Hold Person — consumes concentration
  - addOffer:
      id: cast-hold-person
      assert:
        facts:
          concentration.remaining: 0
          spellcasting.slots.level2.remaining: 1
  - endTurn:
      assert:
        effects:
          exists:
            - effect-hold-person
  # Turn 2: the recast is LEGAL — SRD 5.2 "Another Concentration Effect" loses
  # the first concentration the moment the second cast starts.
  - evaluate:
      assert:
        facts:
          concentration.remaining: 0
        offers:
          legal:
            - cast-hold-person
  # Recast Hold Person: the keyed effect REPLACES the committed hold (the
  # holdPerson.active marker rides the same effect, so the old hold's marker
  # goes with it), and the second slot spends.
  - addOffer:
      id: cast-hold-person
      assert:
        facts:
          concentration.spent: 1
          concentration.remaining: 0
          holdPerson.active: 1
          spellcasting.slots.level2.remaining: 0
  - endTurn:
      assert:
        effects:
          exists:
            - effect-hold-person
