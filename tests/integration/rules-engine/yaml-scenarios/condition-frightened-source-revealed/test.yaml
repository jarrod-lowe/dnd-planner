name: 'Condition Frightened - Source Revealed'
description: >-
  The seed round-trip: hide the source, then reveal it — the empty
  same-`key` ('frightened-source') eviction REPLACES the hidden effect, the
  seed fact reverts to unset (in sight), and rows added afterwards capture
  the in-sight value again. Newest committed effect wins the key, so the
  seeded array order [condition, hidden, reveal] folds to "visible". The
  shared flags stay 0 throughout (the per-row chip model — they never carried
  Frightened to begin with).
ruleGroups:
  - dnd-5e-2024/condition-frightened
initialEffects:
  # Real committed translations in tests/integration/rules-engine/initial-effects.ts.
  - id: effect-frightened
  - id: effect-frightened-source-hidden
  - id: effect-frightened-source-visible
steps:
  - evaluate:
      assert:
        facts:
          condition.frightened: 1
          frightened.sourceHidden: 0
          attack.str.disadvantage: 0
          check.disadvantage: 0
        annotations:
          exists:
            - rule.dnd-5e-2024.condition-frightened.los
