name: 'Find Steed Basic Cast'
description: 'Casting Find Steed consumes an action and L2 spell slot, creates a persistent steed effect with computed stats'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-find-steed
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
  - addOffer:
      id: prepare-find-steed
  # Verify initial state: Find Steed offer exists and is legal
  - evaluate:
      assert:
        facts:
          actions.remaining: 1
          spellcasting.remaining: 1
          spellcasting.slots.level1.remaining: 2
          spellcasting.slots.level2.remaining: 1
        offers:
          exists:
            - cast-find-steed
  # Cast Find Steed using default (L2) slot
  # After addOffer: only action/slot consumption is visible
  # Steed stats are inside advertiseEffect, not visible until effect is committed
  - addOffer:
      id: cast-find-steed
      assert:
        facts:
          actions.remaining: 0
          spellcasting.remaining: 0
          spellcasting.slots.level2.remaining: 0
  # End turn: steed effect is committed, stats now computed
  - endTurn:
      assert:
        effects:
          exists:
            - effect-steed
            - effect-steed-slot-l2
        facts:
          companion.steed.summoned: 1
          companion.steed.hp.max: 25
          companion.steed.hp.current: 25
          companion.steed.ac.value: 12
          companion.steed.speed: 60
          companion.steed.fly.can: 0
          companion.steed.actions.max: 1
          companion.steed.actions.remaining: 1
          companion.steed.bonusActions.max: 1
          companion.steed.bonusActions.remaining: 1
          companion.steed.dismissed: 0
  # Next turn: steed offers are available
  - evaluate:
      assert:
        facts:
          companion.steed.summoned: 1
          companion.steed.hp.max: 25
          companion.steed.ac.value: 12
          companion.steed.actions.remaining: 1
          companion.steed.bonusActions.remaining: 1
        offers:
          exists:
            - steed-move-walk
            - steed-dodge
            - steed-disengage
            - steed-dash
            - offer-dismiss-steed
