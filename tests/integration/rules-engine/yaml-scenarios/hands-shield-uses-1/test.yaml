name: 'Hands - Shield Uses 1 Hand'
description: >
  A loadout holding a shield spends 1 of the 2 hands, leaving one free — a free
  hand is load-bearing (somatic components, Grapple, Lay on Hands), so the
  remaining count is the point.

ruleGroups:
  - dnd-5e-2024/hands
  - dnd-5e-2024/loadout
  - dnd-5e-2024/ac
  - dnd-5e-2024/shield

steps:
  - evaluate:
      assert:
        facts:
          hands.max: 2
          hands.remaining: 2
        offers:
          exists:
            - set-loadout
  - addOffer:
      id: set-loadout
      selections:
        loadout:
          id: shield
          hands: 1
          handsFree: 1
          items:
            - id: shield
              nameKey: rule.dnd-5e-2024.shield.effect-shield.name
              hands: 1
              twoHanded: false
              state:
                armor.shield.equipped: 1
                ac.shieldBonus: 2
      assert:
        facts:
          armor.shield.equipped: 1
          hands.remaining: 1
