name: 'Tormentor (Damage Control) - Board Bakes The Stat Block'
description: >-
  Acquiring the Tormentor advertises ONE permanent keyed effect baking the
  display-only stat block into facts: active, the AC MODE (Moving by default —
  the derived ac.effective reads 21; the flat ac.value bake is retired), HP 60,
  Cargo 500 lb., STR/DEX/CON 16/14/14 with +3/+2/+2 modifiers. Speed bakes
  NOTHING any more (PR-D): the derived speed.effective reads the fuel, so a
  fresh unfuelled vehicle stands at 0 ft. until the Helm feeds it. The keyed
  effect replaces on re-acquire (facts never double), and end of turn commits
  it so the stats persist on later turns. Acquiring also makes the VEHICLE's
  +ADD panel available: the abandon offer appears under the vehicle's subject,
  in the free section, gated on the acquire.
ruleGroups:
  - vehicles/tormentor
steps:
  # Acquire: the advertised effect's state is visible in the projection at once.
  - addOffer:
      id: acquire-tormentor
      assert:
        facts:
          companion.tormentor.active: 1
          companion.tormentor.ac.effective: 21
          companion.tormentor.hp.max: 60
          companion.tormentor.speed.effective: 0
          companion.tormentor.cargo: 500
          companion.tormentor.str: 16
          companion.tormentor.dex: 14
          companion.tormentor.con: 14
          companion.tormentor.str.modifier: 3
          companion.tormentor.dex.modifier: 2
          companion.tormentor.con.modifier: 2
        planErrors:
          - id: acquire-tormentor
            index: 0
            errors: []
  # Acquireed: the vehicle's +ADD panel now carries the abandon offer.
  - evaluate:
      assert:
        offers:
          exists:
            - abandon-tormentor
          legal:
            - abandon-tormentor
        offerUi:
          - id: abandon-tormentor
            ui:
              section: free
              subject: tormentor
              actionCost: []
  # A second acquiring is illegal-but-possible this pass; the keyed effect
  # REPLACES, so every fact stays single (no stacking, active stays 1).
  - addOffer:
      id: acquire-tormentor
      assert:
        facts:
          companion.tormentor.active: 1
          companion.tormentor.str: 16
          companion.tormentor.hp.max: 60
  # End of turn commits the acquire effect; the stats persist.
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-acquire
        facts:
          companion.tormentor.active: 1
          companion.tormentor.ac.effective: 21
          companion.tormentor.hp.max: 60
          companion.tormentor.speed.effective: 0
          companion.tormentor.cargo: 500
  # A later turn still reads the committed stat block.
  - evaluate:
      assert:
        facts:
          companion.tormentor.active: 1
          companion.tormentor.str.modifier: 3
        offers:
          exists:
            - acquire-tormentor
            - abandon-tormentor
