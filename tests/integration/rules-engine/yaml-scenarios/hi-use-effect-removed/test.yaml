name: 'Heroic Inspiration - Use After Effect Removed'
description: 'Planned use-hi errors when HI effects are removed mid-turn'
ruleGroups:
  - dnd-5e-2024/core-events
  - dnd-5e-2024/heroic-inspiration
initialEffects:
  - id: effect-hi-set
    phase: early
    group:
      - hi-set
    ui:
      name: rule.dnd-5e-2024.heroic-inspiration.effect-hi.name
    activities:
      - type: numberSet
        source:
          number: 1
        target:
          fact: heroicInspiration.remaining
        when:
          - fact: heroicInspiration.consumed
            operator: equals
            value: 0
steps:
  # HI is active
  - evaluate:
      assert:
        facts:
          heroicInspiration.remaining: 1
        offers:
          legal:
            - use-hi
  # Add use-hi to plan - should be legal with no errors
  - addOffer:
      id: use-hi
      assert:
        facts:
          heroicInspiration.remaining: 0
          heroicInspiration.consumed: 1
        offers:
          illegal:
            - use-hi
        planErrors:
          - id: use-hi
            index: 0
            errors: []
  # Remove visible effect - remaining drops to 0, use-hi should now error
  - removeEffect:
      id: effect-hi-set
      assert:
        facts:
          heroicInspiration.remaining: 0
        planErrors:
          - id: use-hi
            index: 0
            errors:
              - rule.dnd-5e-2024.heroic-inspiration.use-hi-offer.no_inspiration
