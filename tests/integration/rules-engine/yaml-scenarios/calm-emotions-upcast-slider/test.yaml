name: 'Calm Emotions Upcast Slider'
description: 'The Calm Emotions cast offer exposes a slot-level slider (L2-L5) so casters can up-cast.'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/concentration
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-calm-emotions
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
  - addOffer:
      id: prepare-calm-emotions
  - evaluate:
      assert:
        offers:
          exists:
            - cast-calm-emotions
        offerUi:
          - id: cast-calm-emotions
            ui:
              primaryControl:
                type: slider
                var: slotLevel
                notches:
                  - { value: 2, enabled: { fact: spellcasting.slots.level2.total } }
                  - { value: 3, enabled: { fact: spellcasting.slots.level3.total } }
                  - { value: 4, enabled: { fact: spellcasting.slots.level4.total } }
                  - { value: 5, enabled: { fact: spellcasting.slots.level5.total } }
                valueFormat: spellLevel
