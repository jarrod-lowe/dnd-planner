name: 'Sleep Concentration Blocking'
description: 'Cannot cast Sleep while already concentrating. Concentration resource prevents second cast.'
ruleGroups:
  - dnd-5e-2024/prepared-spells
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/concentration
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - class-paladin/paladin-spells-l1
  - spells/spell-sleep
steps:
  - evaluate:
      assert:
        facts:
          concentration.remaining: 1
        offers:
          exists:
            - set-prepared-spells
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: sleep
            level: 1
            nameKey: rule.spell-sleep.offer-sleep.name
            preparedFact: spell.l1.sleep.prepared
            alwaysPreparedFact: spell.l1.sleep.alwaysPrepared
  - endTurn: {}
  - addOffer:
      id: set-charisma
      selections:
        score: 16
  # Cast Sleep — consumes concentration
  - addOffer:
      id: cast-sleep
      assert:
        facts:
          concentration.remaining: 0
          spellcasting.slots.level1.remaining: 1
  - endTurn:
      assert:
        effects:
          exists:
            - effect-sleep
  # Turn 2: Sleep should be illegal due to concentration being active
  - evaluate:
      assert:
        facts:
          concentration.remaining: 0
        offers:
          illegal:
            - cast-sleep
