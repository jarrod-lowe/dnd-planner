name: 'Loadout - swapping evicts the previous configuration'
description: >
  Every loadout commits ONE effect under the shared key `loadout`, and same-key
  effects do not stack — the newest evicts the older. So setting a second
  configuration is atomic: the first loadout's facts (spear + shield) are gone in
  the same evaluation, with no unequip step and no stale hands spend.

ruleGroups:
  - dnd-5e-2024/hands
  - dnd-5e-2024/loadout
  - dnd-5e-2024/ac
  - dnd-5e-2024/shield
  - dnd-5e-2024/core-events
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spear
  - dnd-5e-2024/greataxe

steps:
  - addOffer:
      id: set-loadout
      selections:
        loadout:
          id: spear+shield
          hands: 2
          handsFree: 0
          items:
            - id: spear
              nameKey: rule.dnd-5e-2024.attacks.spear.name
              hands: 1
              twoHanded: false
              state:
                weapon.spear.equipped: 1
            - id: shield
              nameKey: rule.dnd-5e-2024.shield.effect-shield.name
              hands: 1
              twoHanded: false
              state:
                armor.shield.equipped: 1
                ac.shieldBonus: 2
      assert:
        facts:
          hands.remaining: 0
          weapon.spear.equipped: 1
          armor.shield.equipped: 1

  # Swap to the greataxe: two hands, nothing else. The old loadout is evicted, so
  # the spear and shield drop out and the hand budget is still exactly 2.
  - addOffer:
      id: set-loadout
      selections:
        loadout:
          id: greataxe
          hands: 2
          handsFree: 0
          items:
            - id: greataxe
              nameKey: rule.dnd-5e-2024.attacks.greataxe.name
              hands: 2
              twoHanded: false
              state:
                weapon.greataxe.equipped: 1
      assert:
        facts:
          hands.remaining: 0
          weapon.greataxe.equipped: 1
          weapon.spear.equipped: 0
          armor.shield.equipped: 0
          ac.shieldBonus: 0
        offers:
          exists:
            - greataxe-use-action
          notExists:
            - spear-use-action

  - endTurn:
      assert:
        facts:
          hands.remaining: 0
          weapon.greataxe.equipped: 1
          weapon.spear.equipped: 0
        effects:
          exists:
            - effect-loadout
