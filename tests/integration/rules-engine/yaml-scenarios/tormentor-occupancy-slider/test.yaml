name: 'Tormentor (Damage Control) - Creature Capacity Occupancy'
description: >-
  Acquiring bakes the stat block's Creature Capacity (4 Medium creatures) as
  creatureCapacity.max, with used reading 0 until something counts — the
  recorded occupancy plus every held seat (the passenger-seat pass). The
  vehicle's +ADD carries a free-section occupancy slider (0 to the baked max)
  whose apply advertises ONE permanent KEYED effect recording the occupancy:
  re-applying replaces rather than stacks, the derived used clamps to 0..max,
  and removing the occupancy chip returns used to 0 (no record, no seat).
  No legality gates: over-capacity occupancy is illegal-but-possible this
  pass (diagnostics deferred with acquiring's).
ruleGroups:
  - vehicles/tormentor
steps:
  # Acquire: the capacity lands with the rest of the stat block; nobody
  # counts by default, so used reads 0 before anyone touches the slider.
  - addOffer:
      id: acquire-tormentor
      assert:
        facts:
          companion.tormentor.creatureCapacity.max: 4
          companion.tormentor.creatureCapacity.used: 0
  # The vehicle's +ADD carries the occupancy slider: free, under the vehicle
  # subject, bounded 0..the baked capacity, opening at the current occupancy.
  - evaluate:
      assert:
        offers:
          exists:
            - set-tormentor-occupancy
          legal:
            - set-tormentor-occupancy
        offerUi:
          - id: set-tormentor-occupancy
            ui:
              section: free
              subject: tormentor
              actionCost: []
              primaryControl:
                type: slider
                var: occupancy
                min:
                  number: 0
                max:
                  fact: companion.tormentor.creatureCapacity.max
        offerVars:
          - id: set-tormentor-occupancy
            vars:
              occupancy:
                capture: true
                default:
                  fact: companion.tormentor.creatureCapacity.used
  # Set 3 of 4: the keyed effect IS the stored value (used reads it at once).
  - addOffer:
      id: set-tormentor-occupancy
      selections:
        occupancy: 3
      assert:
        facts:
          companion.tormentor.creatureCapacity.occupancy: 3
          companion.tormentor.creatureCapacity.used: 3
          companion.tormentor.creatureCapacity.max: 4
        planErrors:
          - id: set-tormentor-occupancy
            index: 0
            errors: []
  # Re-set to 2: the keyed effect REPLACES (used reads 2, never 3+2).
  - addOffer:
      id: set-tormentor-occupancy
      selections:
        occupancy: 2
      assert:
        facts:
          companion.tormentor.creatureCapacity.used: 2
  # Commit: one occupancy effect persists alongside the acquire effect.
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-acquire
            - effect-tormentor-occupancy
        facts:
          companion.tormentor.creatureCapacity.used: 2
  # The store stays raw; the derived used CLAMPS to the capacity. The slider's
  # own bound stops the UI here — this pins the derive (the control bound is
  # pinned above), so a stale or foreign value can never read past 0..max.
  - addOffer:
      id: set-tormentor-occupancy
      selections:
        occupancy: 99
      assert:
        facts:
          companion.tormentor.creatureCapacity.occupancy: 99
          companion.tormentor.creatureCapacity.used: 4
  - addOffer:
      id: set-tormentor-occupancy
      selections:
        occupancy: -1
      assert:
        facts:
          companion.tormentor.creatureCapacity.used: 0
  # Commit the clamped re-set, then remove the occupancy chip: the stored
  # value goes with it and used falls back to nothing (no record, no seat).
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-occupancy
  - removeEffect:
      id: effect-tormentor-occupancy
      assert:
        effects:
          notExists:
            - effect-tormentor-occupancy
        facts:
          companion.tormentor.creatureCapacity.used: 0
          companion.tormentor.creatureCapacity.max: 4
          companion.tormentor.active: 1
        offers:
          exists:
            - set-tormentor-occupancy
