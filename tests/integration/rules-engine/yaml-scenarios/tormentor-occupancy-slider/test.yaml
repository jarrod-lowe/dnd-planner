name: 'Tormentor (Damage Control) - Creature Capacity Occupancy'
description: >-
  Boarding bakes the stat block's Creature Capacity (4 Medium creatures) as
  creatureCapacity.max, with used defaulting to 1 — the boarder counts. The
  station's +ADD carries a free-section occupancy slider (0 to the baked max)
  whose apply advertises ONE permanent KEYED effect recording the occupancy:
  re-applying replaces rather than stacks, the derived used clamps to 0..max,
  and removing the occupancy chip returns used to the board default of 1.
  No legality gates: over-capacity occupancy is illegal-but-possible this
  pass (diagnostics deferred with boarding's).
ruleGroups:
  - vehicles/tormentor
steps:
  # Board: the capacity lands with the rest of the stat block; the boarder
  # counts, so used reads 1 before anyone touches the slider.
  - addOffer:
      id: board-tormentor
      assert:
        facts:
          companion.tormentorDamageControl.creatureCapacity.max: 4
          companion.tormentorDamageControl.creatureCapacity.used: 1
  # The station's +ADD carries the occupancy slider: free, under the station
  # subject, bounded 0..the baked capacity, opening at the current occupancy.
  - evaluate:
      assert:
        offers:
          exists:
            - set-tormentor-occupancy
          legal:
            - set-tormentor-occupancy
        offerUi:
          - id: set-tormentor-occupancy
            ui:
              section: free
              subject: tormentor-damage-control
              actionCost: []
              primaryControl:
                type: slider
                var: occupancy
                min:
                  number: 0
                max:
                  fact: companion.tormentorDamageControl.creatureCapacity.max
        offerVars:
          - id: set-tormentor-occupancy
            vars:
              occupancy:
                capture: true
                default:
                  fact: companion.tormentorDamageControl.creatureCapacity.used
  # Set 3 of 4: the keyed effect IS the stored value (used reads it at once).
  - addOffer:
      id: set-tormentor-occupancy
      selections:
        occupancy: 3
      assert:
        facts:
          companion.tormentorDamageControl.creatureCapacity.occupancy: 3
          companion.tormentorDamageControl.creatureCapacity.used: 3
          companion.tormentorDamageControl.creatureCapacity.max: 4
        planErrors:
          - id: set-tormentor-occupancy
            index: 0
            errors: []
  # Re-set to 2: the keyed effect REPLACES (used reads 2, never 3+2).
  - addOffer:
      id: set-tormentor-occupancy
      selections:
        occupancy: 2
      assert:
        facts:
          companion.tormentorDamageControl.creatureCapacity.used: 2
  # Commit: one occupancy effect persists alongside the board effect.
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-damage-control
            - effect-tormentor-occupancy
        facts:
          companion.tormentorDamageControl.creatureCapacity.used: 2
  # The store stays raw; the derived used CLAMPS to the capacity. The slider's
  # own bound stops the UI here — this pins the derive (the control bound is
  # pinned above), so a stale or foreign value can never read past 0..max.
  - addOffer:
      id: set-tormentor-occupancy
      selections:
        occupancy: 99
      assert:
        facts:
          companion.tormentorDamageControl.creatureCapacity.occupancy: 99
          companion.tormentorDamageControl.creatureCapacity.used: 4
  - addOffer:
      id: set-tormentor-occupancy
      selections:
        occupancy: -1
      assert:
        facts:
          companion.tormentorDamageControl.creatureCapacity.used: 0
  # Commit the clamped re-set, then remove the occupancy chip: the stored
  # value goes with it and used falls back to the board default (1).
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-occupancy
  - removeEffect:
      id: effect-tormentor-occupancy
      assert:
        effects:
          notExists:
            - effect-tormentor-occupancy
        facts:
          companion.tormentorDamageControl.creatureCapacity.used: 1
          companion.tormentorDamageControl.creatureCapacity.max: 4
          companion.tormentorDamageControl.active: 1
        offers:
          exists:
            - set-tormentor-occupancy
