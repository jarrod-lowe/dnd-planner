name: 'Condition Frightened - Rest Clears'
description: >-
  Any rest clears the Frightened condition: the keyed effect carries
  untilShortRest, which a short rest satisfies directly and a long rest
  includes. The fact and the notice go with the effect, and the per-row model
  means no shared flags were ever written (the dice-line chip carries the
  disadvantage per row — asserted 0 before AND after) (umbrella default —
  SRD 5.2 gives no mechanical end, so rest plus manual chip dismissal only).
ruleGroups:
  - dnd-5e-2024/condition-frightened
  - dnd-5e-2024/core-events
steps:
  - addOffer:
      id: record-frightened
      assert:
        facts:
          condition.frightened: 1
          attack.str.disadvantage: 0
          check.disadvantage: 0
        annotations:
          exists:
            - rule.dnd-5e-2024.condition-frightened.notice
  # A long rest (the explicit endTurn flag) clears it.
  - endTurn:
      longRest: true
      assert:
        facts:
          condition.frightened: 0
          attack.str.disadvantage: 0
          initiative.disadvantage: 0
          check.disadvantage: 0
        effects:
          notExists:
            - effect-frightened
        annotations:
          notExists:
            - rule.dnd-5e-2024.condition-frightened.notice
  # ...and so does a recorded short rest: the rest flag effect restores its
  # scoped effects within the same evaluation, so the facts and notice are
  # already gone before the turn even ends.
  - addOffer:
      id: record-frightened
      assert:
        facts:
          condition.frightened: 1
  - addOffer:
      id: record-short-rest
      assert:
        facts:
          rest.short: 1
          condition.frightened: 0
          attack.str.disadvantage: 0
          check.disadvantage: 0
        annotations:
          notExists:
            - rule.dnd-5e-2024.condition-frightened.notice
  - endTurn:
      assert:
        facts:
          condition.frightened: 0
        effects:
          notExists:
            - effect-frightened
        annotations:
          notExists:
            - rule.dnd-5e-2024.condition-frightened.notice
