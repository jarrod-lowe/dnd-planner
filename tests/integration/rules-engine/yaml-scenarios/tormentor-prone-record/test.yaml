name: 'Tormentor (Damage Control) - Vehicle Prone and Flip Upright'
description: >-
  The vehicle's Prone Deficiency tracked as STATE ONLY: a namespaced
  companion.tormentorDamageControl.prone fact under a keyed effect of its own
  (never the player-global condition.prone, which would flip the PLAYER's
  attack flags and notice), recorded from the station's +ADD by a free offer
  with no legality gates and cleared by Flip Upright's empty same-key eviction
  (the get-up idiom). The effect is permanent — no rest clears it, because a
  rest does not right a vehicle. A NOTICE (the Life-Bond annotate pattern)
  carries the deficiency gated on the prone fact itself — PC-prone parity: the
  condition triggers its notice — so it stands ONLY while the vehicle is prone
  and withdraws the moment it is flipped upright.
ruleGroups:
  - vehicles/tormentor
steps:
  - evaluate:
      assert:
        facts:
          companion.tormentorDamageControl.prone: 0
        offers:
          exists:
            - board-tormentor
          notExists:
            - knock-tormentor-prone
            - flip-tormentor-upright
        annotations:
          notExists:
            - rule.tormentor.notice
  - addOffer:
      id: board-tormentor
      assert:
        # Boarded but upright: NO notice — the notice is the condition's, not
        # the board's (the player's Prone notice stands only while prone).
        annotations:
          notExists:
            - rule.tormentor.notice
        offers:
          exists:
            - knock-tormentor-prone
          notExists:
            - flip-tormentor-upright
        offerUi:
          - id: knock-tormentor-prone
            ui:
              section: free
              subject: tormentor-damage-control
              # A vehicle CONDITION files like the PC's (#467 taxonomy).
              intents:
                CONDITION: held
              # Both prone offers flip to the VEHICLE's own condition text.
              detailKey: vehicle/tormentor-prone
              actionCost: []
  - addOffer:
      id: knock-tormentor-prone
      assert:
        facts:
          companion.tormentorDamageControl.prone: 1
        offers:
          exists:
            - flip-tormentor-upright
        offerUi:
          - id: flip-tormentor-upright
            ui:
              section: free
              subject: tormentor-damage-control
              intents:
                CONDITION: held
              detailKey: vehicle/tormentor-prone
              actionCost: []
        annotations:
          exists:
            - rule.tormentor.notice
          targets:
            - key: rule.tormentor.notice
              targets: [notice]
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-prone
        facts:
          companion.tormentorDamageControl.prone: 1
  # Re-recording is idempotent: the keyed effect replaces itself (no stacking,
  # no legality gates — however the vehicle came to fall over, it can be
  # recorded).
  - addOffer:
      id: knock-tormentor-prone
      assert:
        facts:
          companion.tormentorDamageControl.prone: 1
  # Flip Upright: the empty same-key eviction clears the fact and withdraws
  # the station chip, and the NOTICE goes with the condition it carries.
  - addOffer:
      id: flip-tormentor-upright
      assert:
        facts:
          companion.tormentorDamageControl.prone: 0
        offers:
          notExists:
            - flip-tormentor-upright
        annotations:
          notExists:
            - rule.tormentor.notice
  - endTurn:
      assert:
        effects:
          notExists:
            - effect-tormentor-prone
        facts:
          companion.tormentorDamageControl.prone: 0
