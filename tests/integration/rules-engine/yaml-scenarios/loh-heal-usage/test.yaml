name: 'Lay on Hands - Heal Usage'
description: 'Healing with Lay on Hands consumes pool points and bonus action, heals HP'
ruleGroups:
  - species-human/species-human
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/hp
  - dnd-5e-2024/core-events
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ac
  - class-paladin/class-paladin-level1
  - class-paladin/class-paladin-lay-on-hands
steps:
  - evaluate:
      assert:
        facts:
          layOnHands.pool.total: 5
          layOnHands.pool.remaining: 5
          bonusActions.remaining: 1
        offers:
          exists:
            - loh-heal
  - addOffer:
      id: loh-heal
      selections:
        amount: 3
      assert:
        facts:
          layOnHands.pool.remaining: 2
          bonusActions.remaining: 0
