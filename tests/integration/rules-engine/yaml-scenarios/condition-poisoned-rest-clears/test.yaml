name: 'Condition Poisoned - Rest Clears'
description: >-
  Any rest clears the Poisoned condition: the keyed effect carries
  untilShortRest, which a short rest satisfies directly and a long rest
  includes. The fact, all the disadvantage flags, and the notice all go with
  the effect (umbrella default — SRD 5.2 gives no mechanical end, so rest plus
  manual chip dismissal only).
ruleGroups:
  - dnd-5e-2024/condition-poisoned
  - dnd-5e-2024/core-events
steps:
  - addOffer:
      id: record-poisoned
      assert:
        facts:
          condition.poisoned: 1
          attack.str.disadvantage: 1
          check.disadvantage: 1
        annotations:
          exists:
            - rule.dnd-5e-2024.condition-poisoned.notice
  # A long rest (the explicit endTurn flag) clears it.
  - endTurn:
      longRest: true
      assert:
        facts:
          condition.poisoned: 0
          attack.str.disadvantage: 0
          initiative.disadvantage: 0
          check.disadvantage: 0
        effects:
          notExists:
            - effect-poisoned
        annotations:
          notExists:
            - rule.dnd-5e-2024.condition-poisoned.notice
  # ...and so does a recorded short rest: the rest flag effect restores its
  # scoped effects within the same evaluation, so the facts and notice are
  # already gone before the turn even ends.
  - addOffer:
      id: record-poisoned
      assert:
        facts:
          condition.poisoned: 1
  - addOffer:
      id: record-short-rest
      assert:
        facts:
          rest.short: 1
          condition.poisoned: 0
          attack.str.disadvantage: 0
          check.disadvantage: 0
        annotations:
          notExists:
            - rule.dnd-5e-2024.condition-poisoned.notice
  - endTurn:
      assert:
        facts:
          condition.poisoned: 0
        effects:
          notExists:
            - effect-poisoned
        annotations:
          notExists:
            - rule.dnd-5e-2024.condition-poisoned.notice
