name: 'Steed Movement - Partial Distance'
description: >-
  Recording the steed moving less than its speed spends only the distance moved,
  not a fixed 30 ft, so short moves leave the rest of the 60-ft pool available.
ruleGroups:
  - dnd-5e-2024/prepared-spells
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-find-steed
steps:
  - evaluate: {}
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: find-steed
            level: 2
            nameKey: rule.spell-find-steed.offer-find-steed.name
            preparedFact: spell.l2.findSteed.prepared
            alwaysPreparedFact: spell.l2.findSteed.alwaysPrepared
  - addOffer:
      id: cast-find-steed
  - endTurn:
      assert:
        facts:
          companion.steed.movement.total: 60
          companion.steed.movement.remaining: 60
  # Walk 10 ft — spends 10, not 30.
  - addOffer:
      id: steed-move-walk
      selections:
        distance: 10
      assert:
        facts:
          companion.steed.movement.remaining: 50
  # Walk another 5 ft — spends 5.
  - addOffer:
      id: steed-move-walk
      selections:
        distance: 5
      assert:
        facts:
          companion.steed.movement.remaining: 45
  # Selecting more than remains (60 with 45 left) is illegal — it must not drive
  # movement negative. The >=5 legality gate alone would let this through.
  - addOffer:
      id: steed-move-walk
      selections:
        distance: 60
      assert:
        planErrors:
          - id: steed-move-walk
            index: 2
            errors:
              - rule.spell-find-steed.steed-move-walk.out_of_movement
