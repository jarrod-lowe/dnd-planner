name: 'Demon Grinder - Vehicle Prone and Flip Upright'
description: >-
  The vehicle's Prone Deficiency tracked as STATE ONLY: a namespaced
  companion.demonGrinder.prone fact under a keyed effect of its own (never the
  player-global condition.prone, which would flip the PLAYER's attack flags
  and notice), recorded from the vehicle's +ADD by a free offer and cleared by
  Flip Upright's empty same-key eviction (the get-up idiom). Both prone offers
  are gated structurally on the acquire ALONE: the prone state itself is a
  LEGALITY gate (the engine's illegal-but-visible contract — plan.ts keeps
  illegal offers applicable with diagnostics, and a planned-anyway row still
  executes), never a structural `when`. While UPRIGHT the knock is legal and
  the flip is illegal (not prone); while PRONE the mirror flips. The effect is
  permanent — no rest clears it, because a rest does not right a vehicle. A
  NOTICE (the Life-Bond annotate pattern) carries the deficiency gated on the
  prone fact itself — PC-prone parity: the condition triggers its notice — so
  it stands ONLY while the vehicle is prone and withdraws the moment it is
  flipped upright.
ruleGroups:
  - vehicles/demon-grinder
steps:
  - evaluate:
      assert:
        facts:
          companion.demonGrinder.prone: 0
        offers:
          exists:
            - acquire-demon-grinder
          # Unacquired, BOTH prone offers are structurally absent (the acquire is
          # the one structural gate): no vehicle, nothing to knock or flip.
          notExists:
            - knock-demon-grinder-prone
            - flip-demon-grinder-upright
        annotations:
          notExists:
            - rule.demon-grinder.notice
  - addOffer:
      id: acquire-demon-grinder
      assert:
        # Acquired but upright: NO notice — the notice is the condition's, not
        # the acquire's (the player's Prone notice stands only while prone).
        annotations:
          notExists:
            - rule.demon-grinder.notice
        offers:
          # Upright: both offers VISIBLE, legality split — the knock legal, the
          # flip illegal with its not-prone diagnostic (never hidden).
          exists:
            - knock-demon-grinder-prone
            - flip-demon-grinder-upright
          legal:
            - knock-demon-grinder-prone
          illegal:
            - flip-demon-grinder-upright
        offerUi:
          - id: knock-demon-grinder-prone
            ui:
              section: free
              subject: demon-grinder
              # A vehicle CONDITION files like the PC's (#467 taxonomy).
              intents:
                CONDITION: held
              # Both prone offers flip to the VEHICLE's own condition text.
              detailKey: vehicle/demon-grinder-prone
              actionCost: []
  - addOffer:
      id: knock-demon-grinder-prone
      assert:
        facts:
          companion.demonGrinder.prone: 1
        offers:
          # Prone (the record merely planned): the mirror — the flip is now
          # the legal one, and the knock stays VISIBLE and ILLEGAL with its
          # already-prone diagnostic.
          exists:
            - knock-demon-grinder-prone
            - flip-demon-grinder-upright
          illegal:
            - knock-demon-grinder-prone
          legal:
            - flip-demon-grinder-upright
        offerUi:
          - id: flip-demon-grinder-upright
            ui:
              section: free
              subject: demon-grinder
              intents:
                CONDITION: held
              detailKey: vehicle/demon-grinder-prone
              actionCost: []
        annotations:
          exists:
            - rule.demon-grinder.notice
          targets:
            - key: rule.demon-grinder.notice
              targets: [notice]
  - endTurn:
      assert:
        effects:
          exists:
            - effect-demon-grinder-prone
        facts:
          companion.demonGrinder.prone: 1
  # While committed-prone the same split stands: knock visible + illegal,
  # flip visible + legal (the plan-fold view of the step above).
  - evaluate:
      assert:
        facts:
          companion.demonGrinder.prone: 1
        offers:
          exists:
            - knock-demon-grinder-prone
            - flip-demon-grinder-upright
          illegal:
            - knock-demon-grinder-prone
          legal:
            - flip-demon-grinder-upright
  # The OVERRIDE path (the plan.ts contract): committing the knock while
  # ILLEGAL still applies — the keyed replacement re-advertises the one
  # record (newest-wins, so still a single prone fact) and the row carries
  # its already-prone diagnostic.
  - addOffer:
      id: knock-demon-grinder-prone
      assert:
        facts:
          companion.demonGrinder.prone: 1
        planErrors:
          - id: knock-demon-grinder-prone
            index: 0
            errors:
              - rule.demon-grinder.knocked-prone.already_prone
  - endTurn:
      assert:
        effects:
          exists:
            - effect-demon-grinder-prone
        facts:
          companion.demonGrinder.prone: 1
  # Flip Upright: the empty same-key eviction clears the fact and withdraws
  # the vehicle chip, and the NOTICE goes with the condition it carries. The
  # flip itself stays VISIBLE once upright — merely illegal (nothing to flip).
  - addOffer:
      id: flip-demon-grinder-upright
      assert:
        facts:
          companion.demonGrinder.prone: 0
        offers:
          exists:
            - flip-demon-grinder-upright
            - knock-demon-grinder-prone
          illegal:
            - flip-demon-grinder-upright
          legal:
            - knock-demon-grinder-prone
        annotations:
          notExists:
            - rule.demon-grinder.notice
  - endTurn:
      assert:
        effects:
          notExists:
            - effect-demon-grinder-prone
        facts:
          companion.demonGrinder.prone: 0
