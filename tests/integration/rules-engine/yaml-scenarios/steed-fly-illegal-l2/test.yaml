name: 'Steed Fly Illegal L2'
description: 'Steed cannot fly at L2 - fly offer is illegal with cannot_fly diagnostic'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-find-steed
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
  - addOffer:
      id: prepare-find-steed
  # Verify Find Steed is available
  - evaluate:
      assert:
        offers:
          exists:
            - cast-find-steed
  # Cast Find Steed at L2
  - addOffer:
      id: cast-find-steed
  - endTurn:
      assert:
        facts:
          companion.steed.summoned: 1
          companion.steed.fly.can: 0
  # Next turn: fly offer should be illegal (cannot fly at L2)
  - evaluate:
      assert:
        offers:
          illegal:
            - steed-move-fly
  # Adding the fly offer should show the cannot_fly error in plan errors
  - addOffer:
      id: steed-move-fly
      assert:
        planErrors:
          - id: steed-move-fly
            index: 0
            errors:
              - rule.spell-find-steed.steed-move-fly.cannot_fly
