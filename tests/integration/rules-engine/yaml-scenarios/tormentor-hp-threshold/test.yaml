name: 'Tormentor (Damage Control) - Damage Threshold Bounces Sub-Threshold Blows'
description: >-
  Threshold model v2 (user-corrected 2026-10-26): sub-threshold damage is
  LEGAL to attempt. The GM tells the player an amount and the player records
  it — the app is what knows it was under the limit. The stat block's damage
  threshold 10 is a BAKED FACT the shared recorder consults: the damage offer
  carries a [Use Threshold | Ignore Threshold] segmented control (rendered
  only while the threshold fact is positive — its enabled condition names the
  fact, and the panel renderer hides a false-gated control), a Use-Threshold
  blow BELOW the fact records NOTHING and returns a 'notice' diagnostic that
  rides THAT planned row alone (planDiagnostics is per-instance — the note
  can never render on another damage row of the same panel), and an
  Ignore-Threshold blow records the RAW amount in full (the GM correction:
  "last round should have taken 1 more"). At or above the threshold, Use mode
  records the FULL amount as ever.
ruleGroups:
  - vehicles/tormentor
steps:
  - addOffer:
      id: acquire-tormentor
      assert:
        # The threshold is data on the acquire effect, not code in the module.
        facts:
          companion.tormentor.damageThreshold: 10
  # The damage offer carries the threshold-mode segmented control, gated on the
  # baked fact (generic factory data — the player/steed scenarios pin theirs).
  - evaluate:
      assert:
        offers:
          exists:
            - record-tormentor-damage
          legal:
            - record-tormentor-damage
        offerUi:
          - id: record-tormentor-damage
            ui:
              secondaryControl:
                type: segmented
                var: thresholdMode
                prefix: planner.record.threshold.prefix
                options:
                  - value: 0
                    label: planner.record.threshold.use
                  - value: 1
                    label: planner.record.threshold.ignore
                enabled:
                  condition:
                    fact: companion.tormentor.damageThreshold
                    operator: greaterThan
                    value: 0
  # IGNORE THRESHOLD first (before any bounce exists): the GM-correction mode
  # records the RAW amount in full — no bounce note, no error.
  - addOffer:
      id: record-tormentor-damage
      selections:
        amount: 9
        thresholdMode: 1
      assert:
        facts:
          companion.tormentor.hp.damageRecorded: 9
          companion.tormentor.hp.current: 51
        planErrors:
          - id: record-tormentor-damage
            index: 0
            errors: []
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-hp-damage
  # THE USER REPRO: TWO damage rows planned — one sub-threshold in Use mode,
  # one landing at the threshold. The bounce note is a per-row 'notice'
  # diagnostic: ONLY the bounced row carries it, the landing row never does,
  # the plan stays legal, and no annotation exists (a per-commit bounce is
  # not a standing panel truth).
  - addOffer:
      id: record-tormentor-damage
      selections:
        amount: 10
      assert:
        planErrors:
          - id: record-tormentor-damage
            index: 0
            errors: []
  - addOffer:
      id: record-tormentor-damage
      selections:
        amount: 9
      assert:
        facts:
          # 9 (committed ignore-mode) + 10 (the landing row): the bounced row
          # adds nothing.
          companion.tormentor.hp.damageRecorded: 19
          companion.tormentor.hp.current: 41
        planErrors:
          - id: record-tormentor-damage
            index: 0
            errors: []
          - id: record-tormentor-damage
            index: 1
            errors:
              - rule.tormentor.record-damage.below_threshold
        status:
          legal: true
  # The bounced row commits NOTHING at end of turn — no marker effect, no
  # state, no record. The note lived on the planned row and leaves with it.
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-hp-damage
          notExists:
            - effect-tormentor-hp-bounce
        facts:
          companion.tormentor.hp.current: 41
  # A long rest clears the records.
  - endTurn:
      longRest: true
      assert:
        effects:
          notExists:
            - effect-tormentor-hp-damage
        facts:
          companion.tormentor.hp.current: 60
  # Above the threshold records in full too.
  - addOffer:
      id: record-tormentor-damage
      selections:
        amount: 20
      assert:
        facts:
          companion.tormentor.hp.damageRecorded: 20
          companion.tormentor.hp.current: 40
