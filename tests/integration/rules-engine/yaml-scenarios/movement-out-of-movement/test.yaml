name: 'Movement: No movement offers when out of movement'
description: 'After using all movement, walk and rough terrain offers become unavailable'
ruleGroups:
  - species-human/species-human
  - dnd-5e-2024/movement
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
steps:
  - evaluate:
      assert:
        facts:
          character.movement.remaining: 30
  - addOffer:
      id: move-walk
      assert:
        facts:
          character.movement.remaining: 0
  - evaluate:
      assert:
        offers:
          notExists:
            - move-walk
            - move-rough-terrain
