name: 'Calm Emotions Slot Selection'
description: 'Calm Emotions (L2) can be cast using L2 or a higher slot; defaults to the lowest available (L2). Higher slots give no extra benefit.'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/concentration
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-calm-emotions
initialEffects:
  - id: test-grant-l2-l3-slots
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level3.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level3.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
      assert:
        facts:
          spellcasting.slots.level2.remaining: 1
          spellcasting.slots.level3.remaining: 1
        offers:
          exists:
            - prepare-calm-emotions
  # Prepare Calm Emotions
  - addOffer:
      id: prepare-calm-emotions
  - endTurn: {}
  # Cast using default (lowest = L2) slot
  - addOffer:
      id: cast-calm-emotions
      assert:
        facts:
          spellcasting.slots.level2.remaining: 0
          spellcasting.slots.level3.remaining: 1
  - endTurn: {}
  # Turn 2: Cast using L3 slot explicitly
  - addOffer:
      id: cast-calm-emotions
      selections:
        slotLevel: 3
      assert:
        facts:
          spellcasting.slots.level2.remaining: 0
          spellcasting.slots.level3.remaining: 0
