name: 'Tormentor (Damage Control) - Station AC Mode Record'
description: >-
  While acquireed, the vehicle's +ADD carries an always-present "AC Mode" record
  offer (free section, the occupancy intent class) with the same segmented
  control pre-showing the CURRENT mode. Apply is immediate (record-class): ONE
  permanent keyed effect storing the mode as the distinct acMotionless.recorded
  fact — re-applying replaces rather than stacks, so the top-bar AC flips
  21 <-> 19 at once, and abandon clears the record with the rest of the panel.
  Unacquired, the offer does not exist (structural gate on the acquire).
ruleGroups:
  - vehicles/tormentor
steps:
  # Unacquired: the vehicle record does not exist at all.
  - evaluate:
      assert:
        offers:
          notExists:
            - set-tormentor-ac-mode
  - addOffer:
      id: acquire-tormentor
  # Acquireed (default Moving): the offer exists and is legal, the segmented
  # control pinned, opening at the CURRENT mode.
  - evaluate:
      assert:
        offers:
          exists:
            - set-tormentor-ac-mode
          legal:
            - set-tormentor-ac-mode
        offerUi:
          - id: set-tormentor-ac-mode
            ui:
              section: free
              subject: tormentor
              actionCost: []
              intents:
                HANDLE: gear
              secondaryControl:
                type: segmented
                var: mode
                prefix: play.choices.tormentor.mode
                options:
                  - value: 0
                    label: rule.tormentor.mode.moving
                  - value: 1
                    label: rule.tormentor.mode.motionless
        offerVars:
          - id: set-tormentor-ac-mode
            vars:
              mode:
                capture: true
                default:
                  fact: companion.tormentor.acMotionless.current
  # Record Motionless: the derived AC reads 19 IMMEDIATELY (the projection
  # folds the advertised keyed effect).
  - addOffer:
      id: set-tormentor-ac-mode
      selections:
        mode: 1
      assert:
        facts:
          companion.tormentor.acMotionless.recorded: 1
          companion.tormentor.acMotionless.current: 1
          companion.tormentor.ac.effective: 19
        planErrors:
          - id: set-tormentor-ac-mode
            index: 0
            errors: []
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-acquire
            - effect-tormentor-ac-mode
        facts:
          companion.tormentor.ac.effective: 19
  # Re-apply Moving: the keyed effect REPLACES — AC 21, never a stacked record.
  - addOffer:
      id: set-tormentor-ac-mode
      selections:
        mode: 0
      assert:
        facts:
          companion.tormentor.acMotionless.recorded: 0
          companion.tormentor.acMotionless.current: 0
          companion.tormentor.ac.effective: 21
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-ac-mode
        facts:
          companion.tormentor.ac.effective: 21
  # Abandon clears the record with the panel; the derived AC reads 0.
  - addOffer:
      id: abandon-tormentor
      assert:
        facts:
          companion.tormentor.ac.effective: 0
          companion.tormentor.acMotionless.recorded: 0
        offers:
          notExists:
            - set-tormentor-ac-mode
  - endTurn:
      assert:
        effects:
          notExists:
            - effect-tormentor-acquire
            - effect-tormentor-ac-mode
        facts:
          companion.tormentor.ac.effective: 0
