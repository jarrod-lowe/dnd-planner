name: 'Tormentor - Helm Drive and Dash Actions'
description: >-
  Drive and Dash are the Helm's plan-row actions, and both spend the player's
  ACTION through the generic spend (the Dash/simple-actions idiom, never the
  weapon attacks' pool): a vehicle action is not an Attack action, so Extra
  Attack neither applies nor is granted. Drive IS the vehicle's movement offer
  (the steed's move rows, PC-parity house rule): its apply spends the action
  BESIDE the captured distance against the derived movement pool. Dash doubles
  the pool for the turn (the steed's dashed flag). With no action left each
  stays visible but ILLEGAL with its OWN no-action diagnostic
  (illegal-but-committable), and a planned-anyway row still spends, the
  over-commit reading negative until the turn ends.
ruleGroups:
  - vehicles/tormentor
  - dnd-5e-2024/action-economy
steps:
  - addOffer:
      id: acquire-tormentor
  - addOffer:
      id: take-tormentor-helm-seat
  - endTurn:
      assert:
        facts:
          companion.tormentor.seats.helm: 1
  # An action available: both of the Helm's actions are legal. Drive files in
  # the MOVE section (the steed's move rows); Dash stays a generic action.
  - evaluate:
      assert:
        facts:
          actions.remaining: 1
        offers:
          legal:
            - drive-tormentor
            - dash-tormentor
        offerUi:
          - id: drive-tormentor
            ui:
              section: move
              subject: tormentor
              detailKey: vehicle/tormentor-helm
              actionCost:
                - action
          - id: dash-tormentor
            ui:
              section: action-other
              subject: tormentor
              detailKey: vehicle/tormentor-helm
              actionCost:
                - action
  # Drive spends the action and the movement — nothing else: the seat stays
  # taken and the capacity counts it still.
  - addOffer:
      id: drive-tormentor
      selections:
        distance: 30
      assert:
        facts:
          actions.remaining: 0
          companion.tormentor.movement.remaining: 70
          companion.tormentor.seats.helm: 1
          companion.tormentor.creatureCapacity.used: 1
        planErrors:
          - id: drive-tormentor
            index: 0
            errors: []
  # No action left: Dash stays visible but ILLEGAL (the engine's
  # illegal-but-visible contract)…
  - evaluate:
      assert:
        offers:
          exists:
            - dash-tormentor
          illegal:
            - dash-tormentor
  # …and the override path spends anyway, DOUBLING the movement pool (the
  # steed's Dash semantics) while the row carries DASH's own diagnostic and,
  # like every planned Dash row, the GM-risk note after it (the first row
  # stays clean, like every action spend).
  - addOffer:
      id: dash-tormentor
      assert:
        facts:
          actions.remaining: -1
          companion.tormentor.movement.total: 200
        planErrors:
          - id: dash-tormentor
            index: 0
            errors:
              - rule.tormentor.dash.no_action
              - rule.tormentor.dash.risk
  # The turn ends: the spends and the doubling age away and both open again —
  # Drive's own diagnostic is the mirror case.
  - endTurn:
      assert:
        facts:
          actions.remaining: 1
          companion.tormentor.movement.total: 100
          companion.tormentor.movement.remaining: 100
          companion.tormentor.seats.helm: 1
  - addOffer:
      id: dash-tormentor
      assert:
        facts:
          actions.remaining: 0
        planErrors:
          - id: dash-tormentor
            index: 0
            errors:
              - rule.tormentor.dash.risk
  - addOffer:
      id: drive-tormentor
      assert:
        facts:
          actions.remaining: -1
          companion.tormentor.movement.remaining: 0
        planErrors:
          - id: drive-tormentor
            index: 0
            errors:
              - rule.tormentor.drive.no_action
