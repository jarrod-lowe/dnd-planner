name: 'Condition Frightened - Record'
description: >-
  Recording being Frightened commits a keyed effect setting condition.frightened
  and emits the LoS toggle annotation — the dice-line chip that carries the
  condition's disadvantage PER ROW (the per-row model, user-directed
  2026-09-29: each planned row captures its own sight value at add time;
  tapping a chip changes that row and the going-forward seed, never previous
  rows). Frightened deliberately contributes NONE of the 22 shared flags:
  the chip forces the disadvantage roll-mode itself and other sources
  (Poisoned, Blinded, untrained armor) keep the flags to themselves — the
  full 22 asserted at 0 as the exclusion pin. The chip renders the moment
  the condition is live (planned recorder included — the disadvantage shows
  on the recording turn's own rows); the orphan case is cleaned store-side
  (removeFromPlan evicts committed effects keyed by the removed row's
  advertised dependents — unit-pinned, not assertible here). A NOTICE
  carries the standing text while the condition is live; the recorder models
  BEING FRIGHTENED (imposed by an enemy effect), so it is free and ungated,
  and any rest clears it (untilShortRest; see
  condition-frightened-rest-clears). An attribution chip (a valueless rider,
  the GWF idiom) explains what the LoS chip FORCES: a single sight-QUALIFIED
  sentence, never a seed-flipped variant (rows capture their own sight value;
  a flipped key would contradict a row whose capture differs from the seed),
  targeting attack.any and check.any — attacks and ability checks, the SRD's
  two disadvantaged tests.
ruleGroups:
  - dnd-5e-2024/condition-frightened
steps:
  - evaluate:
      assert:
        facts:
          condition.frightened: 0
        offers:
          exists:
            - record-frightened
        annotations:
          notExists:
            - rule.dnd-5e-2024.condition-frightened.notice
            - rule.dnd-5e-2024.condition-frightened.los
            - rule.dnd-5e-2024.condition-frightened.disadvantage
  - addOffer:
      id: record-frightened
      assert:
        facts:
          condition.frightened: 1
          attack.str.disadvantage: 0
          attack.dex.disadvantage: 0
          initiative.disadvantage: 0
          check.disadvantage: 0
          skill.acrobatics.disadvantage: 0
          skill.animal-handling.disadvantage: 0
          skill.arcana.disadvantage: 0
          skill.athletics.disadvantage: 0
          skill.deception.disadvantage: 0
          skill.history.disadvantage: 0
          skill.insight.disadvantage: 0
          skill.intimidation.disadvantage: 0
          skill.investigation.disadvantage: 0
          skill.medicine.disadvantage: 0
          skill.nature.disadvantage: 0
          skill.perception.disadvantage: 0
          skill.performance.disadvantage: 0
          skill.persuasion.disadvantage: 0
          skill.religion.disadvantage: 0
          skill.sleight-of-hand.disadvantage: 0
          skill.stealth.disadvantage: 0
          skill.survival.disadvantage: 0
        annotations:
          exists:
            - rule.dnd-5e-2024.condition-frightened.notice
            - rule.dnd-5e-2024.condition-frightened.los
            - rule.dnd-5e-2024.condition-frightened.disadvantage
            - rule.dnd-5e-2024.condition-frightened.disadvantage-checks
          targets:
            - key: rule.dnd-5e-2024.condition-frightened.los
              targets: [attack.any, dice.any]
            - key: rule.dnd-5e-2024.condition-frightened.disadvantage
              targets: [attack.any]
            - key: rule.dnd-5e-2024.condition-frightened.disadvantage-checks
              targets: [check.any]
          riders:
            - key: rule.dnd-5e-2024.condition-frightened.disadvantage
              rider:
                label: rule.dnd-5e-2024.condition-frightened.rider
                type: modifier
                appliesTo: to-hit
            - key: rule.dnd-5e-2024.condition-frightened.disadvantage-checks
              rider:
                label: rule.dnd-5e-2024.condition-frightened.rider
                type: modifier
                appliesTo: check
          toggles:
            - key: rule.dnd-5e-2024.condition-frightened.los
              toggle:
                fact: frightened.sourceHidden
                onWhen: 0
                appliesTo: [to-hit, check]
