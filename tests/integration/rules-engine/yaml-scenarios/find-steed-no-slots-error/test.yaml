name: 'Find Steed - No Slots Error'
description: 'Adding Find Steed with no eligible spell slots should record a no_slots error'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-find-steed
steps:
  - evaluate:
      assert:
        facts:
          spellcasting.slots.level1.remaining: 2
        offers:
          illegal:
            - cast-find-steed
  - addOffer:
      id: cast-find-steed
      assert:
        planErrors:
          - id: cast-find-steed
            index: 0
            errors:
              - rule.spell-find-steed.offer-find-steed.no_slots
