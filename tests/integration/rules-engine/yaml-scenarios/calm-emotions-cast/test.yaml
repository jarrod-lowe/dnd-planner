name: 'Calm Emotions Cast'
description: 'Casting Calm Emotions consumes an L2 slot and concentration, creates a timed effect with countDown=10 and a concentration effect'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/concentration
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-calm-emotions
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
      assert:
        facts:
          spellcasting.remaining: 1
          concentration.remaining: 1
          spellcasting.slots.level2.remaining: 1
        offers:
          notExists:
            - cast-calm-emotions
          exists:
            - prepare-calm-emotions
  # Prepare Calm Emotions first
  - addOffer:
      id: prepare-calm-emotions
  - endTurn:
      assert:
        offers:
          exists:
            - cast-calm-emotions
        offerUi:
          - id: cast-calm-emotions
            ui:
              # Humanoids in the sphere make a Charisma save
              information:
                - type: text
                  label: play.information.saveDc
                  labelValues:
                    saveType: { string: CHA }
                    dc: { fact: spellcasting.saveDC }
  # Set charisma and cast
  - addOffer:
      id: set-charisma
      selections:
        score: 16
      assert:
        facts:
          spellcasting.saveDC: 13
  - addOffer:
      id: cast-calm-emotions
      assert:
        facts:
          spellcasting.remaining: 0
          concentration.remaining: 0
          spellcasting.slots.level2.remaining: 0
  - endTurn:
      assert:
        effects:
          exists:
            - effect-calm-emotions
