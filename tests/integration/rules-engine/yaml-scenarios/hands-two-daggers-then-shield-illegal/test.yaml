name: 'Hands - Dagger And Greataxe Fill Hands'
description: >
  Donning a greataxe uses 2 hands (0 remaining). The shield don offer should
  then be illegal via the hands legality check.

ruleGroups:
  - dnd-5e-2024/hands
  - dnd-5e-2024/ac
  - dnd-5e-2024/shield
  - dnd-5e-2024/core-events
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/attacks
  - dnd-5e-2024/greataxe

steps:
  - evaluate:
      assert:
        facts:
          hands.remaining: 2
        offers:
          exists:
            - don-greataxe
  - addOffer:
      id: don-greataxe
      assert:
        facts:
          weapon.greataxe.equipped: 1
          hands.remaining: 0
  - endTurn:
      assert:
        facts:
          weapon.greataxe.equipped: 1
          hands.remaining: 0
  - evaluate:
      assert:
        offers:
          illegal:
            - don-shield
