name: 'Action Economy - Too Many Actions'
description: 'Cannot add an action when no actions remain, and consumed actions are removed'
ruleGroups:
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
steps:
  - evaluate:
      assert:
        facts:
          actions.remaining: 1
        offers:
          exists:
            - help-action
  - addOffer:
      id: help-action
      assert:
        facts:
          actions.remaining: 0
  - addOffer:
      id: help-action
      assert:
        offers:
          illegal:
            - help-action
  - endTurn:
      assert:
        facts:
          actions.remaining: 1
        offers:
          exists:
            - help-action
