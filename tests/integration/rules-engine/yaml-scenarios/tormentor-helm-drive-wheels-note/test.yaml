name: 'Tormentor - Crushing Wheels Note Rides Every Drive Row'
description: >-
  The stat block's Crushing Wheels trait, restructured on the user's review:
  every planned Drive row carries a SHORT pointer note (the dash-risk idiom)
  — creatures passed over must save (DC 13 Dex) or take the wheels' damage,
  roll the Crushing Wheels row — while the ROLL row itself (wheels-tormentor,
  free, no seat, no spend, damage-only dice line) carries the full rule in
  its description and is ILLEGAL until the Tormentor has Driven this turn
  (Drive's spend writes the per-vehicle drove marker beside the shared pool;
  illegal-but-committable, the engine's contract). The marker ages away with
  the turn, and leaving the Helm removes the Drive row — with no drive row,
  no note anywhere.
ruleGroups:
  - vehicles/tormentor
  - dnd-5e-2024/action-economy
steps:
  - addOffer:
      id: acquire-tormentor
  # The roll row exists the moment the vehicle does (no seat gate) and is
  # ILLEGAL on its own not-driven leg until the Tormentor Drives.
  - evaluate:
      assert:
        offers:
          exists:
            - wheels-tormentor
          illegal:
            - wheels-tormentor
  - addOffer:
      id: take-tormentor-helm-seat
  - endTurn: {}
  # The pool is the FUEL's — a soul coin in the burner (the Helm's
  # bonus-action record, committed here so the row below is legal).
  - addOffer:
      id: set-tormentor-fuel
      selections:
        fuel: 1
  - endTurn: {}
  # The very first Drive row carries the SHORT pointer note: the row informs,
  # the roll row carries the rule. Behind the drive, the marker stands and
  # the roll row turns LEGAL in the same fold.
  - addOffer:
      id: drive-tormentor
      selections:
        distance: 40
      assert:
        planErrors:
          - id: drive-tormentor
            index: 0
            errors:
              - rule.tormentor.drive.crushing_wheels
        status:
          legal: true
        offers:
          legal:
            - wheels-tormentor
  # A free record row planned beside it carries NOTHING (a per-row note is
  # not a panel truth).
  - addOffer:
      id: set-tormentor-ac-mode
      assert:
        planErrors:
          - id: set-tormentor-ac-mode
            index: 0
            errors: []
  # End of turn: the note commits nothing and the drove marker ages away with
  # the spends — the roll row is illegal again until the next Drive.
  - endTurn:
      assert:
        facts:
          actions.remaining: 1
          companion.tormentor.movement.total: 100
          companion.tormentor.movement.remaining: 100
          companion.tormentor.movement.drove: 0
          companion.tormentor.seats.helm: 1
        offers:
          illegal:
            - wheels-tormentor
  # Turn 2: a fresh, LEGAL Drive carries the note ALONE again, and the roll
  # row reopens behind it.
  - addOffer:
      id: drive-tormentor
      assert:
        planErrors:
          - id: drive-tormentor
            index: 0
            errors:
              - rule.tormentor.drive.crushing_wheels
        status:
          legal: true
        offers:
          legal:
            - wheels-tormentor
  # Leave the Helm: the drive offer goes with the seat — with no drive row,
  # the note is nowhere (the note is per-row, never standing).
  - addOffer:
      id: leave-tormentor-helm-seat
      assert:
        offers:
          notExists:
            - drive-tormentor
