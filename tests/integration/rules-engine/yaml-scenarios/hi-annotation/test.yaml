name: 'Heroic Inspiration - Annotation'
description: 'Annotation appears when HI available and disappears after use'
ruleGroups:
  - dnd-5e-2024/core-events
  - dnd-5e-2024/heroic-inspiration
initialEffects:
  - id: effect-hi
    phase: early
    after:
      - group: hi-consume
    group:
      - hi-settle
    ui:
      name: rule.dnd-5e-2024.heroic-inspiration.effect-hi.name
    activities:
      - type: numberSet
        source:
          number: 1
        target:
          fact: heroicInspiration.remaining
        when:
          - fact: heroicInspiration.consumed
            operator: equals
            value: 0
      - type: advertiseEffect
        self: true
        when:
          - fact: heroicInspiration.consumed
            operator: equals
            value: 0
steps:
  - evaluate:
      assert:
        facts:
          heroicInspiration.remaining: 1
        annotations:
          exists:
            - rule.dnd-5e-2024.heroic-inspiration.annotation
  - addOffer:
      id: use-hi
      assert:
        facts:
          heroicInspiration.remaining: 0
        annotations:
          notExists:
            - rule.dnd-5e-2024.heroic-inspiration.annotation
