name: 'Splint Armor Disadvantage'
description: >-
  Disadvantage applies, Stealth always disadvantaged, spellcasting blocked when
  not proficient with heavy armor. The untrained attribution chip (a valueless
  rider, the GWF idiom) names WHY the affected dice-lines default to
  2d20-take-low; the unconditional proficient-worn Stealth disadvantage is a
  separate source and stays un-chipped.
ruleGroups:
  - dnd-5e-2024/ac
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/splint-armor
  - dnd-5e-2024/spellcasting
initialFacts:
  armor.heavy.proficient: 0
steps:
  # Baseline: spellcasting works normally
  - evaluate:
      assert:
        facts:
          spellcasting.max: 1
          spellcasting.remaining: 1
        offers:
          exists:
            - don-splint-armor
        annotations:
          notExists:
            - rule.dnd-5e-2024.armor-training.disadvantage
  # Don splint armor -- disadvantage on STR/DEX checks, always Stealth disadvantage, spellcasting block
  - addOffer:
      id: don-splint-armor
      assert:
        facts:
          ac.base: 17
          ac.dexBonus: 0
          attack.str.disadvantage: 1
          attack.dex.disadvantage: 1
          initiative.disadvantage: 1
          skill.acrobatics.disadvantage: 1
          skill.athletics.disadvantage: 1
          skill.sleight-of-hand.disadvantage: 1
          skill.stealth.disadvantage: 1
          spellcasting.remaining: 0
        annotations:
          exists:
            - rule.dnd-5e-2024.armor-training.disadvantage
            - rule.dnd-5e-2024.armor-training.disadvantage-checks
          targets:
            - key: rule.dnd-5e-2024.armor-training.disadvantage
              targets: [attack.any]
            - key: rule.dnd-5e-2024.armor-training.disadvantage-checks
              targets:
                [
                  dice.initiative,
                  check.acrobatics,
                  check.athletics,
                  check.sleight-of-hand,
                  check.stealth
                ]
          riders:
            - key: rule.dnd-5e-2024.armor-training.disadvantage
              rider:
                label: rule.dnd-5e-2024.armor-training.rider
                type: modifier
                appliesTo: to-hit
            - key: rule.dnd-5e-2024.armor-training.disadvantage-checks
              rider:
                label: rule.dnd-5e-2024.armor-training.rider
                type: modifier
                appliesTo: check
