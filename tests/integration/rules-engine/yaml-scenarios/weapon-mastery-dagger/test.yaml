name: 'Dagger Mastery'
description: >
  Assigning dagger-mastery rule group sets the attack.dagger.mastery fact to 1.

ruleGroups:
  - dnd-5e-2024/core-events
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/attacks
  - dnd-5e-2024/dagger
  - dnd-5e-2024/dagger-mastery

steps:
  - evaluate:
      assert:
        facts:
          attack.dagger.mastery: 1
