name: 'Disengage action consumes action, illegal when no action'
description: >
  Verify that disengage-action is offered and legal when an action is available,
  consumes one action when added to plan, and becomes illegal when no action remains.

ruleGroups:
  - species-human/species-human
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/simple-actions

steps:
  - evaluate:
      assert:
        facts:
          actions.remaining: 1
        offers:
          exists:
            - disengage-action
          legal:
            - disengage-action

  - addOffer:
      id: disengage-action
      assert:
        facts:
          actions.remaining: 0

  - evaluate:
      assert:
        offers:
          illegal:
            - disengage-action
