name: 'Weapon Don Sets Equipped'
description: >
  Adding the don-dagger offer to the plan sets weapon.dagger.equipped to 1.
  After endTurn, the effect-dagger persists and the weapon stays equipped.

ruleGroups:
  - dnd-5e-2024/core-events
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/attacks
  - dnd-5e-2024/dagger

steps:
  - evaluate:
      assert:
        facts:
          weapon.dagger.equipped: 0
        offers:
          exists:
            - don-dagger
  - addOffer:
      id: don-dagger
      assert:
        facts:
          weapon.dagger.equipped: 1
  - endTurn:
      assert:
        facts:
          weapon.dagger.equipped: 1
        effects:
          exists:
            - effect-dagger
