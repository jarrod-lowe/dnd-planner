name: 'Core Events - Seeded damage threshold bounces record-damage'
description: >-
  The player's damage recorder consults the shared factory's threshold gate on
  the player's natural fact name, hp.damageThreshold. No module derives it, so
  today it is unset (reads 0, never gates — the zero-behavior-change
  contract); this scenario seeds it as a committed effect exactly the way a
  future stat-block bake would, and the recorder adapts on its own (threshold
  model v2: sub-threshold damage is LEGAL to attempt): a Use-Threshold blow
  BELOW the fact records NOTHING and returns a 'notice' diagnostic that rides
  THAT planned row alone (never an error, never an annotation), while an
  Ignore-Threshold blow records the RAW amount in full, and a blow AT the
  threshold records in full.
ruleGroups:
  - dnd-5e-2024/hp
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - class-paladin/class-paladin-level1
  - dnd-5e-2024/core-events
steps:
  # Set CON to 14 (modifier +2) → hp.max = 12, hp.current = 12. The recorder's
  # panel surface is pinned UNCHANGED beside the vehicle immunities note
  # (PR-9): the player's recorder configures no immunities option, so its
  # annotationLabels stay exactly the post-hoc reminder labels they have
  # always been — no vehicle note can land here.
  - evaluate:
      assert:
        offers:
          exists:
            - set-constitution
        offerUi:
          - id: record-damage
            ui:
              annotationLabels:
                - damage.any
  - addOffer:
      id: set-constitution
      selections:
        score: 14
      assert:
        facts:
          hp.max: 12
          hp.current: 12
  # IGNORE THRESHOLD first (before any bounce exists): the GM-correction mode
  # records the RAW amount in full — no bounce note, no error.
  - addOffer:
      id: record-damage
      selections:
        amount: 4
        thresholdMode: 1
      assert:
        facts:
          hp.current: 8
        planErrors:
          - id: record-damage
            index: 0
            errors: []
  - endTurn:
      assert:
        effects:
          exists:
            - effect-hp-damage
  # THE USER REPRO: TWO damage rows planned — one sub-threshold in Use mode,
  # one landing at the threshold. The bounce note is a per-row 'notice'
  # diagnostic: ONLY the bounced row carries it, the landing row never does,
  # and the plan stays legal.
  - addOffer:
      id: record-damage
      selections:
        amount: 5
      assert:
        planErrors:
          - id: record-damage
            index: 0
            errors: []
  - addOffer:
      id: record-damage
      selections:
        amount: 4
      assert:
        facts:
          # 4 (committed ignore-mode) + 5 (the landing row): the bounced row
          # adds nothing.
          hp.current: 3
        planErrors:
          - id: record-damage
            index: 0
            errors: []
          - id: record-damage
            index: 1
            errors:
              - rule.dnd-5e-2024.core-events.record-damage.below_threshold
        status:
          legal: true
  # The bounced row commits NOTHING at end of turn — no marker effect, no
  # record. The note lived on the planned row and leaves with it.
  - endTurn:
      assert:
        effects:
          exists:
            - effect-hp-damage
          notExists:
            - effect-hp-bounce
        facts:
          hp.current: 3
