name: 'Prayer of Healing Prepare'
description: 'Cast offer requires preparation first; prepare/unprepare lifecycle works'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-prayer-of-healing
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  # Before preparing, cast offer is absent; prepare offer exists
  - evaluate:
      assert:
        facts:
          spell.l2.prayerOfHealing.prepared: 0
        offers:
          notExists:
            - cast-prayer-of-healing
          exists:
            - prepare-prayer-of-healing
  # After preparing, cast offer becomes available
  - addOffer:
      id: prepare-prayer-of-healing
      assert:
        facts:
          spell.l2.prayerOfHealing.prepared: 1
          spellcasting.prepared.count: 1
  - evaluate:
      assert:
        offers:
          exists:
            - cast-prayer-of-healing
  # Unpreparing removes the cast offer again
  - addOffer:
      id: unprepare-prayer-of-healing
      assert:
        facts:
          spell.l2.prayerOfHealing.prepared: 0
  - evaluate:
      assert:
        offers:
          notExists:
            - cast-prayer-of-healing
