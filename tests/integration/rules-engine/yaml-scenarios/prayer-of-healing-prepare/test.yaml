name: 'Prayer of Healing Prepare'
description: 'Cast offer requires preparation first; the whole-set lifecycle works'
ruleGroups:
  - dnd-5e-2024/prepared-spells
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-prayer-of-healing
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  # Before preparing, cast offer is absent; prepare offer exists
  - evaluate:
      assert:
        facts:
          spell.l2.prayerOfHealing.prepared: 0
        offers:
          notExists:
            - cast-prayer-of-healing
          exists:
            - set-prepared-spells
  # After preparing, cast offer becomes available
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: prayer-of-healing
            level: 2
            nameKey: rule.spell-prayer-of-healing.offer-prayer-of-healing.name
            preparedFact: spell.l2.prayerOfHealing.prepared
            alwaysPreparedFact: spell.l2.prayerOfHealing.alwaysPrepared
      assert:
        facts:
          spell.l2.prayerOfHealing.prepared: 1
          spellcasting.prepared.count: 1
  - evaluate:
      assert:
        offers:
          exists:
            - cast-prayer-of-healing
  # Unpreparing removes the cast offer again: re-commit the set WITHOUT the
  # spell — the keyed effect is replaced, so the fact (and cast offer) drop.
  - updateSelections:
      id: set-prepared-spells
      selections:
        prepared: []
      assert:
        facts:
          spell.l2.prayerOfHealing.prepared: 0
  - evaluate:
      assert:
        offers:
          notExists:
            - cast-prayer-of-healing
