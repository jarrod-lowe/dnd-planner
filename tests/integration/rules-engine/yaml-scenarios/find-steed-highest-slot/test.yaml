name: 'Find Steed - Highest Slot Level Computation'
description: >-
  find-steed.highestSlotLevel should be the highest slot level with total > 0,
  regardless of remaining. A character with L2 and L3 totals should resolve to 3.
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-find-steed
initialEffects:
  - id: test-grant-l2-and-l3-slots
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 2
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 2
      - type: numberSet
        target:
          fact: spellcasting.slots.level3.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level3.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  - evaluate:
      assert:
        facts:
          find-steed.highestSlotLevel: 3
