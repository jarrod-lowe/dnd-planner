name: 'Divine Smite - Illegal No Slots'
description: 'A prepared Divine Smite (no free use) is illegal when all spell slots are exhausted'
ruleGroups:
  - species-human/species-human
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spellcasting
  - class-paladin/class-paladin-level1
  - spells/spell-divine-smite
steps:
  - evaluate: {}
  - addOffer:
      id: prepare-divine-smite
      assert:
        facts:
          bonusActions.remaining: 1
          spellcasting.remaining: 1
          spellcasting.slots.level1.remaining: 2
  - addOffer:
      id: unarmed-strike-use-action
      assert:
        facts:
          attack.last.activation.action: 1
          bonusActions.remaining: 1
          spellcasting.remaining: 1
          spellcasting.slots.level1.remaining: 2
  # Use smite to consume one L1 slot
  - addOffer:
      id: cast-divine-smite
      selections:
        slotLevel: 1
      assert:
        facts:
          bonusActions.remaining: 0
          spellcasting.remaining: 0
          spellcasting.slots.level1.remaining: 1
  - endTurn: {}
  # New turn: attack again, use smite again to exhaust last slot
  - addOffer:
      id: unarmed-strike-use-action
      assert:
        facts:
          attack.last.activation.action: 1
          bonusActions.remaining: 1
          spellcasting.remaining: 1
          spellcasting.slots.level1.remaining: 1
  - addOffer:
      id: cast-divine-smite
      selections:
        slotLevel: 1
      assert:
        facts:
          bonusActions.remaining: 0
          spellcasting.remaining: 0
          spellcasting.slots.level1.remaining: 0
  - endTurn: {}
  # New turn: attack again but no slots left
  - addOffer:
      id: unarmed-strike-use-action
      assert:
        facts:
          attack.last.activation.action: 1
          spellcasting.remaining: 1
          spellcasting.slots.level1.remaining: 0
        offers:
          illegal:
            - cast-divine-smite
