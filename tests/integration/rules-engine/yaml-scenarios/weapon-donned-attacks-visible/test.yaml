name: 'Weapon Attacks Visible When Donned'
description: >
  When a weapon is donned (equipped via persistent effect with equipment-state group),
  weapon attack offers should appear in available rules after the effect sets the equipped fact.

ruleGroups:
  - dnd-5e-2024/core-events
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/attacks
  - dnd-5e-2024/dagger

initialEffects:
  - id: effect-dagger
    phase: normal
    group: [equipment-state]
    activities:
      - type: numberSet
        target:
          fact: weapon.dagger.equipped
        source:
          number: 1
      - type: advertiseEffect
        self: true

steps:
  - evaluate:
      assert:
        facts:
          weapon.dagger.equipped: 1
        offers:
          exists:
            - dagger-use-action
            - dagger-use-reaction-weapon
