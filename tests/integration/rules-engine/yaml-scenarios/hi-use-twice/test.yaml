name: 'Heroic Inspiration - Use Twice'
description: 'Second use-hi should have errors, first should not'
ruleGroups:
  - dnd-5e-2024/core-events
  - dnd-5e-2024/heroic-inspiration
initialEffects:
  - id: effect-hi
    phase: early
    after:
      - group: hi-consume
    group:
      - hi-settle
    ui:
      name: rule.dnd-5e-2024.heroic-inspiration.effect-hi.name
    activities:
      - type: numberSet
        source:
          number: 1
        target:
          fact: heroicInspiration.remaining
        when:
          - fact: heroicInspiration.consumed
            operator: equals
            value: 0
      - type: advertiseEffect
        self: true
        when:
          - fact: heroicInspiration.consumed
            operator: equals
            value: 0
steps:
  - evaluate:
      assert:
        facts:
          heroicInspiration.remaining: 1
        offers:
          exists:
            - use-hi
  - addOffer:
      id: use-hi
      assert:
        offers:
          illegal:
            - use-hi
        planErrors:
          - id: use-hi
            index: 0
            errors: []
  - addOffer:
      id: use-hi
      assert:
        offers:
          illegal:
            - use-hi
        planErrors:
          - id: use-hi
            index: 0
            errors: []
          - id: use-hi
            index: 1
            errors:
              - rule.dnd-5e-2024.heroic-inspiration.use-hi-offer.no_inspiration
