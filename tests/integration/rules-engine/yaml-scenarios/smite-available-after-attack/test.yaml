name: 'Divine Smite - Available After Attack'
description: >
  A prepared Divine Smite is legal after an Unarmed Strike. The gate is the
  melee attack, not the Attack action - and an Unarmed Strike is a melee attack
  the spell names explicitly, so it qualifies even though it is not a weapon.
ruleGroups:
  - dnd-5e-2024/prepared-spells
  - species-human/species-human
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spellcasting
  - class-paladin/class-paladin-level1
  - spells/spell-divine-smite
steps:
  - evaluate:
      assert:
        facts:
          actions.remaining: 1
          bonusActions.remaining: 1
          spellcasting.remaining: 1
          spellcasting.slots.level1.remaining: 2
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: divine-smite
            level: 1
            nameKey: rule.spell-divine-smite.offer-divine-smite.name
            preparedFact: spell.l1.divineSmite.prepared
            alwaysPreparedFact: spell.l1.divineSmite.alwaysPrepared
      assert:
        offers:
          illegal:
            - cast-divine-smite
  - addOffer:
      id: unarmed-strike-use-action
      assert:
        facts:
          actions.remaining: 0
          attack.last.melee: 1
          attack.last.weapon: 0
          attack.last.activation.action: 1
          bonusActions.remaining: 1
          spellcasting.remaining: 1
        offers:
          legal:
            - cast-divine-smite
        # The reminder's gate is the cast offer's `when` plus its four legality
        # conditions, so tapping it can always plan the smite.
        annotations:
          exists:
            - rule.spell-divine-smite.annotation
          addsToPlan:
            - key: rule.spell-divine-smite.annotation
              adds: { offer: cast-divine-smite }
