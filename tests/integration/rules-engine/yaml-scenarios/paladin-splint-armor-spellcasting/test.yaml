name: 'Paladin with Splint Armor Spellcasting'
description: 'A proficient paladin wearing splint armor should be able to cast spells on subsequent turns'
ruleGroups:
  - dnd-5e-2024/ac
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/concentration
  - dnd-5e-2024/turn-rest
  - dnd-5e-2024/splint-armor
  - class-paladin/class-paladin-level1
  - spells/spell-bless
steps:
  # Verify initial state: paladin has heavy armor proficiency and spellcasting
  - evaluate:
      assert:
        facts:
          armor.heavy.proficient: 1
          spellcasting.max: 1
          spellcasting.remaining: 1
          spellcasting.slots.level1.remaining: 2
        offers:
          exists:
            - don-splint-armor
          legal:
            - cast-bless
  # Don the splint armor
  - addOffer:
      id: don-splint-armor
      assert:
        facts:
          ac.base: 17
          armor.splint.equipped: 1
          armor.heavy.proficient: 1
          spellcasting.max: 1
          spellcasting.remaining: 1
  # End turn - armor effect persists, spellcasting must reset
  - endTurn:
      assert:
        facts:
          ac.base: 17
          armor.splint.equipped: 1
          armor.heavy.proficient: 1
          spellcasting.max: 1
          spellcasting.remaining: 1
        effects:
          exists:
            - effect-splint-armor
        offers:
          legal:
            - cast-bless
