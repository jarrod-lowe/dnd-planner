name: 'Acrobatics Skill'
description: 'Acrobatics skill uses DEX modifier'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
steps:
  - evaluate:
      assert:
        facts:
          skill.acrobatics.value: 0
        offers:
          exists:
            - proficiency-acrobatics
  - addOffer:
      id: set-dexterity
      selections:
        score: 14
      assert:
        facts:
          skill.acrobatics.value: 2
  - addOffer:
      id: proficiency-acrobatics
      selections:
        level: 1
      assert:
        facts:
          skill.acrobatics.proficiency: 1
          skill.acrobatics.value: 2
