name: 'Grapple - no free hand is still illegal even when the target saves'
description: >
  A free hand is a prerequisite to attempt a grapple, regardless of the save
  outcome. With all hands occupied, an illegal grapple marked saved (passed=1)
  must still report the no_hand plan error — only the hand occupancy (consume /
  Grappling effect) is skipped on a save, not the prerequisite diagnostic.

ruleGroups:
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/hands
  - dnd-5e-2024/grapple

# An early-phase effect occupying both hands (after hands-reset), so the planned
# grapple-action reads 0 free hands regardless of effect ordering.
initialEffects:
  - id: effect-occupy-hands-early
    phase: early
    after:
      - group: hands-reset
    activities:
      - type: numberIncrement
        target:
          fact: hands.remaining
        source:
          number: 2
        subtract: true
      - type: advertiseEffect
        self: true

steps:
  - evaluate:
      assert:
        facts:
          hands.remaining: 0

  # Mark the illegal grapple saved (passed=1). The hand is not consumed, but the
  # no_hand prerequisite error must still fire.
  - addOffer:
      id: grapple-action
      selections:
        passed: 1
      assert:
        planErrors:
          - id: grapple-action
            errors:
              - rule.dnd-5e-2024.grapple.action-grapple-offer.no_hand
