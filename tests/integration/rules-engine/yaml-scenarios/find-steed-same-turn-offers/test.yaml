name: 'Find Steed Same Turn Offers'
description: 'When Find Steed is planned (not yet committed), steed action offers should be available for same-turn use'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-find-steed
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  # Verify Find Steed is available
  - evaluate:
      assert:
        offers:
          exists:
            - cast-find-steed
  # Add Find Steed to plan (do NOT end turn)
  - addOffer:
      id: cast-find-steed
      assert:
        facts:
          companion.steed.summoned: 1
          companion.steed.actions.remaining: 1
          companion.steed.bonusActions.remaining: 1
        # Steed action offers should be available for same-turn use
        offers:
          exists:
            - steed-dash
            - steed-dodge
            - steed-disengage
