name: 'Condition Frightened - Hidden With Poisoned'
description: >-
  The uniform-max dividend across an effect write and a derive: Poisoned
  effect-writes the flags with stateCombine max, Frightened derives them with
  combine max — mode agreement, no conflict-throw (the Blinded regression
  family). v2 seeds the committed frightened+hidden pair directly (see
  INITIAL_EFFECTS — the toggle is no longer offer-driven): Frightened's derive
  contributes 0, Poisoned's effect writes 1, max = 1 — hiding the fear source
  never erases ANOTHER condition's Disadvantage.
ruleGroups:
  - dnd-5e-2024/condition-poisoned
  - dnd-5e-2024/condition-frightened
steps:
  - addOffer:
      id: record-poisoned
      assert:
        facts:
          condition.poisoned: 1
          condition.frightened: 1
          frightened.sourceHidden: 1
          # Flags STILL 1 — Poisoned alone carries them.
          attack.str.disadvantage: 1
          attack.dex.disadvantage: 1
          initiative.disadvantage: 1
          check.disadvantage: 1
          skill.athletics.disadvantage: 1
          skill.stealth.disadvantage: 1
          skill.perception.disadvantage: 1
        annotations:
          exists:
            - rule.dnd-5e-2024.condition-poisoned.notice
            - rule.dnd-5e-2024.condition-frightened.notice
