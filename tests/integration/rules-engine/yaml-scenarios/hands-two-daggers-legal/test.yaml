name: 'Hands - Two Daggers Fill Both Hands'
description: >
  A dagger is stackable, so a second copy may be held in the other hand. Both
  copies set the same weapon.dagger.equipped fact once, and together they spend
  exactly the 2-hand budget. Swapping one of them for a shield is the same shape:
  two one-handed items, no hands left.

ruleGroups:
  - dnd-5e-2024/hands
  - dnd-5e-2024/loadout
  - dnd-5e-2024/ac
  - dnd-5e-2024/shield
  - dnd-5e-2024/core-events
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/attacks
  - dnd-5e-2024/dagger

# Shield training granted so the loadout rows carry no proficiency warning.
initialFacts:
  armor.shield.proficient: 1

steps:
  - addOffer:
      id: set-loadout
      selections:
        loadout:
          id: dagger+dagger
          hands: 2
          handsFree: 0
          items:
            - id: dagger
              nameKey: rule.dnd-5e-2024.attacks.dagger.name
              hands: 1
              twoHanded: false
              state:
                weapon.dagger.equipped: 1
            - id: dagger
              nameKey: rule.dnd-5e-2024.attacks.dagger.name
              hands: 1
              twoHanded: false
              state:
                weapon.dagger.equipped: 1
      assert:
        facts:
          weapon.dagger.equipped: 1
          hands.remaining: 0
        planErrors:
          - id: set-loadout
            errors: []
        offers:
          exists:
            - dagger-use-action

  # A dagger in one hand and a shield in the other is equally legal.
  - updateSelections:
      id: set-loadout
      selections:
        loadout:
          id: dagger+shield
          hands: 2
          handsFree: 0
          items:
            - id: dagger
              nameKey: rule.dnd-5e-2024.attacks.dagger.name
              hands: 1
              twoHanded: false
              state:
                weapon.dagger.equipped: 1
            - id: shield
              nameKey: rule.dnd-5e-2024.shield.effect-shield.name
              hands: 1
              twoHanded: false
              state:
                armor.shield.equipped: 1
                ac.shieldBonus: 2
      assert:
        facts:
          weapon.dagger.equipped: 1
          armor.shield.equipped: 1
          ac.shieldBonus: 2
          hands.remaining: 0
        planErrors:
          - id: set-loadout
            errors: []
