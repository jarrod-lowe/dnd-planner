name: 'Damage Clears Banked Credit'
description: >-
  `hp.modifier.current` is a plain SUM of independently removable effect deltas,
  and the hp.current clamp hides a POSITIVE total the same way it hides an
  overkill negative one. So the everyday "I mis-entered the damage" flow —
  record damage, heal it back, then dismiss the damage chip — leaves hidden
  CREDIT banked above the floor: the sheet reads full HP, but the next damage
  record is silently swallowed paying that credit down. The mirror of
  heal-repairs-banked-overkill: a heal clears hidden debt BELOW the floor, so a
  damage record must clear hidden credit ABOVE it.
ruleGroups:
  - dnd-5e-2024/hp
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - class-paladin/class-paladin-level1
  - dnd-5e-2024/core-events
steps:
  # CON 14 → hp.max = 10 + 2 = 12.
  - addOffer:
      id: set-constitution
      selections:
        score: 14
      assert:
        facts:
          hp.max: 12
          hp.current: 12
  - addOffer:
      id: record-damage
      selections:
        amount: 7
      assert:
        facts:
          hp.current: 5
  - endTurn:
      assert:
        facts:
          hp.current: 5
  # Heal it all back: capped at the 7 missing, so the modifier returns to 0.
  - addOffer:
      id: record-heal
      selections:
        amount: 12
      assert:
        facts:
          hp.current: 12
  - endTurn:
      assert:
        facts:
          hp.modifier.current: 0
          hp.current: 12
        effects:
          exists:
            - effect-hp-damage
            - effect-hp-heal
  # Dismiss the mis-entered damage chip. The heal record stays, so the modifier
  # is now +7 — invisible on the sheet (still 12/12) but banked.
  - removeEffect:
      id: effect-hp-damage
      assert:
        facts:
          hp.modifier.current: 7
          hp.current: 12
  # The next damage must land in FULL: 12 − 6 = 6. Paying the 6 into the +7
  # credit instead leaves +1 and the HP bar never moves — 6 points of damage
  # silently vanish.
  - addOffer:
      id: record-damage
      selections:
        amount: 6
      assert:
        facts:
          hp.current: 6
  - endTurn:
      assert:
        facts:
          hp.modifier.current: -6
          hp.current: 6
