name: 'Command Cast'
description: 'Casting Command consumes action, spellcasting, and a spell slot. No concentration needed. Instant duration, no timed effect.'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-command
steps:
  - evaluate:
  - addOffer:
      id: prepare-command
  - evaluate:
      assert:
        facts:
          actions.remaining: 1
          spellcasting.remaining: 1
          spellcasting.slots.level1.remaining: 2
        offers:
          exists:
            - cast-command
        offerUi:
          - id: cast-command
            ui:
              # The target makes a Wisdom save
              information:
                - type: text
                  label: play.information.saveDc
                  labelValues:
                    saveType: { string: WIS }
                    dc: { fact: spellcasting.saveDC }
  - addOffer:
      id: cast-command
      assert:
        facts:
          actions.remaining: 0
          spellcasting.remaining: 0
          spellcasting.slots.level1.remaining: 1
  - endTurn:
      assert:
        facts:
          spellcasting.slots.level1.remaining: 1
        effects:
          notExists:
            - effect-command
