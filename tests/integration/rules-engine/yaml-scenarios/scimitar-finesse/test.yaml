name: 'Scimitar Finesse'
description: >
  Scimitar has finesse: hit and damage bonuses use the higher of STR or DEX modifier.
  Test 1: STR 16 (+3) vs DEX 8 (-1) -> uses STR (+3) for hitBonus and damageBonus.
  Test 2: STR 8 (-1) vs DEX 16 (+3) -> uses DEX (+3) for hitBonus and damageBonus.

ruleGroups:
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/turn-rest
  - dnd-5e-2024/attacks
  - dnd-5e-2024/scimitar

steps:
  - evaluate:
      assert:
        offers:
          exists:
            - set-strength
            - set-dexterity

  # Set STR high, DEX low -> finesse should pick STR
  - addOffer:
      id: set-strength
      selections:
        score: 16
      assert:
        facts:
          str.modifier: 3

  - addOffer:
      id: set-dexterity
      selections:
        score: 8
      assert:
        facts:
          dex.modifier: -1
          attack.scimitar.hitBonus: 3
          attack.scimitar.damageBonus: 3

  # End turn to reset, then set DEX high and STR low -> finesse should pick DEX
  - endTurn:
      assert:
        facts:
          actions.remaining: 1

  - addOffer:
      id: set-dexterity
      selections:
        score: 16
      assert:
        facts:
          dex.modifier: 3

  - addOffer:
      id: set-strength
      selections:
        score: 8
      assert:
        facts:
          str.modifier: -1
          attack.scimitar.hitBonus: 3
          attack.scimitar.damageBonus: 3
