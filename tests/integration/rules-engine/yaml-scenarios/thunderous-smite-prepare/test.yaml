name: 'Thunderous Smite Prepare'
description: 'Cast offer requires preparation first; prepare/unprepare lifecycle works'
ruleGroups:
  - dnd-5e-2024/prepared-spells
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-thunderous-smite
steps:
  # TC1: Before preparing, prepare offer exists; cast not available even with slots
  - evaluate:
      assert:
        facts:
          spell.l1.thunderousSmite.prepared: 0
        offers:
          exists:
            - set-prepared-spells
  # TC2: After preparing, cast offer becomes available (still gated on attack)
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: thunderous-smite
            level: 1
            nameKey: rule.spell-thunderous-smite.offer-thunderous-smite.name
            preparedFact: spell.l1.thunderousSmite.prepared
            alwaysPreparedFact: spell.l1.thunderousSmite.alwaysPrepared
      assert:
        facts:
          spell.l1.thunderousSmite.prepared: 1
          spellcasting.prepared.count: 1
