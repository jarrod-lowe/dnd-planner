name: 'Paladin Smite - No Bonus Action'
description: 'Paladin Smite is illegal when no bonus action is available'
ruleGroups:
  - species-human/species-human
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spellcasting
  - class-paladin/class-paladin-level1
  - class-paladin/class-paladin-level2
  - class-paladin/class-paladin-divine-smite
  - class-paladin/class-paladin-paladin-smite
steps:
  # Initial state
  - evaluate:
      assert:
        facts:
          bonusActions.remaining: 1
          paladinSmite.remaining: 1
        offers:
          illegal:
            - paladin-smite
  # Attack first to satisfy attack prerequisite
  - addOffer:
      id: unarmed-strike-use-action
      assert:
        facts:
          attack.last.activation.action: 1
          bonusActions.remaining: 1
        offers:
          legal:
            - paladin-smite
  # Use Divine Smite to consume the bonus action
  - addOffer:
      id: divine-smite
      selections:
        slotLevel: 1
      assert:
        facts:
          bonusActions.remaining: 0
        offers:
          illegal:
            - paladin-smite
