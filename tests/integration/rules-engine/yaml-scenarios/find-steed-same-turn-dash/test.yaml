name: 'Find Steed Same Turn Dash'
description: 'Dashing the steed on the same turn Find Steed is cast (before endTurn) grants full Dash movement (60 base + 60 dash = 120)'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - spells/spell-find-steed
initialEffects:
  - id: test-grant-level2-slot
    phase: early
    group:
      - spellcasting-slots-set
    activities:
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.total
        source:
          number: 1
      - type: numberSet
        target:
          fact: spellcasting.slots.level2.remaining
        source:
          number: 1
      - type: advertiseEffect
        self: true
steps:
  # Verify Find Steed is available
  - evaluate:
      assert:
        offers:
          exists:
            - cast-find-steed
  # Cast Find Steed but do NOT end turn
  - addOffer:
      id: cast-find-steed
      assert:
        facts:
          companion.steed.summoned: 1
          companion.steed.actions.remaining: 1
        offers:
          exists:
            - steed-dash
  # Same-turn Dash: 60 base + 60 dash = 120, consumes steed action
  - addOffer:
      id: steed-dash
      assert:
        facts:
          companion.steed.movement.total: 120
          companion.steed.movement.remaining: 120
          companion.steed.actions.remaining: 0
