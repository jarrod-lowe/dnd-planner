name: 'Divine Smite - After an Opportunity Attack'
description: >
  Divine Smite rides on hitting with a Melee weapon or an Unarmed Strike, not on
  having taken the Attack action. An opportunity attack is one melee attack with
  a weapon, so a spear reaction - on a turn with no Attack action at all, the
  action still unspent - unlocks the smite and the reminder that plans it.

ruleGroups:
  - dnd-5e-2024/prepared-spells
  - species-human/species-human
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spear
  - dnd-5e-2024/spellcasting
  - class-paladin/class-paladin-level1
  - spells/spell-divine-smite

# Spear in hand: the reminder has to land on a real weapon panel, and the
# spear's attack profiles carry the attack.melee label it targets.
initialFacts:
  weapon.spear.equipped: 1

steps:
  # Prepared, but nothing struck yet: illegal-but-visible, and no reminder.
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: divine-smite
            level: 1
            nameKey: rule.spell-divine-smite.offer-divine-smite.name
            preparedFact: spell.l1.divineSmite.prepared
            alwaysPreparedFact: spell.l1.divineSmite.alwaysPrepared
      assert:
        facts:
          actions.remaining: 1
          bonusActions.remaining: 1
          attack.last.melee: 0
          attack.last.activation.action: 0
        offers:
          illegal:
            - cast-divine-smite
        annotations:
          notExists:
            - rule.spell-divine-smite.annotation

  # Spear opportunity attack: a REACTION, so no Attack action is taken and the
  # action budget is untouched - but a melee weapon attack was made.
  - addOffer:
      id: spear-use-reaction-weapon
      assert:
        facts:
          attack.last.melee: 1
          attack.last.activation.action: 0
          actions.remaining: 1
          reactions.remaining: 0
        offers:
          legal:
            - cast-divine-smite
        annotations:
          exists:
            - rule.spell-divine-smite.annotation
          targets:
            - key: rule.spell-divine-smite.annotation
              targets: [attack.melee, attack.unarmed]
          addsToPlan:
            - key: rule.spell-divine-smite.annotation
              adds: { offer: cast-divine-smite }

  # Tapping the reminder plans the smite: legal, and the turn stays legal.
  - addOffer:
      id: cast-divine-smite
      assert:
        planErrors:
          - id: cast-divine-smite
            index: 0
            errors: []
        status:
          legal: true
