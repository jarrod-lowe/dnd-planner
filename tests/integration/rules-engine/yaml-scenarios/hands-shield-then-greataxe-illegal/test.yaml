name: 'Hands - Shield Then Greataxe Illegal'
description: >
  With a shield equipped (1 hand used), donning a greataxe should be illegal.
  1 hand remaining, greataxe needs 2.

ruleGroups:
  - dnd-5e-2024/hands
  - dnd-5e-2024/ac
  - dnd-5e-2024/shield
  - dnd-5e-2024/core-events
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/attacks
  - dnd-5e-2024/greataxe

initialEffects:
  - id: effect-shield
    phase: normal
    after:
      - group: ac-calculation
    group:
      - ac-components
      - _auto.fact.hands.remaining
    activities:
      - type: numberIncrement
        target:
          fact: ac.shieldBonus
        source:
          number: 2
      - type: numberSet
        target:
          fact: armor.shield.equipped
        source:
          number: 1
      - type: numberIncrement
        target:
          fact: hands.remaining
        source:
          number: 1
        subtract: true
      - type: advertiseEffect
        self: true

steps:
  - evaluate:
      assert:
        facts:
          armor.shield.equipped: 1
          hands.remaining: 1
        offers:
          illegal:
            - don-greataxe
