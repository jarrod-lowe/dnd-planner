name: 'Heal Repairs Banked Overkill'
description: >-
  Healing must repair a `hp.modifier.current` that already sits BELOW the floor
  (−hp.max), not just the visible missing HP. The manual current-HP slider is an
  explicit override with a −30 range, so on a low-max character it reaches that
  state legally — and legacy damage records banked there too, before the
  recorders started capping. Reading "missing" off the raw modifier made a heal
  chew through the hidden overkill and leave `hp.current` at 0: the heal looked
  like it did nothing at all. The record has to clear the overkill AND restore
  the healed HP in one delta. Companion to damage-does-not-bank-below-zero,
  which stops NEW records from banking in the first place.
ruleGroups:
  - dnd-5e-2024/hp
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - class-paladin/class-paladin-level1
  - dnd-5e-2024/core-events
steps:
  # CON 14 → hp.max = 10 + 2 = 12.
  - addOffer:
      id: set-constitution
      selections:
        score: 14
      assert:
        facts:
          hp.max: 12
          hp.current: 12
  # The manual override drives the modifier to −30, which is 18 past the floor:
  # HP reads 0/12 and 18 points of loss are hidden below it.
  - addOffer:
      id: set-hp-modifier-current
      selections:
        modifier: -30
      assert:
        facts:
          hp.modifier.current: -30
          hp.current: 0
  # Heal 5: the visible HP must move 0 → 5. Paying only the 5 into the raw −30
  # would leave −25 and hp.current still 0 — the heal silently swallowed.
  - addOffer:
      id: record-heal
      selections:
        amount: 5
      assert:
        facts:
          hp.current: 5
  - endTurn:
      assert:
        facts:
          hp.current: 5
        effects:
          exists:
            - effect-hp-heal
            - effect-hp-modifier-current
  # With the overkill already cleared, the next heal behaves normally: only the
  # 7 missing HP are regained, and the surplus is lost (not banked).
  - addOffer:
      id: record-heal
      selections:
        amount: 20
      assert:
        facts:
          hp.current: 12
  - endTurn:
      assert:
        facts:
          hp.current: 12
  # And damage taken afterwards lands in full — no banked positive modifier.
  - addOffer:
      id: record-damage
      selections:
        amount: 4
      assert:
        facts:
          hp.current: 8
  - endTurn:
      assert:
        facts:
          hp.current: 8
