name: 'Demon Grinder - Fire The Harpoon Flinger'
description: >-
  The Harpoon Flinger's attack offer exists only while the harpoon seat is
  held (the `when` gate is the acquire AND the station's seat fact — the Helm
  does not man the flinger), and while it exists it is a plan-row ACTION
  attack filed like one: ATTACK 'weapons', action cost, a dice-line reading
  the module derives (d20 + 5 to hit, 2d8 piercing with NO damage bonus —
  the Grinder's flinger, not the Tormentor's +2). 120 ft. and one target are
  offer copy and detail text, not range machinery. The ECONOMY is the generic
  action spend (a vehicle action is not a PC weapon attack — no Extra
  Attack): firing consumes the player's full ACTION and nothing else, the
  seat stays taken, and no ammunition is counted (the 10 harpoons are the
  detail's bookkeeping).
ruleGroups:
  - vehicles/demon-grinder
  - dnd-5e-2024/action-economy
steps:
  # Acquired but unseated: no fire offer — the attack is the station's.
  - addOffer:
      id: acquire-demon-grinder
  - evaluate:
      assert:
        offers:
          notExists:
            - fire-demon-grinder-harpoon
  # A driver at the Helm does not man the flinger either.
  - addOffer:
      id: take-demon-grinder-helm-seat
  - evaluate:
      assert:
        offers:
          notExists:
            - fire-demon-grinder-harpoon
  # Seated at the flinger: the offer exists with the full attack shape.
  - addOffer:
      id: leave-demon-grinder-helm-seat
  - addOffer:
      id: take-demon-grinder-harpoon-seat
  - evaluate:
      assert:
        offers:
          exists:
            - fire-demon-grinder-harpoon
          legal:
            - fire-demon-grinder-harpoon
        offerUi:
          - id: fire-demon-grinder-harpoon
            ui:
              section: action-attack
              subject: demon-grinder
              name: rule.demon-grinder.fire-harpoon.name
              description: rule.demon-grinder.fire-harpoon.description
              detailKey: vehicle/demon-grinder-harpoon
              actionCost:
                - action
              annotationLabels:
                - dice.any.companion
              intents:
                ATTACK: weapons
              primaryControl:
                type: dice-line
                dice:
                  - sides: 20
                    bonus:
                      var: hitBonus
                    purpose: to-hit
                  - sides: 8
                    count: 2
                    bonus:
                      var: damageBonus
                    purpose: damage
                    damageType:
                      string: piercing
        offerVars:
          - id: fire-demon-grinder-harpoon
            vars:
              hitBonus:
                capture: true
                default:
                  fact: companion.demonGrinder.harpoon.hitBonus
              damageDie:
                default:
                  number: 8
              damageBonus:
                capture: true
                default:
                  fact: companion.demonGrinder.harpoon.damageBonus
  # The derives the dice-line reads: +5 to hit, +0 damage, while acquired.
  - evaluate:
      assert:
        facts:
          companion.demonGrinder.harpoon.hitBonus: 5
          companion.demonGrinder.harpoon.damageBonus: 0
  # Fire: the generic action spend alone — the player's ACTION, never attack
  # accounting — and nothing else moves (the seat stays taken).
  - addOffer:
      id: fire-demon-grinder-harpoon
      assert:
        facts:
          actions.remaining: 0
          companion.demonGrinder.seats.harpoon: 1
        planErrors:
          - id: fire-demon-grinder-harpoon
            index: 0
            errors: []
  # A second firing the same turn is ILLEGAL-but-COMMITTABLE: the offer stays
  # with its no-action diagnostic and the row still spends.
  - addOffer:
      id: fire-demon-grinder-harpoon
      assert:
        planErrors:
          - id: fire-demon-grinder-harpoon
            index: 1
            errors:
              - rule.demon-grinder.fire-harpoon.no_action
  # End of turn: the spend ages away, the seat stands.
  - endTurn:
      assert:
        facts:
          actions.remaining: 1
          companion.demonGrinder.seats.harpoon: 1
