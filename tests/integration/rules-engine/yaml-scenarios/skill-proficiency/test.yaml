name: 'Skill Proficiency'
description: 'Adding a skill proficiency without a class (proficiency bonus is 0)'
ruleGroups:
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
steps:
  - evaluate:
      assert:
        facts:
          skill.athletics.value: 0
        offers:
          exists:
            - proficiency-athletics
  - addOffer:
      id: set-strength
      selections:
        score: 16
      assert:
        facts:
          skill.athletics.value: 3
  - addOffer:
      id: proficiency-athletics
      selections:
        level: 1
      assert:
        facts:
          skill.athletics.proficiency: 1
          skill.athletics.value: 3
