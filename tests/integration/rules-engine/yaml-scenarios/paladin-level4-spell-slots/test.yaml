name: 'Paladin: Spell slots at level 4'
description: 'A level 4 paladin has 3 level 1 spell slots (unchanged from level 3)'
ruleGroups:
  - dnd-5e-2024/spellcasting
  - class-paladin/class-paladin-level1
  - class-paladin/class-paladin-level2
  - class-paladin/class-paladin-level3
  - class-paladin/class-paladin-level4
steps:
  - evaluate:
      assert:
        facts:
          spellcasting.slots.level1.total: 3
          spellcasting.slots.level1.remaining: 3
