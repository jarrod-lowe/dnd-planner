name: 'Thunderous Smite - After an Opportunity Attack'
description: >
  Thunderous Smite rides on the same trigger as Divine Smite - hitting with a
  Melee weapon or an Unarmed Strike - so a spear opportunity attack unlocks it
  on a turn where no Attack action was taken. The reminder returns with it: the
  annotation was lost when the legacy YAML was stripped and the module port
  never reinstated it.

ruleGroups:
  - dnd-5e-2024/prepared-spells
  - species-human/species-human
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/core-events
  - dnd-5e-2024/attacks
  - dnd-5e-2024/spear
  - dnd-5e-2024/spellcasting
  - class-paladin/class-paladin-level1
  - spells/spell-thunderous-smite

# Spear in hand: the reminder has to land on a real weapon panel, and the
# spear's attack profiles carry the attack.melee label it targets.
initialFacts:
  weapon.spear.equipped: 1

steps:
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: thunderous-smite
            level: 1
            nameKey: rule.spell-thunderous-smite.offer-thunderous-smite.name
            preparedFact: spell.l1.thunderousSmite.prepared
            alwaysPreparedFact: spell.l1.thunderousSmite.alwaysPrepared
      assert:
        facts:
          actions.remaining: 1
          bonusActions.remaining: 1
          attack.last.melee: 0
          attack.last.activation.action: 0
        offers:
          illegal:
            - cast-thunderous-smite
        annotations:
          notExists:
            - rule.spell-thunderous-smite.annotation

  - addOffer:
      id: spear-use-reaction-weapon
      assert:
        facts:
          attack.last.melee: 1
          attack.last.activation.action: 0
          actions.remaining: 1
          reactions.remaining: 0
        offers:
          legal:
            - cast-thunderous-smite
        annotations:
          exists:
            - rule.spell-thunderous-smite.annotation
          targets:
            - key: rule.spell-thunderous-smite.annotation
              targets: [attack.melee, attack.unarmed]
          addsToPlan:
            - key: rule.spell-thunderous-smite.annotation
              adds: { offer: cast-thunderous-smite }

  - addOffer:
      id: cast-thunderous-smite
      assert:
        planErrors:
          - id: cast-thunderous-smite
            index: 0
            errors: []
        status:
          legal: true
