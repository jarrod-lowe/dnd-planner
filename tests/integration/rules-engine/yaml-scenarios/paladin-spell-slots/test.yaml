name: 'Paladin: Spell slots at level 1'
description: 'A level 1 paladin has spellcasting max and remaining of 1, and level 1 spell slots total and remaining of 2'
ruleGroups:
  - dnd-5e-2024/spellcasting
  - class-paladin/class-paladin-level1
steps:
  - evaluate:
      assert:
        facts:
          spellcasting.max: 1
          spellcasting.remaining: 1
          spellcasting.slots.level1.total: 2
          spellcasting.slots.level1.remaining: 2
