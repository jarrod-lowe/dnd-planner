name: 'Divinity - Long Rest Reset'
description: 'Long Rest restores Divinity pool to full'
ruleGroups:
  - class-paladin/class-paladin-level1
  - class-paladin/class-paladin-level2
  - class-paladin/class-paladin-divinity
  - class-paladin/class-paladin-level3
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/turn-rest
steps:
  # Use 1 point
  - evaluate:
      assert:
        facts:
          divinity.remaining: 2
  - addOffer:
      id: divine-sense
      assert:
        facts:
          divinity.remaining: 1
  - endTurn:
      assert:
        facts:
          divinity.remaining: 1
  # Use 1 more point
  - evaluate:
      assert:
        facts:
          divinity.remaining: 1
  - addOffer:
      id: divine-sense
      assert:
        facts:
          divinity.remaining: 0
  - endTurn:
      assert:
        facts:
          divinity.remaining: 0
  # Long Rest
  - evaluate:
      assert:
        facts:
          divinity.remaining: 0
  - addOffer:
      id: long-rest
      assert:
        facts:
          divinity.remaining: 2
  - endTurn:
      assert:
        facts:
          divinity.remaining: 2
  # Verify full pool after Long Rest
  - evaluate:
      assert:
        facts:
          divinity.total: 2
          divinity.remaining: 2
        offers:
          exists:
            - divine-sense
