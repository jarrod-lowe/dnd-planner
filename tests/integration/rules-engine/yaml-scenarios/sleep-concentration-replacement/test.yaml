name: 'Sleep Concentration Replacement'
description: >-
  Casting Sleep while already concentrating is legal (SRD 5.2): the moment the
  second concentration spell starts, the first is dismissed — the shared
  concentration key replaces the hold, so concentration.spent stays 1.
ruleGroups:
  - dnd-5e-2024/prepared-spells
  - dnd-5e-2024/ability-scores
  - dnd-5e-2024/proficiency
  - dnd-5e-2024/action-economy
  - dnd-5e-2024/free-actions
  - dnd-5e-2024/spellcasting
  - dnd-5e-2024/concentration
  - dnd-5e-2024/core-events
  - class-paladin/class-paladin-level1
  - class-paladin/paladin-spells-l1
  - spells/spell-sleep
steps:
  - evaluate:
      assert:
        facts:
          concentration.remaining: 1
        offers:
          exists:
            - set-prepared-spells
  - addOffer:
      id: set-prepared-spells
      selections:
        prepared:
          - spellId: sleep
            level: 1
            nameKey: rule.spell-sleep.offer-sleep.name
            preparedFact: spell.l1.sleep.prepared
            alwaysPreparedFact: spell.l1.sleep.alwaysPrepared
  - endTurn: {}
  - addOffer:
      id: set-charisma
      selections:
        score: 16
  # Cast Sleep — consumes concentration
  - addOffer:
      id: cast-sleep
      assert:
        facts:
          concentration.remaining: 0
          spellcasting.slots.level1.remaining: 1
  - endTurn:
      assert:
        effects:
          exists:
            - effect-sleep
  # Turn 2: the recast is LEGAL — SRD 5.2 "Another Concentration Effect" loses
  # the first concentration the moment the second cast starts.
  - evaluate:
      assert:
        facts:
          concentration.remaining: 0
        offers:
          legal:
            - cast-sleep
  # Recast Sleep: the keyed effect REPLACES the committed hold, so the slot
  # still reads as held once (not stacked) while the second slot spends.
  - addOffer:
      id: cast-sleep
      assert:
        facts:
          concentration.spent: 1
          concentration.remaining: 0
          spellcasting.slots.level1.remaining: 0
  - endTurn:
      assert:
        effects:
          exists:
            - effect-sleep
