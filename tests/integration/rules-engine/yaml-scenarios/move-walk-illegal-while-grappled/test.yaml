name: 'Condition Grappled - Movement Halted'
description: >-
  SRD 5.2 Grappled, Speed 0: "Your Speed is 0 and can't increase", so every
  travel offer (walk, rough terrain, crawl, both swims, fly) is ILLEGAL while
  grappled — a legality gate, not a structural one, so the player still sees
  why (the shared cannot_while_halted diagnostic, which a planned-anyway row
  also carries from the apply re-check). Speed 0 also beats prone's crawl
  allowance: crawl is only-while-prone (illegal while standing on that clause
  alone), and its legality gate carries the same halted clause, so a
  prone+grappled character cannot even crawl (no movement at all). Dismissing
  the condition restores walk.
ruleGroups:
  - species-human/species-human
  - dnd-5e-2024/movement
  - dnd-5e-2024/condition-grappled
steps:
  - evaluate:
      assert:
        facts:
          condition.grappled: 0
          character.movement.halted: 0
        offers:
          legal:
            - move-walk
            - move-rough-terrain
            - move-swim-costly
          notExists:
            - move-swim
          illegal:
            - move-crawl
  - addOffer:
      id: record-grappled
      assert:
        facts:
          condition.grappled: 1
          character.movement.halted: 1
          character.movement.remaining: 0
        offers:
          illegal:
            - move-walk
            - move-rough-terrain
            - move-swim-costly
            - move-fly
  # Planned anyway: the row still executes (illegal-but-visible — the engine's
  # contract) and carries the halted diagnostic from the apply re-check. The
  # out-of-movement diagnostic joins it honestly: the slider's distance default
  # resolves from the pre-plan sheet (30, the unmasked base) while the folded
  # remaining is already masked to 0.
  - addOffer:
      id: move-walk
      assert:
        facts:
          character.movement.remaining: 0
        planErrors:
          - id: move-walk
            index: 0
            errors:
              - rule.dnd-5e-2024.movement.action-move-walk-offer.out_of_movement
              - rule.dnd-5e-2024.movement.cannot_while_halted
  # Un-plan the walk, then the record: the halted mask follows the condition
  # fact through the projection — with neither row planned, remaining and the
  # walk offer are restored. (The committed-effect dismissal path is pinned by
  # condition-grappled-rest-clears.)
  - removeFromPlan:
      id: move-walk
      assert:
        facts:
          condition.grappled: 1
          character.movement.halted: 1
  - removeFromPlan:
      id: record-grappled
      assert:
        facts:
          condition.grappled: 0
          character.movement.halted: 0
          character.movement.remaining: 30
        offers:
          legal:
            - move-walk
