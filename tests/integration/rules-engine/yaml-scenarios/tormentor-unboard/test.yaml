name: 'Tormentor (Damage Control) - Unboard'
description: >-
  Abandoning is a vehicle-panel offer gated on the acquire: apply advertises a
  keyed replacement (the steed dismiss pattern) that evicts the acquire effect,
  so every baked fact clears at once and the vehicle loses its surface once
  the turn commits. Re-acquiring bakes the stats afresh. Raw mount-chip
  removal stays as the override path — the same facts clear without the
  offer.
ruleGroups:
  - vehicles/tormentor
steps:
  - addOffer:
      id: acquire-tormentor
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-acquire
        facts:
          companion.tormentor.active: 1
  # Abandon: the keyed replacement evicts the acquire effect in the projection,
  # so every baked fact reads 0 before the turn even commits.
  - addOffer:
      id: abandon-tormentor
      assert:
        facts:
          companion.tormentor.active: 0
          companion.tormentor.ac.effective: 0
          companion.tormentor.hp.max: 0
          companion.tormentor.speed: 0
          companion.tormentor.cargo: 0
          companion.tormentor.str: 0
          companion.tormentor.str.modifier: 0
        planErrors:
          - id: abandon-tormentor
            index: 0
            errors: []
  # Commit: the acquire effect is gone for good, and the abandon gate closed.
  - endTurn:
      assert:
        effects:
          notExists:
            - effect-tormentor-acquire
        facts:
          companion.tormentor.active: 0
        offers:
          exists:
            - acquire-tormentor
          notExists:
            - abandon-tormentor
  # Re-acquiring after abandoning bakes the stats afresh.
  - addOffer:
      id: acquire-tormentor
      assert:
        facts:
          companion.tormentor.active: 1
          companion.tormentor.ac.effective: 21
  - endTurn:
      assert:
        effects:
          exists:
            - effect-tormentor-acquire
  # Override path: raw mount-chip removal still clears every fact.
  - removeEffect:
      id: effect-tormentor-acquire
      assert:
        effects:
          notExists:
            - effect-tormentor-acquire
        facts:
          companion.tormentor.active: 0
          companion.tormentor.ac.effective: 0
        offers:
          exists:
            - acquire-tormentor
