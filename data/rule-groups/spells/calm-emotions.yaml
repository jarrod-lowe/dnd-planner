# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: spell-calm-emotions
    requires:
      - spellcasting
      - concentration
    translations:
      en:
        name: Calm Emotions
        description: >-
          Level 2 action spell (60ft). Humanoids in a 20ft-radius Sphere make a
          CHA save or gain immunity to Charmed/Frightened, or become
          Indifferent. Concentration, up to 1 minute (10 rounds).
        keywords: [spell, level2, calm emotions, action, enchantment, concentration, bard, cleric]
      en-x-tlh:
        name: tam tIq
        description: >-
          DIch level 2 action (60ft). Sphere Humanoid CHA DIch. buQ, 1 rep
          (10 rounds).
        keywords: [spell, level2, tam tIq, action, buQ]
    detail:
      key: spell/calm-emotions
      source: srd52
      translations:
        en:
          meta: 'Level 2 Enchantment (Bard, Cleric)'
          fields:
            - { labelKey: rules.field.castingTime, value: 'Action' }
            - { labelKey: rules.field.range, value: '60 feet' }
            - { labelKey: rules.field.components, value: 'V, S' }
            - { labelKey: rules.field.duration, value: 'Concentration, up to 1 minute' }
          body: |
            Each Humanoid in a 20-foot-radius Sphere centered on a point you choose
            within range must succeed on a **Charisma saving throw** or be affected
            by one of the following effects (choose for each creature):

            - The creature has Immunity to the Charmed and Frightened conditions
              until the spell ends. If the creature was already Charmed or
              Frightened, those conditions are suppressed for the duration.

            - The creature becomes Indifferent about creatures of your choice that
              it's Hostile toward. This indifference ends if the target takes damage
              or witnesses its allies taking damage. When the spell ends, the
              creature's attitude returns to normal.
    rules:
      # Offer to prepare Calm Emotions (Build → Prepare → L2)
      - id: prepare-calm-emotions-offer
        activities:
          - type: offerRule
            legalWhen:
              - condition:
                  fact: spell.l2.calmEmotions.prepared
                  operator: notEquals
                  value: 1
                illegalDiagnostics:
                  - code: rule.spell-calm-emotions.prepare-calm-emotions-offer.already_prepared
                    severity: error
              - condition:
                  fact: spellcasting.prepared.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-calm-emotions.prepare-calm-emotions-offer.max_prepared
                    severity: error
            rule:
              id: prepare-calm-emotions
              phase: normal
              group:
                - __planned__
              ui:
                section: configuration
                name: rule.spell-calm-emotions.prepare-calm-emotions-offer.name
                intents: { PREPARE: L2 }
                actionCost: []
              activities:
                - type: numberSet
                  target:
                    fact: spell.l2.calmEmotions.prepared
                  source:
                    number: 1
                - type: numberIncrement
                  target:
                    fact: spellcasting.prepared.count
                  source:
                    number: 1
                - type: advertiseEffect
                  rule:
                    id: effect-calm-emotions-prepared
                    ui:
                      name: rule.spell-calm-emotions.effect-calm-emotions-prepared.name
                      hidden: true
                    phase: early
                    after:
                      - group: spell-l2-calmEmotions-removal-set
                      - group: always-prepared-set
                    activities:
                      - type: numberSet
                        target:
                          fact: spell.l2.calmEmotions.prepared
                        source:
                          number: 1
                        when:
                          - fact: spell.l2.calmEmotions.removing
                            operator: equals
                            value: 0
                      # Stop counting against the prepared limit once a feature
                      # grants this spell always-prepared (alwaysPrepared == 1),
                      # otherwise a manual L2 preparation would permanently waste
                      # a prepared slot after the grant activates.
                      - type: numberIncrement
                        target:
                          fact: spellcasting.prepared.count
                        source:
                          number: 1
                        when:
                          - fact: spell.l2.calmEmotions.removing
                            operator: equals
                            value: 0
                          - fact: spell.l2.calmEmotions.alwaysPrepared
                            operator: notEquals
                            value: 1
                      # Retire the effect once always-prepared takes over (the
                      # grant then sustains the prepared fact each evaluation).
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: spell.l2.calmEmotions.removing
                            operator: equals
                            value: 0
                          - fact: spell.l2.calmEmotions.alwaysPrepared
                            operator: notEquals
                            value: 1

      # Offer to unprepare Calm Emotions
      # (illegal when granted always-prepared by a feature)
      - id: unprepare-calm-emotions-offer
        activities:
          - type: offerRule
            legalWhen:
              - condition:
                  fact: spell.l2.calmEmotions.prepared
                  operator: equals
                  value: 1
                illegalDiagnostics:
                  - code: rule.spell-calm-emotions.unprepare-calm-emotions-offer.not_prepared
                    severity: error
              - condition:
                  fact: spell.l2.calmEmotions.alwaysPrepared
                  operator: notEquals
                  value: 1
                illegalDiagnostics:
                  - code: rule.spell-calm-emotions.unprepare-calm-emotions-offer.always_prepared
                    severity: error
            rule:
              id: unprepare-calm-emotions
              ui:
                section: configuration
                name: rule.spell-calm-emotions.unprepare-calm-emotions-offer.name
                intents: { PREPARE: L2 }
                actionCost: []
              activities:
                - type: numberSet
                  target:
                    fact: spell.l2.calmEmotions.prepared
                  source:
                    number: 0
                - type: numberSet
                  target:
                    fact: spell.l2.calmEmotions.removing
                  source:
                    number: 1
                - type: numberIncrement
                  target:
                    fact: spellcasting.prepared.count
                  source:
                    number: 1
                  subtract: true
                - type: advertiseEffect
                  rule:
                    id: effect-calm-emotions-removing
                    ui:
                      name: rule.spell-calm-emotions.effect-calm-emotions-removing.name
                      hidden: true
                    phase: early
                    group:
                      - spell-l2-calmEmotions-removal-set
                    activities:
                      - type: numberSet
                        target:
                          fact: spell.l2.calmEmotions.removing
                        source:
                          number: 1

      # Compute eligible Calm Emotions slot count (levels 2-5)
      - id: compute-calm-emotions-eligible-slots
        phase: normal
        group:
          - calmEmotions-slots-computed
        activities:
          - type: numberSum
            target:
              fact: calmEmotions.eligibleSlotsRemaining
            sources:
              - fact: spellcasting.slots.level2.remaining
              - fact: spellcasting.slots.level3.remaining
              - fact: spellcasting.slots.level4.remaining
              - fact: spellcasting.slots.level5.remaining

      # Compute lowest available slot level (2-5)
      # Cascade from high to low so the lowest available level overwrites
      - id: compute-calm-emotions-lowest-slot
        phase: normal
        group:
          - calmEmotions-slots-computed
        activities:
          - type: numberSet
            target:
              fact: calmEmotions.lowestAvailableSlotLevel
            source:
              number: 5
            when:
              - fact: spellcasting.slots.level5.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: calmEmotions.lowestAvailableSlotLevel
            source:
              number: 4
            when:
              - fact: spellcasting.slots.level4.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: calmEmotions.lowestAvailableSlotLevel
            source:
              number: 3
            when:
              - fact: spellcasting.slots.level3.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: calmEmotions.lowestAvailableSlotLevel
            source:
              number: 2
            when:
              - fact: spellcasting.slots.level2.remaining
                operator: greaterThan
                value: 0

      # Offer Calm Emotions (action spell)
      - id: offer-calm-emotions
        when:
          - fact: spell.l2.calmEmotions.prepared
            operator: equals
            value: 1
        after:
          - group: __planned__
          - group: action
          - group: spellcasting
          - group: calmEmotions-slots-computed
        activities:
          - type: offerRule
            legalWhen:
              - condition:
                  fact: actions.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-calm-emotions.offer-calm-emotions.no_action
                    severity: error
              - condition:
                  fact: spellcasting.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-calm-emotions.offer-calm-emotions.no_spellcasting
                    severity: error
              - condition:
                  fact: concentration.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-calm-emotions.offer-calm-emotions.already_concentrating
                    severity: error
              - condition:
                  fact: calmEmotions.eligibleSlotsRemaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-calm-emotions.offer-calm-emotions.no_slots
                    severity: error
            rule:
              id: cast-calm-emotions
              group:
                - __planned__
                - action
                - spellcasting
              ui:
                section: action-spell
                name: rule.spell-calm-emotions.offer-calm-emotions.name
                description: rule.spell-calm-emotions.offer-calm-emotions.description
                detailKey: spell/calm-emotions
                showDC: true
                information:
                  - type: text
                    label: play.information.saveDc
                    labelValues:
                      saveType: { fact: spellcasting.saveAbility }
                      dc: { fact: spellcasting.saveDC }
                intents:
                  CONTROL: area
                actionCost: [action, conc, L2]
                primaryControl:
                  type: slider
                  var: slotLevel
                  notches:
                    - { value: 2, enabled: { fact: spellcasting.slots.level2.total } }
                    - { value: 3, enabled: { fact: spellcasting.slots.level3.total } }
                    - { value: 4, enabled: { fact: spellcasting.slots.level4.total } }
                    - { value: 5, enabled: { fact: spellcasting.slots.level5.total } }
                  valueFormat: spellLevel
              vars:
                slotLevel:
                  capture: true
                  default:
                    fact: calmEmotions.lowestAvailableSlotLevel
              activities:
                # Consume action
                - type: numberIncrement
                  target:
                    fact: actions.remaining
                  source:
                    number: 1
                  subtract: true
                # Consume spellcasting resource
                - type: numberIncrement
                  target:
                    fact: spellcasting.remaining
                  source:
                    number: 1
                  subtract: true
                # Consume concentration
                - type: numberIncrement
                  target:
                    fact: concentration.remaining
                  source:
                    number: 1
                  subtract: true
                # Error tracking
                - *error-clear
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-calm-emotions.offer-calm-emotions.no_action
                  when:
                    - fact: actions.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-calm-emotions.offer-calm-emotions.no_spellcasting
                  when:
                    - fact: spellcasting.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-calm-emotions.offer-calm-emotions.already_concentrating
                  when:
                    - fact: concentration.remaining
                      operator: lessThan
                      value: 0
                # Bridge var to fact for conditional slot consumption
                - type: numberSet
                  target:
                    fact: calmEmotions.selectedLevel
                  source:
                    var: slotLevel
                # Consume L2 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level2.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: calmEmotions.selectedLevel
                      operator: equals
                      value: 2
                # Consume L3 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level3.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: calmEmotions.selectedLevel
                      operator: equals
                      value: 3
                # Consume L4 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level4.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: calmEmotions.selectedLevel
                      operator: equals
                      value: 4
                # Consume L5 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level5.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: calmEmotions.selectedLevel
                      operator: equals
                      value: 5
                # Track slot consumption errors
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-calm-emotions.offer-calm-emotions.no_slots
                  when:
                    - fact: spellcasting.slots.level2.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-calm-emotions.offer-calm-emotions.no_slots
                  when:
                    - fact: spellcasting.slots.level3.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-calm-emotions.offer-calm-emotions.no_slots
                  when:
                    - fact: spellcasting.slots.level4.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-calm-emotions.offer-calm-emotions.no_slots
                  when:
                    - fact: spellcasting.slots.level5.remaining
                      operator: lessThan
                      value: 0
                # Persist L2 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-calm-emotions-slot-l2
                    ui:
                      name: play.slotEffect.l2
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level2.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: calmEmotions.selectedLevel
                      operator: equals
                      value: 2
                # Persist L3 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-calm-emotions-slot-l3
                    ui:
                      name: play.slotEffect.l3
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level3.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: calmEmotions.selectedLevel
                      operator: equals
                      value: 3
                # Persist L4 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-calm-emotions-slot-l4
                    ui:
                      name: play.slotEffect.l4
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level4.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: calmEmotions.selectedLevel
                      operator: equals
                      value: 4
                # Persist L5 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-calm-emotions-slot-l5
                    ui:
                      name: play.slotEffect.l5
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level5.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: calmEmotions.selectedLevel
                      operator: equals
                      value: 5
                # Create persistent Calm Emotions effect (10 rounds, CHA save, concentration)
                - type: advertiseEffect
                  rule:
                    id: effect-calm-emotions
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    when:
                      - fact: rest.short
                        operator: equals
                        value: 0
                      - fact: rest.long
                        operator: equals
                        value: 0
                    ui:
                      section: ongoing
                      name: rule.spell-calm-emotions.effect-calm-emotions.name
                      detailKey: spell/calm-emotions
                      countDown: 10
                      duration: 10
                      saveType: CHA
                      saveFact: spellcasting.saveDC
                      information:
                        - type: countdown
                          filled: { number: 10 }
                          total: { number: 10 }
                        - type: text
                          label: play.information.saveDc
                          labelValues:
                            saveType: { fact: spellcasting.saveAbility }
                            dc: { fact: spellcasting.saveDC }
                    activities:
                      - type: numberIncrement
                        target:
                          fact: concentration.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
