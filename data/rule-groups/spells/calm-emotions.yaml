ruleGroups:
  - id: spell-calm-emotions
    requires:
      - spellcasting
      - concentration
    translations:
      en:
        name: Calm Emotions
        description: Level 2 action spell (60ft). Humanoids in a 20ft-radius Sphere
          make a CHA save or gain immunity to Charmed/Frightened, or become Indifferent.
          Concentration, up to 1 minute (10 rounds).
        keywords:
          - spell
          - level2
          - calm emotions
          - action
          - enchantment
          - concentration
          - bard
          - cleric
      en-x-tlh:
        name: tam tIq
        description: DIch level 2 action (60ft). Sphere Humanoid CHA DIch. buQ, 1
          rep (10 rounds).
        keywords:
          - spell
          - level2
          - tam tIq
          - action
          - buQ
    detail:
      key: spell/calm-emotions
      source: srd52
      translations:
        en:
          meta: Level 2 Enchantment (Bard, Cleric)
          fields:
            - labelKey: rules.field.castingTime
              value: Action
            - labelKey: rules.field.range
              value: 60 feet
            - labelKey: rules.field.components
              value: V, S
            - labelKey: rules.field.duration
              value: Concentration, up to 1 minute
          body: "Each Humanoid in a 20-foot-radius Sphere centered on a point you\
            \ choose\nwithin range must succeed on a **Charisma saving throw** or\
            \ be affected\nby one of the following effects (choose for each creature):\n\
            \n- The creature has Immunity to the Charmed and Frightened conditions\n\
            \  until the spell ends. If the creature was already Charmed or\n  Frightened,\
            \ those conditions are suppressed for the duration.\n\n- The creature\
            \ becomes Indifferent about creatures of your choice that\n  it's Hostile\
            \ toward. This indifference ends if the target takes damage\n  or witnesses\
            \ its allies taking damage. When the spell ends, the\n  creature's attitude\
            \ returns to normal.\n"
