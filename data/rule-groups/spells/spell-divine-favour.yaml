ruleGroups:
  - id: spell-divine-favour
    requires:
      - spellcasting
    translations:
      en:
        name: Divine Favour
        description: Bonus action. For 1 minute, your weapon attacks deal an extra
          1d4 radiant damage.
        keywords:
          - paladin
          - divine
          - favour
          - radiant
          - damage
          - bonus action
          - spell
      en-x-tlh:
        name: quv
        description: DIch bonus action. DIch DIvI' DIvI' DIvI' 1d4 radiant DIvI'.
        keywords:
          - paladin
          - quv
          - radiant
          - DIvI'
    detail:
      key: spell/divine-favour
      source: srd52
      translations:
        en:
          meta: Level 1 Transmutation (Paladin)
          fields:
            - labelKey: rules.field.castingTime
              value: Bonus Action
            - labelKey: rules.field.range
              value: Self
            - labelKey: rules.field.components
              value: V, S
            - labelKey: rules.field.duration
              value: 1 minute
          body: 'Until the spell ends, your attacks with weapons deal an extra 1d4

            Radiant damage on a hit.

            '
