                          remaining: companion.steed.actions.remaining
                        - type: usedMax
                          label: play.stats.steed.bonusActions
                          total: companion.steed.bonusActions.max
                          remaining: companion.steed.bonusActions.remaining
                    activities:
                      - type: numberSet
                        target:
                          fact: companion.steed.summoned
                        source:
                          number: 1
                      - type: numberSet
                        target:
                          fact: companion.steed.ac.value
                        source:
                          number: 13
                      - type: numberSet
                        target:
                          fact: companion.steed.hp.base.max
                        source:
                          number: 35
                      - type: numberSet
                        target:
                          fact: companion.steed.hp.max
                        source:
                          number: 35
                      - type: numberSet
                        target:
                          fact: companion.steed.hp.current
                        source:
                          number: 35
                      - type: numberSet
                        target:
                          fact: companion.steed.speed
                        source:
                          number: 60
                      - type: numberCopy
                        source:
                          fact: companion.steed.speed
                        target:
                          fact: companion.steed.movement.total
                      - type: numberCopy
                        source:
                          fact: companion.steed.speed
                        target:
                          fact: companion.steed.movement.remaining
                      - type: numberSet
                        target:
                          fact: companion.steed.str
                        source:
                          number: 18
                      - type: numberSet
                        target:
                          fact: companion.steed.dex
                        source:
                          number: 12
                      - type: numberSet
                        target:
                          fact: companion.steed.con
                        source:
                          number: 14
                      - type: numberSet
                        target:
                          fact: companion.steed.int
                        source:
                          number: 6
                      - type: numberSet
                        target:
                          fact: companion.steed.wis
                        source:
                          number: 12
                      - type: numberSet
                        target:
                          fact: companion.steed.cha
                        source:
                          number: 8
                      - type: numberFunction
                        function: statToModifier
                        sources:
                          - fact: companion.steed.str
                        target:
                          fact: companion.steed.str.modifier
                      - type: numberFunction
                        function: statToModifier
                        sources:
                          - fact: companion.steed.dex
                        target:
                          fact: companion.steed.dex.modifier
                      - type: numberFunction
                        function: statToModifier
                        sources:
                          - fact: companion.steed.con
                        target:
                          fact: companion.steed.con.modifier
                      - type: numberFunction
                        function: statToModifier
                        sources:
                          - fact: companion.steed.int
                        target:
                          fact: companion.steed.int.modifier
                      - type: numberFunction
                        function: statToModifier
                        sources:
                          - fact: companion.steed.wis
                        target:
                          fact: companion.steed.wis.modifier
                      - type: numberFunction
                        function: statToModifier
                        sources:
                          - fact: companion.steed.cha
                        target:
                          fact: companion.steed.cha.modifier
                      - type: numberIncrement
                        target:
                          fact: companion.steed.str.save
                        source:
                          fact: companion.steed.str.modifier
                      - type: numberIncrement
                        target:
                          fact: companion.steed.dex.save
