                          total: companion.steed.movement.total
                          remaining: companion.steed.movement.remaining
                        - type: ability
                          label: play.topBar.abilities
                          abilities:
                            - name: play.stats.str
                              fact: companion.steed.str.modifier
                              saveFact: companion.steed.str.save
                            - name: play.stats.dex
                              fact: companion.steed.dex.modifier
                              saveFact: companion.steed.dex.save
                            - name: play.stats.con
