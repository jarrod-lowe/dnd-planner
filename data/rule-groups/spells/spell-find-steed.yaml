                              var: distance
                              max: { fact: companion.steed.movement.total }
                              step: 5
                              unit: ft
                            intents: { MOVE: travel }
                            actionCost: [move]
                          vars:
                            distance:
                              capture: true
                              default:
                                fact: companion.steed.movement.remaining
                          activities:
