# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: spell-find-steed
    requires:
      - spellcasting
    translations:
      en:
        name: Find Steed
        description: >-
          Level 2 conjuration spell. Summons an otherworldly steed that serves
          as your loyal mount. The steed has stats that scale with the slot
          level used.
        keywords: [spell, level2, find steed, steed, action, conjuration, paladin, mount]
      en-x-tlh:
        name: Sargh Sam
        description: >-
          DIch level 2 conjuration. Sargh DIch Sam DIch DIch DIch.
        keywords: [spell, level2, sargh sam, steed, action, mount]
    detail:
      key: spell/find-steed
      source: srd52
      translations:
        en:
          meta: 'Level 2 Conjuration (Paladin)'
          fields:
            - { labelKey: rules.field.castingTime, value: 'Action' }
            - { labelKey: rules.field.range, value: '30 feet' }
            - { labelKey: rules.field.components, value: 'V, S' }
            - { labelKey: rules.field.duration, value: 'Instantaneous' }
          body: |
            You summon an otherworldly being that appears as a loyal steed in an
            unoccupied space of your choice within range. This creature uses the
            **Otherworldly Steed** stat block. If you already have a steed from
            this spell, the steed is replaced by the new one.

            The steed resembles a Large, rideable animal of your choice, such as
            a horse, a camel, a dire wolf, or an elk. Whenever you cast the
            spell, choose the steed's creature type—Celestial, Fey, or Fiend—
            which determines certain traits in the stat block.

            **Combat.** The steed is an ally to you and your allies. In combat,
            it shares your Initiative count, and it functions as a controlled
            mount while you ride it (as defined in the rules on mounted combat).
            If you have the Incapacitated condition, the steed takes its turn
            immediately after yours and acts independently, focusing on
            protecting you.

            **Disappearance of the Steed.** The steed disappears if it drops to
            0 Hit Points or if you die. When it disappears, it leaves behind
            anything it was wearing or carrying. If you cast this spell again,
            you decide whether you summon the steed that disappeared or a
            different one.

            *Using a Higher-Level Spell Slot.* Use the spell slot's level for
            the spell's level in the stat block.

            **Otherworldly Steed**

            *Large Celestial, Fey, or Fiend (Your Choice), Neutral*

            **AC** 10 + 1 per spell level; **HP** 5 + 10 per spell level (Hit
            Dice [d10s] equal to the spell's level); **Speed** 60 ft., Fly 60
            ft. (requires level 4+ spell)

            **STR** 18 (+4) **DEX** 12 (+1) **CON** 14 (+2) **INT** 6 (−2)
            **WIS** 12 (+1) **CHA** 8 (−1)

            **Senses** Passive Perception 11; **Languages** Telepathy 1 mile
            (works only with you); **CR** None (XP 0); PB equals your
            Proficiency Bonus

            *Life Bond.* When you regain Hit Points from a level 1+ spell, the
            steed regains the same number of Hit Points if you're within 5 feet
            of it.

            **Actions**

            *Otherworldly Slam.* Melee Attack Roll: Bonus equals your spell
            attack modifier, reach 5 ft. *Hit:* 1d8 plus the spell's level of
            Radiant (Celestial), Psychic (Fey), or Necrotic (Fiend) damage.

            **Bonus Actions**

            *Fell Glare (Fiend Only; Recharges after a Long Rest).* *Wisdom
            Saving Throw:* DC equals your spell save DC, one creature within 60
            feet the steed can see. *Failure:* The target has the Frightened
            condition until the end of your next turn.

            *Fey Step (Fey Only; Recharges after a Long Rest).* The steed
            teleports, along with its rider, to an unoccupied space of your
            choice up to 60 feet away from itself.

            *Healing Touch (Celestial Only; Recharges after a Long Rest).* One
            creature within 5 feet of the steed regains a number of Hit Points
            equal to 2d8 plus the spell's level.
    rules:
      # Offer to prepare Find Steed (Build → Prepare → L2)
      - id: prepare-find-steed-offer
        activities:
          - type: offerRule
            legalWhen:
              - condition:
                  fact: spell.l2.findSteed.prepared
                  operator: notEquals
                  value: 1
                illegalDiagnostics:
                  - code: rule.spell-find-steed.prepare-find-steed-offer.already_prepared
                    severity: error
              - condition:
                  fact: spellcasting.prepared.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-find-steed.prepare-find-steed-offer.max_prepared
                    severity: error
            rule:
              id: prepare-find-steed
              phase: normal
              group:
                - __planned__
              ui:
                section: configuration
                name: rule.spell-find-steed.prepare-find-steed-offer.name
                intents: { PREPARE: L2 }
                actionCost: []
              activities:
                - type: numberSet
                  target:
                    fact: spell.l2.findSteed.prepared
                  source:
                    number: 1
                - type: numberIncrement
                  target:
                    fact: spellcasting.prepared.count
                  source:
                    number: 1
                - type: advertiseEffect
                  rule:
                    id: effect-find-steed-prepared
                    ui:
                      name: rule.spell-find-steed.effect-find-steed-prepared.name
                      hidden: true
                    phase: early
                    after:
                      - group: spell-l2-find-steed-removal-set
                      - group: always-prepared-set
                    activities:
                      - type: numberSet
                        target:
                          fact: spell.l2.findSteed.prepared
                        source:
                          number: 1
                        when:
                          - fact: spell.l2.findSteed.removing
                            operator: equals
                            value: 0
                      # Stop counting against the prepared limit once a feature
                      # grants this spell always-prepared (alwaysPrepared == 1),
                      # otherwise a manual L2 preparation would permanently waste
                      # a prepared slot after the grant activates.
                      - type: numberIncrement
                        target:
                          fact: spellcasting.prepared.count
                        source:
                          number: 1
                        when:
                          - fact: spell.l2.findSteed.removing
                            operator: equals
                            value: 0
                          - fact: spell.l2.findSteed.alwaysPrepared
                            operator: notEquals
                            value: 1
                      # Retire the effect once always-prepared takes over (the
                      # grant then sustains the prepared fact each evaluation).
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: spell.l2.findSteed.removing
                            operator: equals
                            value: 0
                          - fact: spell.l2.findSteed.alwaysPrepared
                            operator: notEquals
                            value: 1

      # Offer to unprepare Find Steed
      # (illegal when granted always-prepared by a feature, e.g. Paladin L5)
      - id: unprepare-find-steed-offer
        activities:
          - type: offerRule
            legalWhen:
              - condition:
                  fact: spell.l2.findSteed.prepared
                  operator: equals
                  value: 1
                illegalDiagnostics:
                  - code: rule.spell-find-steed.unprepare-find-steed-offer.not_prepared
                    severity: error
              - condition:
                  fact: spell.l2.findSteed.alwaysPrepared
                  operator: notEquals
                  value: 1
                illegalDiagnostics:
                  - code: rule.spell-find-steed.unprepare-find-steed-offer.always_prepared
                    severity: error
            rule:
              id: unprepare-find-steed
              ui:
                section: configuration
                name: rule.spell-find-steed.unprepare-find-steed-offer.name
                intents: { PREPARE: L2 }
                actionCost: []
              activities:
                - type: numberSet
                  target:
                    fact: spell.l2.findSteed.prepared
                  source:
                    number: 0
                - type: numberSet
                  target:
                    fact: spell.l2.findSteed.removing
                  source:
                    number: 1
                - type: numberIncrement
                  target:
                    fact: spellcasting.prepared.count
                  source:
                    number: 1
                  subtract: true
                - type: advertiseEffect
                  rule:
                    id: effect-find-steed-removing
                    ui:
                      name: rule.spell-find-steed.effect-find-steed-removing.name
                      hidden: true
                    phase: early
                    group:
                      - spell-l2-find-steed-removal-set
                    activities:
                      - type: numberSet
                        target:
                          fact: spell.l2.findSteed.removing
                        source:
                          number: 1

      # Compute eligible Find Steed slot count (levels 2-5)
      - id: compute-find-steed-eligible-slots
        phase: normal
        group:
          - find-steed-slots-computed
        activities:
          - type: numberSum
            target:
              fact: find-steed.eligibleSlotsRemaining
            sources:
              - fact: spellcasting.slots.level2.remaining
              - fact: spellcasting.slots.level3.remaining
              - fact: spellcasting.slots.level4.remaining
              - fact: spellcasting.slots.level5.remaining

      # Compute lowest available slot level (L2-L5)
      - id: compute-find-steed-lowest-slot
        phase: normal
        group:
          - find-steed-slots-computed
        activities:
          - type: numberSet
            target:
              fact: find-steed.lowestAvailableSlotLevel
            source:
              number: 2
          - type: numberSet
            target:
              fact: find-steed.lowestAvailableSlotLevel
            source:
              number: 5
            when:
              - fact: spellcasting.slots.level5.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: find-steed.lowestAvailableSlotLevel
            source:
              number: 4
            when:
              - fact: spellcasting.slots.level4.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: find-steed.lowestAvailableSlotLevel
            source:
              number: 3
            when:
              - fact: spellcasting.slots.level3.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: find-steed.lowestAvailableSlotLevel
            source:
              number: 2
            when:
              - fact: spellcasting.slots.level2.remaining
                operator: greaterThan
                value: 0

      # Compute highest available slot level (L2-L5, based on total > 0)
      - id: compute-find-steed-highest-slot
        phase: normal
        group:
          - find-steed-slots-computed
        activities:
          - type: numberSet
            target:
              fact: find-steed.highestSlotLevel
            source:
              number: 2
          - type: numberSet
            target:
              fact: find-steed.highestSlotLevel
            source:
              number: 3
            when:
              - fact: spellcasting.slots.level3.total
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: find-steed.highestSlotLevel
            source:
              number: 4
            when:
              - fact: spellcasting.slots.level4.total
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: find-steed.highestSlotLevel
            source:
              number: 5
            when:
              - fact: spellcasting.slots.level5.total
                operator: greaterThan
                value: 0

      # Combine the free once-per-long-rest use with spell slots.
      - id: compute-find-steed-resources
        phase: normal
        after:
          - group: find-steed-slots-computed
          - group: spellcasting-computed
        group:
          - find-steed-resources-computed
        activities:
          # Total castable resources = eligible slots + free uses
          - type: numberSum
            target:
              fact: find-steed.anyResourceRemaining
            sources:
              - fact: find-steed.eligibleSlotsRemaining
              - fact: paladinFindSteed.remaining
          # Default slider position: lowest slot, unless a free use is available
          - type: numberCopy
            source:
              fact: find-steed.lowestAvailableSlotLevel
            target:
              fact: find-steed.defaultLevel
          - type: numberSet
            target:
              fact: find-steed.defaultLevel
            source:
              number: 0
            when:
              - fact: paladinFindSteed.remaining
                operator: greaterThan
                value: 0

      # Offer Find Steed (action spell)
      - id: offer-find-steed
        when:
          - fact: spell.l2.findSteed.prepared
            operator: equals
            value: 1
        after:
          - group: __planned__
          - group: spellcasting
          - group: find-steed-slots-computed
          - group: find-steed-resources-computed
        activities:
          - type: offerRule
            legalWhen:
              - condition:
                  fact: actions.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-find-steed.offer-find-steed.no_action
                    severity: error
              - condition: &fs-has-resource
                  fact: find-steed.anyResourceRemaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-find-steed.offer-find-steed.no_slots
                    severity: error
              - condition:
                  fact: spellcasting.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-find-steed.offer-find-steed.no_spellcasting
                    severity: error
              - condition:
                  fact: companion.steed.summoned
                  operator: equals
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-find-steed.offer-find-steed.already_mounted
                    severity: error
            rule:
              id: cast-find-steed
              group:
                - __planned__
                - spellcasting
              ui:
                section: action-spell
                name: rule.spell-find-steed.offer-find-steed.name
                description: rule.spell-find-steed.offer-find-steed.description
                actionCost: [action]
                detailKey: spell/find-steed
                intents:
                  AID: summon
                primaryControl:
                  type: slider
                  var: slotLevel
                  notches:
                    - value: 0
                      enabled: { fact: paladinFindSteed.total }
                    - value: 2
                      enabled: { fact: spellcasting.slots.level2.total }
                    - value: 3
                      enabled: { fact: spellcasting.slots.level3.total }
                    - value: 4
                      enabled: { fact: spellcasting.slots.level4.total }
                    - value: 5
                      enabled: { fact: spellcasting.slots.level5.total }
                  valueFormat: spellLevel
              vars:
                slotLevel:
                  capture: true
                  default:
                    fact: find-steed.defaultLevel
              activities:
                # Consume action
                - type: numberIncrement
                  target:
                    fact: actions.remaining
                  source:
                    number: 1
                  subtract: true
                # Consume spellcasting resource
                - type: numberIncrement
                  target:
                    fact: spellcasting.remaining
                  source:
                    number: 1
                  subtract: true
                # Error tracking
                - *error-clear
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-find-steed.offer-find-steed.no_action
                  when:
                    - fact: actions.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-find-steed.offer-find-steed.no_spellcasting
                  when:
                    - fact: spellcasting.remaining
                      operator: lessThan
                      value: 0
                # Bridge var to fact for conditional slot consumption
                - type: numberSet
                  target:
                    fact: find-steed.selectedLevel
                  source:
                    var: slotLevel
                # Free use (level 0): consume the once-per-long-rest use, no slot.
                # Decrement (rather than set 0) so an over-use goes negative and
                # is caught by the no_free_use error below.
                - type: numberIncrement
                  target:
                    fact: paladinFindSteed.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 0
                # Persist the spent free use across turns (until a long rest)
                - type: advertiseEffect
                  rule:
                    id: effect-find-steed-free
                    ui:
                      name: rule.spell-find-steed.effect-find-steed-free.name
                      hidden: true
                    phase: early
                    after:
                      - group: paladin-find-steed-set
                    group:
                      - paladin-find-steed-effect
                    when:
                      - fact: rest.long
                        operator: equals
                        value: 0
                    activities:
                      - type: numberSet
                        target:
                          fact: paladinFindSteed.remaining
                        source:
                          number: 0
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 0
                # Consume L2 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level2.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 2
                # Consume L3 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level3.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 3
                # Consume L4 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level4.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 4
                # Consume L5 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level5.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 5
                # Track slot consumption errors
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-find-steed.offer-find-steed.no_free_use
                  when:
                    - fact: paladinFindSteed.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-find-steed.offer-find-steed.no_slots
                  when:
                    - fact: spellcasting.slots.level2.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-find-steed.offer-find-steed.no_slots
                  when:
                    - fact: spellcasting.slots.level3.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-find-steed.offer-find-steed.no_slots
                  when:
                    - fact: spellcasting.slots.level4.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-find-steed.offer-find-steed.no_slots
                  when:
                    - fact: spellcasting.slots.level5.remaining
                      operator: lessThan
                      value: 0

                # === Free-use → level-2 mapping ===
                # After slot consumption (which correctly skipped level 0),
                # mark the free use and map selectedLevel to 2 so all downstream
                # steed effects (offers, resources, persistence) fire as L2.
                - type: numberSet
                  target:
                    fact: find-steed.wasFreeUse
                  source:
                    number: 1
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 0
                - type: numberSet
                  target:
                    fact: find-steed.selectedLevel
                  source:
                    number: 2
                  when:
                    - fact: find-steed.wasFreeUse
                      operator: equals
                      value: 1

                # === Steed facts for same-turn use ===
                - type: numberSet
                  target:
                    fact: companion.steed.summoned
                  source:
                    number: 1
                - type: numberSet
                  target:
                    fact: companion.steed.actions.remaining
                  source:
                    number: 1
                - type: numberSet
                  target:
                    fact: companion.steed.bonusActions.remaining
                  source:
                    number: 1
                # Initialize speed/movement same-turn so a same-turn Dash grants
                # movement. The persisted effect-steed-resources only applies from
                # the next turn; ground speed is 60 at every slot level (L2-L5).
                - type: numberSet
                  target:
                    fact: companion.steed.speed
                  source:
                    number: 60
                - type: numberSet
                  target:
                    fact: companion.steed.movement.total
                  source:
                    number: 60
                - type: numberSet
                  target:
                    fact: companion.steed.movement.remaining
                  source:
                    number: 60

                # === Same-turn steed action offers (L2) ===
                - type: offerRule
                  legalWhen:
                    - condition:
                        fact: companion.steed.actions.remaining
                        operator: greaterThan
                        value: 0
                      illegalDiagnostics:
                        - code: rule.spell-find-steed.steed-dash.no_actions
                          severity: error
                  rule:
                    id: steed-dash
                    group:
                      - __planned__
                      - action
                    after:
                      - group: spellcasting
                    ui:
                      section: action
                      subject: steed
                      name: rule.spell-find-steed.steed-dash.name
                      intents: { MOVE: dash }
                      actionCost: [action]
                    vars: {}
                    activities:
                      - type: numberIncrement
                        target:
                          fact: companion.steed.actions.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: numberIncrement
                        target:
                          fact: companion.steed.movement.remaining
                        source:
                          fact: companion.steed.speed
                      - type: numberIncrement
                        target:
                          fact: companion.steed.movement.total
                        source:
                          fact: companion.steed.speed
                      - *error-clear
                      - type: setAdd
                        target:
                          var: errors
                        source:
                          string: rule.spell-find-steed.steed-dash.no_actions
                        when:
                          - fact: companion.steed.actions.remaining
                            operator: lessThan
                            value: 0
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 2
                - type: offerRule
                  legalWhen:
                    - condition:
                        fact: companion.steed.actions.remaining
                        operator: greaterThan
                        value: 0
                      illegalDiagnostics:
                        - code: rule.spell-find-steed.steed-dodge.no_actions
                          severity: error
                  rule:
                    id: steed-dodge
                    group:
                      - __planned__
                      - action
                    after:
                      - group: spellcasting
                    ui:
                      section: action-other
                      subject: steed
                      name: rule.spell-find-steed.steed-dodge.name
                      intents: { DEFEND: evade }
                      actionCost: [action]
                    vars: {}
                    activities:
                      - type: numberIncrement
                        target:
                          fact: companion.steed.actions.remaining
                        source:
                          number: 1
                        subtract: true
                      - *error-clear
                      - type: setAdd
                        target:
                          var: errors
                        source:
                          string: rule.spell-find-steed.steed-dodge.no_actions
                        when:
                          - fact: companion.steed.actions.remaining
                            operator: lessThan
                            value: 0
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 2
                - type: offerRule
                  legalWhen:
                    - condition:
                        fact: companion.steed.actions.remaining
                        operator: greaterThan
                        value: 0
                      illegalDiagnostics:
                        - code: rule.spell-find-steed.steed-disengage.no_actions
                          severity: error
                  rule:
                    id: steed-disengage
                    group:
                      - __planned__
                      - action
                    after:
                      - group: spellcasting
                    ui:
                      section: action-other
                      subject: steed
                      name: rule.spell-find-steed.steed-disengage.name
                      packBehind: steed-dodge
                      intents: { DEFEND: evade }
                      actionCost: [action]
                    vars: {}
                    activities:
                      - type: numberIncrement
                        target:
                          fact: companion.steed.actions.remaining
                        source:
                          number: 1
                        subtract: true
                      - *error-clear
                      - type: setAdd
                        target:
                          var: errors
                        source:
                          string: rule.spell-find-steed.steed-disengage.no_actions
                        when:
                          - fact: companion.steed.actions.remaining
                            operator: lessThan
                            value: 0
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 2

                # === Same-turn steed action offers (L3) ===
                - type: offerRule
                  legalWhen:
                    - condition:
                        fact: companion.steed.actions.remaining
                        operator: greaterThan
                        value: 0
                      illegalDiagnostics:
                        - code: rule.spell-find-steed.steed-dash.no_actions
                          severity: error
                  rule:
                    id: steed-dash
                    group:
                      - __planned__
                      - action
                    after:
                      - group: spellcasting
                    ui:
                      section: action
                      subject: steed
                      name: rule.spell-find-steed.steed-dash.name
                      intents: { MOVE: dash }
                      actionCost: [action]
                    vars: {}
                    activities:
                      - type: numberIncrement
                        target:
                          fact: companion.steed.actions.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: numberIncrement
                        target:
                          fact: companion.steed.movement.remaining
                        source:
                          fact: companion.steed.speed
                      - type: numberIncrement
                        target:
                          fact: companion.steed.movement.total
                        source:
