                      - type: numberSet
                        target:
                          fact: companion.steed.hp.max
                        source:
                          number: 55
                      - type: numberSet
                        target:
                          fact: companion.steed.hp.current
                        source:
                          number: 55
                      - type: numberSet
                        target:
                          fact: companion.steed.speed
                        source:
                          number: 60
                      - type: numberSet
                        target:
                          fact: companion.steed.fly.can
                        source:
                          number: 1
                      - type: numberSet
                        target:
                          fact: companion.steed.speed.fly
                        source:
                          number: 60
                      - type: numberSet
                        target:
                          fact: companion.steed.str
                        source:
                          number: 18
                      - type: numberSet
                        target:
                          fact: companion.steed.dex
                        source:
                          number: 12
                      - type: numberSet
                        target:
                          fact: companion.steed.con
                        source:
                          number: 14
                      - type: numberSet
                        target:
                          fact: companion.steed.int
                        source:
                          number: 6
                      - type: numberSet
                        target:
                          fact: companion.steed.wis
                        source:
                          number: 12
                      - type: numberSet
                        target:
                          fact: companion.steed.cha
                        source:
                          number: 8
                      - type: numberSet
                        target:
                          fact: companion.steed.actions.max
                        source:
                          number: 1
                      - type: numberSet
                        target:
                          fact: companion.steed.actions.remaining
                        source:
                          number: 1
                      - type: numberSet
                        target:
                          fact: companion.steed.bonusActions.max
                        source:
                          number: 1
                      - type: numberSet
                        target:
                          fact: companion.steed.bonusActions.remaining
                        source:
                          number: 1
                      # No self-advertise — re-created each turn by effect-steed
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 5

                # L5 Steed Offers (normal phase: offers + self-advertise + re-advertise resources)
                - type: advertiseEffect
                  rule:
                    id: effect-steed
                    phase: normal
                    after:
                      - group: __planned__
                    ui:
                      name: rule.spell-find-steed.effect-steed.name
                      detailKey: spell/find-steed
                    activities:
                      - type: offerRule
                        legalWhen:
                          - condition:
                              fact: companion.steed.actions.remaining
                              operator: greaterThan
                              value: 0
                            illegalDiagnostics:
                              - code: rule.spell-find-steed.offer-steed-dummy-action.no_actions
                                severity: error
                        rule:
                          id: offer-steed-dummy-action
                          group:
                            - __planned__
                            - action
                          ui:
                            section: action
                            subject: steed
                            name: rule.spell-find-steed.offer-steed-dummy-action.name
                            actionCost: [action]
                            intents:
                              ATTACK: brawl
                          activities:
                            - *error-clear
                            - type: numberIncrement
                              target:
                                fact: companion.steed.actions.remaining
                              source:
                                number: 1
                              subtract: true
                            - type: setAdd
                              target:
                                var: errors
                              source:
                                string: rule.spell-find-steed.offer-steed-dummy-action.no_actions
                              when:
                                - fact: companion.steed.actions.remaining
                                  operator: lessThan
                                  value: 0
                      - type: offerRule
                        legalWhen:
                          - condition:
                              fact: companion.steed.bonusActions.remaining
                              operator: greaterThan
                              value: 0
                            illegalDiagnostics:
                              - code: rule.spell-find-steed.offer-steed-dummy-bonus.no_bonus_actions
                                severity: error
                        rule:
                          id: offer-steed-dummy-bonus
                          group:
                            - __planned__
                            - bonus-action
                          ui:
                            section: bonus-action
                            subject: steed
                            name: rule.spell-find-steed.offer-steed-dummy-bonus.name
                            actionCost: [bonus]
                            intents:
                              AID: evade
                          activities:
                            - *error-clear
                            - type: numberIncrement
                              target:
                                fact: companion.steed.bonusActions.remaining
                              source:
                                number: 1
                              subtract: true
                            - type: setAdd
                              target:
                                var: errors
                              source:
                                string: rule.spell-find-steed.offer-steed-dummy-bonus.no_bonus_actions
                              when:
                                - fact: companion.steed.bonusActions.remaining
                                  operator: lessThan
                                  value: 0
                      - type: offerRule
                        legalWhen:
                          - condition:
                              fact: actions.remaining
                              operator: greaterThan
                              value: 0
                        rule:
                          id: offer-dismiss-steed
                          group:
                            - __planned__
                            - action
                          ui:
                            section: action
                            subject: steed
                            name: rule.spell-find-steed.offer-dismiss-steed.name
                            actionCost: [action]
                            intents:
                              HANDLE: dismiss
                          activities:
                            - type: numberIncrement
                              target:
                                fact: actions.remaining
                              source:
                                number: 1
                              subtract: true
                            - type: numberSet
                              target:
                                fact: companion.steed.dismissed
                              source:
                                number: 1
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: companion.steed.dismissed
                            operator: equals
                            value: 0
                      - type: advertiseEffect
                        rule: *steed-resources-l5
                        when:
                          - fact: companion.steed.dismissed
                            operator: equals
                            value: 0
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 5
