                # L3 Steed Offers (normal phase: offers + self-advertise + re-advertise resources)
                - type: advertiseEffect
                  rule:
                    id: effect-steed
                    cascadeRemove:
                      - effect-steed-resources
                      - effect-steed-hp-damage
                      - effect-steed-hp-heal
                      - effect-steed-hp-modifier-max
                      - effect-steed-hp-modifier-current
                    phase: normal
                    ui:
                      name: rule.spell-find-steed.effect-steed.name
                      detailKey: spell/find-steed
                    activities:
                      # === Movement computation ===
                      - type: numberFunction
                        function: multiply
                        sources:
                          - fact: companion.steed.movement.total
                          - number: 0.5
                        target:
                          fact: companion.steed.movement.half_total
                      - type: numberFunction
                        function: multiply
                        sources:
                          - fact: companion.steed.movement.remaining
                          - number: 0.5
                        target:
                          fact: companion.steed.movement.half_remaining
                      # === Movement Offers ===
                      # Walk
                      - type: offerRule
                        legalWhen:
                          - condition:
                              fact: companion.steed.movement.remaining
                              operator: greaterThanOrEqual
                              value: 5
                            illegalDiagnostics:
                              - code: rule.spell-find-steed.steed-move-walk.out_of_movement
                                severity: error
                        rule:
                          id: steed-move-walk
                          group:
                            - __planned__
                            - move
                          ui:
                            section: move
                            subject: steed
                            name: rule.spell-find-steed.steed-move-walk.name
                            primaryControl:
                              type: slider
                              var: distance
                              max: { fact: companion.steed.movement.total }
                              step: 5
                              unit: ft
                            intents: { MOVE: travel }
                            actionCost: [move]
                          vars:
                            distance:
                              capture: true
                              default:
                                fact: companion.steed.movement.remaining
                          activities:
                            - type: numberIncrement
                              target:
                                fact: companion.steed.movement.remaining
                              source:
                                var: distance
                              subtract: true
                            - *error-clear
                            - type: setAdd
                              target:
                                var: errors
                              source:
                                string: rule.spell-find-steed.steed-move-walk.out_of_movement
                              when:
                                - fact: companion.steed.movement.remaining
                                  operator: lessThan
                                  value: 0
                      # Rough Terrain
                      - type: offerRule
                        legalWhen:
                          - condition:
                              fact: companion.steed.movement.remaining
                              operator: greaterThanOrEqual
                              value: 10
                            illegalDiagnostics:
                              - code: rule.spell-find-steed.steed-move-rough-terrain.out_of_movement
                                severity: error
                        rule:
                          id: steed-move-rough-terrain
                          group:
                            - __planned__
                            - move
                          ui:
                            section: move
                            subject: steed
                            name: rule.spell-find-steed.steed-move-rough-terrain.name
                            packBehind: steed-move-walk
                            primaryControl:
                              type: slider
                              var: distance
                              max: { fact: companion.steed.movement.half_total }
                              step: 5
                              unit: ft
                            intents: { MOVE: travel }
                            actionCost: [move]
                          vars:
                            distance:
                              capture: true
                              default:
                                fact: companion.steed.movement.half_remaining
                          activities:
                            - type: numberIncrement
                              target:
                                fact: companion.steed.movement.remaining
                              source:
                                var: distance
                              subtract: true
                            - type: numberIncrement
                              target:
                                fact: companion.steed.movement.remaining
                              source:
                                var: distance
                              subtract: true
                            - *error-clear
                            - type: setAdd
                              target:
                                var: errors
                              source:
                                string: rule.spell-find-steed.steed-move-rough-terrain.out_of_movement
                              when:
                                - fact: companion.steed.movement.remaining
                                  operator: lessThan
                                  value: 0
                      # Fly
                      - type: offerRule
                        legalWhen:
                          - condition:
                              fact: companion.steed.fly.can
                              operator: greaterThanOrEqual
                              value: 1
