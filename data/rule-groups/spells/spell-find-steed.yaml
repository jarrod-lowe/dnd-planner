# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: spell-find-steed
    requires:
      - spellcasting
    translations:
      en:
        name: Find Steed
        description: >-
          Level 2 conjuration spell. Summons an otherworldly steed that serves
          as your loyal mount. The steed has stats that scale with the slot
          level used.
        keywords: [spell, level2, find steed, steed, action, conjuration, paladin, mount]
      en-x-tlh:
        name: Sargh Sam
        description: >-
          DIch level 2 conjuration. Sargh DIch Sam DIch DIch DIch.
        keywords: [spell, level2, sargh sam, steed, action, mount]
    detail:
      key: spell/find-steed
      source: srd52
      translations:
        en:
          meta: 'Level 2 Conjuration (Paladin)'
          fields:
            - { labelKey: rules.field.castingTime, value: 'Action' }
            - { labelKey: rules.field.range, value: '30 feet' }
            - { labelKey: rules.field.components, value: 'V, S' }
            - { labelKey: rules.field.duration, value: 'Instantaneous' }
          body: |
            You summon an otherworldly being that appears as a loyal steed in an
            unoccupied space of your choice within range. This creature uses the
            **Otherworldly Steed** stat block. If you already have a steed from
            this spell, the steed is replaced by the new one.

            The steed resembles a Large, rideable animal of your choice, such as
            a horse, a camel, a dire wolf, or an elk. Whenever you cast the
            spell, choose the steed's creature type—Celestial, Fey, or Fiend—
            which determines certain traits in the stat block.

            **Combat.** The steed is an ally to you and your allies. In combat,
            it shares your Initiative count, and it functions as a controlled
            mount while you ride it (as defined in the rules on mounted combat).
            If you have the Incapacitated condition, the steed takes its turn
            immediately after yours and acts independently, focusing on
            protecting you.

            **Disappearance of the Steed.** The steed disappears if it drops to
            0 Hit Points or if you die. When it disappears, it leaves behind
            anything it was wearing or carrying. If you cast this spell again,
            you decide whether you summon the steed that disappeared or a
            different one.

            *Using a Higher-Level Spell Slot.* Use the spell slot's level for
            the spell's level in the stat block.

            **Otherworldly Steed**

            *Large Celestial, Fey, or Fiend (Your Choice), Neutral*

            **AC** 10 + 1 per spell level; **HP** 5 + 10 per spell level (Hit
            Dice [d10s] equal to the spell's level); **Speed** 60 ft., Fly 60
            ft. (requires level 4+ spell)

            **STR** 18 (+4) **DEX** 12 (+1) **CON** 14 (+2) **INT** 6 (−2)
            **WIS** 12 (+1) **CHA** 8 (−1)

            **Senses** Passive Perception 11; **Languages** Telepathy 1 mile
            (works only with you); **CR** None (XP 0); PB equals your
            Proficiency Bonus

            *Life Bond.* When you regain Hit Points from a level 1+ spell, the
            steed regains the same number of Hit Points if you're within 5 feet
            of it.

            **Actions**

            *Otherworldly Slam.* Melee Attack Roll: Bonus equals your spell
            attack modifier, reach 5 ft. *Hit:* 1d8 plus the spell's level of
            Radiant (Celestial), Psychic (Fey), or Necrotic (Fiend) damage.

            **Bonus Actions**

            *Fell Glare (Fiend Only; Recharges after a Long Rest).* *Wisdom
            Saving Throw:* DC equals your spell save DC, one creature within 60
            feet the steed can see. *Failure:* The target has the Frightened
            condition until the end of your next turn.

            *Fey Step (Fey Only; Recharges after a Long Rest).* The steed
            teleports, along with its rider, to an unoccupied space of your
            choice up to 60 feet away from itself.

            *Healing Touch (Celestial Only; Recharges after a Long Rest).* One
            creature within 5 feet of the steed regains a number of Hit Points
            equal to 2d8 plus the spell's level.
    rules:
      # Compute eligible Find Steed slot count (levels 2-5)
      - id: compute-find-steed-eligible-slots
        phase: normal
        group:
          - find-steed-slots-computed
        activities:
          - type: numberSum
            target:
              fact: find-steed.eligibleSlotsRemaining
            sources:
              - fact: spellcasting.slots.level2.remaining
              - fact: spellcasting.slots.level3.remaining
              - fact: spellcasting.slots.level4.remaining
              - fact: spellcasting.slots.level5.remaining

      # Compute lowest available slot level (L2-L5)
      - id: compute-find-steed-lowest-slot
        phase: normal
        group:
          - find-steed-slots-computed
        activities:
          - type: numberSet
            target:
              fact: find-steed.lowestAvailableSlotLevel
            source:
              number: 2
          - type: numberSet
            target:
              fact: find-steed.lowestAvailableSlotLevel
            source:
              number: 5
            when:
              - fact: spellcasting.slots.level5.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: find-steed.lowestAvailableSlotLevel
            source:
              number: 4
            when:
              - fact: spellcasting.slots.level4.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: find-steed.lowestAvailableSlotLevel
            source:
              number: 3
            when:
              - fact: spellcasting.slots.level3.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: find-steed.lowestAvailableSlotLevel
            source:
              number: 2
            when:
              - fact: spellcasting.slots.level2.remaining
                operator: greaterThan
                value: 0

      # Offer Find Steed (action spell)
      - id: offer-find-steed
        after:
          - group: __planned__
          - group: spellcasting
          - group: find-steed-slots-computed
        activities:
          - type: offerRule
            legalWhen:
              - condition:
                  fact: actions.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-find-steed.offer-find-steed.no_action
                    severity: error
              - condition:
                  fact: find-steed.eligibleSlotsRemaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-find-steed.offer-find-steed.no_slots
                    severity: error
              - condition:
                  fact: spellcasting.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-find-steed.offer-find-steed.no_spellcasting
                    severity: error
              - condition:
                  fact: companion.steed.summoned
                  operator: equals
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-find-steed.offer-find-steed.already_mounted
                    severity: error
            rule:
              id: cast-find-steed
              group:
                - __planned__
                - spellcasting
              ui:
                section: action-spell
                name: rule.spell-find-steed.offer-find-steed.name
                actionCost: [action, L2]
                detailKey: spell/find-steed
                intents:
                  AID: summon
              vars:
                slotLevel:
                  capture: true
                  default:
                    fact: find-steed.lowestAvailableSlotLevel
              activities:
                # Consume action
                - type: numberIncrement
                  target:
                    fact: actions.remaining
                  source:
                    number: 1
                  subtract: true
                # Consume spellcasting resource
                - type: numberIncrement
                  target:
                    fact: spellcasting.remaining
                  source:
                    number: 1
                  subtract: true
                # Error tracking
                - *error-clear
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-find-steed.offer-find-steed.no_action
                  when:
                    - fact: actions.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-find-steed.offer-find-steed.no_spellcasting
                  when:
                    - fact: spellcasting.remaining
                      operator: lessThan
                      value: 0
                # Bridge var to fact for conditional slot consumption
                - type: numberSet
                  target:
                    fact: find-steed.selectedLevel
                  source:
                    var: slotLevel
                # Consume L2 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level2.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 2
                # Consume L3 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level3.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 3
                # Consume L4 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level4.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 4
                # Consume L5 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level5.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 5
                # Track slot consumption errors
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-find-steed.offer-find-steed.no_slots
                  when:
                    - fact: spellcasting.slots.level2.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-find-steed.offer-find-steed.no_slots
                  when:
                    - fact: spellcasting.slots.level3.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-find-steed.offer-find-steed.no_slots
                  when:
                    - fact: spellcasting.slots.level4.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-find-steed.offer-find-steed.no_slots
                  when:
                    - fact: spellcasting.slots.level5.remaining
                      operator: lessThan
                      value: 0
                # No eligible slot was resolved (selectedLevel < 2 means no L2+ slot available)
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-find-steed.offer-find-steed.no_slots
                  when:
                    - fact: find-steed.selectedLevel
                      operator: lessThan
                      value: 2

                # === Steed facts for same-turn use ===
                - type: numberSet
                  target:
                    fact: companion.steed.summoned
                  source:
                    number: 1
                - type: numberSet
                  target:
                    fact: companion.steed.actions.remaining
                  source:
                    number: 1
                - type: numberSet
                  target:
                    fact: companion.steed.bonusActions.remaining
                  source:
                    number: 1

                # === Same-turn steed action offers (L2) ===
                - type: offerRule
                  legalWhen:
                    - condition:
                        fact: companion.steed.actions.remaining
                        operator: greaterThan
                        value: 0
                      illegalDiagnostics:
                        - code: rule.spell-find-steed.offer-steed-dummy-action.no_actions
                          severity: error
                  rule:
                    id: offer-steed-dummy-action
                    group:
                      - __planned__
                      - action
                    after:
                      - group: spellcasting
                    ui:
                      section: action
                      subject: steed
                      name: rule.spell-find-steed.offer-steed-dummy-action.name
                      actionCost: [action]
                      intents:
                        ATTACK: brawl
                    activities:
                      - *error-clear
                      - type: numberIncrement
                        target:
                          fact: companion.steed.actions.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: setAdd
                        target:
                          var: errors
                        source:
                          string: rule.spell-find-steed.offer-steed-dummy-action.no_actions
                        when:
                          - fact: companion.steed.actions.remaining
                            operator: lessThan
                            value: 0
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 2
                - type: offerRule
                  legalWhen:
                    - condition:
                        fact: companion.steed.bonusActions.remaining
                        operator: greaterThan
                        value: 0
                      illegalDiagnostics:
                        - code: rule.spell-find-steed.offer-steed-dummy-bonus.no_bonus_actions
                          severity: error
                  rule:
                    id: offer-steed-dummy-bonus
                    group:
                      - __planned__
                      - bonus-action
                    after:
                      - group: spellcasting
                    ui:
                      section: bonus-action
                      subject: steed
                      name: rule.spell-find-steed.offer-steed-dummy-bonus.name
                      actionCost: [bonus]
                      intents:
                        AID: evade
                    activities:
                      - *error-clear
                      - type: numberIncrement
                        target:
                          fact: companion.steed.bonusActions.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: setAdd
                        target:
                          var: errors
                        source:
                          string: rule.spell-find-steed.offer-steed-dummy-bonus.no_bonus_actions
                        when:
                          - fact: companion.steed.bonusActions.remaining
                            operator: lessThan
                            value: 0
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 2

                # === Same-turn steed action offers (L3) ===
                - type: offerRule
                  legalWhen:
                    - condition:
                        fact: companion.steed.actions.remaining
                        operator: greaterThan
                        value: 0
                      illegalDiagnostics:
                        - code: rule.spell-find-steed.offer-steed-dummy-action.no_actions
                          severity: error
                  rule:
                    id: offer-steed-dummy-action
                    group:
                      - __planned__
                      - action
                    after:
                      - group: spellcasting
                    ui:
                      section: action
                      subject: steed
                      name: rule.spell-find-steed.offer-steed-dummy-action.name
                      actionCost: [action]
                      intents:
                        ATTACK: brawl
                    activities:
                      - *error-clear
                      - type: numberIncrement
                        target:
                          fact: companion.steed.actions.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: setAdd
                        target:
                          var: errors
                        source:
                          string: rule.spell-find-steed.offer-steed-dummy-action.no_actions
                        when:
                          - fact: companion.steed.actions.remaining
                            operator: lessThan
                            value: 0
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 3
                - type: offerRule
                  legalWhen:
                    - condition:
                        fact: companion.steed.bonusActions.remaining
                        operator: greaterThan
                        value: 0
                      illegalDiagnostics:
                        - code: rule.spell-find-steed.offer-steed-dummy-bonus.no_bonus_actions
                          severity: error
                  rule:
                    id: offer-steed-dummy-bonus
                    group:
                      - __planned__
                      - bonus-action
                    after:
                      - group: spellcasting
                    ui:
                      section: bonus-action
                      subject: steed
                      name: rule.spell-find-steed.offer-steed-dummy-bonus.name
                      actionCost: [bonus]
                      intents:
                        AID: evade
                    activities:
                      - *error-clear
                      - type: numberIncrement
                        target:
                          fact: companion.steed.bonusActions.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: setAdd
                        target:
                          var: errors
                        source:
                          string: rule.spell-find-steed.offer-steed-dummy-bonus.no_bonus_actions
                        when:
                          - fact: companion.steed.bonusActions.remaining
                            operator: lessThan
                            value: 0
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 3

                # === Same-turn steed action offers (L4) ===
                - type: offerRule
                  legalWhen:
                    - condition:
                        fact: companion.steed.actions.remaining
                        operator: greaterThan
                        value: 0
                      illegalDiagnostics:
                        - code: rule.spell-find-steed.offer-steed-dummy-action.no_actions
                          severity: error
                  rule:
                    id: offer-steed-dummy-action
                    group:
                      - __planned__
                      - action
                    after:
                      - group: spellcasting
                    ui:
                      section: action
                      subject: steed
                      name: rule.spell-find-steed.offer-steed-dummy-action.name
                      actionCost: [action]
                      intents:
                        ATTACK: brawl
                    activities:
                      - *error-clear
                      - type: numberIncrement
                        target:
                          fact: companion.steed.actions.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: setAdd
                        target:
                          var: errors
                        source:
                          string: rule.spell-find-steed.offer-steed-dummy-action.no_actions
                        when:
                          - fact: companion.steed.actions.remaining
                            operator: lessThan
                            value: 0
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 4
                - type: offerRule
                  legalWhen:
                    - condition:
                        fact: companion.steed.bonusActions.remaining
                        operator: greaterThan
                        value: 0
                      illegalDiagnostics:
                        - code: rule.spell-find-steed.offer-steed-dummy-bonus.no_bonus_actions
                          severity: error
                  rule:
                    id: offer-steed-dummy-bonus
                    group:
                      - __planned__
                      - bonus-action
                    after:
                      - group: spellcasting
                    ui:
                      section: bonus-action
                      subject: steed
                      name: rule.spell-find-steed.offer-steed-dummy-bonus.name
                      actionCost: [bonus]
                      intents:
                        AID: evade
                    activities:
                      - *error-clear
                      - type: numberIncrement
                        target:
                          fact: companion.steed.bonusActions.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: setAdd
                        target:
                          var: errors
                        source:
                          string: rule.spell-find-steed.offer-steed-dummy-bonus.no_bonus_actions
                        when:
                          - fact: companion.steed.bonusActions.remaining
                            operator: lessThan
                            value: 0
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 4

                # === Same-turn steed action offers (L5) ===
                - type: offerRule
                  legalWhen:
                    - condition:
                        fact: companion.steed.actions.remaining
                        operator: greaterThan
                        value: 0
                      illegalDiagnostics:
                        - code: rule.spell-find-steed.offer-steed-dummy-action.no_actions
                          severity: error
                  rule:
                    id: offer-steed-dummy-action
                    group:
                      - __planned__
                      - action
                    after:
                      - group: spellcasting
                    ui:
                      section: action
                      subject: steed
                      name: rule.spell-find-steed.offer-steed-dummy-action.name
                      actionCost: [action]
                      intents:
                        ATTACK: brawl
                    activities:
                      - *error-clear
                      - type: numberIncrement
                        target:
                          fact: companion.steed.actions.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: setAdd
                        target:
                          var: errors
                        source:
                          string: rule.spell-find-steed.offer-steed-dummy-action.no_actions
                        when:
                          - fact: companion.steed.actions.remaining
                            operator: lessThan
                            value: 0
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 5
                - type: offerRule
                  legalWhen:
                    - condition:
                        fact: companion.steed.bonusActions.remaining
                        operator: greaterThan
                        value: 0
                      illegalDiagnostics:
                        - code: rule.spell-find-steed.offer-steed-dummy-bonus.no_bonus_actions
                          severity: error
                  rule:
                    id: offer-steed-dummy-bonus
                    group:
                      - __planned__
                      - bonus-action
                    after:
                      - group: spellcasting
                    ui:
                      section: bonus-action
                      subject: steed
                      name: rule.spell-find-steed.offer-steed-dummy-bonus.name
                      actionCost: [bonus]
                      intents:
                        AID: evade
                    activities:
                      - *error-clear
                      - type: numberIncrement
                        target:
                          fact: companion.steed.bonusActions.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: setAdd
                        target:
                          var: errors
                        source:
                          string: rule.spell-find-steed.offer-steed-dummy-bonus.no_bonus_actions
                        when:
                          - fact: companion.steed.bonusActions.remaining
                            operator: lessThan
                            value: 0
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 5

                # === Slot persistence effects (L2-L5) ===
                - type: advertiseEffect
                  rule:
                    id: effect-steed-slot-l2
                    ui:
                      name: play.slotEffect.l2
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level2.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 2
                - type: advertiseEffect
                  rule:
                    id: effect-steed-slot-l3
                    ui:
                      name: play.slotEffect.l3
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level3.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 3
                - type: advertiseEffect
                  rule:
                    id: effect-steed-slot-l4
                    ui:
                      name: play.slotEffect.l4
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level4.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 4
                - type: advertiseEffect
                  rule:
                    id: effect-steed-slot-l5
                    ui:
                      name: play.slotEffect.l5
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level5.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 5

                # === Steed effects (per level, self-contained) ===
                # Each level's steed effect has hardcoded stats.
                # Only one is created (the when condition is mutually exclusive).

                # L2 Steed Resources (early phase: stats + resources, no self-advertise)
                - type: advertiseEffect
                  rule: &steed-resources-l2
                    id: effect-steed-resources
                    phase: early
                    ui:
                      section: mount
                      name: rule.spell-find-steed.effect-steed.name
                      subject: steed
                      stats:
                        - name: play.stats.steed.hp
                          type: usedMax
                          total: companion.steed.hp.max
                          remaining: companion.steed.hp.current
                          section: resources
                          subject: steed
                        - name: play.stats.steed.ac
                          type: value
                          fact: companion.steed.ac.value
                          section: resources
                          subject: steed
                        - name: play.stats.steed.speed
                          type: value
                          fact: companion.steed.speed
                          section: resources
                          subject: steed
                        - name: play.stats.steed.actions
                          type: usedMax
                          total: companion.steed.actions.max
                          remaining: companion.steed.actions.remaining
                          section: resources
                          subject: steed
                        - name: play.stats.steed.bonusActions
                          type: usedMax
                          total: companion.steed.bonusActions.max
                          remaining: companion.steed.bonusActions.remaining
                          section: resources
                          subject: steed
                      topBar:
                        - type: usedMax
