                                    when:
                                      - fact: rest.long
                                        operator: equals
                                        value: 0
                                      - fact: companion.steed.hp.current
                                        operator: greaterThan
                                        value: 0
                                      - fact: companion.steed.dismissed
                                        operator: equals
                                        value: 0
                      # === HP Modifiers ===
                      # Max HP Modifier
                      - type: offerRule
                        rule:
                          id: steed-set-hp-modifier-max
                          group:
                            - __planned__
                          after:
                            - group: __effects__
                          ui:
                            section: free
                            subject: steed
                            name: rule.spell-find-steed.steed-set-hp-modifier-max.name
                            sliderMin: -10
                            sliderMax: 30
                            primaryControl:
                              type: slider
                              var: modifier
                              min: { number: -10 }
                              max: { number: 30 }
                            intents: { HEALTH: hp }
                            actionCost: []
                          vars:
                            modifier:
                              capture: true
                              default:
                                number: 0
                          activities:
                            - type: numberSet
                              target:
                                fact: companion.steed.hp.modifier.max
                              source:
                                var: modifier
                            - type: numberSum
                              target:
                                fact: companion.steed.hp.max
                              sources:
                                - fact: companion.steed.hp.base.max
                                - fact: companion.steed.hp.modifier.max
                            - type: advertiseEffect
                              when:
                                - fact: companion.steed.hp.current
                                  operator: greaterThan
                                  value: 0
                              rule:
                                id: effect-steed-hp-modifier-max
                                ui:
                                  name: rule.spell-find-steed.steed-effect-hp-modifier-max.name
                                  displayFact: companion.steed.hp.modifier.max
                                  section: health
                                  subject: steed
                                phase: normal
                                when:
                                  - fact: companion.steed.hp.current
                                    operator: greaterThan
                                    value: 0
                                  - fact: companion.steed.dismissed
                                    operator: equals
                                    value: 0
                                vars:
                                  modifier:
                                    capture: true
                                    default:
                                      number: 0
                                activities:
                                  - type: numberSet
                                    target:
                                      fact: companion.steed.hp.modifier.max
                                    source:
                                      var: modifier
                                  - type: numberSum
                                    target:
                                      fact: companion.steed.hp.max
                                    sources:
                                      - fact: companion.steed.hp.base.max
                                      - fact: companion.steed.hp.modifier.max
                                  - type: advertiseEffect
                                    self: true
                                    when:
                                      - fact: companion.steed.hp.current
                                        operator: greaterThan
                                        value: 0
                                      - fact: companion.steed.dismissed
                                        operator: equals
                                        value: 0
                      # Current HP Modifier
                      - type: offerRule
                        rule:
                          id: steed-set-hp-modifier-current
                          group:
                            - __planned__
                          after:
                            - group: __effects__
                          ui:
                            section: free
                            subject: steed
                            name: rule.spell-find-steed.steed-set-hp-modifier-current.name
                            sliderMin: -30
                            sliderMax: 30
                            primaryControl:
                              type: slider
                              var: modifier
                              min: { number: -30 }
                              max: { number: 30 }
                            intents: { HEALTH: hp }
                            actionCost: []
                          vars:
                            modifier:
                              capture: true
                              default:
                                number: 0
                          activities:
                            - type: numberSet
                              target:
                                fact: companion.steed.hp.modifier.current
                              source:
                                var: modifier
                            - type: numberIncrement
                              target:
                                fact: companion.steed.hp.current
                              source:
                                var: modifier
                            - type: advertiseEffect
                              when:
                                - fact: companion.steed.hp.current
                                  operator: greaterThan
                                  value: 0
                              rule:
                                id: effect-steed-hp-modifier-current
                                ui:
                                  name: rule.spell-find-steed.steed-effect-hp-modifier-current.name
                                  displayFact: companion.steed.hp.modifier.current
                                  section: health
                                  subject: steed
                                phase: normal
                                when:
                                  - fact: companion.steed.hp.current
                                    operator: greaterThan
                                    value: 0
                                  - fact: companion.steed.dismissed
                                    operator: equals
                                    value: 0
                                vars:
                                  modifier:
                                    capture: true
                                    default:
                                      number: 0
                                activities:
                                  - type: numberSet
                                    target:
                                      fact: companion.steed.hp.modifier.current
                                    source:
                                      var: modifier
                                  - type: numberIncrement
                                    target:
                                      fact: companion.steed.hp.current
                                    source:
                                      var: modifier
                                  - type: advertiseEffect
                                    self: true
                                    when:
                                      - fact: companion.steed.hp.current
                                        operator: greaterThan
                                        value: 0
                                      - fact: companion.steed.dismissed
                                        operator: equals
                                        value: 0
                      # === Note ===
                      - type: offerRule
                        rule:
                          id: steed-note
                          group:
                            - __planned__
                          ui:
                            section: free
                            subject: steed
                            name: rule.spell-find-steed.steed-note.name
                            primaryControl:
                              type: text
                              var: text
                              multiline: true
                            intents: { NOTE: freeform }
                            actionCost: []
                          vars:
                            text:
                              capture: true
                              default:
                                string: ''
                          activities: []
                      # === Dismiss ===
                      - type: offerRule
                        legalWhen:
                          - condition:
                              fact: actions.remaining
                              operator: greaterThan
                              value: 0
                        rule:
                          id: offer-dismiss-steed
                          group:
                            - __planned__
                            - action
                          ui:
                            section: action
                            subject: steed
                            name: rule.spell-find-steed.offer-dismiss-steed.name
                            actionCost: [action]
                            intents:
                              HANDLE: dismiss
                          activities:
                            - type: numberIncrement
                              target:
                                fact: actions.remaining
                              source:
                                number: 1
                              subtract: true
                            - type: numberSet
                              target:
                                fact: companion.steed.dismissed
                              source:
                                number: 1
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: companion.steed.dismissed
                            operator: equals
                            value: 0
                          - fact: companion.steed.hp.current
                            operator: greaterThan
                            value: 0
                      - type: advertiseEffect
                        rule: *steed-resources-l5
                        when:
                          - fact: companion.steed.dismissed
                            operator: equals
                            value: 0
                          - fact: companion.steed.hp.current
                            operator: greaterThan
                            value: 0
                  when:
                    - fact: find-steed.selectedLevel
                      operator: equals
                      value: 5

      # === Life Bond annotation ===
      # When the steed is summoned, annotate the Record Healing panel to remind
      # the player that the steed also regains HP from spell healing within 5 ft.
      - id: annotate-life-bond
        after:
          - group: __planned__
        activities:
          - type: annotate
            when:
              - fact: companion.steed.summoned
                operator: equals
                value: 1
            key: rule.spell-find-steed.annotate-life-bond.text
            targets:
              - healing.any
