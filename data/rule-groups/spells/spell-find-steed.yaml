                      # === HP Recording ===
                      # Record Damage
                      - type: offerRule
                        rule:
                          id: steed-record-damage
                          group:
                            - __planned__
                          ui:
                            section: free
                            subject: steed
                            name: rule.spell-find-steed.steed-record-damage.name
                            primaryControl:
                              type: slider
                              var: amount
                              min: { number: 0 }
                              max: { fact: companion.steed.hp.max }
                              unit: hp
                            intents: { HEALTH: hp }
                            actionCost: []
                          vars:
                            amount:
                              capture: true
                              default:
                                number: 0
                          activities:
                            - type: numberIncrement
                              target:
                                fact: companion.steed.hp.current
                              source:
                                var: amount
                              subtract: true
                            - type: advertiseEffect
                              when:
                                - fact: companion.steed.hp.current
                                  operator: greaterThan
                                  value: 0
                              rule:
                                id: effect-steed-hp-damage
                                ui:
                                  name: rule.spell-find-steed.steed-record-damage.effect.name
                                  displaySelection: amount
                                  section: health
                                phase: normal
                                when:
                                  - fact: rest.long
                                    operator: equals
                                    value: 0
                                  - fact: companion.steed.hp.current
                                    operator: greaterThan
                                    value: 0
                                  - fact: companion.steed.dismissed
                                    operator: equals
                                    value: 0
                                vars:
                                  amount:
                                    capture: true
                                    default:
                                      number: 0
                                activities:
                                  - type: numberIncrement
                                    target:
                                      fact: companion.steed.hp.current
                                    source:
                                      var: amount
                                    subtract: true
                                  - type: advertiseEffect
                                    self: true
                                    when:
                                      - fact: rest.long
                                        operator: equals
                                        value: 0
                                      - fact: companion.steed.hp.current
                                        operator: greaterThan
                                        value: 0
                                      - fact: companion.steed.dismissed
                                        operator: equals
                                        value: 0
