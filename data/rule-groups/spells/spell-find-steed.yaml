                              - code: rule.spell-find-steed.steed-move-fly.cannot_fly
                                severity: error
                          - condition:
                              fact: companion.steed.movement.remaining
                              operator: greaterThanOrEqual
                              value: 5
                            illegalDiagnostics:
                              - code: rule.spell-find-steed.steed-move-fly.out_of_movement
                                severity: error
                        rule:
                          id: steed-move-fly
                          group:
                            - __planned__
                            - move
                          ui:
                            section: move
                            subject: steed
                            name: rule.spell-find-steed.steed-move-fly.name
                            packBehind: steed-move-walk
                            primaryControl:
                              type: slider
                              var: distance
                              max: { fact: companion.steed.movement.total }
                              step: 5
                              unit: ft
                            intents: { MOVE: travel }
                            actionCost: [move]
                          vars:
                            distance:
                              capture: true
                              default:
                                fact: companion.steed.movement.remaining
                          activities:
                            - type: numberIncrement
                              target:
                                fact: companion.steed.movement.remaining
