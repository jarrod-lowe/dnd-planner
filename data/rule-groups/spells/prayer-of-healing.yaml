ruleGroups:
  - id: spell-prayer-of-healing
    requires:
      - spellcasting
    translations:
      en:
        name: Prayer of Healing
        description: Level 2 action spell (30ft). Up to 5 creatures gain a Short Rest's
          benefits and regain 2d8 Hit Points. Upcasting adds +1d8 per level.
        keywords:
          - spell
          - level2
          - prayer
          - healing
          - abjuration
          - action
      en-x-tlh:
        name: Qor' nIvbogh
        description: DIch level 2 action. vagh creatures regain 2d8 HP. nIvbogh +1d8.
        keywords:
          - spell
          - level2
          - Qor'
          - nIvbogh
          - action
    detail:
      key: spell/prayer-of-healing
      source: srd52
      translations:
        en:
          meta: Level 2 Abjuration (Cleric, Paladin)
          fields:
            - labelKey: rules.field.castingTime
              value: 10 minutes
            - labelKey: rules.field.range
              value: 30 feet
            - labelKey: rules.field.components
              value: V
            - labelKey: rules.field.duration
              value: Instantaneous
          body: 'Up to five creatures of your choice who remain within range for the

            spell''s entire casting gain the benefits of a Short Rest and also

            regain 2d8 Hit Points. A creature can''t be affected by this spell

            again until that creature finishes a Long Rest.


            *Using a Higher-Level Spell Slot.* The healing increases by 1d8 for

            each spell slot level above 2.

            '
