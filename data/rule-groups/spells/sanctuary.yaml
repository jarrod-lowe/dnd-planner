ruleGroups:
  - id: spell-sanctuary
    requires:
      - spellcasting
    translations:
      en:
        name: Sanctuary
        description: Level 1 bonus action spell. Target must make a WIS save or be
          unable to attack or cast harmful spells. Lasts 1 minute (10 rounds).
        keywords:
          - spell
          - level1
          - sanctuary
          - bonus action
          - abjuration
      en-x-tlh:
        name: chal
        description: DIch level 1 bonus action. DIch chal DIvI' DIvI' DIvI'.
        keywords:
          - spell
          - level1
          - chal
          - bonus action
    detail:
      key: spell/sanctuary
      source: srd52
      translations:
        en:
          meta: Level 1 Abjuration (Cleric)
          fields:
            - labelKey: rules.field.castingTime
              value: Bonus Action
            - labelKey: rules.field.range
              value: 30 feet
            - labelKey: rules.field.components
              value: V, S, M (a shard of glass from a mirror)
            - labelKey: rules.field.duration
              value: 1 minute
          body: 'You ward a creature within range. Until the spell ends, any creature

            who targets the warded creature with an attack roll or a damaging spell

            must succeed on a Wisdom saving throw or either choose a new target or

            lose the attack or spell. This spell doesn''t protect the warded

            creature from areas of effect. The spell ends if the warded creature

            makes an attack roll, casts a spell, or deals damage.

            '
