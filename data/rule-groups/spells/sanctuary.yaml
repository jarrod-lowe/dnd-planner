# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: spell-sanctuary
    requires:
      - spellcasting
    translations:
      en:
        name: Sanctuary
        description: >-
          Level 1 bonus action spell. Target must make a WIS save or be unable
          to attack or cast harmful spells. Lasts 1 minute (10 rounds).
        keywords: [spell, level1, sanctuary, bonus action, abjuration]
      en-x-tlh:
        name: chal
        description: >-
          DIch level 1 bonus action. DIch chal DIvI' DIvI' DIvI'.
        keywords: [spell, level1, chal, bonus action]
    detail:
      key: spell/sanctuary
      source: srd52
      translations:
        en:
          meta: 'Level 1 Abjuration (Cleric)'
          fields:
            - { labelKey: rules.field.castingTime, value: 'Bonus Action' }
            - { labelKey: rules.field.range, value: '30 feet' }
            - { labelKey: rules.field.components, value: 'V, S, M (a shard of glass from a mirror)' }
            - { labelKey: rules.field.duration, value: '1 minute' }
          body: |
            You ward a creature within range. Until the spell ends, any creature
            who targets the warded creature with an attack roll or a damaging spell
            must succeed on a Wisdom saving throw or either choose a new target or
            lose the attack or spell. This spell doesn't protect the warded
            creature from areas of effect. The spell ends if the warded creature
            makes an attack roll, casts a spell, or deals damage.
    rules:
      # Offer to prepare Sanctuary (Build → Prepare → L1)
      - id: prepare-sanctuary-offer
        activities:
          - type: offerRule
            legalWhen:
              - *not-locked-legal
              - condition:
                  fact: spell.l1.sanctuary.prepared
                  operator: notEquals
                  value: 1
                illegalDiagnostics:
                  - code: rule.spell-sanctuary.prepare-sanctuary-offer.already_prepared
                    severity: error
              - condition:
                  fact: spellcasting.prepared.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-sanctuary.prepare-sanctuary-offer.max_prepared
                    severity: error
            rule:
              id: prepare-sanctuary
              phase: normal
              group:
                - __planned__
              ui:
                section: configuration
                name: rule.spell-sanctuary.prepare-sanctuary-offer.name
                intents: { PREPARE: L1 }
                actionCost: []
              activities:
                - type: numberSet
                  target:
                    fact: spell.l1.sanctuary.prepared
                  source:
                    number: 1
                - type: numberIncrement
                  target:
                    fact: spellcasting.prepared.count
                  source:
                    number: 1
                - type: advertiseEffect
                  rule:
                    id: effect-sanctuary-prepared
                    ui:
                      name: rule.spell-sanctuary.effect-sanctuary-prepared.name
                      hidden: true
                    phase: early
                    after:
                      - group: spell-l1-sanctuary-removal-set
                      - group: always-prepared-set
                    activities:
                      - type: numberSet
                        target:
                          fact: spell.l1.sanctuary.prepared
                        source:
                          number: 1
                        when:
                          - fact: spell.l1.sanctuary.removing
                            operator: equals
                            value: 0
                      # Stop counting against the prepared limit once a feature
                      # grants this spell always-prepared (alwaysPrepared == 1),
                      # otherwise a manual L1 preparation would permanently waste
                      # a prepared slot after the grant activates.
                      - type: numberIncrement
                        target:
                          fact: spellcasting.prepared.count
                        source:
                          number: 1
                        when:
                          - fact: spell.l1.sanctuary.removing
                            operator: equals
                            value: 0
                          - fact: spell.l1.sanctuary.alwaysPrepared
                            operator: notEquals
                            value: 1
                      # Retire the effect once always-prepared takes over (the
                      # grant then sustains the prepared fact each evaluation).
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: spell.l1.sanctuary.removing
                            operator: equals
                            value: 0
                          - fact: spell.l1.sanctuary.alwaysPrepared
                            operator: notEquals
                            value: 1

      # Offer to unprepare Sanctuary
      # (illegal when granted always-prepared by a feature, e.g. Oath of Redemption L3)
      - id: unprepare-sanctuary-offer
        activities:
          - type: offerRule
            legalWhen:
              - *not-locked-legal
              - condition:
                  fact: spell.l1.sanctuary.prepared
                  operator: equals
                  value: 1
                illegalDiagnostics:
                  - code: rule.spell-sanctuary.unprepare-sanctuary-offer.not_prepared
                    severity: error
              - condition:
                  fact: spell.l1.sanctuary.alwaysPrepared
                  operator: notEquals
                  value: 1
                illegalDiagnostics:
                  - code: rule.spell-sanctuary.unprepare-sanctuary-offer.always_prepared
                    severity: error
            rule:
              id: unprepare-sanctuary
              ui:
                section: configuration
                name: rule.spell-sanctuary.unprepare-sanctuary-offer.name
                intents: { PREPARE: L1 }
                actionCost: []
              activities:
                - type: numberSet
                  target:
                    fact: spell.l1.sanctuary.prepared
                  source:
                    number: 0
                - type: numberSet
                  target:
                    fact: spell.l1.sanctuary.removing
                  source:
                    number: 1
                - type: numberIncrement
                  target:
                    fact: spellcasting.prepared.count
                  source:
                    number: 1
                  subtract: true
                - type: advertiseEffect
                  rule:
                    id: effect-sanctuary-removing
                    ui:
                      name: rule.spell-sanctuary.effect-sanctuary-removing.name
                      hidden: true
                    phase: early
                    group:
                      - spell-l1-sanctuary-removal-set
                    activities:
                      - type: numberSet
                        target:
                          fact: spell.l1.sanctuary.removing
                        source:
                          number: 1

      # Compute eligible sanctuary slot count (levels 1-5)
      - id: compute-sanctuary-eligible-slots
        phase: normal
        group:
          - sanctuary-slots-computed
        activities:
          - type: numberSum
            target:
              fact: sanctuary.eligibleSlotsRemaining
            sources:
              - fact: spellcasting.slots.level1.remaining
              - fact: spellcasting.slots.level2.remaining
              - fact: spellcasting.slots.level3.remaining
              - fact: spellcasting.slots.level4.remaining
              - fact: spellcasting.slots.level5.remaining

      # Compute lowest available slot level
      # Cascade from high to low so the lowest available level overwrites
      - id: compute-sanctuary-lowest-slot
        phase: normal
        group:
          - sanctuary-slots-computed
        activities:
          - type: numberSet
            target:
              fact: sanctuary.lowestAvailableSlotLevel
            source:
              number: 5
            when:
              - fact: spellcasting.slots.level5.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: sanctuary.lowestAvailableSlotLevel
            source:
              number: 4
            when:
              - fact: spellcasting.slots.level4.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: sanctuary.lowestAvailableSlotLevel
            source:
              number: 3
            when:
              - fact: spellcasting.slots.level3.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: sanctuary.lowestAvailableSlotLevel
            source:
              number: 2
            when:
              - fact: spellcasting.slots.level2.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: sanctuary.lowestAvailableSlotLevel
            source:
              number: 1
            when:
              - fact: spellcasting.slots.level1.remaining
                operator: greaterThan
                value: 0

      # Offer Sanctuary (bonus action)
      - id: offer-sanctuary
        when:
          - fact: spell.l1.sanctuary.prepared
            operator: equals
            value: 1
        after:
          - group: __planned__
          - group: spellcasting
          - group: sanctuary-slots-computed
        activities:
          - type: offerRule
            legalWhen:
              - condition:
                  fact: bonusActions.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-sanctuary.offer-sanctuary.no_bonus_action
                    severity: error
              - condition:
                  fact: sanctuary.eligibleSlotsRemaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-sanctuary.offer-sanctuary.no_slots
                    severity: error
              - condition:
                  fact: spellcasting.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-sanctuary.offer-sanctuary.no_spellcasting
                    severity: error
            rule:
              id: cast-sanctuary
              group:
                - __planned__
                - spellcasting
              ui:
                section: bonus-action-spell
                name: rule.spell-sanctuary.offer-sanctuary.name
                description: rule.spell-sanctuary.offer-sanctuary.description
                detailKey: spell/sanctuary
                showDC: true
                information:
                  - type: text
                    label: play.information.saveDc
                    labelValues:
                      saveType: { fact: spellcasting.saveAbility }
                      dc: { fact: spellcasting.saveDC }
                intents:
                  DEFEND: ward
                actionCost: [bonus, L1]
              vars:
                slotLevel:
                  capture: true
                  default:
                    fact: sanctuary.lowestAvailableSlotLevel
              activities:
                # Consume bonus action
                - type: numberIncrement
                  target:
                    fact: bonusActions.remaining
                  source:
                    number: 1
                  subtract: true
                # Consume spellcasting resource
                - type: numberIncrement
                  target:
                    fact: spellcasting.remaining
                  source:
                    number: 1
                  subtract: true
                # Error tracking
                - *error-clear
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-sanctuary.offer-sanctuary.no_bonus_action
                  when:
                    - fact: bonusActions.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-sanctuary.offer-sanctuary.no_spellcasting
                  when:
                    - fact: spellcasting.remaining
                      operator: lessThan
                      value: 0
                # Bridge var to fact for conditional slot consumption
                - type: numberSet
                  target:
                    fact: sanctuary.selectedLevel
                  source:
                    var: slotLevel
                # Consume L1 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level1.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: sanctuary.selectedLevel
                      operator: equals
                      value: 1
                # Consume L2 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level2.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: sanctuary.selectedLevel
                      operator: equals
                      value: 2
                # Consume L3 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level3.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: sanctuary.selectedLevel
                      operator: equals
                      value: 3
                # Consume L4 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level4.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: sanctuary.selectedLevel
                      operator: equals
                      value: 4
                # Consume L5 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level5.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: sanctuary.selectedLevel
                      operator: equals
                      value: 5
                # Track slot consumption errors
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-sanctuary.offer-sanctuary.no_slots
                  when:
                    - fact: spellcasting.slots.level1.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-sanctuary.offer-sanctuary.no_slots
                  when:
                    - fact: spellcasting.slots.level2.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-sanctuary.offer-sanctuary.no_slots
                  when:
                    - fact: spellcasting.slots.level3.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-sanctuary.offer-sanctuary.no_slots
                  when:
                    - fact: spellcasting.slots.level4.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-sanctuary.offer-sanctuary.no_slots
                  when:
                    - fact: spellcasting.slots.level5.remaining
                      operator: lessThan
                      value: 0
                # Persist L1 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-sanctuary-slot-l1
                    ui:
                      name: play.slotEffect.l1
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level1.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: sanctuary.selectedLevel
                      operator: equals
                      value: 1
                # Persist L2 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-sanctuary-slot-l2
                    ui:
                      name: play.slotEffect.l2
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level2.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: sanctuary.selectedLevel
                      operator: equals
                      value: 2
                # Persist L3 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-sanctuary-slot-l3
                    ui:
                      name: play.slotEffect.l3
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level3.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: sanctuary.selectedLevel
                      operator: equals
                      value: 3
                # Persist L4 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-sanctuary-slot-l4
                    ui:
                      name: play.slotEffect.l4
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level4.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: sanctuary.selectedLevel
                      operator: equals
                      value: 4
                # Persist L5 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-sanctuary-slot-l5
                    ui:
                      name: play.slotEffect.l5
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level5.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: sanctuary.selectedLevel
                      operator: equals
                      value: 5
                # Create persistent Sanctuary effect (10 rounds, WIS save)
                - type: advertiseEffect
                  rule:
                    id: effect-sanctuary
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    when:
                      - fact: rest.short
                        operator: equals
                        value: 0
                      - fact: rest.long
                        operator: equals
                        value: 0
                    ui:
                      section: ongoing
                      name: rule.spell-sanctuary.effect-sanctuary.name
                      countDown: 10
                      duration: 10
                      saveType: WIS
                      saveFact: spellcasting.saveDC
                      information:
                        - type: countdown
                          filled: { number: 10 }
                          total: { number: 10 }
                        - type: text
                          label: play.information.saveDc
                          labelValues:
                            saveType: { fact: spellcasting.saveAbility }
                            dc: { fact: spellcasting.saveDC }
                    activities:
                      - type: advertiseEffect
                        self: true
