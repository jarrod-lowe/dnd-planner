ruleGroups:
  - id: spell-sleep
    requires:
      - spellcasting
      - concentration
    translations:
      en:
        name: Sleep
        description: Level 1 action spell (60ft). Target must make a WIS save or fall
          unconscious. Concentration, up to 1 minute (10 rounds).
        keywords:
          - spell
          - level1
          - sleep
          - action
          - enchantment
          - concentration
      en-x-tlh:
        name: Qong
        description: DIch level 1 action. DIch Qong DIvI' WIS DIch. buQ, 1 rep.
        keywords:
          - spell
          - level1
          - Qong
          - action
          - buQ
    detail:
      key: spell/sleep
      source: srd52
      translations:
        en:
          meta: Level 1 Enchantment (Bard, Sorcerer, Wizard)
          fields:
            - labelKey: rules.field.castingTime
              value: Action
            - labelKey: rules.field.range
              value: 60 feet
            - labelKey: rules.field.components
              value: V, S, M (a pinch of sand or rose petals)
            - labelKey: rules.field.duration
              value: Concentration, up to 1 minute
          body: 'Each creature of your choice in a 5-foot-radius Sphere centered on
            a point

            within range must succeed on a **Wisdom saving throw** or have the

            Incapacitated condition until the end of its next turn, at which point
            it

            must repeat the save. If the target fails the second save, the target
            has

            the Unconscious condition for the duration. The spell ends on a target
            if

            it takes damage or someone within 5 feet of it takes an action to shake
            it

            out of the spell''s effect.


            Creatures that don''t sleep, such as elves, or that have Immunity to the

            Exhaustion condition automatically succeed on saves against this spell.

            '
