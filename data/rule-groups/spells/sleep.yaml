# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: spell-sleep
    requires:
      - spellcasting
      - concentration
    translations:
      en:
        name: Sleep
        description: >-
          Level 1 action spell (60ft). Target must make a WIS save or fall
          unconscious. Concentration, up to 1 minute (10 rounds).
        keywords: [spell, level1, sleep, action, enchantment, concentration]
      en-x-tlh:
        name: Qong
        description: >-
          DIch level 1 action. DIch Qong DIvI' WIS DIch. buQ, 1 rep.
        keywords: [spell, level1, Qong, action, buQ]
    detail:
      key: spell/sleep
      source: srd52
      translations:
        en:
          meta: 'Level 1 Enchantment (Bard, Sorcerer, Wizard)'
          fields:
            - { labelKey: rules.field.castingTime, value: 'Action' }
            - { labelKey: rules.field.range, value: '60 feet' }
            - { labelKey: rules.field.components, value: 'V, S, M (a pinch of sand or rose petals)' }
            - { labelKey: rules.field.duration, value: 'Concentration, up to 1 minute' }
          body: |
            Each creature of your choice in a 5-foot-radius Sphere centered on a point
            within range must succeed on a **Wisdom saving throw** or have the
            Incapacitated condition until the end of its next turn, at which point it
            must repeat the save. If the target fails the second save, the target has
            the Unconscious condition for the duration. The spell ends on a target if
            it takes damage or someone within 5 feet of it takes an action to shake it
            out of the spell's effect.

            Creatures that don't sleep, such as elves, or that have Immunity to the
            Exhaustion condition automatically succeed on saves against this spell.
    rules:
      # Offer to prepare Sleep (Build → Prepare → L1)
      - id: prepare-sleep-offer
        activities:
          - type: offerRule
            legalWhen:
              - *not-locked-legal
              - condition:
                  fact: spell.l1.sleep.prepared
                  operator: notEquals
                  value: 1
                illegalDiagnostics:
                  - code: rule.spell-sleep.prepare-sleep-offer.already_prepared
                    severity: error
              - condition:
                  fact: spellcasting.prepared.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-sleep.prepare-sleep-offer.max_prepared
                    severity: error
            rule:
              id: prepare-sleep
              phase: normal
              group:
                - __planned__
              ui:
                section: configuration
                name: rule.spell-sleep.prepare-sleep-offer.name
                intents: { PREPARE: L1 }
                actionCost: []
              activities:
                - type: numberSet
                  target:
                    fact: spell.l1.sleep.prepared
                  source:
                    number: 1
                - type: numberIncrement
                  target:
                    fact: spellcasting.prepared.count
                  source:
                    number: 1
                - type: advertiseEffect
                  rule:
                    id: effect-sleep-prepared
                    ui:
                      name: rule.spell-sleep.effect-sleep-prepared.name
                      hidden: true
                    phase: early
                    after:
                      - group: spell-l1-sleep-removal-set
                      - group: always-prepared-set
                    activities:
                      - type: numberSet
                        target:
                          fact: spell.l1.sleep.prepared
                        source:
                          number: 1
                        when:
                          - fact: spell.l1.sleep.removing
                            operator: equals
                            value: 0
                      # Stop counting against the prepared limit once a feature
                      # grants this spell always-prepared (alwaysPrepared == 1),
                      # otherwise a manual L1 preparation would permanently waste
                      # a prepared slot after the grant activates.
                      - type: numberIncrement
                        target:
                          fact: spellcasting.prepared.count
                        source:
                          number: 1
                        when:
                          - fact: spell.l1.sleep.removing
                            operator: equals
                            value: 0
                          - fact: spell.l1.sleep.alwaysPrepared
                            operator: notEquals
                            value: 1
                      # Retire the effect once always-prepared takes over (the
                      # grant then sustains the prepared fact each evaluation).
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: spell.l1.sleep.removing
                            operator: equals
                            value: 0
                          - fact: spell.l1.sleep.alwaysPrepared
                            operator: notEquals
                            value: 1

      # Offer to unprepare Sleep
      # (illegal when granted always-prepared by a feature, e.g. Oath of Redemption L3)
      - id: unprepare-sleep-offer
        activities:
          - type: offerRule
            legalWhen:
              - *not-locked-legal
              - condition:
                  fact: spell.l1.sleep.prepared
                  operator: equals
                  value: 1
                illegalDiagnostics:
                  - code: rule.spell-sleep.unprepare-sleep-offer.not_prepared
                    severity: error
              - condition:
                  fact: spell.l1.sleep.alwaysPrepared
                  operator: notEquals
                  value: 1
                illegalDiagnostics:
                  - code: rule.spell-sleep.unprepare-sleep-offer.always_prepared
                    severity: error
            rule:
              id: unprepare-sleep
              ui:
                section: configuration
                name: rule.spell-sleep.unprepare-sleep-offer.name
                intents: { PREPARE: L1 }
                actionCost: []
              activities:
                - type: numberSet
                  target:
                    fact: spell.l1.sleep.prepared
                  source:
                    number: 0
                - type: numberSet
                  target:
                    fact: spell.l1.sleep.removing
                  source:
                    number: 1
                - type: numberIncrement
                  target:
                    fact: spellcasting.prepared.count
                  source:
                    number: 1
                  subtract: true
                - type: advertiseEffect
                  rule:
                    id: effect-sleep-removing
                    ui:
                      name: rule.spell-sleep.effect-sleep-removing.name
                      hidden: true
                    phase: early
                    group:
                      - spell-l1-sleep-removal-set
                    activities:
                      - type: numberSet
                        target:
                          fact: spell.l1.sleep.removing
                        source:
                          number: 1

      # Compute eligible sleep slot count (levels 1-5)
      - id: compute-sleep-eligible-slots
        phase: normal
        group:
          - sleep-slots-computed
        activities:
          - type: numberSum
            target:
              fact: sleep.eligibleSlotsRemaining
            sources:
              - fact: spellcasting.slots.level1.remaining
              - fact: spellcasting.slots.level2.remaining
              - fact: spellcasting.slots.level3.remaining
              - fact: spellcasting.slots.level4.remaining
              - fact: spellcasting.slots.level5.remaining

      # Compute lowest available slot level
      # Cascade from high to low so the lowest available level overwrites
      - id: compute-sleep-lowest-slot
        phase: normal
        group:
          - sleep-slots-computed
        activities:
          - type: numberSet
            target:
              fact: sleep.lowestAvailableSlotLevel
            source:
              number: 5
            when:
              - fact: spellcasting.slots.level5.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: sleep.lowestAvailableSlotLevel
            source:
              number: 4
            when:
              - fact: spellcasting.slots.level4.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: sleep.lowestAvailableSlotLevel
            source:
              number: 3
            when:
              - fact: spellcasting.slots.level3.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: sleep.lowestAvailableSlotLevel
            source:
              number: 2
            when:
              - fact: spellcasting.slots.level2.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: sleep.lowestAvailableSlotLevel
            source:
              number: 1
            when:
              - fact: spellcasting.slots.level1.remaining
                operator: greaterThan
                value: 0

      # Offer Sleep (action spell)
      - id: offer-sleep
        when:
          - fact: spell.l1.sleep.prepared
            operator: equals
            value: 1
        after:
          - group: __planned__
          - group: action
          - group: spellcasting
          - group: sleep-slots-computed
        activities:
          - type: offerRule
            legalWhen:
              - condition:
                  fact: actions.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-sleep.offer-sleep.no_action
                    severity: error
              - condition:
                  fact: spellcasting.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-sleep.offer-sleep.no_spellcasting
                    severity: error
              - condition:
                  fact: concentration.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-sleep.offer-sleep.already_concentrating
                    severity: error
              - condition:
                  fact: sleep.eligibleSlotsRemaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-sleep.offer-sleep.no_slots
                    severity: error
            rule:
              id: cast-sleep
              group:
                - __planned__
                - action
                - spellcasting
              ui:
                section: action-spell
                name: rule.spell-sleep.offer-sleep.name
                description: rule.spell-sleep.offer-sleep.description
                detailKey: spell/sleep
                showDC: true
                information:
                  - type: text
                    label: play.information.saveDc
                    labelValues:
                      saveType: { fact: spellcasting.saveAbility }
                      dc: { fact: spellcasting.saveDC }
                intents:
                  CONTROL: area
                actionCost: [action, conc, L1]
              vars:
                slotLevel:
                  capture: true
                  default:
                    fact: sleep.lowestAvailableSlotLevel
              activities:
                # Consume action
                - type: numberIncrement
                  target:
                    fact: actions.remaining
                  source:
                    number: 1
                  subtract: true
                # Consume spellcasting resource
                - type: numberIncrement
                  target:
                    fact: spellcasting.remaining
                  source:
                    number: 1
                  subtract: true
                # Consume concentration
                - type: numberIncrement
                  target:
                    fact: concentration.remaining
                  source:
                    number: 1
                  subtract: true
                # Error tracking
                - *error-clear
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-sleep.offer-sleep.no_action
                  when:
                    - fact: actions.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-sleep.offer-sleep.no_spellcasting
                  when:
                    - fact: spellcasting.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-sleep.offer-sleep.already_concentrating
                  when:
                    - fact: concentration.remaining
                      operator: lessThan
                      value: 0
                # Bridge var to fact for conditional slot consumption
                - type: numberSet
                  target:
                    fact: sleep.selectedLevel
                  source:
                    var: slotLevel
                # Consume L1 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level1.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: sleep.selectedLevel
                      operator: equals
                      value: 1
                # Consume L2 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level2.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: sleep.selectedLevel
                      operator: equals
                      value: 2
                # Consume L3 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level3.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: sleep.selectedLevel
                      operator: equals
                      value: 3
                # Consume L4 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level4.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: sleep.selectedLevel
                      operator: equals
                      value: 4
                # Consume L5 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level5.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: sleep.selectedLevel
                      operator: equals
                      value: 5
                # Track slot consumption errors
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-sleep.offer-sleep.no_slots
                  when:
                    - fact: spellcasting.slots.level1.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-sleep.offer-sleep.no_slots
                  when:
                    - fact: spellcasting.slots.level2.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-sleep.offer-sleep.no_slots
                  when:
                    - fact: spellcasting.slots.level3.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-sleep.offer-sleep.no_slots
                  when:
                    - fact: spellcasting.slots.level4.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-sleep.offer-sleep.no_slots
                  when:
                    - fact: spellcasting.slots.level5.remaining
                      operator: lessThan
                      value: 0
                # Persist L1 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-sleep-slot-l1
                    ui:
                      name: play.slotEffect.l1
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level1.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: sleep.selectedLevel
                      operator: equals
                      value: 1
                # Persist L2 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-sleep-slot-l2
                    ui:
                      name: play.slotEffect.l2
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level2.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: sleep.selectedLevel
                      operator: equals
                      value: 2
                # Persist L3 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-sleep-slot-l3
                    ui:
                      name: play.slotEffect.l3
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level3.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: sleep.selectedLevel
                      operator: equals
                      value: 3
                # Persist L4 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-sleep-slot-l4
                    ui:
                      name: play.slotEffect.l4
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level4.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: sleep.selectedLevel
                      operator: equals
                      value: 4
                # Persist L5 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-sleep-slot-l5
                    ui:
                      name: play.slotEffect.l5
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level5.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: sleep.selectedLevel
                      operator: equals
                      value: 5
                # Create persistent Sleep effect (10 rounds, WIS save, concentration)
                - type: advertiseEffect
                  rule:
                    id: effect-sleep
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    when:
                      - fact: rest.short
                        operator: equals
                        value: 0
                      - fact: rest.long
                        operator: equals
                        value: 0
                    ui:
                      section: ongoing
                      name: rule.spell-sleep.effect-sleep.name
                      detailKey: spell/sleep
                      countDown: 10
                      duration: 10
                      saveType: WIS
                      saveFact: spellcasting.saveDC
                      information:
                        - type: countdown
                          filled: { number: 10 }
                          total: { number: 10 }
                        - type: text
                          label: play.information.saveDc
                          labelValues:
                            saveType: { fact: spellcasting.saveAbility }
                            dc: { fact: spellcasting.saveDC }
                    activities:
                      - type: numberIncrement
                        target:
                          fact: concentration.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
