ruleGroups:
  - id: spell-thunderous-smite
    requires:
      - spellcasting
    translations:
      en:
        name: Thunderous Smite
        description: Level 1 bonus action spell. After hitting with a melee weapon
          attack, deal an extra 2d6 thunder damage. Target must make a STR save or
          be pushed 10 feet and knocked prone. Upcasting adds +1d6 per level.
        keywords:
          - spell
          - level1
          - thunderous
          - smite
          - thunder
          - damage
          - bonus action
      en-x-tlh:
        name: raQ muHta
        description: DIch level 1 bonus action. DIch nuH DIch DIvI' 2d6 thunder DIvI'.
        keywords:
          - spell
          - level1
          - raQ
          - bonus action
    detail:
      key: spell/thunderous-smite
      source: custom
      translations:
        en:
          meta: Level 1 Evocation (Paladin)
          fields:
            - labelKey: rules.field.castingTime
              value: Bonus Action, after a Melee weapon or Unarmed hit
            - labelKey: rules.field.range
              value: Self
            - labelKey: rules.field.components
              value: V
            - labelKey: rules.field.duration
              value: Instantaneous
          body: 'Your attack is audibly accompanied by a thunderous sound that can
            be

            heard up to 300 feet away. The target takes 2d6 thunder damage.

            Targets who are creatures, if they fail a strength saving throw

            against your spell save DC, are also pushed 10 feet away from you

            and knocked prone.


            *Using a Higher-Level Spell Slot.* The extra Thunder damage increases

            by 1d6 for each spell slot level above 1.

            '
