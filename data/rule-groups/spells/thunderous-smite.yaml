# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: spell-thunderous-smite
    requires:
      - spellcasting
    translations:
      en:
        name: Thunderous Smite
        description: >-
          Level 1 bonus action spell. After hitting with a melee weapon attack,
          deal an extra 2d6 thunder damage. Target must make a STR save or be
          pushed 10 feet and knocked prone. Upcasting adds +1d6 per level.
        keywords: [spell, level1, thunderous, smite, thunder, damage, bonus action]
      en-x-tlh:
        name: raQ muHta
        description: >-
          DIch level 1 bonus action. DIch nuH DIch DIvI' 2d6 thunder DIvI'.
        keywords: [spell, level1, raQ, bonus action]
    detail:
      key: spell/thunderous-smite
      source: custom
      translations:
        en:
          meta: 'Level 1 Evocation (Paladin)'
          fields:
            - { labelKey: rules.field.castingTime, value: 'Bonus Action, after a Melee weapon or Unarmed hit' }
            - { labelKey: rules.field.range, value: 'Self' }
            - { labelKey: rules.field.components, value: 'V' }
            - { labelKey: rules.field.duration, value: 'Instantaneous' }
          body: |
            Your attack is audibly accompanied by a thunderous sound that can be
            heard up to 300 feet away. The target takes 2d6 thunder damage.
            Targets who are creatures, if they fail a strength saving throw
            against your spell save DC, are also pushed 10 feet away from you
            and knocked prone.
            
            *Using a Higher-Level Spell Slot.* The extra Thunder damage increases
            by 1d6 for each spell slot level above 1.
    rules:
      # Offer to prepare Thunderous Smite (Build → Prepare → L1)
      - id: prepare-thunderous-smite-offer
        activities:
          - type: offerRule
            legalWhen:
              - condition:
                  fact: spell.l1.thunderousSmite.prepared
                  operator: notEquals
                  value: 1
                illegalDiagnostics:
                  - code: rule.spell-thunderous-smite.prepare-thunderous-smite-offer.already_prepared
                    severity: error
              - condition:
                  fact: spellcasting.prepared.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-thunderous-smite.prepare-thunderous-smite-offer.max_prepared
                    severity: error
            rule:
              id: prepare-thunderous-smite
              phase: normal
              group:
                - __planned__
              ui:
                section: configuration
                name: rule.spell-thunderous-smite.prepare-thunderous-smite-offer.name
                intents: { PREPARE: L1 }
                actionCost: []
              activities:
                - type: numberSet
                  target:
                    fact: spell.l1.thunderousSmite.prepared
                  source:
                    number: 1
                - type: numberIncrement
                  target:
                    fact: spellcasting.prepared.count
                  source:
                    number: 1
                - type: advertiseEffect
                  rule:
                    id: effect-thunderous-smite-prepared
                    ui:
                      name: rule.spell-thunderous-smite.effect-thunderous-smite-prepared.name
                      hidden: true
                    phase: early
                    after:
                      - group: spell-l1-thunderous-smite-removal-set
                    activities:
                      - type: numberSet
                        target:
                          fact: spell.l1.thunderousSmite.prepared
                        source:
                          number: 1
                        when:
                          - fact: spell.l1.thunderousSmite.removing
                            operator: equals
                            value: 0
                      - type: numberIncrement
                        target:
                          fact: spellcasting.prepared.count
                        source:
                          number: 1
                        when:
                          - fact: spell.l1.thunderousSmite.removing
                            operator: equals
                            value: 0
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: spell.l1.thunderousSmite.removing
                            operator: equals
                            value: 0

      # Offer to unprepare Thunderous Smite
      - id: unprepare-thunderous-smite-offer
        activities:
          - type: offerRule
            legalWhen:
              - condition:
                  fact: spell.l1.thunderousSmite.prepared
                  operator: equals
                  value: 1
                illegalDiagnostics:
                  - code: rule.spell-thunderous-smite.unprepare-thunderous-smite-offer.not_prepared
                    severity: error
            rule:
              id: unprepare-thunderous-smite
              ui:
                section: configuration
                name: rule.spell-thunderous-smite.unprepare-thunderous-smite-offer.name
                intents: { PREPARE: L1 }
                actionCost: []
              activities:
                - type: numberSet
                  target:
                    fact: spell.l1.thunderousSmite.prepared
                  source:
                    number: 0
                - type: numberSet
                  target:
                    fact: spell.l1.thunderousSmite.removing
                  source:
                    number: 1
                - type: numberIncrement
                  target:
                    fact: spellcasting.prepared.count
                  source:
                    number: 1
                  subtract: true
                - type: advertiseEffect
                  rule:
                    id: effect-thunderous-smite-removing
                    ui:
                      name: rule.spell-thunderous-smite.effect-thunderous-smite-removing.name
                      hidden: true
                    phase: early
                    group:
                      - spell-l1-thunderous-smite-removal-set
                    activities:
                      - type: numberSet
                        target:
                          fact: spell.l1.thunderousSmite.removing
                        source:
                          number: 1

      # Compute eligible thunderous smite slot count (levels 1-5)
      - id: compute-tsmite-eligible-slots
        phase: normal
        group:
          - tsmite-slots-computed
        activities:
          - type: numberSum
            target:
              fact: tsmite.eligibleSlotsRemaining
            sources:
              - fact: spellcasting.slots.level1.remaining
              - fact: spellcasting.slots.level2.remaining
              - fact: spellcasting.slots.level3.remaining
              - fact: spellcasting.slots.level4.remaining
              - fact: spellcasting.slots.level5.remaining

      # Compute lowest available slot level and corresponding die count
      # Cascade from high to low so the lowest available level overwrites
      - id: compute-tsmite-lowest-slot
        phase: normal
        group:
          - tsmite-slots-computed
        activities:
          - type: numberSet
            target:
              fact: tsmite.lowestAvailableSlotLevel
            source:
              number: 5
            when:
              - fact: spellcasting.slots.level5.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: tsmite.defaultDieCount
            source:
              number: 6
            when:
              - fact: spellcasting.slots.level5.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: tsmite.lowestAvailableSlotLevel
            source:
              number: 4
            when:
              - fact: spellcasting.slots.level4.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: tsmite.defaultDieCount
            source:
              number: 5
            when:
              - fact: spellcasting.slots.level4.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: tsmite.lowestAvailableSlotLevel
            source:
              number: 3
            when:
              - fact: spellcasting.slots.level3.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: tsmite.defaultDieCount
            source:
              number: 4
            when:
              - fact: spellcasting.slots.level3.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: tsmite.lowestAvailableSlotLevel
            source:
              number: 2
            when:
              - fact: spellcasting.slots.level2.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: tsmite.defaultDieCount
            source:
              number: 3
            when:
              - fact: spellcasting.slots.level2.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: tsmite.lowestAvailableSlotLevel
            source:
              number: 1
            when:
              - fact: spellcasting.slots.level1.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: tsmite.defaultDieCount
            source:
              number: 2
            when:
              - fact: spellcasting.slots.level1.remaining
                operator: greaterThan
                value: 0
          # Cap the slider at the highest slot level this spell actually handles
          # (1-5); spellcasting.maxSlotLevel can be 6-9 for a multiclass caster.
          - type: numberCopy
            source:
              fact: spellcasting.maxSlotLevel
            target:
              fact: tsmite.maxCastLevel
          - type: numberSet
            target:
              fact: tsmite.maxCastLevel
            source:
              number: 5
            when:
              - fact: spellcasting.maxSlotLevel
                operator: greaterThan
                value: 5

      # Offer Thunderous Smite (bonus action, gated on attack action taken)
      - id: offer-thunderous-smite
        when:
          - fact: spell.l1.thunderousSmite.prepared
            operator: equals
            value: 1
        after:
          - group: __planned__
          - group: spellcasting
          - group: tsmite-slots-computed
        activities:
          - type: offerRule
            legalWhen:
              - condition: *has-bonus-action
                illegalDiagnostics:
                  - code: rule.spell-thunderous-smite.offer-thunderous-smite.no_bonus_action
                    severity: error
              - condition: *has-attack-action
                illegalDiagnostics:
                  - code: rule.spell-thunderous-smite.offer-thunderous-smite.no_attack
                    severity: error
              - condition: &ts-has-smite-slots
                  fact: tsmite.eligibleSlotsRemaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-thunderous-smite.offer-thunderous-smite.no_slots
                    severity: error
              - condition: *has-spellcasting
                illegalDiagnostics:
                  - code: rule.spell-thunderous-smite.offer-thunderous-smite.no_spellcasting
                    severity: error
            rule:
              id: cast-thunderous-smite
              group:
                - __planned__
                - spellcasting
              ui:
                section: bonus-action-spell
                name: rule.spell-thunderous-smite.offer-thunderous-smite.name
                detailKey: spell/thunderous-smite
                dieSides: 6
                showDC: true
                saveType: STR
                primaryControl:
                  type: slider
                  var: slotLevel
                  min: { number: 1 }
                  max: { fact: tsmite.maxCastLevel }
                  valueFormat: spellLevel
                information:
                  - type: text
                    label: play.information.saveDc
                    labelValues:
                      saveType: { fact: spellcasting.saveAbility }
                      dc: { fact: spellcasting.saveDC }
                intents:
                  ATTACK: spells
                actionCost: [bonus, L1]
              vars:
                slotLevel:
                  capture: true
                  default:
                    fact: tsmite.lowestAvailableSlotLevel
                dieCount:
                  capture: true
                  default:
                    fact: tsmite.defaultDieCount
              activities:
                # Consume bonus action
                - type: numberIncrement
                  target:
                    fact: bonusActions.remaining
                  source:
                    number: 1
                  subtract: true
                # Consume spellcasting resource
                - type: numberIncrement
                  target:
                    fact: spellcasting.remaining
                  source:
                    number: 1
                  subtract: true
                # Error tracking
                - *error-clear
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-thunderous-smite.offer-thunderous-smite.no_bonus_action
                  when:
                    - fact: bonusActions.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-thunderous-smite.offer-thunderous-smite.no_spellcasting
                  when:
                    - fact: spellcasting.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-thunderous-smite.offer-thunderous-smite.no_attack
                  when:
                    - fact: attack.last.activation.action
                      operator: lessThan
                      value: 1
                # Bridge var to fact for conditional slot consumption
                - type: numberSet
                  target:
                    fact: tsmite.selectedLevel
                  source:
                    var: slotLevel
                # Consume L1 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level1.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: tsmite.selectedLevel
                      operator: equals
                      value: 1
                # Consume L2 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level2.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: tsmite.selectedLevel
                      operator: equals
                      value: 2
                # Consume L3 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level3.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: tsmite.selectedLevel
                      operator: equals
                      value: 3
                # Consume L4 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level4.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: tsmite.selectedLevel
                      operator: equals
                      value: 4
                # Consume L5 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level5.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: tsmite.selectedLevel
                      operator: equals
                      value: 5
                # Track slot consumption errors
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-thunderous-smite.offer-thunderous-smite.no_slots
                  when:
                    - fact: spellcasting.slots.level1.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-thunderous-smite.offer-thunderous-smite.no_slots
                  when:
                    - fact: spellcasting.slots.level2.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-thunderous-smite.offer-thunderous-smite.no_slots
                  when:
                    - fact: spellcasting.slots.level3.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-thunderous-smite.offer-thunderous-smite.no_slots
                  when:
                    - fact: spellcasting.slots.level4.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-thunderous-smite.offer-thunderous-smite.no_slots
                  when:
                    - fact: spellcasting.slots.level5.remaining
                      operator: lessThan
                      value: 0
                # Persist L1 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-tsmite-slot-l1
                    ui:
                      name: play.slotEffect.l1
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level1.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: tsmite.selectedLevel
                      operator: equals
                      value: 1
                # Persist L2 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-tsmite-slot-l2
                    ui:
                      name: play.slotEffect.l2
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level2.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: tsmite.selectedLevel
                      operator: equals
                      value: 2
                # Persist L3 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-tsmite-slot-l3
                    ui:
                      name: play.slotEffect.l3
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level3.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: tsmite.selectedLevel
                      operator: equals
                      value: 3
                # Persist L4 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-tsmite-slot-l4
                    ui:
                      name: play.slotEffect.l4
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level4.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: tsmite.selectedLevel
                      operator: equals
                      value: 4
                # Persist L5 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-tsmite-slot-l5
                    ui:
                      name: play.slotEffect.l5
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level5.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: tsmite.selectedLevel
                      operator: equals
                      value: 5

      # Annotate melee/unarmed attacks when Thunderous Smite is available
      - id: annotate-thunderous-smite
        when:
          - fact: spell.l1.thunderousSmite.prepared
            operator: equals
            value: 1
        after:
          - group: __planned__
          - group: spellcasting
          - group: tsmite-slots-computed
        activities:
          - type: annotate
            when:
              - *has-bonus-action
              - *has-attack-action
              - *ts-has-smite-slots
              - *has-spellcasting
            key: rule.spell-thunderous-smite.annotation
            targets: [attack.melee, attack.unarmed]
