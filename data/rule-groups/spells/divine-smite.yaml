# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: spell-divine-smite
    requires:
      - spellcasting
    translations:
      en:
        name: Divine Smite
        description: >-
          Level 1 bonus action spell. After hitting with a melee weapon or
          unarmed strike, deal an extra 2d8 radiant damage. Upcasting adds +1d8
          per level.
        keywords: [spell, level1, divine, smite, radiant, damage, bonus action]
      en-x-tlh:
        name: quv Qaw'
        description: >-
          DIch level 1 bonus action. DIch nuH DIch DIvI' 2d8 radiant DIvI'.
        keywords: [spell, level1, quv, Qaw', bonus action]
    detail:
      key: spell/divine-smite
      source: srd52
      translations:
        en:
          meta: 'Level 1 Evocation (Paladin)'
          fields:
            - { labelKey: rules.field.castingTime, value: 'Bonus Action, after a Melee weapon or Unarmed hit' }
            - { labelKey: rules.field.range, value: 'Self' }
            - { labelKey: rules.field.components, value: 'V' }
            - { labelKey: rules.field.duration, value: 'Instantaneous' }
          body: |
            The target takes an extra 2d8 Radiant damage from your attack. The
            damage increases by 1d8 if the target is a Fiend or an Undead.

            *Using a Higher-Level Spell Slot.* The extra damage increases by 1d8
            for each spell slot level above 1.
    rules:
      # Offer to prepare Divine Smite (Build → Prepare → L1)
      - id: prepare-divine-smite-offer
        activities:
          - type: offerRule
            legalWhen:
              - condition:
                  fact: spell.l1.divineSmite.prepared
                  operator: notEquals
                  value: 1
                illegalDiagnostics:
                  - code: rule.spell-divine-smite.prepare-divine-smite-offer.already_prepared
                    severity: error
              - condition:
                  fact: spellcasting.prepared.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-divine-smite.prepare-divine-smite-offer.max_prepared
                    severity: error
            rule:
              id: prepare-divine-smite
              phase: normal
              group:
                - __planned__
              ui:
                section: configuration
                name: rule.spell-divine-smite.prepare-divine-smite-offer.name
                intents: { PREPARE: L1 }
                actionCost: []
              activities:
                - type: numberSet
                  target:
                    fact: spell.l1.divineSmite.prepared
                  source:
                    number: 1
                - type: numberIncrement
                  target:
                    fact: spellcasting.prepared.count
                  source:
                    number: 1
                - type: advertiseEffect
                  rule:
                    id: effect-divine-smite-prepared
                    ui:
                      name: rule.spell-divine-smite.effect-divine-smite-prepared.name
                      hidden: true
                    phase: early
                    after:
                      - group: spell-l1-divine-smite-removal-set
                    activities:
                      - type: numberSet
                        target:
                          fact: spell.l1.divineSmite.prepared
                        source:
                          number: 1
                        when:
                          - fact: spell.l1.divineSmite.removing
                            operator: equals
                            value: 0
                      - type: numberIncrement
                        target:
                          fact: spellcasting.prepared.count
                        source:
                          number: 1
                        when:
                          - fact: spell.l1.divineSmite.removing
                            operator: equals
                            value: 0
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: spell.l1.divineSmite.removing
                            operator: equals
                            value: 0

      # Offer to unprepare Divine Smite
      # (illegal when granted always-prepared by a feature, e.g. Paladin L2)
      - id: unprepare-divine-smite-offer
        activities:
          - type: offerRule
            legalWhen:
              - condition:
                  fact: spell.l1.divineSmite.prepared
                  operator: equals
                  value: 1
                illegalDiagnostics:
                  - code: rule.spell-divine-smite.unprepare-divine-smite-offer.not_prepared
                    severity: error
              - condition:
                  fact: spell.l1.divineSmite.alwaysPrepared
                  operator: notEquals
                  value: 1
                illegalDiagnostics:
                  - code: rule.spell-divine-smite.unprepare-divine-smite-offer.always_prepared
                    severity: error
            rule:
              id: unprepare-divine-smite
              ui:
                section: configuration
                name: rule.spell-divine-smite.unprepare-divine-smite-offer.name
                intents: { PREPARE: L1 }
                actionCost: []
              activities:
                - type: numberSet
                  target:
                    fact: spell.l1.divineSmite.prepared
                  source:
                    number: 0
                - type: numberSet
                  target:
                    fact: spell.l1.divineSmite.removing
                  source:
                    number: 1
                - type: numberIncrement
                  target:
                    fact: spellcasting.prepared.count
                  source:
                    number: 1
                  subtract: true
                - type: advertiseEffect
                  rule:
                    id: effect-divine-smite-removing
                    ui:
                      name: rule.spell-divine-smite.effect-divine-smite-removing.name
                      hidden: true
                    phase: early
                    group:
                      - spell-l1-divine-smite-removal-set
                    activities:
                      - type: numberSet
                        target:
                          fact: spell.l1.divineSmite.removing
                        source:
                          number: 1

      # Compute eligible smite slot count (levels 1-5)
      - id: compute-smite-eligible-slots
        phase: normal
        group:
          - smite-slots-computed
        activities:
          - type: numberSum
            target:
              fact: smite.eligibleSlotsRemaining
            sources:
              - fact: spellcasting.slots.level1.remaining
              - fact: spellcasting.slots.level2.remaining
              - fact: spellcasting.slots.level3.remaining
              - fact: spellcasting.slots.level4.remaining
              - fact: spellcasting.slots.level5.remaining

      # Compute lowest available slot level and corresponding die count
      # Cascade from high to low so the lowest available level overwrites
      - id: compute-smite-lowest-slot
        phase: normal
        group:
          - smite-slots-computed
        activities:
          - type: numberSet
            target:
              fact: smite.lowestAvailableSlotLevel
            source:
              number: 5
            when:
              - fact: spellcasting.slots.level5.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: smite.defaultDieCount
            source:
              number: 6
            when:
              - fact: spellcasting.slots.level5.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: smite.lowestAvailableSlotLevel
            source:
              number: 4
            when:
              - fact: spellcasting.slots.level4.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: smite.defaultDieCount
            source:
              number: 5
            when:
              - fact: spellcasting.slots.level4.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: smite.lowestAvailableSlotLevel
            source:
              number: 3
            when:
              - fact: spellcasting.slots.level3.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: smite.defaultDieCount
            source:
              number: 4
            when:
              - fact: spellcasting.slots.level3.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: smite.lowestAvailableSlotLevel
            source:
              number: 2
            when:
              - fact: spellcasting.slots.level2.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: smite.defaultDieCount
            source:
              number: 3
            when:
              - fact: spellcasting.slots.level2.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: smite.lowestAvailableSlotLevel
            source:
              number: 1
            when:
              - fact: spellcasting.slots.level1.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: smite.defaultDieCount
            source:
              number: 2
            when:
              - fact: spellcasting.slots.level1.remaining
                operator: greaterThan
                value: 0

      # Combine the free once-per-long-rest use with spell slots.
      # The free use is offered as slot "level 0" (2d8, no slot expended).
      - id: compute-smite-resources
        phase: normal
        after:
          - group: smite-slots-computed
        group:
          - smite-resources-computed
        activities:
          # Total castable resources = eligible slots + free uses
          - type: numberSum
            target:
              fact: smite.anyResourceRemaining
            sources:
              - fact: smite.eligibleSlotsRemaining
              - fact: paladinSmite.remaining
          # Default slider position: lowest slot, unless a free use is available
          - type: numberCopy
            source:
              fact: smite.lowestAvailableSlotLevel
            target:
              fact: smite.defaultLevel
          # Minimum slider position: 1, unless the character owns the free-use
          # feature (paladinSmite.total > 0). Keyed on total — not remaining — so
          # the "Free Use" (level 0) notch stays on the slider even once spent;
          # picking it then warns (no_free_use) and it is not the default.
          - type: numberSet
            target:
              fact: smite.minSlotLevel
            source:
              number: 1
          - type: numberSet
            target:
              fact: smite.minSlotLevel
            source:
              number: 0
            when:
              - fact: paladinSmite.total
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: smite.defaultLevel
            source:
              number: 0
            when:
              - fact: paladinSmite.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: smite.defaultDieCount
            source:
              number: 2
            when:
              - fact: paladinSmite.remaining
                operator: greaterThan
                value: 0

      # Offer Divine Smite (bonus action, gated on preparation + attack action)
      - id: offer-divine-smite
        when:
          - fact: spell.l1.divineSmite.prepared
            operator: equals
            value: 1
        after:
          - group: __planned__
          - group: spellcasting
          - group: smite-resources-computed
        activities:
          - type: offerRule
            legalWhen:
              - condition: *has-bonus-action
                illegalDiagnostics:
                  - code: rule.spell-divine-smite.offer-divine-smite.no_bonus_action
                    severity: error
              - condition: *has-attack-action
                illegalDiagnostics:
                  - code: rule.spell-divine-smite.offer-divine-smite.no_attack
                    severity: error
              - condition: &ds-has-resource
                  fact: smite.anyResourceRemaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-divine-smite.offer-divine-smite.no_resource
                    severity: error
              - condition: *has-spellcasting
                illegalDiagnostics:
                  - code: rule.spell-divine-smite.offer-divine-smite.no_spellcasting
                    severity: error
            rule:
              id: cast-divine-smite
              group:
                - __planned__
                - spellcasting
              ui:
                section: bonus-action-spell
                name: rule.spell-divine-smite.offer-divine-smite.name
                detailKey: spell/divine-smite
                dieSides: 8
                primaryControl:
                  type: slider
                  var: slotLevel
                  min: { fact: smite.minSlotLevel }
                  max: { fact: spellcasting.maxSlotLevel }
                  valueFormat: spellLevel
                intents:
                  ATTACK: spells
                actionCost: [bonus]
              vars:
                slotLevel:
                  capture: true
                  default:
                    fact: smite.defaultLevel
                dieCount:
                  capture: true
                  default:
                    fact: smite.defaultDieCount
              activities:
                # Consume bonus action
                - type: numberIncrement
                  target:
                    fact: bonusActions.remaining
                  source:
                    number: 1
                  subtract: true
                # Consume spellcasting resource (casting a spell)
                - type: numberIncrement
                  target:
                    fact: spellcasting.remaining
                  source:
                    number: 1
                  subtract: true
                # Error tracking
                - *error-clear
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-divine-smite.offer-divine-smite.no_bonus_action
                  when:
                    - fact: bonusActions.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-divine-smite.offer-divine-smite.no_spellcasting
                  when:
                    - fact: spellcasting.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-divine-smite.offer-divine-smite.no_attack
                  when:
                    - fact: attack.last.activation.action
                      operator: lessThan
                      value: 1
                # Bridge var to fact for conditional consumption
                - type: numberSet
                  target:
                    fact: smite.selectedLevel
                  source:
                    var: slotLevel
                # Free use (level 0): consume the once-per-long-rest use, no slot.
                # Decrement (rather than set 0) so an over-use goes negative and
                # is caught by the no_free_use error below.
                - type: numberIncrement
                  target:
                    fact: paladinSmite.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: smite.selectedLevel
                      operator: equals
                      value: 0
                # Persist the spent free use across turns (until a long rest)
                - type: advertiseEffect
                  rule:
                    id: effect-divine-smite-free
                    ui:
                      name: rule.spell-divine-smite.effect-divine-smite-free.name
                      hidden: true
                    phase: early
                    after:
                      - group: paladin-smite-set
                    group:
                      - paladin-smite-effect
                    when:
                      - fact: rest.long
                        operator: equals
                        value: 0
                    activities:
                      - type: numberSet
                        target:
                          fact: paladinSmite.remaining
                        source:
                          number: 0
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: smite.selectedLevel
                      operator: equals
                      value: 0
                # Consume L1 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level1.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: smite.selectedLevel
                      operator: equals
                      value: 1
                # Consume L2 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level2.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: smite.selectedLevel
                      operator: equals
                      value: 2
                # Consume L3 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level3.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: smite.selectedLevel
                      operator: equals
                      value: 3
                # Consume L4 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level4.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: smite.selectedLevel
                      operator: equals
                      value: 4
                # Consume L5 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level5.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: smite.selectedLevel
                      operator: equals
                      value: 5
                # Track resource consumption errors (specific per resource)
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-divine-smite.offer-divine-smite.no_free_use
                  when:
                    - fact: paladinSmite.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-divine-smite.offer-divine-smite.no_l1_slots
                  when:
                    - fact: spellcasting.slots.level1.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-divine-smite.offer-divine-smite.no_l2_slots
                  when:
                    - fact: spellcasting.slots.level2.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-divine-smite.offer-divine-smite.no_l3_slots
                  when:
                    - fact: spellcasting.slots.level3.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-divine-smite.offer-divine-smite.no_l4_slots
                  when:
                    - fact: spellcasting.slots.level4.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-divine-smite.offer-divine-smite.no_l5_slots
                  when:
                    - fact: spellcasting.slots.level5.remaining
                      operator: lessThan
                      value: 0
                # Persist L1 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-divine-smite-slot-l1
                    ui:
                      name: play.slotEffect.l1
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level1.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: smite.selectedLevel
                      operator: equals
                      value: 1
                # Persist L2 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-divine-smite-slot-l2
                    ui:
                      name: play.slotEffect.l2
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level2.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: smite.selectedLevel
                      operator: equals
                      value: 2
                # Persist L3 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-divine-smite-slot-l3
                    ui:
                      name: play.slotEffect.l3
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level3.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: smite.selectedLevel
                      operator: equals
                      value: 3
                # Persist L4 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-divine-smite-slot-l4
                    ui:
                      name: play.slotEffect.l4
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level4.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: smite.selectedLevel
                      operator: equals
                      value: 4
                # Persist L5 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-divine-smite-slot-l5
                    ui:
                      name: play.slotEffect.l5
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level5.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: smite.selectedLevel
                      operator: equals
                      value: 5

      # Annotate melee/unarmed attacks when Divine Smite is available
      - id: annotate-divine-smite
        when:
          - fact: spell.l1.divineSmite.prepared
            operator: equals
            value: 1
        after:
          - group: __planned__
          - group: spellcasting
          - group: smite-resources-computed
        activities:
          - type: annotate
            when:
              - *has-bonus-action
              - *has-attack-action
              - *ds-has-resource
              - *has-spellcasting
            key: rule.spell-divine-smite.annotation
            targets: [attack.melee, attack.unarmed]
