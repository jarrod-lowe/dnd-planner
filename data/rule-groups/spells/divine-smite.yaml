ruleGroups:
  - id: spell-divine-smite
    requires:
      - spellcasting
    translations:
      en:
        name: Divine Smite
        description: Level 1 bonus action spell. After hitting with a melee weapon
          or unarmed strike, deal an extra 2d8 radiant damage. Upcasting adds +1d8
          per level.
        keywords:
          - spell
          - level1
          - divine
          - smite
          - radiant
          - damage
          - bonus action
      en-x-tlh:
        name: quv Qaw'
        description: DIch level 1 bonus action. DIch nuH DIch DIvI' 2d8 radiant DIvI'.
        keywords:
          - spell
          - level1
          - quv
          - Qaw'
          - bonus action
    detail:
      key: spell/divine-smite
      source: srd52
      translations:
        en:
          meta: Level 1 Evocation (Paladin)
          fields:
            - labelKey: rules.field.castingTime
              value: Bonus Action, after a Melee weapon or Unarmed hit
            - labelKey: rules.field.range
              value: Self
            - labelKey: rules.field.components
              value: V
            - labelKey: rules.field.duration
              value: Instantaneous
          body: 'The target takes an extra 2d8 Radiant damage from your attack. The

            damage increases by 1d8 if the target is a Fiend or an Undead.


            *Using a Higher-Level Spell Slot.* The extra damage increases by 1d8

            for each spell slot level above 1.

            '
