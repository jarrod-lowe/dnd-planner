ruleGroups:
  - id: spell-protection-from-evil-and-good
    requires:
      - spellcasting
      - concentration
    translations:
      en:
        name: Protection from Evil and Good
        description: Level 1 action spell (touch). Protects against aberrations, celestials,
          elementals, fey, fiends, and undead. Concentration, up to 10 minutes (100
          rounds).
        keywords:
          - spell
          - level1
          - protection-from-evil-and-good
          - action
          - abjuration
          - concentration
      en-x-tlh:
        name: mIgh Do' Ha'DIbaH je
        description: DIch level 1 action. DIch mIgh Do' Ha'DIbaH je DIvI' DIvI'. buQ,
          10 rep.
        keywords:
          - spell
          - level1
          - mIgh-Do'-Ha'DIbaH-je
          - action
          - abjuration
          - buQ
    detail:
      key: spell/protection-from-evil-and-good
      source: srd52
      translations:
        en:
          meta: Level 1 Abjuration (Cleric, Druid, Paladin, Warlock, Wizard)
          fields:
            - labelKey: rules.field.castingTime
              value: Action
            - labelKey: rules.field.range
              value: Touch
            - labelKey: rules.field.components
              value: V, S, M (a flask of Holy Water worth 25+ GP, which the spell
                consumes)
            - labelKey: rules.field.duration
              value: Concentration, up to 10 minutes
          body: 'Until the spell ends, one willing creature you touch is protected

            against creatures that are Aberrations, Celestials, Elementals, Fey,

            Fiends, and Undead. The protection grants several benefits. Creatures

            of those types have Disadvantage on attack rolls against the target.

            The target also can''t be possessed by or gain the Charmed or Frightened

            conditions from them. If the target is already possessed, Charmed, or

            Frightened by such a creature, the target has Advantage on any new

            saving throw against the relevant effect.

            '
