ruleGroups:
  - id: spell-bless
    requires:
      - spellcasting
      - concentration
    translations:
      en:
        name: Bless
        description: Level 1 action spell (30ft). Target 2+SL creatures. Concentration,
          up to 1 minute (10 rounds). +1d4 to attack rolls and saving throws.
        keywords:
          - spell
          - level1
          - bless
          - action
          - enchantment
          - concentration
      en-x-tlh:
        name: DIch
        description: DIch level 1 action. DIch DIvI' 2+SL. buQ, 1 rep. +1d4 DIvI'
          DIvI'.
        keywords:
          - spell
          - level1
          - DIch
          - action
          - buQ
    detail:
      key: spell/bless
      source: srd52
      translations:
        en:
          meta: Level 1 Enchantment (Cleric, Paladin)
          fields:
            - labelKey: rules.field.castingTime
              value: Action
            - labelKey: rules.field.range
              value: 30 feet
            - labelKey: rules.field.components
              value: V, S, M (a Holy Symbol worth 5+ GP)
            - labelKey: rules.field.duration
              value: Concentration, up to 1 minute
          body: 'You bless up to three creatures within range. Whenever a target makes

            an attack roll or a saving throw before the spell ends, the target adds

            1d4 to the attack roll or save.


            *Using a Higher-Level Spell Slot.* You can target one additional creature

            for each spell slot level above 1.

            '
