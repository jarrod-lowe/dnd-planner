# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: spell-hold-person
    requires:
      - spellcasting
      - concentration
    translations:
      en:
        name: Hold Person
        description: >-
          Level 2 action spell (60ft). One Humanoid makes a WIS save or is
          Paralyzed; it repeats the save at the end of each of its turns.
          Concentration, up to 1 minute (10 rounds).
        keywords: [spell, level2, hold person, action, enchantment, concentration, bard, cleric, druid, sorcerer, warlock, wizard]
      en-x-tlh:
        name: nuv mevmoH
        description: >-
          DIch level 2 action (60ft). wa' Humanoid WIS DIch ghap qam Qaw'.
          buQ, 1 rep (10 rounds).
        keywords: [spell, level2, nuv mevmoH, action, buQ]
    detail:
      key: spell/hold-person
      source: srd52
      translations:
        en:
          meta: 'Level 2 Enchantment (Bard, Cleric, Druid, Sorcerer, Warlock, Wizard)'
          fields:
            - { labelKey: rules.field.castingTime, value: 'Action' }
            - { labelKey: rules.field.range, value: '60 feet' }
            - { labelKey: rules.field.components, value: 'V, S, M (a straight piece of iron)' }
            - { labelKey: rules.field.duration, value: 'Concentration, up to 1 minute' }
          body: |
            Choose a Humanoid that you can see within range. The target must
            succeed on a **Wisdom saving throw** or have the Paralyzed condition
            for the duration. At the end of each of its turns, the target repeats
            the save, ending the spell on itself on a success.

            ***Using a Higher-Level Spell Slot.*** You can target one additional
            Humanoid for each spell slot level above 2.
    rules:
      # Offer to prepare Hold Person (Build → Prepare → L2)
      - id: prepare-hold-person-offer
        activities:
          - type: offerRule
            legalWhen:
              - *not-locked-legal
              - condition:
                  fact: spell.l2.holdPerson.prepared
                  operator: notEquals
                  value: 1
                illegalDiagnostics:
                  - code: rule.spell-hold-person.prepare-hold-person-offer.already_prepared
                    severity: error
              - condition:
                  fact: spellcasting.prepared.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-hold-person.prepare-hold-person-offer.max_prepared
                    severity: error
            rule:
              id: prepare-hold-person
              phase: normal
              group:
                - __planned__
              ui:
                section: configuration
                name: rule.spell-hold-person.prepare-hold-person-offer.name
                intents: { PREPARE: L2 }
                actionCost: []
              activities:
                - type: numberSet
                  target:
                    fact: spell.l2.holdPerson.prepared
                  source:
                    number: 1
                - type: numberIncrement
                  target:
                    fact: spellcasting.prepared.count
                  source:
                    number: 1
                - type: advertiseEffect
                  rule:
                    id: effect-hold-person-prepared
                    ui:
                      name: rule.spell-hold-person.effect-hold-person-prepared.name
                      hidden: true
                    phase: early
                    after:
                      - group: spell-l2-holdPerson-removal-set
                      - group: always-prepared-set
                    activities:
                      - type: numberSet
                        target:
                          fact: spell.l2.holdPerson.prepared
                        source:
                          number: 1
                        when:
                          - fact: spell.l2.holdPerson.removing
                            operator: equals
                            value: 0
                      # Stop counting against the prepared limit once a feature
                      # grants this spell always-prepared (alwaysPrepared == 1),
                      # otherwise a manual L2 preparation would permanently waste
                      # a prepared slot after the grant activates.
                      - type: numberIncrement
                        target:
                          fact: spellcasting.prepared.count
                        source:
                          number: 1
                        when:
                          - fact: spell.l2.holdPerson.removing
                            operator: equals
                            value: 0
                          - fact: spell.l2.holdPerson.alwaysPrepared
                            operator: notEquals
                            value: 1
                      # Retire the effect once always-prepared takes over (the
                      # grant then sustains the prepared fact each evaluation).
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: spell.l2.holdPerson.removing
                            operator: equals
                            value: 0
                          - fact: spell.l2.holdPerson.alwaysPrepared
                            operator: notEquals
                            value: 1

      # Offer to unprepare Hold Person
      # (illegal when granted always-prepared by a feature)
      - id: unprepare-hold-person-offer
        activities:
          - type: offerRule
            legalWhen:
              - *not-locked-legal
              - condition:
                  fact: spell.l2.holdPerson.prepared
                  operator: equals
                  value: 1
                illegalDiagnostics:
                  - code: rule.spell-hold-person.unprepare-hold-person-offer.not_prepared
                    severity: error
              - condition:
                  fact: spell.l2.holdPerson.alwaysPrepared
                  operator: notEquals
                  value: 1
                illegalDiagnostics:
                  - code: rule.spell-hold-person.unprepare-hold-person-offer.always_prepared
                    severity: error
            rule:
              id: unprepare-hold-person
              ui:
                section: configuration
                name: rule.spell-hold-person.unprepare-hold-person-offer.name
                intents: { PREPARE: L2 }
                actionCost: []
              activities:
                - type: numberSet
                  target:
                    fact: spell.l2.holdPerson.prepared
                  source:
                    number: 0
                - type: numberSet
                  target:
                    fact: spell.l2.holdPerson.removing
                  source:
                    number: 1
                - type: numberIncrement
                  target:
                    fact: spellcasting.prepared.count
                  source:
                    number: 1
                  subtract: true
                - type: advertiseEffect
                  rule:
                    id: effect-hold-person-removing
                    ui:
                      name: rule.spell-hold-person.effect-hold-person-removing.name
                      hidden: true
                    phase: early
                    group:
                      - spell-l2-holdPerson-removal-set
                    activities:
                      - type: numberSet
                        target:
                          fact: spell.l2.holdPerson.removing
                        source:
                          number: 1

      # Compute eligible Hold Person slot count (levels 2-5)
      - id: compute-hold-person-eligible-slots
        phase: normal
        group:
          - holdPerson-slots-computed
        activities:
          - type: numberSum
            target:
              fact: holdPerson.eligibleSlotsRemaining
            sources:
              - fact: spellcasting.slots.level2.remaining
              - fact: spellcasting.slots.level3.remaining
              - fact: spellcasting.slots.level4.remaining
              - fact: spellcasting.slots.level5.remaining

      # Compute lowest available slot level (2-5)
      # Cascade from high to low so the lowest available level overwrites
      - id: compute-hold-person-lowest-slot
        phase: normal
        group:
          - holdPerson-slots-computed
        activities:
          - type: numberSet
            target:
              fact: holdPerson.lowestAvailableSlotLevel
            source:
              number: 5
            when:
              - fact: spellcasting.slots.level5.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: holdPerson.lowestAvailableSlotLevel
            source:
              number: 4
            when:
              - fact: spellcasting.slots.level4.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: holdPerson.lowestAvailableSlotLevel
            source:
              number: 3
            when:
              - fact: spellcasting.slots.level3.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: holdPerson.lowestAvailableSlotLevel
            source:
              number: 2
            when:
              - fact: spellcasting.slots.level2.remaining
                operator: greaterThan
                value: 0

      # Offer Hold Person (action spell)
      - id: offer-hold-person
        when:
          - fact: spell.l2.holdPerson.prepared
            operator: equals
            value: 1
        after:
          - group: __planned__
          - group: action
          - group: spellcasting
          - group: holdPerson-slots-computed
        activities:
          - type: offerRule
            legalWhen:
              - condition:
                  fact: actions.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-hold-person.offer-hold-person.no_action
                    severity: error
              - condition:
                  fact: spellcasting.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-hold-person.offer-hold-person.no_spellcasting
                    severity: error
              - condition:
                  fact: concentration.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-hold-person.offer-hold-person.already_concentrating
                    severity: error
              - condition:
                  fact: holdPerson.eligibleSlotsRemaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.spell-hold-person.offer-hold-person.no_slots
                    severity: error
            rule:
              id: cast-hold-person
              group:
                - __planned__
                - action
                - spellcasting
              ui:
                section: action-spell
                name: rule.spell-hold-person.offer-hold-person.name
                description: rule.spell-hold-person.offer-hold-person.description
                detailKey: spell/hold-person
                showDC: true
                information:
                  - type: text
                    label: play.information.saveDc
                    labelValues:
                      saveType: { string: WIS }
                      dc: { fact: spellcasting.saveDC }
                intents:
                  CONTROL: single
                actionCost: [action, conc, L2]
                primaryControl:
                  type: slider
                  var: slotLevel
                  notches:
                    - { value: 2, enabled: { fact: spellcasting.slots.level2.total } }
                    - { value: 3, enabled: { fact: spellcasting.slots.level3.total } }
                    - { value: 4, enabled: { fact: spellcasting.slots.level4.total } }
                    - { value: 5, enabled: { fact: spellcasting.slots.level5.total } }
                  valueFormat: spellLevel
              vars:
                slotLevel:
                  capture: true
                  default:
                    fact: holdPerson.lowestAvailableSlotLevel
              activities:
                # Consume action
                - type: numberIncrement
                  target:
                    fact: actions.remaining
                  source:
                    number: 1
                  subtract: true
                # Consume spellcasting resource
                - type: numberIncrement
                  target:
                    fact: spellcasting.remaining
                  source:
                    number: 1
                  subtract: true
                # Consume concentration
                - type: numberIncrement
                  target:
                    fact: concentration.remaining
                  source:
                    number: 1
                  subtract: true
                # Error tracking
                - *error-clear
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-hold-person.offer-hold-person.no_action
                  when:
                    - fact: actions.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-hold-person.offer-hold-person.no_spellcasting
                  when:
                    - fact: spellcasting.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-hold-person.offer-hold-person.already_concentrating
                  when:
                    - fact: concentration.remaining
                      operator: lessThan
                      value: 0
                # Bridge var to fact for conditional slot consumption
                - type: numberSet
                  target:
                    fact: holdPerson.selectedLevel
                  source:
                    var: slotLevel
                # Consume L2 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level2.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: holdPerson.selectedLevel
                      operator: equals
                      value: 2
                # Consume L3 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level3.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: holdPerson.selectedLevel
                      operator: equals
                      value: 3
                # Consume L4 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level4.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: holdPerson.selectedLevel
                      operator: equals
                      value: 4
                # Consume L5 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level5.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: holdPerson.selectedLevel
                      operator: equals
                      value: 5
                # Track slot consumption errors
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-hold-person.offer-hold-person.no_slots
                  when:
                    - fact: spellcasting.slots.level2.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-hold-person.offer-hold-person.no_slots
                  when:
                    - fact: spellcasting.slots.level3.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-hold-person.offer-hold-person.no_slots
                  when:
                    - fact: spellcasting.slots.level4.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-hold-person.offer-hold-person.no_slots
                  when:
                    - fact: spellcasting.slots.level5.remaining
                      operator: lessThan
                      value: 0
                # No castable slot level resolved (no free slots at any level):
                # selectedLevel stays below 2, so no per-level subtraction fires.
                # Record no_slots so the planned choice is flagged illegal.
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.spell-hold-person.offer-hold-person.no_slots
                  when:
                    - fact: holdPerson.selectedLevel
                      operator: lessThan
                      value: 2
                # Persist L2 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-hold-person-slot-l2
                    ui:
                      name: play.slotEffect.l2
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level2.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: holdPerson.selectedLevel
                      operator: equals
                      value: 2
                # Persist L3 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-hold-person-slot-l3
                    ui:
                      name: play.slotEffect.l3
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level3.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: holdPerson.selectedLevel
                      operator: equals
                      value: 3
                # Persist L4 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-hold-person-slot-l4
                    ui:
                      name: play.slotEffect.l4
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level4.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: holdPerson.selectedLevel
                      operator: equals
                      value: 4
                # Persist L5 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-hold-person-slot-l5
                    ui:
                      name: play.slotEffect.l5
                      hidden: true
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level5.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: holdPerson.selectedLevel
                      operator: equals
                      value: 5
                # Create persistent Hold Person effect (10 rounds, WIS save, concentration)
                - type: advertiseEffect
                  rule:
                    id: effect-hold-person
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    when:
                      - fact: rest.short
                        operator: equals
                        value: 0
                      - fact: rest.long
                        operator: equals
                        value: 0
                    ui:
                      section: ongoing
                      name: rule.spell-hold-person.effect-hold-person.name
                      detailKey: spell/hold-person
                      countDown: 10
                      duration: 10
                      saveType: WIS
                      saveFact: spellcasting.saveDC
                      information:
                        - type: countdown
                          filled: { number: 10 }
                          total: { number: 10 }
                        - type: text
                          label: play.information.saveDc
                          labelValues:
                            saveType: { string: WIS }
                            dc: { fact: spellcasting.saveDC }
                    activities:
                      - type: numberIncrement
                        target:
                          fact: concentration.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
