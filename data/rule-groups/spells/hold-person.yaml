ruleGroups:
  - id: spell-hold-person
    requires:
      - spellcasting
      - concentration
    translations:
      en:
        name: Hold Person
        description: Level 2 action spell (60ft). One Humanoid makes a WIS save or
          is Paralyzed; it repeats the save at the end of each of its turns. Concentration,
          up to 1 minute (10 rounds).
        keywords:
          - spell
          - level2
          - hold person
          - action
          - enchantment
          - concentration
          - bard
          - cleric
          - druid
          - sorcerer
          - warlock
          - wizard
      en-x-tlh:
        name: nuv mevmoH
        description: DIch level 2 action (60ft). wa' Humanoid WIS DIch ghap qam Qaw'.
          buQ, 1 rep (10 rounds).
        keywords:
          - spell
          - level2
          - nuv mevmoH
          - action
          - buQ
    detail:
      key: spell/hold-person
      source: srd52
      translations:
        en:
          meta: Level 2 Enchantment (Bard, Cleric, Druid, Sorcerer, Warlock, Wizard)
          fields:
            - labelKey: rules.field.castingTime
              value: Action
            - labelKey: rules.field.range
              value: 60 feet
            - labelKey: rules.field.components
              value: V, S, M (a straight piece of iron)
            - labelKey: rules.field.duration
              value: Concentration, up to 1 minute
          body: 'Choose a Humanoid that you can see within range. The target must

            succeed on a **Wisdom saving throw** or have the Paralyzed condition

            for the duration. At the end of each of its turns, the target repeats

            the save, ending the spell on itself on a success.


            ***Using a Higher-Level Spell Slot.*** You can target one additional

            Humanoid for each spell slot level above 2.

            '
