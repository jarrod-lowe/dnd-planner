ruleGroups:
  - id: spell-aid
    requires:
      - spellcasting
    translations:
      en:
        name: Aid
        description: Level 2 action spell (30ft). +5 HP per slot level to 3 creatures.
          8 hours.
        keywords:
          - spell
          - level2
          - aid
          - action
          - abjuration
          - bard
          - cleric
          - druid
          - paladin
          - ranger
      en-x-tlh:
        name: QaH
        description: DIch level 2 action (30ft). +5 HP per slot level 3 creatures.
          8 rep.
        keywords:
          - spell
          - level2
          - QaH
          - action
    detail:
      key: spell/aid
      source: srd52
      translations:
        en:
          meta: Level 2 Abjuration (Bard, Cleric, Druid, Paladin, Ranger)
          fields:
            - labelKey: rules.field.castingTime
              value: Action
            - labelKey: rules.field.range
              value: 30 feet
            - labelKey: rules.field.components
              value: V, S, M (a strip of white cloth)
            - labelKey: rules.field.duration
              value: 8 hours
          body: 'Choose up to three creatures within range. Each target''s Hit Point

            maximum and current Hit Points increase by 5 for the duration.


            **Using a Higher-Level Spell Slot.** Each target''s Hit Points

            increase by 5 for each spell slot level above 2.

            '
