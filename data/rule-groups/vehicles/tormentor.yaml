# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: tormentor
    # The ONE group for the whole vehicle: later vehicles join this group as
    # their own subjects. Acquiring is equipping a vehicle, not manning a
    # station (the Damage-Control seat fiction is retired). Ungated: available
    # to every character (acquire legality is not checked — multiple
    # acquisitions are illegal-but-possible).
    translations:
      en:
        name: Tormentor
        description: The Tormentor war vehicle. Acquire it to see its AC, HP,
          Speed, cargo capacity, and STR/DEX/CON while you ride.
        keywords:
          - vehicle
          - tormentor
          - acquire
          - abandon
          - mount
      en-x-tlh:
        name: Duj Sep
        description: Duj Sep SuvwI' Duj. Duj Sep yISuq 'ej AC, HP, Do, ngIS
          'ej laH Duj Sep Daj yIlegh.
        keywords:
          - vehicle
          - tormentor
          - acquire
          - abandon
          - mount
    # The Tormentor is not SRD content: this detail is our own wording —
    # numbers and short factual phrases only, never trait prose. It reads
    # in-world (the vehicle and its numbers); nothing about the app.
    detail:
      key: vehicle/tormentor
      source: custom
      translations:
        en:
          meta: Huge Vehicle
          fields:
            - labelKey: rules.field.armorClass
              value: '21'
            - labelKey: rules.field.weight
              value: 3,000 lb.
          body: |
            A huge infernal war vehicle, 3,000 lb., built for raiding and
            scouting on bladed iron wheels. It carries 4 Medium creatures and
            500 lb. of cargo.

            Armor Class 21 (19 while motionless); 60 hit points; Speed
            100 ft.; STR 16 (+3), DEX 14 (+2), CON 14 (+2). The vehicle has
            no Intelligence, Wisdom, or Charisma, and shrugs off fire,
            poison, and psychic damage.

            **Prone Deficiency.** The Tormentor cannot right itself: fallen
            over, it stays prone and can do nothing until something flips it
            upright.

            **Stations.** The Helm drives and steers the Tormentor. The
            Harpoon Flinger fires its 10 harpoons at +7 to hit, range
            120 ft., for 2d8+2 piercing damage.

            **Juke.** The driver can spend their reaction, while the
            Tormentor is able to move, to gain advantage on a Dexterity
            saving throw.
  # The vehicle's OWN prone text — the flip target for both prone offers and
  # the prone chip. A catalog-only entry (the find-steed `*-detail` pattern):
  # it exists to publish the detail JSON and contributes nothing to play.
  # Like the stat block above, our own wording (the Tormentor is not SRD) in
  # an in-world voice — the player's condition/prone prose would promise a
  # war machine crawling and righting itself at the cost of movement.
  - id: tormentor-prone-detail
    translations:
      en:
        name: Prone (Tormentor)
        description: Detail text for the Tormentor's fallen-prone condition
        keywords:
          - prone
          - tormentor
          - vehicle
          - fallen
          - flip upright
          - knocked down
          - condition
      en-x-tlh:
        name: Prone (Tormentor)
        description: Detail text for the Tormentor's fallen-prone condition
        keywords:
          - prone
          - tormentor
          - vehicle
          - fallen
          - flip upright
          - condition
    detail:
      key: vehicle/tormentor-prone
      source: custom
      translations:
        en:
          meta: Vehicle Condition
          body: |
            **Fallen Prone.** Even a war machine can be knocked flat. Tipped
            onto its side — by a crash, a collision, or a blow too heavy to
            shrug off — the Tormentor has fallen prone, and its bladed iron
            wheels are off the ground.

            **Prone Deficiency.** The Tormentor is a vehicle, not a creature,
            and it cannot right itself. It cannot crawl, and no amount of
            movement lifts it: fallen prone, it can do nothing. It stays on
            its side through every turn and every rest, until something
            flips it upright.

            **The Way Clear.** Flipping the war machine upright is the one
            way out of the condition — its crew hauling it over, or allies
            heaving together. The moment its wheels are back under it, the
            Tormentor is upright and ready to roll again.
  # The DAMAGE recorder's flip detail — the settled home for the stat block's
  # damage semantics (threshold, immunities, mishap): nothing here behaves
  # differently beyond the threshold the recorder gates on, so the explanation
  # rides the offer instead of standing notices. A catalog-only entry like the
  # prone detail above: our own wording (the Tormentor is not SRD), in-world
  # voice, numbers and short factual phrases only.
  - id: tormentor-damage-detail
    translations:
      en:
        name: Damage (Tormentor)
        description: Detail text for recording damage against the Tormentor
        keywords:
          - damage
          - tormentor
          - vehicle
          - threshold
          - immunity
          - mishap
          - repairs
      en-x-tlh:
        name: Damage (Tormentor)
        description: Detail text for recording damage against the Tormentor
        keywords:
          - damage
          - tormentor
          - vehicle
          - threshold
          - immunity
          - mishap
          - repairs
    detail:
      key: vehicle/tormentor-damage
      source: custom
      translations:
        en:
          meta: Vehicle Damage
          body: |
            The Tormentor is a huge war machine of bladed iron, and damage
            against it does not land the way it does against flesh.

            **Damage Threshold 10.** A blow that deals less than ten damage
            leaves the Tormentor unmarked — record the blow as it is called
            and nothing is taken; the swing simply bounces off the armour
            plate. A blow of ten or more lands in full: the threshold is a
            floor, not a cap, and never subtracts from what gets through. To
            land a correction beneath the threshold, ignore it for that one
            record.

            **Immunities.** Fire, poison, and psychic damage cannot hurt the
            vehicle at all. Record none of it, however heavy the blow.

            **Mishap Threshold 20.** A single source that deals twenty or more
            damage to the Tormentor triggers a mishap — consult the
            mishap table for what breaks loose.
  # The HARPOON FLINGER's flip detail — linked from the fire offer. A
  # catalog-only entry like the prone and damage details above: our own
  # wording (the Tormentor is not SRD), in-world voice for the numbers, plus
  # the one app-facing note the settled plan calls for (ammunition is
  # display-only). 120 ft. and one target live here and in the offer copy,
  # not in range machinery.
  - id: tormentor-harpoon-detail
    translations:
      en:
        name: Harpoon Flinger (Tormentor)
        description: Detail text for firing the Tormentor's Harpoon Flinger
        keywords:
          - harpoon
          - flinger
          - tormentor
          - vehicle
          - attack
          - piercing
          - ranged
      en-x-tlh:
        name: Harpoon Flinger (Tormentor)
        description: Detail text for firing the Tormentor's Harpoon Flinger
        keywords:
          - harpoon
          - flinger
          - tormentor
          - vehicle
          - attack
          - piercing
          - ranged
    detail:
      key: vehicle/tormentor-harpoon
      source: custom
      translations:
        en:
          meta: Vehicle Weapon
          fields:
            - labelKey: rules.field.range
              value: 120 ft.
            - labelKey: rules.field.damage
              value: 2d8+2 piercing
          body: |
            **Harpoon Flinger.** A ranged weapon attack: +7 to hit, range
            120 ft., one target, 2d8+2 piercing damage on a hit. The attack
            is made with an action while you hold the Harpoon Flinger seat.

            **Magic Weapons.** The flinger's harpoons are magical.

            **Ammunition.** The flinger's rack carries 10 harpoons. The app
            does not track how many have been fired — spent harpoons and
            reloads are the crew's bookkeeping.
  # The HELM's flip detail — linked from the Drive, Dash and Juke offers. A
  # catalog-only entry like the harpoon's: our own wording (the Tormentor is
  # not SRD), in-world voice for what the driver does, plus the Dash rule —
  # the 2024-format stat block takes the vehicle's Dash as a bonus action
  # under a per-encounter cap (3 + its Constitution modifier; each Dash
  # beyond that risks damaging the vehicle), the rule stated without baking
  # the computed total. The stat block's three-quarters cover for the Helm
  # crew stays out: cover is the table's business here.
  - id: tormentor-helm-detail
    translations:
      en:
        name: Helm (Tormentor)
        description: Detail text for driving the Tormentor from the Helm
        keywords:
          - helm
          - drive
          - dash
          - juke
          - tormentor
          - vehicle
          - driver
          - steer
      en-x-tlh:
        name: Helm (Tormentor)
        description: Detail text for driving the Tormentor from the Helm
        keywords:
          - helm
          - drive
          - dash
          - juke
          - tormentor
          - vehicle
          - driver
    detail:
      key: vehicle/tormentor-helm
      source: custom
      translations:
        en:
          meta: Vehicle Station
          body: |
            **Helm.** The Helm takes one crew member, and its driver holds the
            war machine's handle: **Drive** spends the driver's action
            steering the Tormentor through the turn.

            **Dash.** The driver can spend a bonus action pushing the
            Tormentor flat out, doubling its movement for the turn. Each
            encounter the vehicle can Dash 3 times plus its Constitution
            modifier; each Dash beyond that runs the risk of damaging the
            vehicle.

            **Juke.** The driver can spend their reaction to swerve the
            Tormentor, gaining advantage on a Dexterity saving throw. The
            swerve needs the machine rolling: the Tormentor can juke only
            while it is able to move.
