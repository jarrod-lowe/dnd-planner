# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: tormentor
    # The ONE group for the whole vehicle: seats (action stations) join this
    # group as their own subjects, because seats change during play. Only the
    # Damage Control pseudo-seat exists yet. Ungated: available to every
    # character (boarding legality is not checked this pass — multiple
    # boardings are illegal-but-possible).
    translations:
      en:
        name: Tormentor
        description: The Tormentor war vehicle and its crew stations. Board it
          on damage-control duty to see its AC, HP, Speed, cargo capacity, and
          STR/DEX/CON while you ride.
        keywords:
          - vehicle
          - tormentor
          - board
          - mount
          - crew
          - damage control
      en-x-tlh:
        name: Duj Sep
        description: Duj Sep 'ej Duj Sep Sep. Duj Sep Sep Irneh yI'och. Sep,
          wa', chal, Duj Sep Sep 'ej Sep wa' 'ej Sep.
        keywords:
          - vehicle
          - tormentor
          - board
          - mount
          - crew
          - damage control
    # The Tormentor is not SRD content: this detail is our own wording —
    # numbers and short factual phrases only, never trait prose.
    detail:
      key: vehicle/tormentor-damage-control
      source: custom
      translations:
        en:
          meta: Huge Vehicle
          fields:
            - labelKey: rules.field.armorClass
              value: '21'
            - labelKey: rules.field.weight
              value: 3,000 lb.
          body: |
            A huge war vehicle, 3,000 lb. This station is damage control:
            riding along on crew duty that is neither the helm nor a weapon
            seat.

            **Modeled here.** Armor Class 21; Hit Points 60 (a fixed stat —
            damage tracking is not modeled yet); Speed 100 ft.; cargo capacity
            500 lb.; STR 16 (+3), DEX 14 (+2), CON 14 (+2). The vehicle has no
            Intelligence, Wisdom, or Charisma.

            **Not modeled yet.** Creature capacity and occupancy, the Helm and
            Harpoon Flinger stations, the driver's Juke reaction, the damage
            threshold and immunities, and the lower AC while motionless arrive
            in later updates.
