# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: demon-grinder
    # The SECOND per-vehicle rule group on the shared infernal-vehicle factory
    # (the settled design): the Demon Grinder is its OWN group, beside the
    # Tormentor's, and owning one of EACH vehicle group is legal (while ONE
    # seat per player holds globally across every vehicle). PR-3 landed the
    # SEAT-FREE base (acquire/abandon, occupancy, the HP recorders, the prone
    # pair, checks/saves and the derives); PR-4 added the Helm and one
    # Harpoon Flinger; PR-5 adds the Wrecking Ball. The Chomper follows.
    # Ungated: available to every character (acquire legality is not checked —
    # multiple acquisitions are illegal-but-possible).
    translations:
      en:
        name: Demon Grinder
        description: The Demon Grinder war vehicle. Acquire it to see its AC, HP,
          Speed, cargo capacity, and STR/DEX/CON while you ride.
        keywords:
          - vehicle
          - grinder
          - acquire
          - abandon
          - mount
      en-x-tlh:
        name: Duj Qaw'
        description: Duj Qaw' SuvwI' Duj. Duj Qaw' yISuq 'ej AC, HP, Do, ngIS
          'ej laH Duj Daj yIlegh.
        keywords:
          - vehicle
          - grinder
          - acquire
          - abandon
          - mount
    # The Demon Grinder is not SRD content: this detail is our own wording —
    # numbers and short factual phrases only, never trait prose. It reads
    # in-world (the vehicle and its numbers); nothing about the app. The AC is
    # FLAT (the stat block carries no motionless rider). PR-4 added the
    # Stations and Dash paragraphs; PR-5 adds the Wrecking Ball to the
    # Stations paragraph (the Chomper joins in its own pass).
    detail:
      key: vehicle/demon-grinder
      source: custom
      translations:
        en:
          meta: Gargantuan Vehicle
          fields:
            - labelKey: rules.field.armorClass
              value: '19'
            - labelKey: rules.field.weight
              value: 12,000 lb.
          body: |
            A Gargantuan infernal war vehicle, 12,000 lb., built to roll over
            whatever stands in its path. It carries 8 Medium creatures and
            1 ton of cargo (2,000 lb.).

            Armor Class 19; 200 hit points (damage threshold 10, mishap
            threshold 20); Speed 100 ft.; STR 18 (+4), DEX 10 (+0), CON 18
            (+4). The vehicle has no Intelligence, Wisdom, or Charisma, and
            shrugs off fire, poison, and psychic damage.

            **Stations.** The Helm drives and steers the Demon Grinder. The
            Wrecking Ball swings at +9 to hit, reach 15 ft., for 8d8+4
            bludgeoning damage, doubled against objects and structures. The
            Harpoon Flinger fires its 10 harpoons at +5 to hit, range
            120 ft., for 2d8 piercing damage.

            **Dash.** The driver can spend a bonus action to push the Demon
            Grinder flat out, doubling its movement for the turn. Each
            encounter the vehicle can Dash 3 times plus its Constitution
            modifier; each Dash beyond that runs the risk of damaging the
            vehicle.

            **Crushing Wheels.** The Demon Grinder can move through the space
            of a Large or smaller creature. Each creature it moves through for
            the first time on a turn must succeed on a DC 11 Dexterity saving
            throw or take 22 (4d10) bludgeoning damage and be knocked prone. A
            creature already prone takes an extra 22 (4d10) bludgeoning damage
            instead of being knocked prone. The wheels can catch a creature
            only once per turn.

            **Magic Weapons.** The Demon Grinder's weapon attacks are magical.

            **Prone Deficiency.** The Demon Grinder cannot right itself:
            fallen over, it stays prone and can do nothing until something
            flips it upright.
  # The vehicle's OWN prone text — the flip target for both prone offers and
  # the prone chip. A catalog-only entry (the find-steed `*-detail` pattern):
  # it exists to publish the detail JSON and contributes nothing to play.
  # Like the stat block above, our own wording in an in-world voice — the
  # player's condition/prone prose would promise a war machine crawling and
  # righting itself at the cost of movement.
  - id: demon-grinder-prone-detail
    translations:
      en:
        name: Prone (Demon Grinder)
        description: Detail text for the Demon Grinder's fallen-prone condition
        keywords:
          - prone
          - grinder
          - vehicle
          - fallen
          - flip upright
          - knocked down
          - condition
      en-x-tlh:
        name: Prone (Demon Grinder)
        description: Detail text for the Demon Grinder's fallen-prone condition
        keywords:
          - prone
          - grinder
          - vehicle
          - fallen
          - flip upright
          - condition
    detail:
      key: vehicle/demon-grinder-prone
      source: custom
      translations:
        en:
          meta: Vehicle Condition
          body: |
            **Fallen Prone.** Even a war machine can be knocked flat. Tipped
            onto its side — by a crash, a collision, or a blow too heavy to
            shrug off — the Demon Grinder has fallen prone, and its huge iron
            wheels are off the ground.

            **Prone Deficiency.** The Demon Grinder is a vehicle, not a
            creature, and it cannot right itself. It cannot crawl, and no
            amount of movement lifts it: fallen prone, it can do nothing. It
            stays on its side through every turn and every rest, until
            something flips it upright.

            **The Way Clear.** Flipping the war machine upright is the one way
            out of the condition — its crew hauling it over, or allies heaving
            together. The moment its wheels are back under it, the Demon
            Grinder is upright and ready to roll again.
  # The DAMAGE recorder's flip detail — the settled home for the stat block's
  # damage semantics (threshold, immunities, mishap): nothing here behaves
  # differently beyond the threshold the recorder gates on, so the explanation
  # rides the offer instead of standing notices. A catalog-only entry like the
  # prone detail above: our own wording, in-world voice, numbers and short
  # factual phrases only.
  - id: demon-grinder-damage-detail
    translations:
      en:
        name: Damage (Demon Grinder)
        description: Detail text for recording damage against the Demon Grinder
        keywords:
          - damage
          - grinder
          - vehicle
          - threshold
          - immunity
          - mishap
          - repairs
      en-x-tlh:
        name: Damage (Demon Grinder)
        description: Detail text for recording damage against the Demon Grinder
        keywords:
          - damage
          - grinder
          - vehicle
          - threshold
          - immunity
          - mishap
          - repairs
    detail:
      key: vehicle/demon-grinder-damage
      source: custom
      translations:
        en:
          meta: Vehicle Damage
          body: |
            The Demon Grinder is a Gargantuan war machine of iron, and damage
            against it does not land the way it does against flesh.

            **Damage Threshold 10.** A blow that deals less than ten damage
            leaves the Demon Grinder unmarked — record the blow as it is
            called and nothing is taken; the swing simply bounces off the
            armour plate. A blow of ten or more lands in full: the threshold
            is a floor, not a cap, and never subtracts from what gets
            through. To land a correction beneath the threshold, ignore it
            for that one record.

            **Immunities.** Fire, poison, and psychic damage cannot hurt the
            vehicle at all. Record none of it, however heavy the blow.

            **Mishap Threshold 20.** A single source that deals twenty or more
            damage to the Demon Grinder triggers a mishap — consult the
            mishap table for what breaks loose.
  # The HELM's flip detail — linked from the Drive and Dash offers. A
  # catalog-only entry like the Tormentor's: our own wording (the Demon
  # Grinder is not SRD), in-world voice for what the driver does, plus the
  # Dash rule — the 2024-format stat block takes the vehicle's Dash as a
  # bonus action under a per-encounter cap (3 + its Constitution modifier;
  # each Dash beyond that risks damaging the vehicle), the rule stated
  # without baking the computed total. NO Juke: the Demon Grinder's stat
  # block carries no Reaction, so the Helm has no reaction to spend. The
  # stat block's three-quarters cover for the Helm crew stays out: cover is
  # the table's business here (the Tormentor helm precedent).
  - id: demon-grinder-helm-detail
    translations:
      en:
        name: Helm (Demon Grinder)
        description: Detail text for driving the Demon Grinder from the Helm
        keywords:
          - helm
          - drive
          - dash
          - grinder
          - vehicle
          - driver
          - steer
      en-x-tlh:
        name: Helm (Demon Grinder)
        description: Detail text for driving the Demon Grinder from the Helm
        keywords:
          - helm
          - drive
          - dash
          - grinder
          - vehicle
          - driver
    detail:
      key: vehicle/demon-grinder-helm
      source: custom
      translations:
        en:
          meta: Vehicle Station
          body: |
            **Helm.** The Helm takes one crew member, and its driver holds the
            war machine's handle: **Drive** spends the driver's action
            steering the Demon Grinder through the turn.

            **Dash.** The driver can spend a bonus action pushing the Demon
            Grinder flat out, doubling its movement for the turn. Each
            encounter the vehicle can Dash 3 times plus its Constitution
            modifier; each Dash beyond that runs the risk of damaging the
            vehicle.
  # The HARPOON FLINGER's flip detail — linked from the fire offer. A
  # catalog-only entry like the Tormentor's: our own wording (the Demon
  # Grinder is not SRD), in-world voice for the numbers, plus the one
  # app-facing note the settled plan calls for (ammunition is display-only).
  # 120 ft. and one target live here and in the offer copy, not in range
  # machinery. The average damage (9) rides the prose beside the dice.
  - id: demon-grinder-harpoon-detail
    translations:
      en:
        name: Harpoon Flinger (Demon Grinder)
        description: Detail text for firing the Demon Grinder's Harpoon Flinger
        keywords:
          - harpoon
          - flinger
          - grinder
          - vehicle
          - attack
          - piercing
          - ranged
      en-x-tlh:
        name: Harpoon Flinger (Demon Grinder)
        description: Detail text for firing the Demon Grinder's Harpoon Flinger
        keywords:
          - harpoon
          - flinger
          - grinder
          - vehicle
          - attack
          - piercing
          - ranged
    detail:
      key: vehicle/demon-grinder-harpoon
      source: custom
      translations:
        en:
          meta: Vehicle Weapon
          fields:
            - labelKey: rules.field.range
              value: 120 ft.
            - labelKey: rules.field.damage
              value: 2d8 piercing
          body: |
            **Harpoon Flinger.** A ranged weapon attack: +5 to hit, range
            120 ft., one target, 2d8 piercing damage on a hit (average 9).
            The attack is made with an action while you hold the Harpoon
            Flinger seat.

            **Magic Weapons.** The flinger's harpoons are magical.

            **Ammunition.** The flinger's rack carries 10 harpoons. The app
            does not track how many have been fired — spent harpoons and
            reloads are the crew's bookkeeping.
  # The WRECKING BALL's flip detail — linked from the swing offer (PR-5). A
  # catalog-only entry like the flinger's: our own wording (the Demon Grinder
  # is not SRD), in-world voice for the numbers, plus the station's one RIDER
  # — the damage doubled against objects and structures — as COPY ONLY. No
  # mechanic doubles anything: what counts as an object or a structure is the
  # GM's call at the table, so the rule is stated here and on the offer row
  # and nothing is wired (the Tormentor "magical + 10 harpoons" precedent).
  # Reach 15 ft. and one target live here and in the offer copy, not in range
  # machinery; half cover stays out like every station's (cover is the
  # table's business here). The average damage (40) rides the prose beside
  # the dice. Keywords carry the whole name AND its distinct words: the
  # search index is prefix-based over whole standardized terms, so
  # 'wrecking ball' alone would index only wrec-onwards of 'wreckingball' —
  # 'wrecking' and 'ball' are what 'bal'-style queries hit (the PR-3
  # 'grinder' lesson).
  - id: demon-grinder-wrecking-ball-detail
    translations:
      en:
        name: Wrecking Ball (Demon Grinder)
        description: Detail text for swinging the Demon Grinder's Wrecking Ball
        keywords:
          - wrecking ball
          - wrecking
          - ball
          - grinder
          - vehicle
          - attack
          - bludgeoning
          - melee
          - structure
          - object
      en-x-tlh:
        name: Wrecking Ball (Demon Grinder)
        description: Detail text for swinging the Demon Grinder's Wrecking Ball
        keywords:
          - wrecking ball
          - wrecking
          - ball
          - grinder
          - vehicle
          - attack
          - bludgeoning
          - melee
          - structure
          - object
    detail:
      key: vehicle/demon-grinder-wrecking-ball
      source: custom
      translations:
        en:
          meta: Vehicle Weapon
          fields:
            - labelKey: rules.field.range
              value: 15 ft. reach
            - labelKey: rules.field.damage
              value: 8d8+4 bludgeoning
          body: |
            **Wrecking Ball.** A melee weapon attack: +9 to hit, reach
            15 ft., one target, 40 (8d8+4) bludgeoning damage on a hit. The
            swing is made with an action while you crew the Wrecking Ball.

            **Against Objects and Structures.** The ball's damage is doubled
            against objects and structures. What counts is the GM's call at
            the table — a wall, a gate or a siege tower falls twice as fast;
            a creature never does.

            **Magic Weapons.** The ball's attack is magical.
  # The FUEL and BOOST records' flip detail — linked from both helm-gated
  # record offers (the Tormentor pattern). A catalog-only entry like the
  # helm's: our own wording (the Demon Grinder is not SRD), in-world voice
  # for the fuels and their speeds, the boost rule, and the bonus-action cost
  # of each. The 1-minute duration is copy only — nothing times it for the
  # crew; when the minute is up, the driver records the boost as spent (sets
  # it back to none).
  - id: demon-grinder-fuel-detail
    translations:
      en:
        name: Fuel and Boost (Demon Grinder)
        description: Detail text for the Demon Grinder's fuel and boost records
        keywords:
          - fuel
          - boost
          - soul coin
          - grinder
          - vehicle
          - speed
          - burner
      en-x-tlh:
        name: Fuel and Boost (Demon Grinder)
        description: Detail text for the Demon Grinder's fuel and boost records
        keywords:
          - fuel
          - boost
          - soul coin
          - grinder
          - vehicle
          - speed
          - burner
    detail:
      key: vehicle/demon-grinder-fuel
      source: custom
      translations:
        en:
          meta: Vehicle Fuel
          body: |
            **Fuel.** The Demon Grinder runs on what its crew feeds the
            burner: no fuel and its wheels stand still (Speed 0), a soul coin
            drives it at 100 ft., and a flask of demon ichor burns at 80 ft.
            Setting the fuel takes a bonus action at the Helm.

            **Boost.** A flask of demon ichor poured into the boost tank
            takes a bonus action at the Helm and adds 30 ft. to the Demon
            Grinder's speed for 1 minute. The boost only burns while the
            machine runs on a soul coin. Nothing counts the minute for the
            crew: when it runs out, the driver records the boost as spent.
