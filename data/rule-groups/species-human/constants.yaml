# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: species-human
    translations:
      en:
        name: Human
        description: Human species constants and movement rules
        keywords: [human, species, race, movement]
      en-x-tlh:
        name: Human
        description: Human Segh
        keywords: [Human, Segh, Do]
    rules:
      # Grant Heroic Inspiration on Long Rest
      - id: human-hi-long-rest
        phase: early
        after:
          - group: hi-settle
        when:
          - fact: rest.long
            operator: equals
            value: 1
          - fact: heroicInspiration.remaining
            operator: equals
            value: 0
        activities:
          - type: numberSet
            source:
              number: 1
            target:
              fact: heroicInspiration.remaining
          - type: advertiseEffect
            rule:
              id: effect-hi
              phase: early
              after:
                - group: hi-consume
              group:
                - hi-settle
              ui:
                name: rule.dnd-5e-2024.heroic-inspiration.effect-hi.name
              activities:
                - type: numberSet
                  source:
                    number: 1
                  target:
                    fact: heroicInspiration.remaining
                  when:
                    - fact: heroicInspiration.consumed
                      operator: equals
                      value: 0
                - type: advertiseEffect
                  self: true
                  when:
                    - fact: heroicInspiration.consumed
                      operator: equals
                      value: 0

      # Max Distance
      - id: set-base-distance
        phase: early
        group:
          - species-constants
        activities:
          - type: numberSet
            target:
              fact: character.movement.total
            source:
              number: 30
          - type: numberSet
            target:
              fact: character.movement.swim.can
            source:
              number: 1
          - type: numberSet
            target:
              fact: character.movement.swim.cost
            source:
              number: 2
          - type: numberSet
            target:
              fact: character.movement.fly.can
            source:
              number: 0
