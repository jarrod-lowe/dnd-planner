# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: heroic-inspiration
    translations:
      en:
        name: Heroic Inspiration
        description: Track Heroic Inspiration
        keywords: [inspiration, heroic]
      en-x-tlh:
        name: SuvwI' SubchI'
        description: SuvwI' SubchI' track
        keywords: [SuvwI', SubchI']
    rules:
      # Reset consumed flag each evaluation
      - id: hi-consumed-reset
        phase: early
        group:
          - hi-init
        activities:
          - type: numberSet
            source:
              number: 0
            target:
              fact: heroicInspiration.consumed

      # Set max HI and declare UI stat
      - id: hi-max
        phase: early
        ui:
          stats:
            - name: play.stats.heroicInspiration
              type: value
              fact: heroicInspiration.remaining
              section: resources
        activities:
          - type: numberSet
            source:
              number: 1
            target:
              fact: heroicInspiration.max

      # Offer to grant HI (player marks DM gave inspiration)
      - id: grant-hi-offer
        after:
          - group: __planned__
        activities:
          - type: offerRule
            legalWhen:
              - condition:
                  fact: heroicInspiration.remaining
                  operator: lessThan
                  value: 1
                illegalDiagnostics:
                  - code: rule.dnd-5e-2024.heroic-inspiration.grant-hi-offer.already_has
                    severity: error
            rule:
              id: grant-hi
              phase: normal
              group:
                - hi-provide
              ui:
                section: other
                name: rule.dnd-5e-2024.heroic-inspiration.grant-hi.name
                intents: { AID: self }
                actionCost: []
              activities:
                - *error-clear
                - type: setAdd
                  target: { var: errors }
                  source: { string: rule.dnd-5e-2024.heroic-inspiration.grant-hi-offer.already_has }
                  when:
                    - fact: heroicInspiration.remaining
                      operator: greaterThanOrEqual
                      value: 1
                - type: numberSet
                  source:
                    number: 1
                  target:
                    fact: heroicInspiration.remaining

      # Offer to use HI (consume inspiration)
      - id: use-hi-offer
        after:
          - group: __planned__
        activities:
          - type: offerRule
            legalWhen:
              - condition:
                  fact: heroicInspiration.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.dnd-5e-2024.heroic-inspiration.use-hi-offer.no_inspiration
                    severity: error
            rule:
              id: use-hi
              phase: normal
              after:
                - group: hi-provide
              group:
                - hi-consume
              ui:
                section: other
                name: rule.dnd-5e-2024.heroic-inspiration.use-hi.name
                intents: { AID: self }
                actionCost: []
              activities:
                - *error-clear
                - type: setAdd
                  target: { var: errors }
                  source: { string: rule.dnd-5e-2024.heroic-inspiration.use-hi-offer.no_inspiration }
                  when:
                    - fact: heroicInspiration.remaining
                      operator: lessThan
                      value: 1
                - type: numberSet
                  source:
                    number: 1
                  target:
                    fact: heroicInspiration.consumed
                - type: numberSet
                  source:
                    number: 0
                  target:
                    fact: heroicInspiration.remaining

      # Advertise effect-hi-set when HI is available and not consumed
      - id: hi-effect-advertise
        phase: safeguard
        when:
          - fact: heroicInspiration.remaining
            operator: greaterThan
            value: 0
          - fact: heroicInspiration.consumed
            operator: equals
            value: 0
        activities:
          - type: advertiseEffect
            rule:
              id: effect-hi-set
              phase: early
              group:
                - hi-set
              ui:
                name: rule.dnd-5e-2024.heroic-inspiration.effect-hi.name
              activities:
                - type: numberSet
                  source:
                    number: 1
                  target:
                    fact: heroicInspiration.remaining
                  when:
                    - fact: heroicInspiration.consumed
                      operator: equals
                      value: 0

      # Annotate dice panels when HI is available
      - id: annotate-hi
        phase: normal
        after:
          - group: hi-consume
        when:
          - fact: heroicInspiration.remaining
            operator: greaterThan
            value: 0
        activities:
          - type: annotate
            key: rule.dnd-5e-2024.heroic-inspiration.annotation
            targets: [dice.any]
