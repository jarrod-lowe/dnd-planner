ruleGroups:
  - id: heroic-inspiration
    translations:
      en:
        name: Heroic Inspiration
        description: Track Heroic Inspiration
        keywords:
          - inspiration
          - heroic
      en-x-tlh:
        name: SuvwI' SubchI'
        description: SuvwI' SubchI' track
        keywords:
          - SuvwI'
          - SubchI'
    detail:
      key: rule/heroic-inspiration
      source: srd52
      translations:
        en:
          meta: Rules Glossary
          body: |
            If you (a player character) have Heroic Inspiration, you can expend
            it to reroll any die immediately after rolling it, and you must use
            the new roll.

            If you gain Heroic Inspiration but already have it, it's lost unless
            you give it to a player character who lacks it.

