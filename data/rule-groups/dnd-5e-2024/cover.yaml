    translations:
      en:
        name: Cover
        description: Record the degree of cover you are behind — half (+2 AC and Dex saves), three-quarters (+5), or total
        keywords:
          - cover
          - half cover
          - three-quarters cover
          - total cover
          - defense
          - obstacle
          - wall
      en-x-tlh:
        name: So'ghach
        description: bIngDaq So'ghach Dalo'bogh yIghItlh — bID, wej bID, ghap naQ
        keywords:
          - So'ghach
          - bID
          - naQ
    detail:
      key: rule/cover
      source: srd52
      translations:
        en:
          meta: Rules Glossary
          body: |
            **Cover.** Cover provides a degree of protection to a target behind it. There are three degrees of cover, each of which provides a different benefit to a target: Half Cover (+2 bonus to AC and Dexterity saving throws), Three-Quarters Cover (+5 bonus to AC and Dexterity saving throws), and Total Cover (can't be targeted directly).

            If behind more than one degree of cover, a target benefits only from the most protective degree. A target can benefit from cover only when an attack or other effect originates on the opposite side of the cover.
