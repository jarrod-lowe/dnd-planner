# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: skill-checks
    translations:
      en:
        name: Skill Checks
        description: d20 rollers for all skills
        keywords: [skill, check, roll, ability]
      en-x-tlh:
        name: laH mugh
        description: laH mugh mugh
        keywords: [laH, mugh]
    rules:
      # Acrobatics — leader (no packBehind)
      - id: roll-skill-acrobatics-offer
        after:
          - group: __planned__
        activities:
          - type: offerRule
            rule:
              id: roll-skill-acrobatics
              group:
                - __planned__
              ui:
                model: d20-roll
                section: free
                name: play.stats.skills.acrobatics
                disadvantageFact: skill.acrobatics.disadvantage
                primaryControl:
                  type: dice-line
                  dice:
                    - expression: d20
                      bonus: { var: rollBonus }
                  advantage: { fact: skill.acrobatics.disadvantage }
              vars:
                rollBonus:
                  capture: true
                  default:
                    fact: skill.acrobatics.value
              activities: []

