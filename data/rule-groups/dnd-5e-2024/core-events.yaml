# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: core-events
    translations:
      en:
        name: Core Events
        description: Built-in rules for recording game events (damage, healing, saves, checks, rests, notes)
        keywords: [event, record, damage, heal, save, check, rest, note]
      en-x-tlh:
        name: DLon ngoD
        description: DLon DIvI' DIvI' DIvI' DIvI' DIvI'
        keywords: [DLon, DIvI', DIvI']
    rules:
      # === DAMAGE recording ===
      # Records damage taken, triggers concentration check if concentrating.
      - id: offer-record-damage
        after:
          - group: __planned__
        activities:
          - type: offerRule
            rule:
              id: record-damage
              group:
                - __planned__
              after:
                - group: hp-copied
                - group: __effects__
              ui:
                section: free
                name: planner.record.damage
                primaryControl:
                  type: slider
                  var: amount
                  min: { number: 0 }
                  max: { fact: hp.max }
                  unit: hp
                intents:
                  HEALTH: hp
                actionCost: []
              vars:
                amount:
                  capture: true
                  default:
                    number: 0
              activities:
                - type: numberIncrement
                  target:
                    fact: hp.current
                  source:
                    var: amount
                  subtract: true
                - type: advertiseEffect
                  rule:
                    id: effect-hp-damage
                    ui:
                      name: rule.dnd-5e-2024.core-events.effect-hp-damage.name
                      displaySelection: amount
                      section: health
                    phase: normal
                    after:
                      - group: hp-copied
                    when:
                      - fact: rest.long
                        operator: equals
                        value: 0
                    vars:
                      amount:
                        capture: true
                        default:
                          number: 0
                    activities:
                      - type: numberIncrement
                        target:
                          fact: hp.current
                        source:
                          var: amount
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                - type: numberSet
                  target:
                    fact: concentration.damage-taken
                  source:
                    number: 1
                  when:
                    - fact: concentration.remaining
                      operator: lessThanOrEqual
                      value: 0

