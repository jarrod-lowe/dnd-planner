                primaryControl:
                  type: dice-line
                  dice:
                    - sides: 20
                      bonus: { var: saveBonus }
                      purpose: save
                secondaryControl:
                  type: segmented
                  var: passed
                  options:
                    - value: -1
                      label: planner.record.outcome.none
                    - value: 1
                      label: planner.record.passed
                    - value: 0
                      label: planner.record.failed
                intents:
                  SAVE: you
                actionCost: []
              vars:
                saveBonus:
                  capture: true
                  default:
                    fact: str.save
                passed:
                  capture: true
                  default:
                    number: -1
              activities:
                - type: numberSet
                  target:
                    fact: event.save-last-result
                  source:
                    var: passed

