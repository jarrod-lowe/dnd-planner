ruleGroups:
  - id: feat-sentinel
    condition:
      - type: or
        clauses:
          - fact: str.value
            operator: greaterThanOrEqual
            value: 13
          - fact: dex.value
            operator: greaterThanOrEqual
            value: 13
    translations:
      en:
        name: Sentinel
        description: Opportunist. You strike foes who attack others and cannot be
          avoided by Disengaging.
        keywords:
          - sentinel
          - feat
          - opportunity
          - attack
          - reaction
          - melee
      en-x-tlh:
        name: Sentinel
        description: Sentinel DIvI'. DIch DIvI' DIch 'ej DIch DIvI' DIvI'.
        keywords:
          - sentinel
          - DIvI'
          - DIch
          - jey'
    settings:
      - id: sentinel-ability-score
        type: select
        translations:
          en:
            name: Ability Score Increase (+1)
          en-x-tlh:
            name: laH chel (+1)
        options:
          - value: str
            translations:
              en:
                name: Strength
              en-x-tlh:
                name: HoS
          - value: dex
            translations:
              en:
                name: Dexterity
              en-x-tlh:
                name: Do
        effect:
          id: sentinel-asi-${value}
          key: sentinel-asi-${value}
          state:
            ${value}.value: 1
          # Named for the strip's reveal toggle; hidden from the default view.
          display:
            name: rules.settings.sentinel-asi.${value}
            displayFact: ${value}.value
            hidden: true
          expiry:
            kind: permanent
