# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: ability-scores
    translations:
      en:
        name: Ability Scores
        description: Set ability scores for your character
        keywords: [ability, score, strength, dexterity, constitution, intelligence, wisdom, charisma, stats]
      en-x-tlh:
        name: laH
        description: laHlIj Dangu'
        keywords: [laH, HoS, Do, "'et", val, Sov, Quv]
    rules:
      - id: str-value-reset
        phase: early
        activities: []
        ui:
          stats:
            - name: play.stats.str
              type: value
              fact: str.value
              modifierFact: str.modifier
              saveFact: str.save
              section: stats

      - id: str-save-modifier
        phase: normal
        activities:
          - type: numberIncrement
            target:
              fact: str.save
            source:
              fact: str.modifier

      - id: set-strength-offer
        after:
          - group: __planned__
        activities:
          - type: offerRule
            legalWhen:
              - condition:
                  fact: str.value
                  operator: equals
                  value: 0
                illegalDiagnostics:
                  - code: rule.dnd-5e-2024.ability-scores.set-strength-offer.already_set
                    severity: error
            rule:
              id: set-strength
              group:
                - __planned__
              ui:
                model: ability-score
                section: configuration
                name: rule.dnd-5e-2024.ability-scores.set-strength.name
              vars:
                score:
                  capture: true
                  default:
                    number: 10
              activities:
                # Set str.value from the slider
                - type: numberSet
                  target:
                    fact: str.value
                  source:
                    var: score
                # Compute str.modifier from the score
                - type: numberFunction
                  function: statToModifier
                  sources:
                    - var: score
                  target:
                    fact: str.modifier
                # Create a persistent effect that sustains forever
                - type: advertiseEffect
                  rule:
                    id: effect-strength
                    phase: early
                    group:
                      - str-values
                    ui:
                      name: rule.dnd-5e-2024.ability-scores.effect-strength.name
                    vars:
                      score:
                        capture: true
                        default:
                          number: 10
                    activities:
                      # Re-set str.value from the stored score
                      - type: numberSet
                        target:
                          fact: str.value
                        source:
                          var: score
                      # Re-compute str.modifier
                      - type: numberFunction
                        function: statToModifier
                        sources:
                          - var: score
                        target:
                          fact: str.modifier
                      # Self-sustain forever (no when condition)
                      - type: advertiseEffect
                        self: true

