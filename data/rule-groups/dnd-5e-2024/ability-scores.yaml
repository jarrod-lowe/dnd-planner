# yaml-language-server: $schema=../schema.json
refs:
  ability-score-control: &ability-score-control
    type: slider
    var: score
    max: { var: maxValue }
    min: { number: 0 }
    step: 1

ruleGroups:
  - id: ability-scores
    translations:
      en:
        name: Ability Scores
        description: Set ability scores for your character
        keywords: [ability, score, strength, dexterity, constitution, intelligence, wisdom, charisma, stats]
      en-x-tlh:
        name: laH
        description: laHlIj Dangu'
        keywords: [laH, HoS, Do, "'et", val, Sov, Quv]
    rules:
      - id: str-value-reset
        phase: early
        group:
          - str-values
        activities: []
        ui:
          stats:
            - name: play.stats.str
              type: value
              fact: str.value
              modifierFact: str.modifier
              saveFact: str.save
              section: stats
          topBar:
            - type: ability
              label: play.topBar.abilities
              abilities:
                - name: play.stats.str
                  fact: str.modifier
                  proficiencyFact: str.save.proficient
                - name: play.stats.dex
                  fact: dex.modifier
                  proficiencyFact: dex.save.proficient
                - name: play.stats.con
                  fact: con.modifier
                  proficiencyFact: con.save.proficient
                - name: play.stats.int
                  fact: int.modifier
                  proficiencyFact: int.save.proficient
                - name: play.stats.wis
                  fact: wis.modifier
                  proficiencyFact: wis.save.proficient
                - name: play.stats.cha
                  fact: cha.modifier
                  proficiencyFact: cha.save.proficient

      - id: str-save-modifier
        phase: normal
        activities:
          - type: numberIncrement
            target:
              fact: str.save
            source:
              fact: str.modifier

      - id: str-modifier-compute
        phase: early
        after:
          - group: str-base-set
          - group: str-increases
        group:
          - str-modifier-ready
        activities:
          - type: numberFunction
            function: statToModifier
            sources:
              - fact: str.value
            target:
              fact: str.modifier

      - id: set-strength-offer
        after:
          - group: __planned__
        activities:
          - type: offerRule
            legalWhen:
              - condition:
                  fact: str.value
                  operator: equals
                  value: 0
                illegalDiagnostics:
                  - code: rule.dnd-5e-2024.ability-scores.set-strength-offer.already_set
                    severity: error
            rule:
              id: set-strength
              phase: early
              after:
                - group: str-values
              group:
                - __planned__
                - str-base-set
              ui:
                section: configuration
                name: rule.dnd-5e-2024.ability-scores.set-strength.name
                primaryControl: *ability-score-control
                intents: { STAT: set }
                actionCost: []
              vars:
                score:
                  capture: true
                  default:
                    number: 10
                maxValue:
                  default:
                    number: 30
              activities:
                # Error tracking
                - *error-clear
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.dnd-5e-2024.ability-scores.set-strength-offer.already_set
                  when:
                    - fact: str.value
                      operator: notEquals
                      value: 0
                # Set str.value from the slider
                - type: numberSet
                  target:
                    fact: str.value
                  source:
                    var: score
                # Create a persistent effect that sustains forever
                - type: advertiseEffect
                  rule:
                    id: effect-strength
                    phase: early
                    group:
                      - str-values
                      - Stats
                    ui:
                      name: rule.dnd-5e-2024.ability-scores.effect-strength.name
                      hidden: true
                      displayFact: str.value
                      primaryControl: *ability-score-control
                    vars:
                      score:
                        capture: true
                        default:
                          number: 10
                      maxValue:
                        default:
                          number: 30
                    activities:
                      # Re-set str.value from the stored score
                      - type: numberSet
                        target:
                          fact: str.value
                        source:
                          var: score
                      # Self-sustain forever (no when condition)
                      - type: advertiseEffect
                        self: true

