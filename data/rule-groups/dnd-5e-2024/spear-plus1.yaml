# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: spear-plus1
    requires:
      - attacks
      - hands
    translations:
      en:
        name: Spear +1
        description: Attack rules for a +1 spear, a magical simple melee weapon dealing 1d6+1 piercing (versatile 1d8+1)
        keywords: [attack, spear, weapon, melee, throwable, versatile, damage, magical]
      en-x-tlh:
        name: yan cha'
        description: yan 'ej jey' naQ cha'
        keywords: [jey', yan, nuH]
    detail:
      key: weapon/spear-plus1
      source: srd52
      translations:
        en:
          meta: 'Magic Weapon, Uncommon (+1)'
          fields:
            - { labelKey: rules.field.damage, value: '1d6 piercing (1d8 two-handed)' }
            - { labelKey: rules.field.properties, value: 'Thrown (Range 20/60), Versatile (1d8)' }
            - { labelKey: rules.field.mastery, value: 'Sap' }
            - { labelKey: rules.field.weight, value: '3 lb.' }
          body: |
            You have a bonus to attack rolls and damage rolls made with this
            magic weapon. The bonus is determined by the weapon's rarity; this
            spear is Uncommon, so the bonus is +1.
    rules:
      # Compute spear+1 hit bonus = STR modifier + proficiency bonus + 1 (enhancement)
      - id: compute-spear-plus1-hit-bonus
        phase: normal
        activities:
          - type: numberSum
            target:
              fact: attack.spear-plus1.hitBonus
            sources:
              - fact: str.modifier
              - fact: proficiency.bonus
              - number: 1

      # Compute spear+1 damage bonus = STR modifier + 1 (enhancement)
      - id: compute-spear-plus1-damage-bonus
        phase: normal
        activities:
          - type: numberSum
            target:
              fact: attack.spear-plus1.damageBonus
            sources:
              - fact: str.modifier
              - number: 1

      # Mark the weapon as magical
      - id: annotate-spear-plus1-magical
        phase: normal
        activities:
          - type: annotate
            key: rule.dnd-5e-2024.spear-plus1.magical
            targets:
              - property.magical
