# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: action-economy
    requires:
      - core-events
    translations:
      en:
        name: Action Economy
        description: Core rules for action points per turn
        keywords: [actions, action, economy]
      en-x-tlh:
        name: DIvI' DIvI'
        description: DIvI' DIvI' naQ wa'DIch
        keywords: [DIvI']
    rules:
      # Action Resources - set max actions (base rule: 1 action per turn)
      - id: action-max
        phase: early
        group:
          - action-max
        ui:
          stats:
            - name: play.stats.actions
              type: usedMax
              total: actions.max
              remaining: actions.remaining
              section: resources
          resources:
            - type: usedMax
              label: play.stats.actions
              total: actions.max
              remaining: actions.remaining
        activities:
          - type: numberSet
            source:
              number: 1
            target:
              fact: actions.max

      # Action Resources - reset remaining at start of turn
      - id: action-reset
        phase: early
        after:
          - group: action-max
        activities:
          - type: numberCopy
            source:
              fact: actions.max
            target:
              fact: actions.remaining

      # Bonus Action Resources - set max bonus actions (base rule: 1 per turn)
      - id: bonus-action-max
        phase: early
        group:
          - bonus-action-max
        ui:
          stats:
            - name: play.stats.bonusActions
              type: usedMax
              total: bonusActions.max
              remaining: bonusActions.remaining
              section: resources
          resources:
            - type: usedMax
              label: play.stats.bonusActions
              total: bonusActions.max
              remaining: bonusActions.remaining
        activities:
          - type: numberSet
            source:
              number: 1
            target:
              fact: bonusActions.max

      # Bonus Action Resources - reset remaining at start of turn
      - id: bonus-action-reset
        phase: early
        after:
          - group: bonus-action-max
        activities:
          - type: numberCopy
            source:
              fact: bonusActions.max
            target:
              fact: bonusActions.remaining

      # Reaction Resources - add base reaction (1 per turn)
      # Uses numberIncrement so future features can add extra reactions without ordering
      - id: reaction-max
        phase: early
        group:
          - reaction-max
        ui:
          stats:
            - name: play.stats.reactions
              type: usedMax
              total: reactions.max
              remaining: reactions.remaining
              section: resources
          resources:
            - type: usedMax
              label: play.stats.reactions
              total: reactions.max
              remaining: reactions.remaining
        activities:
          - type: numberIncrement
            source:
              number: 1
            target:
              fact: reactions.max

      # Reaction Resources - reset remaining at start of turn
      - id: reaction-reset
        phase: early
        after:
          - group: reaction-max
        activities:
          - type: numberCopy
            source:
              fact: reactions.max
            target:
              fact: reactions.remaining

      # Extra Attack budget - free follow-up attacks left in the current
      # Attack-action chain. Reset to 0 each turn. extraAttacks.max (the number
      # of extra attacks granted per Attack action) is left undefined here and
      # raised via numberIncrement by class features (e.g. Paladin L5), mirroring
      # the reaction-max pattern so multiple sources stack without ordering.
      - id: extra-attack-reset
        phase: early
        activities:
          - type: numberSet
            source:
              number: 0
            target:
              fact: attackAction.extraRemaining

      # Compute whether an Attack action is available: legal if a normal action
      # remains OR a free follow-up attack remains. legalWhen entries are AND-ed
      # with no native OR, so the attack offers gate on this computed fact.
      # Runs after planned attacks settle so it reflects spent actions/budget.
      - id: extra-attack-can-attack
        phase: normal
        after:
          - group: __planned__
        group:
          - ea-canattack
        activities:
          - type: numberSet
            source:
              number: 0
            target:
              fact: attackAction.canAttack
          - type: numberSet
            source:
              number: 1
            target:
              fact: attackAction.canAttack
            when:
              - fact: actions.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            source:
              number: 1
            target:
              fact: attackAction.canAttack
            when:
              - fact: attackAction.extraRemaining
                operator: greaterThan
                value: 0

      # Remind the player that an Extra Attack follow-up is available. Shown only
      # once the Attack action has been taken and a follow-up charge remains
      # (extraRemaining > 0) — not before the first attack, and not on the swing
      # that exhausts the budget. Targets attack.action so it appears only on
      # Attack-action attacks (weapon / unarmed / grapple / shove), not on
      # reaction or bonus-action attacks which cannot use the budget.
      - id: extra-attack-annotate
        phase: normal
        after:
          - group: __planned__
        when:
          - fact: attackAction.extraRemaining
            operator: greaterThan
            value: 0
        activities:
          - type: annotate
            key: rule.dnd-5e-2024.attacks.extra-attack.annotation
            targets: [attack.action]
