ruleGroups:
  - id: condition-frightened
    requires: []
    translations:
      en:
        name: Frightened
        description: Rules while you have the Frightened condition; record it when an effect frightens you, and toggle whether the source of fear is in sight
        keywords:
          - frightened
          - fear
          - scared
          - afraid
          - condition
          - line of sight
      en-x-tlh:
        name: ghIjlu'pu'
        description: ghIjlu'pu' Dotlh; ghIjlu'DI' yIghun, ghIjwI' leghlu'ghach yIwIvnIS
        keywords:
          - ghIj
          - ghIjlu'pu'
          - Dotlh
    detail:
      key: condition/frightened
      source: srd52
      translations:
        en:
          meta: Condition
          body: |
            **Frightened [Condition].** While you have the Frightened condition, you experience the following effects.

            **Ability Checks and Attacks Affected.** You have Disadvantage on ability checks and attack rolls while the source of fear is within line of sight.

            **Can't Approach.** You can't willingly move closer to the source of fear.
