ruleGroups:
  - id: condition-exhaustion
    requires:
      - movement
    translations:
      en:
        name: Exhaustion
        description: Rules while you have the Exhaustion condition; record a level each time you receive it — die at 6, a Long Rest removes one
        keywords:
          - exhaustion
          - exhausted
          - fatigue
          - tired
          - level
          - condition
          - death
          - long rest
      en-x-tlh:
        name: ngoy'taH
        description: ngoy'taH Dotlh; DaHevDI' wa' Sab yIghun — javDI' bIHegh, Qong naQ wa' Sab pol
        keywords:
          - ngoy'
          - ngoy'taH
          - Dotlh
    detail:
      key: condition/exhaustion
      source: srd52
      translations:
        en:
          meta: Condition
          body: |
            **Exhaustion [Condition].** While you have the Exhaustion condition, you experience the following effects.

            **Exhaustion Levels.** This condition is cumulative. Each time you receive it, you gain 1 Exhaustion level. You die if your Exhaustion level is 6.

            **D20 Tests Affected.** When you make a D20 Test, the roll is reduced by 2 times your Exhaustion level.

            **Speed Reduced.** Your Speed is reduced by a number of feet equal to 5 times your Exhaustion level.

            **Removing Exhaustion Levels.** Finishing a Long Rest removes 1 of your Exhaustion levels. When your Exhaustion level reaches 0, the condition ends.
