# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: shove
    translations:
      en:
        name: Shove
        description: Core rules for the Shove action
        keywords: [shove, action, attack, strength, push, prone]
      en-x-tlh:
        name: DIvI' puv
        description: DIvI' puv DIvI' naQ
        keywords: [puv, DIvI', HIv, HoS]
    detail:
      key: attack/shove
      source: srd52
      translations:
        en:
          meta: 'Unarmed Strike Option'
          fields:
            - { labelKey: rules.field.range, value: '5 feet' }
            - { labelKey: rules.field.dc, value: '8 + Strength modifier + Proficiency Bonus' }
          body: |
            **Shove.** The target must succeed on a Strength or Dexterity saving
            throw (it chooses which), or you either push it 5 feet away or cause
            it to have the Prone condition. The DC for the saving throw equals 8
            plus your Strength modifier and Proficiency Bonus. This shove is
            possible only if the target is no more than one size larger than you.
    rules:
      # Compute shove DC = 8 + proficiency bonus + STR modifier
      - id: compute-shove-dc
        phase: normal
        activities:
          - type: numberSum
            target:
              fact: shove.dc
            sources:
              - number: 8
              - fact: proficiency.bonus
              - fact: str.modifier

      # Offer shove as an action. A Shove is an Unarmed Strike option and counts
      # as an attack within the Attack action, so it participates in the Extra
      # Attack budget like other action attacks.
      - id: action-shove-offer
        after:
          - group: action
          - group: __planned__
          - group: ea-canattack
        activities:
          - type: offerRule
            legalWhen:
              - condition:
                  fact: attackAction.canAttack
                  operator: equals
                  value: 1
                illegalDiagnostics:
                  - code: rule.dnd-5e-2024.shove.action-shove-offer.no_action
                    severity: error
            rule:
              id: shove-action
              ui:
                section: action-attack
                packBehind: unarmed-strike-use-action
                name: rule.dnd-5e-2024.shove.shove-action.name
                description: rule.dnd-5e-2024.shove.shove-action.description
                detailKey: attack/shove
                vsKey: play.choices.contested.vsStrDex
                outcomeKey: play.choices.shove.outcome
                annotationLabels: [attack.action]
                primaryControl:
                  type: dice-line
                  annotationLabels: [dice.any]
                  dice:
                    - sides: 20
                      bonus: { var: dc }
                      purpose: to-hit
                intents: { ATTACK: brawl }
                actionCost: [action]
              vars:
                dc:
                  capture: true
                  default:
                    fact: shove.dc
              group:
                - __planned__
                - action
              activities:
                # Extra Attack budget: spend a free follow-up if one is open,
                # otherwise spend an action and open the follow-up budget.
                - type: numberCopy
                  source:
                    fact: attackAction.extraRemaining
                  target:
                    fact: attackAction.wasExtra
                  id: snapshot-extra
                - type: numberCopy
                  source:
                    fact: actions.remaining
                  target:
                    fact: attackAction.actionsBefore
                  id: snapshot-actions
                - type: numberIncrement
                  target:
                    fact: attackAction.extraRemaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: attackAction.wasExtra
                      operator: greaterThan
                      value: 0
                  id: spend-extra
                - type: numberIncrement
                  target:
                    fact: actions.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: attackAction.wasExtra
                      operator: lessThanOrEqual
                      value: 0
                  id: action-cost
                - type: numberCopy
                  source:
                    fact: extraAttacks.max
                  target:
                    fact: attackAction.extraRemaining
                  when:
                    - fact: attackAction.wasExtra
                      operator: lessThanOrEqual
                      value: 0
                    - fact: attackAction.actionsBefore
                      operator: greaterThan
                      value: 0
                  id: refill-extra
                - *error-clear
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.dnd-5e-2024.shove.action-shove-offer.no_action
                  when:
                    - fact: attackAction.wasExtra
                      operator: lessThanOrEqual
                      value: 0
                    - fact: attackAction.actionsBefore
                      operator: lessThanOrEqual
                      value: 0
