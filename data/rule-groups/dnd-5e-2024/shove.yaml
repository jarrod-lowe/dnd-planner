# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: shove
    translations:
      en:
        name: Shove
        description: Core rules for the Shove action
        keywords: [shove, action, attack, strength, push, prone]
      en-x-tlh:
        name: DIvI' puv
        description: DIvI' puv DIvI' naQ
        keywords: [puv, DIvI', HIv, HoS]
    rules:
      # Compute shove DC = 8 + proficiency bonus + STR modifier
      - id: compute-shove-dc
        phase: normal
        activities:
          - type: numberSum
            target:
              fact: shove.dc
            sources:
              - number: 8
              - fact: proficiency.bonus
              - fact: str.modifier

      # Offer shove as an action
      - id: action-shove-offer
        after:
          - group: action
          - group: __planned__
        activities:
          - type: offerRule
            legalWhen:
              - condition:
                  fact: actions.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.dnd-5e-2024.shove.action-shove-offer.no_action
                    severity: error
            rule:
              id: shove-action
              ui:
                section: action-attack
                packBehind: unarmed-strike-use-action
                name: rule.dnd-5e-2024.shove.shove-action.name
                vsKey: play.choices.contested.vsStrDex
                outcomeKey: play.choices.shove.outcome
                primaryControl:
                  type: dice-line
                  annotationLabels: [dice.any]
                  dice:
                    - expression: d20
                      bonus: { var: dc }
              vars:
                dc:
                  capture: true
                  default:
                    fact: shove.dc
              group:
                - __planned__
                - action
              activities:
                - type: numberIncrement
                  target:
                    fact: actions.remaining
                  source:
                    number: 1
                  subtract: true
                - *error-clear
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.dnd-5e-2024.shove.action-shove-offer.no_action
                  when:
                    - fact: actions.remaining
                      operator: lessThan
                      value: 0
