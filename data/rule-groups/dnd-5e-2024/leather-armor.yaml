                      - type: numberSet
                        target:
                          fact: attack.disadvantage
                        source:
                          number: 1
                        when:
                          fact: armor.light.proficient
                          operator: notEquals
                          value: 1
                      - type: numberSet
                        target:
                          fact: initiative.disadvantage
                        source:
                          number: 1
                        when:
                          fact: armor.light.proficient
                          operator: notEquals
                          value: 1
                      - type: numberSet
                        target:
                          fact: skill.acrobatics.disadvantage
                        source:
                          number: 1
                        when:
                          fact: armor.light.proficient
                          operator: notEquals
                          value: 1
                      - type: numberSet
                        target:
                          fact: skill.animal-handling.disadvantage
                        source:
                          number: 1
                        when:
                          fact: armor.light.proficient
                          operator: notEquals
                          value: 1
                      - type: numberSet
                        target:
                          fact: skill.arcana.disadvantage
                        source:
                          number: 1
                        when:
                          fact: armor.light.proficient
                          operator: notEquals
                          value: 1
                      - type: numberSet
                        target:
                          fact: skill.athletics.disadvantage
                        source:
                          number: 1
                        when:
                          fact: armor.light.proficient
                          operator: notEquals
                          value: 1
                      - type: numberSet
                        target:
                          fact: skill.deception.disadvantage
                        source:
                          number: 1
                        when:
                          fact: armor.light.proficient
                          operator: notEquals
                          value: 1
                      - type: numberSet
                        target:
                          fact: skill.history.disadvantage
                        source:
                          number: 1
                        when:
                          fact: armor.light.proficient
                          operator: notEquals
                          value: 1
                      - type: numberSet
                        target:
                          fact: skill.insight.disadvantage
                        source:
                          number: 1
                        when:
                          fact: armor.light.proficient
                          operator: notEquals
                          value: 1
                      - type: numberSet
                        target:
                          fact: skill.intimidation.disadvantage
                        source:
                          number: 1
                        when:
                          fact: armor.light.proficient
                          operator: notEquals
                          value: 1
                      - type: numberSet
                        target:
                          fact: skill.investigation.disadvantage
                        source:
                          number: 1
                        when:
                          fact: armor.light.proficient
                          operator: notEquals
                          value: 1
                      - type: numberSet
                        target:
                          fact: skill.medicine.disadvantage
                        source:
                          number: 1
                        when:
                          fact: armor.light.proficient
                          operator: notEquals
                          value: 1
                      - type: numberSet
                        target:
                          fact: skill.nature.disadvantage
                        source:
                          number: 1
                        when:
                          fact: armor.light.proficient
                          operator: notEquals
                          value: 1
                      - type: numberSet
                        target:
                          fact: skill.perception.disadvantage
                        source:
                          number: 1
                        when:
                          fact: armor.light.proficient
                          operator: notEquals
                          value: 1
                      - type: numberSet
                        target:
                          fact: skill.performance.disadvantage
                        source:
                          number: 1
                        when:
                          fact: armor.light.proficient
                          operator: notEquals
                          value: 1
                      - type: numberSet
                        target:
                          fact: skill.persuasion.disadvantage
                        source:
                          number: 1
                        when:
                          fact: armor.light.proficient
                          operator: notEquals
                          value: 1
                      - type: numberSet
                        target:
                          fact: skill.religion.disadvantage
                        source:
                          number: 1
                        when:
                          fact: armor.light.proficient
                          operator: notEquals
                          value: 1
                      - type: numberSet
                        target:
                          fact: skill.sleight-of-hand.disadvantage
                        source:
                          number: 1
                        when:
                          fact: armor.light.proficient
                          operator: notEquals
                          value: 1
                      - type: numberSet
                        target:
                          fact: skill.stealth.disadvantage
                        source:
                          number: 1
                        when:
                          fact: armor.light.proficient
                          operator: notEquals
                          value: 1
                      - type: numberSet
                        target:
                          fact: skill.survival.disadvantage
