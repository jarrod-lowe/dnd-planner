ruleGroups:
  - id: leather-armor
    requires:
      - ac
    translations:
      en:
        name: Leather Armor
        description: Light armor providing AC 11 + Dex
        keywords:
          - armor
          - leather
          - light
          - ac
          - equipment
      en-x-tlh:
        name: DIch Jun
        description: DIch Jun nob DIvI'
        keywords:
          - DIch
          - Jun
    detail:
      key: equipment/leather-armor
      source: srd52
      translations:
        en:
          meta: Light Armor
          fields:
            - labelKey: rules.field.armorClass
              value: 11 + Dex modifier
            - labelKey: rules.field.stealth
              value: Normal
            - labelKey: rules.field.weight
              value: 10 lb.
            - labelKey: rules.field.donDoff
              value: 1 minute to don or doff
          body: 'Leather Armor is Light Armor: your base Armor Class equals 11 plus

            your Dexterity modifier.


            If you wear Light, Medium, or Heavy armor and lack training with it,

            you have Disadvantage on any D20 Test that involves Strength or

            Dexterity, and you can''t cast spells. You can wear only one suit of

            armor at a time.

            '
