ruleGroups:
  - id: condition-unconscious
    requires:
      - movement
      - condition-incapacitated
      - condition-prone
    translations:
      en:
        name: Unconscious
        description: Rules while you have the Unconscious condition; record it when an effect knocks you out, Regain Consciousness when you wake
        keywords:
          - unconscious
          - unconsciousness
          - knocked out
          - asleep
          - sleeping
          - wake
          - condition
      en-x-tlh:
        name: QongtaH
        description: QongtaH Dotlh; QongmoHlu'DI' yIghun, vemDI' yIvemqa'
        keywords:
          - Qong
          - vem
          - Dotlh
    detail:
      key: condition/unconscious
      source: srd52
      translations:
        en:
          meta: Condition
          body: |
            **Unconscious [Condition].** While you have the Unconscious condition, you experience the following effects.

            **Inert.** You have the Incapacitated and Prone conditions, and you drop whatever you're holding. When this condition ends, you remain Prone.

            **Speed 0.** Your Speed is 0 and can't increase.

            **Attacks Affected.** Attack rolls against you have Advantage.

            **Saving Throws Affected.** You automatically fail Strength and Dexterity saving throws.

            **Automatic Critical Hits.** Any attack roll that hits you is a Critical Hit if the attacker is within 5 feet of you.

            **Unaware.** You're unaware of your surroundings.
