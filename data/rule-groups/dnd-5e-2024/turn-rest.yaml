# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: turn-rest
    translations:
      en:
        name: Turn and Rest
        description: Core rules for turn counting and rest management
        keywords: [rest, long rest, short rest]
      en-x-tlh:
        name: wa'DIch 'ej nIb poH
        description: wa'DIch 'ej nIb poH DIvI' naQ
        keywords: [wa'DIch, nIb, poH]
    rules:
      - id: rest-long-reset
        phase: early
        activities: []

      # Long Rest - offer the long rest action
      - id: offer-long-rest
        after:
          - group: __planned__
        activities:
          - type: offerRule
            rule:
              id: long-rest
              ui:
                section: rest
                name: rule.dnd-5e-2024.turn-rest.long-rest.name
                intents: { REST: type }
                actionCost: []
              group:
                - __planned__
              phase: early
              activities:
                - type: numberSet
                  target:
                    fact: rest.long
                  source:
                    number: 1

      # Short Rest - offer the short rest action
      - id: offer-short-rest
        after:
          - group: __planned__
        activities:
          - type: offerRule
            rule:
              id: short-rest
              ui:
                section: rest
                name: rule.dnd-5e-2024.turn-rest.short-rest.name
                intents: { REST: type }
                actionCost: []
              group:
                - __planned__
              phase: early
              activities:
                - type: numberSet
                  target:
                    fact: rest.short
                  source:
                    number: 1
