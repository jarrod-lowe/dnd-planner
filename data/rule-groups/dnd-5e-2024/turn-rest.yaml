# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: turn-rest
    translations:
      en:
        name: Turn and Rest
        description: Core rules for turn counting and rest management
        keywords: [turn, rest, long rest, short rest, counter]
      en-x-tlh:
        name: wa'DIch 'ej nIb poH
        description: wa'DIch 'ej nIb poH DIvI' naQ
        keywords: [wa'DIch, nIb, poH]
    rules:
      - id: rest-long-reset
        phase: early
        activities: []

      # Long Rest - offer the long rest action
      - id: offer-long-rest
        after:
          - group: __planned__
        activities:
          - type: offerRule
            rule:
              id: long-rest
              ui:
                section: rest
                name: rule.dnd-5e-2024.turn-rest.long-rest.name
              group:
                - __planned__
              phase: early
              activities:
                - type: numberSet
                  target:
                    fact: rest.long
                  source:
                    number: 1

      # Short Rest - offer the short rest action
      - id: offer-short-rest
        after:
          - group: __planned__
        activities:
          - type: offerRule
            rule:
              id: short-rest
              ui:
                section: rest
                name: rule.dnd-5e-2024.turn-rest.short-rest.name
              group:
                - __planned__
              phase: early
              activities:
                - type: numberSet
                  target:
                    fact: rest.short
                  source:
                    number: 1

      # Turn Counter - increments each turn, never resets
      # On each evaluation, the standing rule increments from 0 to 1 and advertises
      # a new effect. Previously committed effects also increment by 1 each.
      # Counter = 1 (standing) + N (existing effects) = turn number.
      - id: turn-counter-increment
        phase: early
        group:
          - turn-counter
        ui:
          stats:
            - name: play.stats.turnCounter
              type: value
              fact: turn.counter
              section: turn
        activities:
          - type: numberIncrement
            target:
              fact: turn.counter
            source:
              number: 1
          - type: advertiseEffect
            when:
              - fact: turn.counter
                operator: equals
                value: 1
            rule:
              id: effect-turn-counter
              phase: early
              activities:
                - type: numberIncrement
                  target:
                    fact: turn.counter
                  source:
                    number: 1
                - type: advertiseEffect
                  self: true
