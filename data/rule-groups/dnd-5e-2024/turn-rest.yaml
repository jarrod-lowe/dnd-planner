# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: turn-rest
    translations:
      en:
        name: Turn and Rest
        description: Core rules for turn counting and long rest management
        keywords: [turn, rest, long rest, counter]
      en-x-tlh:
        name: wa'DIch 'ej nIb poH
        description: wa'DIch 'ej nIb poH DIvI' naQ
        keywords: [wa'DIch, nIb, poH]
    rules:
      - id: rest-long-reset
        phase: early
        activities: []

      # Long Rest - offer the long rest action
      - id: offer-long-rest
        after:
          - group: __planned__
        activities:
          - type: offerRule
            rule:
              id: long-rest
              ui:
                model: rest
                section: rest
                name: rule.dnd-5e-2024.turn-rest.long-rest.name
              group:
                - __planned__
              phase: early
              activities:
                - type: numberSet
                  target:
                    fact: rest.long
                  source:
                    number: 1

      # Turn Counter - increments each turn, never resets
      - id: turn-counter-increment
        phase: early
        group:
          - turn-counter
        ui:
          stats:
            - name: play.stats.turnCounter
              type: value
              fact: turn.counter
              section: turn
        activities:
          - type: numberIncrement
            target:
              fact: turn.counter
            source:
              number: 1
