ruleGroups:
  - id: feat-savage-attacker
    translations:
      en:
        name: Savage Attacker
        description: Origin Feat. You've trained to deal particularly damaging strikes.
          Once per turn when you hit a target with a weapon, you can roll the weapon's
          damage dice twice and use either roll against the target.
        keywords:
          - savage
          - attacker
          - feat
          - damage
          - weapon
          - reroll
          - origin
      en-x-tlh:
        name: Qaw' SuvwI'
