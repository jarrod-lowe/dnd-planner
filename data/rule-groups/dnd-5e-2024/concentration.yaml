# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: concentration
    translations:
      en:
        name: Concentration
        description: Tracks concentration state — only one concentration spell can be active at a time.
        keywords: [concentration, spell, resource]
      en-x-tlh:
        name: buQ
        description: buQ DIvI' DIch DIvI' DIch DIvI' naQ.
        keywords: [buQ, DIvI', laH]
    rules:
      # Concentration resource - set max (1 slot, binary)
      - id: concentration-max
        phase: early
        ui:
          stats:
            - name: play.stats.concentration
              type: usedMax
              total: concentration.max
              remaining: concentration.remaining
              section: magic
          topBar:
            - type: concentration
              label: play.topBar.conc
              activeLabel: play.topBar.concActive
              noneLabel: play.topBar.concNone
        activities:
          - type: numberSet
            source:
              number: 1
            target:
              fact: concentration.max

      # Reset concentration remaining each turn
      - id: concentration-reset
        phase: early
        after:
          - group: concentration-max
        activities:
          - type: numberCopy
            source:
              fact: concentration.max
            target:
              fact: concentration.remaining

      # Offer concentration check when damage is taken while concentrating
      # Activates when core-events damage recording sets concentration.damage-taken = 1
      - id: offer-concentration-check
        after:
          - group: __planned__
        when:
          - fact: concentration.damage-taken
            operator: equals
            value: 1
          - fact: concentration.remaining
            operator: lessThanOrEqual
            value: 0
        activities:
          - type: offerRule
            rule:
              id: concentration-check
              group:
                - __planned__
              ui:
                section: free
                name: planner.concentration.check
                intents:
                  SAVE: you
                actionCost: []
              vars:
                passed:
                  capture: true
                  default:
                    number: 1
              activities:
                - type: numberSet
                  target:
                    fact: concentration.check-passed
                  source:
                    var: passed
                - type: numberSet
                  target:
                    fact: concentration.damage-taken
                  source:
                    number: 0
