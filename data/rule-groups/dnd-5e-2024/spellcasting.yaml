# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: spellcasting
    requires:
      - concentration
    translations:
      en:
        name: Spellcasting
        description: Core spellcasting rules for spell slots and spell actions per turn
        keywords: [spellcasting, spell, magic, slots]
      en-x-tlh:
        name: mugh DIvI'
        description: mugh DIvI' 'ej mugh DIvI' naQ
        keywords: [mugh, DIvI', laH]
    rules:
      # Spellcasting Resources - set max spells per turn (base rule: 1 per turn)
      - id: spellcasting-max
        phase: early
        group:
          - spellcasting-max
        ui:
          stats:
            - name: play.stats.spellcasting
              type: usedMax
              total: spellcasting.max
              remaining: spellcasting.remaining
              section: resources
        activities:
          - type: numberSet
            source:
              number: 1
            target:
              fact: spellcasting.max

      # Spellcasting Resources - reset remaining at start of turn
      - id: spellcasting-reset
        phase: early
        after:
          - group: spellcasting-max
        activities:
          - type: numberCopy
            source:
              fact: spellcasting.max
            target:
              fact: spellcasting.remaining

      # Spell Save DC - computed from proficiency + spellcasting ability modifier
      - id: spellcasting-save-dc
        phase: normal
        after:
          - group: spellcasting-modifier-set
        ui:
          stats:
            - name: play.stats.spellSaveDC
              type: value
              fact: spellcasting.saveDC
              section: magic
        activities:
          - type: numberSet
            target:
              fact: spellcasting.saveDC
            source:
              number: 8
          - type: numberIncrement
            target:
              fact: spellcasting.saveDC
            source:
              fact: proficiency.bonus
          - type: numberIncrement
            target:
              fact: spellcasting.saveDC
            source:
              fact: spellcasting.modifier

      # Spell Slots - UI stats for all slot levels
      - id: spellcasting-slots-total
        phase: early
        activities: []
        ui:
          stats:
            - name: play.stats.spellLevel
              nameParams: { level: 1 }
              type: usedMax
              total: spellcasting.slots.level1.total
              remaining: spellcasting.slots.level1.remaining
              section: magic
            - name: play.stats.spellLevel
              nameParams: { level: 2 }
              type: usedMax
              total: spellcasting.slots.level2.total
              remaining: spellcasting.slots.level2.remaining
              section: magic
            - name: play.stats.spellLevel
              nameParams: { level: 3 }
              type: usedMax
              total: spellcasting.slots.level3.total
              remaining: spellcasting.slots.level3.remaining
              section: magic
            - name: play.stats.spellLevel
              nameParams: { level: 4 }
              type: usedMax
              total: spellcasting.slots.level4.total
              remaining: spellcasting.slots.level4.remaining
              section: magic
            - name: play.stats.spellLevel
              nameParams: { level: 5 }
              type: usedMax
              total: spellcasting.slots.level5.total
              remaining: spellcasting.slots.level5.remaining
              section: magic
            - name: play.stats.spellLevel
              nameParams: { level: 6 }
              type: usedMax
              total: spellcasting.slots.level6.total
              remaining: spellcasting.slots.level6.remaining
              section: magic
            - name: play.stats.spellLevel
              nameParams: { level: 7 }
              type: usedMax
              total: spellcasting.slots.level7.total
              remaining: spellcasting.slots.level7.remaining
              section: magic
            - name: play.stats.spellLevel
              nameParams: { level: 8 }
              type: usedMax
              total: spellcasting.slots.level8.total
              remaining: spellcasting.slots.level8.remaining
              section: magic
            - name: play.stats.spellLevel
              nameParams: { level: 9 }
              type: usedMax
              total: spellcasting.slots.level9.total
              remaining: spellcasting.slots.level9.remaining
              section: magic

      # Spell Slots - reset all current to totals on long rest only
      - id: spellcasting-slots-reset
        phase: early
        after:
          - group: spellcasting-slots-set
          - group: spell-slot-effect
        when:
          - fact: rest.long
            operator: equals
            value: 1
        activities:
          - type: numberCopy
            source:
              fact: spellcasting.slots.level1.total
            target:
              fact: spellcasting.slots.level1.remaining
          - type: numberCopy
            source:
              fact: spellcasting.slots.level2.total
            target:
              fact: spellcasting.slots.level2.remaining
          - type: numberCopy
            source:
              fact: spellcasting.slots.level3.total
            target:
              fact: spellcasting.slots.level3.remaining
          - type: numberCopy
            source:
              fact: spellcasting.slots.level4.total
            target:
              fact: spellcasting.slots.level4.remaining
          - type: numberCopy
            source:
              fact: spellcasting.slots.level5.total
            target:
              fact: spellcasting.slots.level5.remaining
          - type: numberCopy
            source:
              fact: spellcasting.slots.level6.total
            target:
              fact: spellcasting.slots.level6.remaining
          - type: numberCopy
            source:
              fact: spellcasting.slots.level7.total
            target:
              fact: spellcasting.slots.level7.remaining
          - type: numberCopy
            source:
              fact: spellcasting.slots.level8.total
            target:
              fact: spellcasting.slots.level8.remaining
          - type: numberCopy
            source:
              fact: spellcasting.slots.level9.total
            target:
              fact: spellcasting.slots.level9.remaining

      # Prepared Spell Capacity - compute remaining slots
      - id: compute-prepared-remaining
        phase: normal
        activities:
          - type: numberCopy
            source:
              fact: spellcasting.prepared.max
            target:
              fact: spellcasting.prepared.remaining
          - type: numberIncrement
            target:
              fact: spellcasting.prepared.remaining
            source:
              fact: spellcasting.prepared.count
            subtract: true
