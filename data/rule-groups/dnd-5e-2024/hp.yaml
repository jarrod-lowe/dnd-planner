# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: hp
    translations:
      en:
        name: Hit Points
        description: Core rules for hit points tracking
        keywords: [hit points, hp, health]
      en-x-tlh:
        name: DIch DIvI'
        description: DIch DIvI' naQ
        keywords: [DIch, DIvI']
    rules:
      # HP Reset - sets hp.max to 0, declares two-group pattern
      - id: hp-reset
        phase: normal
        group:
          - hp-total
          - hp-set
        activities:
          - type: numberSet
            target:
              fact: hp.max
            source:
              number: 0

      # HP Copy - after all class levels contribute, copy max to current
      - id: hp-copy
        phase: normal
        group:
          - hp-copied
        after:
          - group: hp-set
        activities:
          - type: numberCopy
            source:
              fact: hp.max
            target:
              fact: hp.current

      # === MAX HP MODIFIER OFFER ===
      - id: set-hp-modifier-max-offer
        after:
          - group: __planned__
        activities:
          - type: offerRule
            rule:
              id: set-hp-modifier-max
              group:
                - __planned__
              ui:
                section: health
                name: rule.dnd-5e-2024.hp.set-hp-modifier-max.name
                sliderMin: -10
                sliderMax: 30
                primaryControl:
                  type: slider
                  var: modifier
                  min: { number: -10 }
                  max: { number: 30 }
                intents: { HANDLE: gear }
                actionCost: []
              vars:
                modifier:
                  capture: true
                  default:
                    number: 0
                maxValue:
                  default:
                    number: 30
              activities:
                - type: numberSet
                  target:
                    fact: hp.modifier.max
                  source:
                    var: modifier
                - type: numberIncrement
                  target:
                    fact: hp.max
                  source:
                    var: modifier
                - type: advertiseEffect
                  rule:
                    id: effect-hp-modifier-max
                    phase: normal
                    after:
                      - group: hp-total
                    group:
                      - hp-set
                    vars:
                      modifier:
                        capture: true
                        default:
                          number: 0
                    activities:
                      - type: numberSet
                        target:
                          fact: hp.modifier.max
                        source:
                          var: modifier
                      - type: numberIncrement
                        target:
                          fact: hp.max
                        source:
                          var: modifier
                      - type: advertiseEffect
                        self: true

      # === CURRENT HP MODIFIER OFFER ===
      - id: set-hp-modifier-current-offer
        after:
          - group: __planned__
        activities:
          - type: offerRule
            rule:
              id: set-hp-modifier-current
              group:
                - __planned__
              after:
                - group: hp-copied
              ui:
                section: health
                name: rule.dnd-5e-2024.hp.set-hp-modifier-current.name
                sliderMin: -30
                sliderMax: 30
                primaryControl:
                  type: slider
                  var: modifier
                  min: { number: -30 }
                  max: { number: 30 }
                intents: { HANDLE: gear }
                actionCost: []
              vars:
                modifier:
                  capture: true
                  default:
                    number: 0
                maxValue:
                  default:
                    number: 30
              activities:
                - type: numberSet
                  target:
                    fact: hp.modifier.current
                  source:
                    var: modifier
                - type: numberIncrement
                  target:
                    fact: hp.current
                  source:
                    var: modifier
                - type: advertiseEffect
                  rule:
                    id: effect-hp-modifier-current
                    phase: normal
                    after:
                      - group: hp-copied
                    vars:
                      modifier:
                        capture: true
                        default:
                          number: 0
                    activities:
                      - type: numberSet
                        target:
                          fact: hp.modifier.current
                        source:
                          var: modifier
                      - type: numberIncrement
                        target:
                          fact: hp.current
                        source:
                          var: modifier
                      - type: advertiseEffect
                        self: true

      # HP Display - show in resources section
      - id: hp-display
        activities: []
        ui:
          stats:
            - name: play.stats.hp
              type: usedMax
              total: hp.max
              remaining: hp.current
              section: resources
