ruleGroups:
  - id: class-paladin-paladin-smite
    requires:
      - spell-divine-smite
    translations:
      en:
        name: Paladin's Smite
        description: You always have the Divine Smite spell prepared (it does not
          count against your prepared-spell limit), and you can cast it once per Long
          Rest without expending a spell slot.
        keywords:
          - paladin
          - smite
          - radiant
          - damage
          - bonus action
          - free
          - prepared
      en-x-tlh:
        name: DIch Qaw'
        description: reH quv Qaw' mugh SoH; wa' Long Rest mugh laH lo'Ha' DIvI' laH.
        keywords:
          - paladin
          - Qaw'
          - DIch
