# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: class-paladin-paladin-smite
    # Granted by taking Paladin level 2 (class-paladin-level2 requires this group).
    # Depend only on the Divine Smite spell — depending back on level 2 would
    # create a requires cycle that blocks removal of either in Manage Rules.
    requires:
      - spell-divine-smite
    translations:
      en:
        name: Paladin's Smite
        description: >-
          You always have the Divine Smite spell prepared (it does not count
          against your prepared-spell limit), and you can cast it once per Long
          Rest without expending a spell slot.
        keywords: [paladin, smite, radiant, damage, bonus action, free, prepared]
      en-x-tlh:
        name: DIch Qaw'
        description: >-
          reH quv Qaw' mugh SoH; wa' Long Rest mugh laH lo'Ha' DIvI' laH.
        keywords: [paladin, Qaw', DIch]
    rules:
      # Divine Smite is always prepared for a Paladin from level 2.
      # This grant does NOT consume a prepared-spell slot
      # (spellcasting.prepared.count is untouched) and the alwaysPrepared flag
      # blocks the Unprepare offer in spells/divine-smite.yaml.
      - id: paladin-smite-always-prepared
        phase: early
        group:
          - always-prepared-set
        activities:
          - type: numberSet
            target:
              fact: spell.l1.divineSmite.prepared
            source:
              number: 1
          - type: numberSet
            target:
              fact: spell.l1.divineSmite.alwaysPrepared
            source:
              number: 1

      # Set total free uses and initialize remaining
      - id: paladin-smite-set-total
        phase: early
        group:
          - paladin-smite-set
        activities:
          - type: numberIncrement
            target:
              fact: paladinSmite.total
            source:
              number: 1
          - type: numberIncrement
            target:
              fact: paladinSmite.remaining
            source:
              number: 1

      # UI stats display
      - id: paladin-smite-ui
        phase: early
        activities: []
        ui:
          stats:
            - name: play.stats.paladinSmite
              type: usedMax
              total: paladinSmite.total
              remaining: paladinSmite.remaining
              section: resources
          resources:
            - type: usedMax
              label: play.stats.paladinSmite
              total: paladinSmite.total
              remaining: paladinSmite.remaining

      # Reset on Long Rest
      - id: paladin-smite-reset
        phase: early
        after:
          - group: paladin-smite-set
          - group: paladin-smite-effect
        when:
          - fact: rest.long
            operator: equals
            value: 1
        activities:
          - type: numberCopy
            source:
              fact: paladinSmite.total
            target:
              fact: paladinSmite.remaining
