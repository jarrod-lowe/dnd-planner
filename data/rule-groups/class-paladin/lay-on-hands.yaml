ruleGroups:
  - id: class-paladin-lay-on-hands
    translations:
      en:
        name: Lay on Hands
        description: Paladins can draw on a pool of healing power to restore hit points
          or cure poison
        keywords:
          - paladin
          - lay on hands
          - heal
          - cure
          - poison
      en-x-tlh:
        name: ghop Du
        description: Segh ghop Du lo' DIch DIvI' 'ej DIvI'
        keywords:
          - paladin
          - ghop
          - DIch
    detail:
      key: class-feature/lay-on-hands
      source: srd52
      translations:
        en:
          meta: Paladin Level 1 Feature
          body: 'Your blessed touch can heal wounds. You have a pool of healing power

            that replenishes when you finish a Long Rest. With that pool, you can

            restore a total number of Hit Points equal to five times your Paladin

            level.


            As a Bonus Action, you can touch a creature (which could be yourself)

            and draw power from the pool of healing to restore a number of Hit

            Points to that creature, up to the maximum amount remaining in the

            pool.


            You can also expend 5 Hit Points from the pool of healing power to

            remove the Poisoned condition from the creature; those points don''t

            also restore Hit Points to the creature.

            '
