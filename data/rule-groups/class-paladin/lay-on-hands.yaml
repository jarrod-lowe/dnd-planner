# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: class-paladin-lay-on-hands
    translations:
      en:
        name: Lay on Hands
        description: Paladins can draw on a pool of healing power to restore hit points or cure poison
        keywords: [paladin, lay on hands, heal, cure, poison]
      en-x-tlh:
        name: ghop Du
        description: Segh ghop Du lo' DIch DIvI' 'ej DIvI'
        keywords: [paladin, ghop, DIch]
    detail:
      key: class-feature/lay-on-hands
      source: srd52
      translations:
        en:
          meta: 'Paladin Level 1 Feature'
          body: |
            Your blessed touch can heal wounds. You have a pool of healing power
            that replenishes when you finish a Long Rest. With that pool, you can
            restore a total number of Hit Points equal to five times your Paladin
            level.

            As a Bonus Action, you can touch a creature (which could be yourself)
            and draw power from the pool of healing to restore a number of Hit
            Points to that creature, up to the maximum amount remaining in the
            pool.

            You can also expend 5 Hit Points from the pool of healing power to
            remove the Poisoned condition from the creature; those points don't
            also restore Hit Points to the creature.
    rules:
      # Lay on Hands Pool - UI stats display
      - id: loh-pool-ui
        phase: early
        activities: []
        ui:
          stats:
            - name: play.stats.layOnHands
              type: usedMax
              total: layOnHands.pool.total
              remaining: layOnHands.pool.remaining
              section: resources
          resources:
            - type: usedMax
              label: play.stats.layOnHands
              total: layOnHands.pool.total
              remaining: layOnHands.pool.remaining

      # Lay on Hands Pool - reset on Long Rest
      - id: loh-pool-reset
        phase: early
        after:
          - group: loh-pool-set
          - group: loh-pool-effect
        when:
          - fact: rest.long
            operator: equals
            value: 1
        activities:
          - type: numberCopy
            source:
              fact: layOnHands.pool.total
            target:
              fact: layOnHands.pool.remaining

      # Lay on Hands - Heal (bonus action)
      - id: offer-loh-heal
        after:
          - group: __planned__
        activities:
          - type: offerRule
            legalWhen:
              - condition: *has-bonus-action
                illegalDiagnostics:
                  - code: rule.class-paladin-lay-on-hands.offer-loh-heal.no_bonus_action
                    severity: error
              - condition:
                  fact: layOnHands.pool.remaining
                  operator: greaterThanOrEqual
                  value: 1
                illegalDiagnostics:
                  - code: rule.class-paladin-lay-on-hands.offer-loh-heal.pool_empty
                    severity: error
            rule:
              id: loh-heal
              group:
                - __planned__
              ui:
                section: bonus-action-other
                name: rule.class-paladin-lay-on-hands.loh-heal.name
                detailKey: class-feature/lay-on-hands
                sliderMin: 1
                primaryControl:
                  type: slider
                  var: amount
                  min: { number: 1 }
                  max: { var: maxValue }
                intents:
                  AID: self
                actionCost: [bonus, LoH]
              vars:
                amount:
                  capture: true
                  default:
                    fact: layOnHands.pool.remaining
                maxValue:
                  capture: true
                  default:
                    fact: layOnHands.pool.total
              activities:
                - type: numberIncrement
                  target:
                    fact: bonusActions.remaining
                  source:
                    number: 1
                  subtract: true
                - type: numberIncrement
                  target:
                    fact: layOnHands.pool.remaining
                  source:
                    var: amount
                  subtract: true
                - *error-clear
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.class-paladin-lay-on-hands.offer-loh-heal.no_bonus_action
                  when:
                    - fact: bonusActions.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.class-paladin-lay-on-hands.offer-loh-heal.pool_empty
                  when:
                    - fact: layOnHands.pool.remaining
                      operator: lessThan
                      value: 0
                - type: advertiseEffect
                  rule:
                    id: effect-loh-heal
                    phase: early
                    group:
                      - loh-pool-effect
                    when:
                      - fact: rest.long
                        operator: equals
                        value: 0
                    ui:
                      section: lay-on-hands
                      name: rule.class-paladin-lay-on-hands.loh-heal.name
                      detailKey: class-feature/lay-on-hands
                      primaryControl:
                        type: slider
                        var: amount
                        min: { number: 1 }
                        max: { var: maxValue }
                    vars:
                      amount:
                        capture: true
                        default:
                          fact: layOnHands.pool.remaining
                      maxValue:
                        capture: true
                        default:
                          fact: layOnHands.pool.total
                    activities:
                      - type: numberIncrement
                        target:
                          fact: layOnHands.pool.remaining
                        source:
                          var: amount
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0

      # Lay on Hands - Purify Poison (bonus action)
      - id: offer-loh-purify-poison
        after:
          - group: __planned__
        activities:
          - type: offerRule
            legalWhen:
              - condition: *has-bonus-action
                illegalDiagnostics:
                  - code: rule.class-paladin-lay-on-hands.offer-loh-purify-poison.no_bonus_action
                    severity: error
              - condition:
                  fact: layOnHands.pool.remaining
                  operator: greaterThanOrEqual
                  value: 5
                illegalDiagnostics:
                  - code: rule.class-paladin-lay-on-hands.offer-loh-purify-poison.insufficient_pool
                    severity: error
            rule:
              id: loh-purify-poison
              group:
                - __planned__
              ui:
                section: bonus-action-other
                name: rule.class-paladin-lay-on-hands.loh-purify-poison.name
                detailKey: class-feature/lay-on-hands
                intents:
                  AID: self
                actionCost: [bonus, LoH]
              activities:
                - type: numberIncrement
                  target:
                    fact: bonusActions.remaining
                  source:
                    number: 1
                  subtract: true
                - type: numberIncrement
                  target:
                    fact: layOnHands.pool.remaining
                  source:
                    number: 5
                  subtract: true
                - *error-clear
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.class-paladin-lay-on-hands.offer-loh-purify-poison.no_bonus_action
                  when:
                    - fact: bonusActions.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.class-paladin-lay-on-hands.offer-loh-purify-poison.insufficient_pool
                  when:
                    - fact: layOnHands.pool.remaining
                      operator: lessThan
                      value: 0
                - type: advertiseEffect
                  rule:
                    id: effect-loh-purify
                    phase: early
                    group:
                      - loh-pool-effect
                    when:
                      - fact: rest.long
                        operator: equals
                        value: 0
                    ui:
                      section: lay-on-hands
                      name: rule.class-paladin-lay-on-hands.loh-purify-poison.name
                      detailKey: class-feature/lay-on-hands
                    activities:
                      - type: numberIncrement
                        target:
                          fact: layOnHands.pool.remaining
                        source:
                          number: 5
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
