ruleGroups:
  - id: class-paladin-oath-redemption-level3
    requires:
      - class-paladin-level3
      - class-paladin-divinity
      - spell-sanctuary
      - spell-sleep
    translations:
      en:
        name: Oath of Redemption Level 3
        description: 'Paladin Oath of Redemption features at level 3, including the
          Rebuke the Violent and Emissary of Peace divinity channel options

          '
        keywords:
          - paladin
          - oath
          - redemption
          - level3
          - divinity
          - rebuke
          - emissary
          - peace
      en-x-tlh:
        name: Oath of Redemption Level 3
        description: 'Paladin Oath of Redemption level 3, Rebuke the Violent DIvI''
          Emissary of Peace rojDuy

          '
        keywords:
          - paladin
          - oath
          - redemption
          - level3
          - DIvI'
          - rebuke
          - rojDuy
    detail:
      key: class-feature/rebuke-the-violent
      source: custom
      translations:
        en:
          meta: Channel Divinity (Oath of Redemption)
          fields:
            - labelKey: rules.field.castingTime
              value: 1 Reaction (when a nearby creature is damaged by an attack)
            - labelKey: rules.field.range
              value: 30 feet
            - labelKey: rules.field.dc
              value: Wisdom save vs your spell save DC
          body: |
            When a creature you can see within 30 feet of you harms another
            creature — not you — with an attack, you can spend your Reaction and
            one use of Channel Divinity to chasten the aggressor. The attacker
            must roll a Wisdom saving throw against your spell save DC, taking
            radiant damage matching the harm it just inflicted on a failure, or
            only half that amount if it succeeds.
