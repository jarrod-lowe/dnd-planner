# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: class-paladin-level2
    requires:
      - class-paladin-level1
      - class-paladin-paladin-smite
    translations:
      en:
        name: Paladin Level 2
        description: Paladin class features at level 2, including an expanded Lay on Hands pool
        keywords: [paladin, class, level2, lay on hands]
      en-x-tlh:
        name: Paladin Level 2
        description: Paladin Segh level 2, ghop Du chel
        keywords: [paladin, segh, level2, ghop]
    rules:
      # Hit Die - Level 2 Paladin adds 1d10
      - id: paladin-level2-hit-die
        phase: early
        group:
          - hit-die-base
        activities:
          - type: numberIncrement
            target:
              fact: hitDie.d10.total
            source:
              number: 1

      # HP - Level 2 Paladin adds average d10 (6) + captured CON modifier at level-up time
      - id: paladin-level2-hp
        phase: normal
        after:
          - group: hp-total
        group:
          - hp-set
        vars:
          conAtLevel:
            capture: true
            default:
              fact: con.modifier
        activities:
          - type: numberIncrement
            target:
              fact: hp.max
            source:
              number: 6
          - type: numberIncrement
            target:
              fact: hp.base.max
            source:
              number: 6
          - type: numberIncrement
            target:
              fact: hp.max
            source:
              var: conAtLevel
          - type: numberIncrement
            target:
              fact: hp.base.max
            source:
              var: conAtLevel

      # Prepared Spell Capacity - Level 2 Paladin adds 1 more prepared spell
      - id: paladin-level2-prepared-max
        phase: early
        activities:
          - type: numberIncrement
            target:
              fact: spellcasting.prepared.max
            source:
              number: 1

      # Lay on Hands Pool - Level 2 Paladin adds 5 more points
      - id: paladin-level2-lay-on-hands-pool
        phase: early
        group:
          - loh-pool-set
        activities:
          - type: numberIncrement
            target:
              fact: layOnHands.pool.total
            source:
              number: 5
          - type: numberIncrement
            target:
              fact: layOnHands.pool.remaining
            source:
              number: 5
