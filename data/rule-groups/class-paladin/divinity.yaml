ruleGroups:
  - id: class-paladin-divinity
    translations:
      en:
        name: Divinity
        description: Paladins draw on divine power to fuel special abilities
        keywords:
          - paladin
          - divinity
          - divine
          - channel
      en-x-tlh:
        name: DIvI'
        description: Segh DIvI' DIvI' DIch
        keywords:
          - paladin
          - DIvI'
          - DIch
    detail:
      key: class-feature/divine-sense
      source: srd52
      translations:
        en:
          meta: Channel Divinity (Paladin)
          body: 'You can channel divine energy directly from the Outer Planes to fuel

            magical effects, starting with Divine Sense. You can use Channel

            Divinity twice; you regain one expended use when you finish a Short

            Rest and all expended uses when you finish a Long Rest.


            *Divine Sense.* As a Bonus Action, you can open your awareness to

            detect Celestials, Fiends, and Undead. For the next 10 minutes or

            until you have the Incapacitated condition, you know the location of

            any creature of those types within 60 feet of yourself, and you know

            its creature type. Within the same radius, you also detect the

            presence of any place or object that has been consecrated or

            desecrated, as with the Hallow spell.

            '
