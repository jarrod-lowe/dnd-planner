# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: class-paladin-divine-smite
    requires:
      - class-paladin-level2
    translations:
      en:
        name: Divine Smite
        description: >-
          Paladin Level 2 bonus action. When you hit with a melee weapon or
          unarmed strike, expend a spell slot to deal radiant damage.
        keywords: [paladin, divine, smite, radiant, damage, bonus action]
      en-x-tlh:
        name: quv Qaw'
        description: >-
          DIch level 2 bonus action. DIch nuH DIch DIvI' DIvI' DIvI'.
        keywords: [paladin, quv, Qaw']
    rules:
      # Compute eligible smite slot count (levels 1-5)
      - id: compute-smite-eligible-slots
        phase: normal
        group:
          - smite-slots-computed
        activities:
          - type: numberSum
            target:
              fact: smite.eligibleSlotsRemaining
            sources:
              - fact: spellcasting.slots.level1.remaining
              - fact: spellcasting.slots.level2.remaining
              - fact: spellcasting.slots.level3.remaining
              - fact: spellcasting.slots.level4.remaining
              - fact: spellcasting.slots.level5.remaining

      # Offer Divine Smite (bonus action, gated on attack action taken)
      - id: offer-divine-smite
        after:
          - group: __planned__
          - group: spellcasting
          - group: smite-slots-computed
        activities:
          - type: offerRule
            legalWhen:
              - condition:
                  fact: bonusActions.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.class-paladin-divine-smite.offer-divine-smite.no_bonus_action
                    severity: error
              - condition:
                  fact: attack.last.activation.action
                  operator: equals
                  value: 1
                illegalDiagnostics:
                  - code: rule.class-paladin-divine-smite.offer-divine-smite.no_attack
                    severity: error
              - condition:
                  fact: smite.eligibleSlotsRemaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.class-paladin-divine-smite.offer-divine-smite.no_slots
                    severity: error
              - condition:
                  fact: spellcasting.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.class-paladin-divine-smite.offer-divine-smite.no_spellcasting
                    severity: error
            rule:
              id: divine-smite
              group:
                - __planned__
                - spellcasting
              ui:
                model: smite
                section: bonus-action-other
                name: rule.class-paladin-divine-smite.divine-smite.name
              vars:
                slotLevel:
                  capture: true
                  default:
                    number: 1
                dieCount:
                  capture: true
                  default:
                    number: 2
              activities:
                # Consume bonus action
                - type: numberIncrement
                  target:
                    fact: bonusActions.remaining
                  source:
                    number: 1
                  subtract: true
                # Consume spellcasting resource
                - type: numberIncrement
                  target:
                    fact: spellcasting.remaining
                  source:
                    number: 1
                  subtract: true
                # Error tracking
                - *error-clear
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.class-paladin-divine-smite.offer-divine-smite.no_bonus_action
                  when:
                    fact: bonusActions.remaining
                    operator: lessThan
                    value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.class-paladin-divine-smite.offer-divine-smite.no_spellcasting
                  when:
                    fact: spellcasting.remaining
                    operator: lessThan
                    value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.class-paladin-divine-smite.offer-divine-smite.no_attack
                  when:
                    fact: attack.last.activation.action
                    operator: lessThan
                    value: 1
                # Bridge var to fact for conditional slot consumption
                - type: numberSet
                  target:
                    fact: smite.selectedLevel
                  source:
                    var: slotLevel
                # Consume L1 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level1.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    fact: smite.selectedLevel
                    operator: equals
                    value: 1
                # Consume L2 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level2.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    fact: smite.selectedLevel
                    operator: equals
                    value: 2
                # Consume L3 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level3.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    fact: smite.selectedLevel
                    operator: equals
                    value: 3
                # Consume L4 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level4.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    fact: smite.selectedLevel
                    operator: equals
                    value: 4
                # Consume L5 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level5.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    fact: smite.selectedLevel
                    operator: equals
                    value: 5
                # Track slot consumption errors
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.class-paladin-divine-smite.offer-divine-smite.no_slots
                  when:
                    fact: spellcasting.slots.level1.remaining
                    operator: lessThan
                    value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.class-paladin-divine-smite.offer-divine-smite.no_slots
                  when:
                    fact: spellcasting.slots.level2.remaining
                    operator: lessThan
                    value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.class-paladin-divine-smite.offer-divine-smite.no_slots
                  when:
                    fact: spellcasting.slots.level3.remaining
                    operator: lessThan
                    value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.class-paladin-divine-smite.offer-divine-smite.no_slots
                  when:
                    fact: spellcasting.slots.level4.remaining
                    operator: lessThan
                    value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.class-paladin-divine-smite.offer-divine-smite.no_slots
                  when:
                    fact: spellcasting.slots.level5.remaining
                    operator: lessThan
                    value: 0
                # Persist L1 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-smite-l1
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level1.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          fact: rest.long
                          operator: equals
                          value: 0
                  when:
                    fact: smite.selectedLevel
                    operator: equals
                    value: 1
                # Persist L2 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-smite-l2
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level2.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          fact: rest.long
                          operator: equals
                          value: 0
                  when:
                    fact: smite.selectedLevel
                    operator: equals
                    value: 2
                # Persist L3 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-smite-l3
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level3.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          fact: rest.long
                          operator: equals
                          value: 0
                  when:
                    fact: smite.selectedLevel
                    operator: equals
                    value: 3
                # Persist L4 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-smite-l4
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level4.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          fact: rest.long
                          operator: equals
                          value: 0
                  when:
                    fact: smite.selectedLevel
                    operator: equals
                    value: 4
                # Persist L5 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-smite-l5
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level5.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          fact: rest.long
                          operator: equals
                          value: 0
                  when:
                    fact: smite.selectedLevel
                    operator: equals
                    value: 5
