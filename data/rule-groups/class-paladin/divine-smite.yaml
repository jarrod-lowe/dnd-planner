# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: class-paladin-divine-smite
    requires:
      - class-paladin-level2
    translations:
      en:
        name: Divine Smite
        description: >-
          Paladin Level 2 bonus action. When you hit with a melee weapon or
          unarmed strike, expend a spell slot to deal radiant damage.
        keywords: [paladin, divine, smite, radiant, damage, bonus action]
      en-x-tlh:
        name: quv Qaw'
        description: >-
          DIch level 2 bonus action. DIch nuH DIch DIvI' DIvI' DIvI'.
        keywords: [paladin, quv, Qaw']
    rules:
      # Compute eligible smite slot count (levels 1-5)
      - id: compute-smite-eligible-slots
        phase: normal
        group:
          - smite-slots-computed
        activities:
          - type: numberSum
            target:
              fact: smite.eligibleSlotsRemaining
            sources:
              - fact: spellcasting.slots.level1.remaining
              - fact: spellcasting.slots.level2.remaining
              - fact: spellcasting.slots.level3.remaining
              - fact: spellcasting.slots.level4.remaining
              - fact: spellcasting.slots.level5.remaining

      # Compute lowest available slot level and corresponding die count
      # Cascade from high to low so the lowest available level overwrites
      - id: compute-smite-lowest-slot
        phase: normal
        group:
          - smite-slots-computed
        activities:
          - type: numberSet
            target:
              fact: smite.lowestAvailableSlotLevel
            source:
              number: 5
            when:
              - fact: spellcasting.slots.level5.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: smite.defaultDieCount
            source:
              number: 6
            when:
              - fact: spellcasting.slots.level5.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: smite.lowestAvailableSlotLevel
            source:
              number: 4
            when:
              - fact: spellcasting.slots.level4.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: smite.defaultDieCount
            source:
              number: 5
            when:
              - fact: spellcasting.slots.level4.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: smite.lowestAvailableSlotLevel
            source:
              number: 3
            when:
              - fact: spellcasting.slots.level3.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: smite.defaultDieCount
            source:
              number: 4
            when:
              - fact: spellcasting.slots.level3.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: smite.lowestAvailableSlotLevel
            source:
              number: 2
            when:
              - fact: spellcasting.slots.level2.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: smite.defaultDieCount
            source:
              number: 3
            when:
              - fact: spellcasting.slots.level2.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: smite.lowestAvailableSlotLevel
            source:
              number: 1
            when:
              - fact: spellcasting.slots.level1.remaining
                operator: greaterThan
                value: 0
          - type: numberSet
            target:
              fact: smite.defaultDieCount
            source:
              number: 2
            when:
              - fact: spellcasting.slots.level1.remaining
                operator: greaterThan
                value: 0

      # Offer Divine Smite (bonus action, gated on attack action taken)
      - id: offer-divine-smite
        after:
          - group: __planned__
          - group: spellcasting
          - group: smite-slots-computed
        activities:
          - type: offerRule
            legalWhen:
              - condition: &ds-has-bonus-action
                  fact: bonusActions.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.class-paladin-divine-smite.offer-divine-smite.no_bonus_action
                    severity: error
              - condition: &ds-has-attack-action
                  fact: attack.last.activation.action
                  operator: equals
                  value: 1
                illegalDiagnostics:
                  - code: rule.class-paladin-divine-smite.offer-divine-smite.no_attack
                    severity: error
              - condition: &ds-has-smite-slots
                  fact: smite.eligibleSlotsRemaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.class-paladin-divine-smite.offer-divine-smite.no_slots
                    severity: error
              - condition: &ds-has-spellcasting
                  fact: spellcasting.remaining
                  operator: greaterThan
                  value: 0
                illegalDiagnostics:
                  - code: rule.class-paladin-divine-smite.offer-divine-smite.no_spellcasting
                    severity: error
            rule:
              id: divine-smite
              group:
                - __planned__
                - spellcasting
              ui:
                section: bonus-action-other
                name: rule.class-paladin-divine-smite.divine-smite.name
                primaryControl:
                  type: slider
                  var: slotLevel
                  min: { number: 1 }
                  max: { number: 5 }
              vars:
                slotLevel:
                  capture: true
                  default:
                    fact: smite.lowestAvailableSlotLevel
                dieCount:
                  capture: true
                  default:
                    fact: smite.defaultDieCount
              activities:
                # Consume bonus action
                - type: numberIncrement
                  target:
                    fact: bonusActions.remaining
                  source:
                    number: 1
                  subtract: true
                # Consume spellcasting resource
                - type: numberIncrement
                  target:
                    fact: spellcasting.remaining
                  source:
                    number: 1
                  subtract: true
                # Error tracking
                - *error-clear
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.class-paladin-divine-smite.offer-divine-smite.no_bonus_action
                  when:
                    - fact: bonusActions.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.class-paladin-divine-smite.offer-divine-smite.no_spellcasting
                  when:
                    - fact: spellcasting.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.class-paladin-divine-smite.offer-divine-smite.no_attack
                  when:
                    - fact: attack.last.activation.action
                      operator: lessThan
                      value: 1
                # Bridge var to fact for conditional slot consumption
                - type: numberSet
                  target:
                    fact: smite.selectedLevel
                  source:
                    var: slotLevel
                # Consume L1 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level1.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: smite.selectedLevel
                      operator: equals
                      value: 1
                # Consume L2 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level2.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: smite.selectedLevel
                      operator: equals
                      value: 2
                # Consume L3 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level3.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: smite.selectedLevel
                      operator: equals
                      value: 3
                # Consume L4 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level4.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: smite.selectedLevel
                      operator: equals
                      value: 4
                # Consume L5 slot
                - type: numberIncrement
                  target:
                    fact: spellcasting.slots.level5.remaining
                  source:
                    number: 1
                  subtract: true
                  when:
                    - fact: smite.selectedLevel
                      operator: equals
                      value: 5
                # Track slot consumption errors
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.class-paladin-divine-smite.offer-divine-smite.no_slots
                  when:
                    - fact: spellcasting.slots.level1.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.class-paladin-divine-smite.offer-divine-smite.no_slots
                  when:
                    - fact: spellcasting.slots.level2.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.class-paladin-divine-smite.offer-divine-smite.no_slots
                  when:
                    - fact: spellcasting.slots.level3.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.class-paladin-divine-smite.offer-divine-smite.no_slots
                  when:
                    - fact: spellcasting.slots.level4.remaining
                      operator: lessThan
                      value: 0
                - type: setAdd
                  target:
                    var: errors
                  source:
                    string: rule.class-paladin-divine-smite.offer-divine-smite.no_slots
                  when:
                    - fact: spellcasting.slots.level5.remaining
                      operator: lessThan
                      value: 0
                # Persist L1 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-smite-l1
                    ui:
                      name: play.slotEffect.l1
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level1.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: smite.selectedLevel
                      operator: equals
                      value: 1
                # Persist L2 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-smite-l2
                    ui:
                      name: play.slotEffect.l2
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level2.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: smite.selectedLevel
                      operator: equals
                      value: 2
                # Persist L3 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-smite-l3
                    ui:
                      name: play.slotEffect.l3
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level3.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: smite.selectedLevel
                      operator: equals
                      value: 3
                # Persist L4 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-smite-l4
                    ui:
                      name: play.slotEffect.l4
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level4.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: smite.selectedLevel
                      operator: equals
                      value: 4
                # Persist L5 slot consumption across turns
                - type: advertiseEffect
                  rule:
                    id: effect-smite-l5
                    ui:
                      name: play.slotEffect.l5
                    phase: early
                    after:
                      - group: spellcasting-slots-set
                    group:
                      - spell-slot-effect
                    activities:
                      - type: numberIncrement
                        target:
                          fact: spellcasting.slots.level5.remaining
                        source:
                          number: 1
                        subtract: true
                      - type: advertiseEffect
                        self: true
                        when:
                          - fact: rest.long
                            operator: equals
                            value: 0
                  when:
                    - fact: smite.selectedLevel
                      operator: equals
                      value: 5

      # Annotate melee/unarmed attacks when Divine Smite is available
      - id: annotate-divine-smite
        after:
          - group: __planned__
          - group: spellcasting
          - group: smite-slots-computed
        activities:
          - type: annotate
            when:
              - *ds-has-bonus-action
              - *ds-has-attack-action
              - *ds-has-smite-slots
              - *ds-has-spellcasting
            key: rule.class-paladin-divine-smite.annotation
            targets: [attack.melee, attack.unarmed]
