# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: class-paladin-level1
    requires:
      - spellcasting
      - lay-on-hands
    translations:
      en:
        name: Paladin Level 1
        description: Paladin class features at level 1, including proficiency bonus and spellcasting
        keywords: [paladin, class, level1, spellcasting]
      en-x-tlh:
        name: Paladin Level 1
        description: Paladin Segh level 1, proficient chel
        keywords: [paladin, segh, level1]
    rules:
      # Hit Die - Level 1 Paladin gets 1d10
      - id: paladin-level1-hit-die
        phase: early
        group:
          - hit-die-base
        activities:
          - type: numberIncrement
            target:
              fact: hitDie.d10.total
            source:
              number: 1

      # HP - Level 1 Paladin contributes d10 max + CON modifier
      - id: paladin-level1-hp
        phase: normal
        after:
          - group: hp-total
        group:
          - hp-set
        activities:
          - type: numberIncrement
            target:
              fact: hp.max
            source:
              number: 10
          - type: numberIncrement
            target:
              fact: hp.max
            source:
              fact: con.modifier

      # Proficiency Bonus - Level 1 Paladin adds +2
      - id: paladin-level1-proficiency
        phase: early
        activities:
          - type: numberIncrement
            target:
              fact: proficiency.bonus
            source:
              number: 2

      # Spellcasting ability modifier (Charisma for Paladins)
      - id: paladin-level1-spellcasting-modifier
        phase: normal
        after:
          - group: __planned__
        group:
          - spellcasting-modifier-set
        activities:
          - type: numberIncrement
            target:
              fact: spellcasting.modifier
            source:
              fact: cha.modifier

      # Spell Slots - Level 1 Paladin gets 2 level 1 slots
      - id: paladin-level1-spell-slots
        phase: early
        group:
          - spellcasting-slots-set
        activities:
          - type: numberIncrement
            target:
              fact: spellcasting.slots.level1.total
            source:
              number: 2
          - type: numberIncrement
            target:
              fact: spellcasting.slots.level1.remaining
            source:
              number: 2

      # Lay on Hands Pool - Level 1 Paladin adds 5 points
      - id: paladin-level1-lay-on-hands-pool
        phase: early
        group:
          - loh-pool-set
        activities:
          - type: numberIncrement
            target:
              fact: layOnHands.pool.total
            source:
              number: 5
          - type: numberIncrement
            target:
              fact: layOnHands.pool.remaining
            source:
              number: 5

      # Armor Proficiencies - Paladin is proficient in all armor and shields
      - id: paladin-level1-armor-proficiencies
        phase: early
        activities:
          - type: numberSet
            target:
              fact: armor.light.proficient
            source:
              number: 1
          - type: numberSet
            target:
              fact: armor.medium.proficient
            source:
              number: 1
          - type: numberSet
            target:
              fact: armor.heavy.proficient
            source:
              number: 1
          - type: numberSet
            target:
              fact: armor.shield.proficient
            source:
              number: 1
