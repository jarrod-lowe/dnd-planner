ruleGroups:
  - id: class-paladin-level1
    requires:
      - spellcasting
      - class-paladin-lay-on-hands
      - paladin-spells-l1
    translations:
      en:
        name: Paladin Level 1
        description: Paladin class features at level 1, including proficiency bonus
          and spellcasting
        keywords:
          - paladin
          - class
          - level1
          - spellcasting
      en-x-tlh:
        name: Paladin Level 1
        description: Paladin Segh level 1, proficient chel
        keywords:
          - paladin
          - segh
          - level1
    settings:
      - id: paladin-skill-1
        type: select
        translations:
          en:
            name: Skill Proficiency
          en-x-tlh:
            name: Skill Proficiency
        options:
          - value: athletics
            translations:
              en:
                name: Athletics
              en-x-tlh:
                name: Athletics
          - value: insight
            translations:
              en:
                name: Insight
              en-x-tlh:
                name: Insight
          - value: intimidation
            translations:
              en:
                name: Intimidation
              en-x-tlh:
                name: Intimidation
          - value: medicine
            translations:
              en:
                name: Medicine
              en-x-tlh:
                name: Medicine
          - value: persuasion
            translations:
              en:
                name: Persuasion
              en-x-tlh:
                name: Persuasion
          - value: religion
            translations:
              en:
                name: Religion
              en-x-tlh:
                name: Religion
        effect:
          id: paladin-skill-proficiency-${value}
          key: skill-${value}-prof
          state:
            skill.${value}.proficiency: 1
          # Named for the strip's reveal toggle; hidden from the default view.
          display:
            name: rules.settings.paladin-skill.${value}
            hidden: true
          expiry:
            kind: permanent
      - id: paladin-skill-2
        type: select
