# yaml-language-server: $schema=../schema.json
ruleGroups:
  - id: class-paladin-oath-redemption-level5
    requires:
      - class-paladin-level5
      - class-paladin-oath-redemption-level4
      - spell-calm-emotions
      - spell-hold-person
    translations:
      en:
        name: Oath of Redemption Level 5
        description: >
          Paladin Oath of Redemption oath spells at level 5: Calm Emotions and
          Hold Person are always prepared and do not count against your prepared
          spells.
        keywords: [paladin, oath, redemption, level5, calm, emotions, hold, person]
      en-x-tlh:
        name: Oath of Redemption Level 5
        description: >
          Paladin Oath of Redemption level 5 oath spells: Calm Emotions, Hold
          Person reH mugh.
        keywords: [paladin, oath, redemption, level5, calm, emotions, hold, person]
    rules:
      # Calm Emotions is always prepared for Oath of Redemption from level 5.
      # This grant does NOT consume a prepared-spell slot
      # (spellcasting.prepared.count is untouched) and the alwaysPrepared flag
      # blocks the Unprepare offer in spells/calm-emotions.yaml.
      - id: oath-redemption-calm-emotions-always-prepared
        phase: early
        group:
          - always-prepared-set
        activities:
          - type: numberSet
            target:
              fact: spell.l2.calmEmotions.prepared
            source:
              number: 1
          - type: numberSet
            target:
              fact: spell.l2.calmEmotions.alwaysPrepared
            source:
              number: 1

      # Hold Person is always prepared for Oath of Redemption from level 5.
      # This grant does NOT consume a prepared-spell slot
      # (spellcasting.prepared.count is untouched) and the alwaysPrepared flag
      # blocks the Unprepare offer in spells/hold-person.yaml.
      - id: oath-redemption-hold-person-always-prepared
        phase: early
        group:
          - always-prepared-set
        activities:
          - type: numberSet
            target:
              fact: spell.l2.holdPerson.prepared
            source:
              number: 1
          - type: numberSet
            target:
              fact: spell.l2.holdPerson.alwaysPrepared
            source:
              number: 1
