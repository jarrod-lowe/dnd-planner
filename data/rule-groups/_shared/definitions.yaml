# Shared anchor definitions for rule-group YAML files.
# Prepended before parsing so anchors are available cross-file.

sharedRefs:
  error-clear: &error-clear
    type: setClear
    target:
      var: errors

  skill-proficiency-options: &skill-proficiency-options
    - value: 0.5
      label: play.topBar.proficientDotHalf
      ariaLabel: play.choices.skillProficiency.half
    - value: 1
      label: play.topBar.proficientDotFull
      ariaLabel: play.choices.skillProficiency.full
    - value: 2
      label: play.topBar.proficientDotDouble
      ariaLabel: play.choices.skillProficiency.double

  skill-proficiency-control: &skill-proficiency-control
    type: select
    var: level
    options: *skill-proficiency-options

  has-bonus-action: &has-bonus-action
    fact: bonusActions.remaining
    operator: greaterThan
    value: 0

  has-attack-action: &has-attack-action
    fact: attack.last.activation.action
    operator: equals
    value: 1

  has-spellcasting: &has-spellcasting
    fact: spellcasting.remaining
    operator: greaterThan
    value: 0

  has-weapon-attack: &has-weapon-attack
    fact: attack.last.weapon
    operator: equals
    value: 1

  # Gates every BUILD offer (STAT / PROFICIENCY / PREPARE / EQUIP) on the
  # build.locked fact. Add `*not-locked-legal` to an offer's legalWhen and
  # `*lock-error-track` to the offered rule's activities (after *error-clear)
  # so a locked build hides all BUILD options behind the eye. Set by build-lock.
  not-locked-legal: &not-locked-legal
    condition:
      fact: build.locked
      operator: equals
      value: 0
    illegalDiagnostics:
      - code: rule.dnd-5e-2024.build-lock.locked
        severity: error

  lock-error-track: &lock-error-track
    type: setAdd
    target:
      var: errors
    source:
      string: rule.dnd-5e-2024.build-lock.locked
    when:
      - fact: build.locked
        operator: notEquals
        value: 0
