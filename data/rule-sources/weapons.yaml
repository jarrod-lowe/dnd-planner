definitions:
  - id: dagger
    kind: option
    tags: [attack, weapon, melee]
    requires: [dagger, hands]
    hands: 1
    traits:
      weapon.light: true
      weapon.finesse: true
      weapon.throwable: true
      weapon.mastery: nick
    ui:
      name: rule.dnd-5e-2024.attacks.dagger.name
      disadvantageFact: attack.str.disadvantage
      annotationLabels: [attack.any, attack.melee, attack.weapon, dice.any]
      primaryControl:
        type: dice-line
        ranges: { var: ranges }
        advantage: { fact: attack.str.disadvantage }
        dice:
          - expression: d20
            bonus: { var: hitBonus }
          - expression: { var: damageDie }
            bonus: { var: damageBonus }
            damageType: { string: piercing }
    vars:
      ranges:
        default:
          array:
            - distance: 5
              type: melee
            - distance: 20
              type: thrown
            - distance: 60
              type: thrown
              disadvantage: true
      hitBonus:
        capture: true
        default:
          fact: attack.dagger.hitBonus
      damageDie:
        default:
          number: 4
      extraHands:
        default:
          number: 0
      damageBonus:
        capture: true
        default:
          fact: attack.dagger.damageBonus
    payload:
      phase: normal
      after:
        - group: __effects__
      group: [__planned__]
      activities: []
    translations:
      en:
        name: Dagger
        description: Dagger
        keywords: [dagger, weapon, attack]
      en-x-tlh:
        name: Dagger
        description: Dagger
        keywords: [dagger, nuH, jey']

  - id: greataxe
