profiles:
  - id: use-action
    match:
      tags: [attack]
    ui:
      section: action-attack
      intents: { ATTACK: weapons }
      actionCost: [action]
    gating:
      when:
        - fact: weapon.$(definition.id).equipped
          operator: equals
          value: 1
      legalWhen:
        - condition:
            fact: actions.remaining
            operator: greaterThan
            value: 0
          illegalDiagnostics:
            - code: rule.dnd-5e-2024.attacks.activation.no_action
              severity: error
    wrapper:
      group: [action]
      activitiesBefore:
        - type: numberIncrement
          target:
            fact: actions.remaining
          source:
            number: 1
          subtract: true
          id: action-cost
        - type: numberSet
          target:
            fact: attack.last.activation.action
          source:
            number: 1
          id: action-flag
        - type: numberSet
          target:
            fact: attack.last.weapon
          source:
            number: 1
          id: weapon-flag
        - type: setClear
          target:
            var: errors
          id: error-clear
        - type: setAdd
          target:
            var: errors
          source:
            string: rule.dnd-5e-2024.attacks.activation.no_action
          when:
            - fact: actions.remaining
              operator: lessThan
              value: 0
          id: error-check
        - type: numberSet
          target:
            fact: attack.$(definition.id).extraHandsNeeded
          source:
            var: extraHands
          id: extra-hands-fact
        - type: setAdd
          target:
            var: errors
          source:
            string: rule.dnd-5e-2024.attacks.versatile.no-free-hand
          when:
            - fact: attack.$(definition.id).extraHandsNeeded
              operator: greaterThan
              value: 0
            - fact: hands.remaining
              operator: lessThan
              value: 1
          id: extra-hands-check
    emit:
      mode: offerRule

  - id: use-reaction-weapon
    match:
      tags: [weapon]
    filterRanges: melee
    ui:
      section: reaction
      intents: { DEFEND: weapons }
      actionCost: [reaction]
      annotationLabels:
        - attack.any
        - attack.melee
        - attack.weapon
        - dice.any
        - attack.reaction
    gating:
      when:
        - fact: capability.attack.reaction.weapon
          operator: equals
          value: 1
        - fact: weapon.$(definition.id).equipped
          operator: equals
          value: 1
      legalWhen:
        - condition:
            fact: reactions.remaining
            operator: greaterThan
            value: 0
          illegalDiagnostics:
            - code: rule.dnd-5e-2024.attacks.activation.no_reaction
              severity: error
    wrapper:
      activitiesBefore:
        - type: numberIncrement
          target:
            fact: reactions.remaining
          source:
            number: 1
          subtract: true
          id: reaction-cost
        - type: numberSet
          target:
            fact: attack.last.activation.reaction
          source:
            number: 1
          id: reaction-flag
        - type: numberSet
          target:
            fact: attack.last.weapon
          source:
            number: 1
          id: weapon-flag
        - type: setClear
          target:
            var: errors
          id: error-clear
        - type: setAdd
          target:
            var: errors
          source:
            string: rule.dnd-5e-2024.attacks.activation.no_reaction
          when:
            - fact: reactions.remaining
              operator: lessThan
              value: 0
          id: error-check
        - type: numberSet
          target:
            fact: attack.$(definition.id).extraHandsNeeded
          source:
            var: extraHands
          id: extra-hands-fact
        - type: setAdd
          target:
            var: errors
          source:
            string: rule.dnd-5e-2024.attacks.versatile.no-free-hand
          when:
            - fact: attack.$(definition.id).extraHandsNeeded
              operator: greaterThan
              value: 0
            - fact: hands.remaining
              operator: lessThan
              value: 1
          id: extra-hands-check
    emit:
      mode: offerRule

  - id: use-bonus-followup-light
    match:
      tags: [weapon]
      traits:
        weapon.light: true
    ui:
      section: bonus-action
      intents: { ATTACK: weapons }
      actionCost: [bonus]
    gating:
      when:
        - fact: capability.attack.bonus.light
          operator: equals
          value: 1
        - fact: weapon.$(definition.id).equipped
          operator: equals
          value: 1
      legalWhen:
        - condition:
            fact: bonusActions.remaining
            operator: greaterThan
            value: 0
          illegalDiagnostics:
            - code: rule.dnd-5e-2024.attacks.activation.no_bonus_action
              severity: error
    wrapper:
      activitiesBefore:
        - type: numberIncrement
          target:
            fact: bonusActions.remaining
          source:
            number: 1
          subtract: true
          id: bonus-cost
        - type: numberSet
          target:
            fact: attack.last.activation.bonus
          source:
            number: 1
          id: bonus-flag
        - type: numberSet
          target:
            fact: attack.last.weapon
          source:
            number: 1
          id: weapon-flag
        - type: setClear
          target:
            var: errors
          id: error-clear
        - type: setAdd
          target:
            var: errors
          source:
            string: rule.dnd-5e-2024.attacks.activation.no_bonus_action
          when:
            - fact: bonusActions.remaining
              operator: lessThan
              value: 0
          id: error-check
        - type: numberSet
          target:
            fact: attack.$(definition.id).extraHandsNeeded
          source:
            var: extraHands
          id: extra-hands-fact
        - type: setAdd
          target:
            var: errors
          source:
            string: rule.dnd-5e-2024.attacks.versatile.no-free-hand
          when:
            - fact: attack.$(definition.id).extraHandsNeeded
              operator: greaterThan
              value: 0
            - fact: hands.remaining
              operator: lessThan
              value: 1
          id: extra-hands-check
    emit:
      mode: offerRule

  - id: don-offer
    match:
      tags: [weapon]
    ui:
      section: equip
      name: rule.dnd-5e-2024.weapon-don.don-$(definition.id).name
      intents: { EQUIP: weapons }
      actionCost: []
      primaryControl: null
      secondaryControl: null
      disadvantageFact: null
      annotationLabels: null
      followups: null
    gating:
      legalWhen:
        - condition:
            fact: weapon.$(definition.id).equipped
            operator: notEquals
            value: 1
          illegalDiagnostics:
            - code: rule.dnd-5e-2024.weapon-don.$(definition.id).already-equipped
              severity: error
        - condition:
            fact: hands.remaining
            operator: greaterThanOrEqual
            value: $(definition.hands)
          illegalDiagnostics:
            - code: rule.dnd-5e-2024.weapon-don.$(definition.id).no-hands
              severity: error
    wrapper:
      activitiesAfter:
        - type: numberSet
          target:
            fact: weapon.$(definition.id).equipped
          source:
            number: 1
        - type: numberIncrement
          target:
            fact: hands.remaining
          source:
            number: $(definition.hands)
          subtract: true
        - type: setAdd
          target: { var: errors }
          source: { string: rule.dnd-5e-2024.weapon-don.$(definition.id).no-hands }
          when:
            - fact: hands.remaining
              operator: lessThan
              value: 0
        - type: advertiseEffect
          rule:
            id: effect-$(definition.id)
            phase: normal
            group: [equipment-state]
            ui:
              name: rule.dnd-5e-2024.weapon-don.effect-$(definition.id).name
            activities:
              - type: numberSet
                target:
                  fact: weapon.$(definition.id).equipped
                source:
                  number: 1
              - type: numberIncrement
                target:
                  fact: hands.remaining
                source:
                  number: $(definition.hands)
                subtract: true
              - type: advertiseEffect
                self: true
    emit:
      mode: offerRule

expansions:
  - id: weapon-don-doff
    includeDefinitions:
      kind: option
      tags: [weapon]
    includeProfiles:
      - don-offer
    emit:
      ruleGroupIdPattern: 'generated-$(definition.id)-don-doff'
      ruleIdPattern: 'don-$(definition.id)'
      offerRuleIdPattern: 'don-$(definition.id)-offer'
      after:
        - group: equipment-state
      translations:
        en:
          name: '$(definition.translations.en.name)'
          description: 'Don $(definition.translations.en.name)'
          keywords:
            - '$(definition.id)'
            - don
            - equipment
        en-x-tlh:
          name: '$(definition.translations.en-x-tlh.name)'
          description: '$(definition.translations.en-x-tlh.name)'
          keywords:
            - '$(definition.id)'
            - don

  - id: attack-activations
    includeDefinitions:
      kind: option
      tags: [attack]
    includeProfiles:
      - use-action
      - use-reaction-weapon
      - use-bonus-followup-light
    emit:
      ruleGroupIdPattern: 'generated-$(definition.id)-activations'
      ruleIdPattern: '$(definition.id)-$(profile.id)'
      offerRuleIdPattern: '$(definition.id)-$(profile.id)-offer'
      after:
        - group: option-capabilities
        - group: equipment-state
      translations:
        en:
          name: '$(definition.translations.en.name)'
          description: '$(definition.translations.en.description)'
          keywords:
            - '$(definition.id)'
        en-x-tlh:
          name: '$(definition.translations.en-x-tlh.name)'
          description: '$(definition.translations.en-x-tlh.description)'
          keywords:
            - '$(definition.id)'
