definitions:
  - id: unarmed-strike
    kind: option
    tags: [attack, weapon]
    requires: [attacks]
    ui:
      name: rule.dnd-5e-2024.attacks.unarmed-strike.name
      disadvantageFact: attack.str.disadvantage
      annotationLabels: [attack.any, attack.melee, attack.unarmed]
      primaryControl:
        type: dice-line
        ranges: { var: ranges }
        advantage: { fact: attack.str.disadvantage }
        dice:
          - expression: d20
            bonus: { var: hitBonus }
          - expression: { var: damageDie }
            bonus: { var: damageBonus }
        annotationLabels: [attack.any, attack.melee, attack.unarmed]
    vars:
      ranges:
        default:
          array:
            - distance: 5
              type: melee
      hitBonus:
        capture: true
        default:
          fact: attack.unarmed.hitBonus
      damageDie:
        default:
          number: 0
      damageBonus:
        capture: true
        default:
          fact: attack.unarmed.damageBonus
    payload:
      phase: normal
      group: [__planned__]
      activities: []
    translations:
      en:
        name: Unarmed Strike
        description: Unarmed Strike
        keywords: [unarmed, strike, attack]
      en-x-tlh:
        name: DIvI' naQ
        description: DIvI' naQ
        keywords: [DIvI', naQ, jey']

  - id: dagger
