    tags: [attack, weapon, melee]
    requires: [greataxe, hands]
    hands: 2
    traits:
      weapon.heavy: true
      weapon.twoHanded: true
      weapon.mastery: cleave
    ui:
      name: rule.dnd-5e-2024.attacks.greataxe.name
      disadvantageFact: attack.str.disadvantage
      annotationLabels: [attack.any, attack.melee, attack.weapon, dice.any, property.twoHanded]
      followups:
        - type: attack-line
          condition:
            fact: attack.greataxe.mastery
            operator: equals
            value: 1
          button: rule.dnd-5e-2024.attacks.greataxe-cleave.button
      primaryControl:
        type: dice-line
        ranges: { var: ranges }
        advantage: { fact: attack.str.disadvantage }
        dice:
          - expression: d20
            bonus: { var: hitBonus }
          - expression: { var: damageDie }
            bonus: { var: damageBonus }
            damageType: { string: slashing }
      secondaryControl:
        type: dice-line
        enabled:
          condition:
            fact: attack.greataxe.mastery
            operator: equals
            value: 1
          button: rule.dnd-5e-2024.attacks.greataxe-cleave.button
        ranges: { var: ranges }
        dice:
          - expression: d20
            bonus: { var: hitBonus }
          - expression: { var: damageDie }
            bonus: { var: damageBonus }
            damageType: { string: slashing }
    vars:
      ranges:
        default:
          array:
            - distance: 5
              type: melee
      hitBonus:
        capture: true
        default:
          fact: attack.greataxe.hitBonus
      damageDie:
        default:
          number: 12
      extraHands:
        default:
          number: 0
      damageBonus:
        capture: true
        default:
          fact: attack.greataxe.damageBonus
    payload:
      phase: normal
      after:
        - group: __effects__
      group: [__planned__]
      activities: []
    translations:
      en:
        name: Greataxe
        description: Greataxe
        keywords: [greataxe, weapon, attack]
      en-x-tlh:
        name: nuH jen
        description: nuH jen
        keywords: [nuH, jen, jey']

