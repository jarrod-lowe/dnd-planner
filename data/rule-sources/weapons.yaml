        capture: true
        default:
          fact: attack.javelin.damageBonus
    payload:
      phase: normal
      group: [__planned__]
      activities: []
    translations:
      en:
        name: Javelin
        description: Javelin
        keywords: [javelin, weapon, attack]
      en-x-tlh:
        name: Javelin
        description: Javelin
        keywords: [javelin, nuH, jey']

  - id: scimitar
    kind: option
    tags: [attack, weapon, melee]
    requires: [scimitar]
    traits:
