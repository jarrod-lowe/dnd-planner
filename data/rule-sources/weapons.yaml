      disadvantageFact: attack.str.disadvantage
      annotationLabels: [attack.any, attack.melee, attack.weapon]
      primaryControl:
        type: dice-line
        ranges: { var: ranges }
        advantage: { fact: attack.str.disadvantage }
        dice:
          - expression: d20
            bonus: { var: hitBonus }
          - expression: { var: damageDie }
            bonus: { var: damageBonus }
        annotationLabels: [attack.any, attack.melee, attack.weapon]
    vars:
      ranges:
        default:
          array:
            - distance: 5
              type: melee
            - distance: 20
              type: thrown
            - distance: 60
              type: thrown
              disadvantage: true
      hitBonus:
        capture: true
        default:
          fact: attack.dagger.hitBonus
      damageDie:
        default:
          number: 4
      damageBonus:
        capture: true
        default:
          fact: attack.dagger.damageBonus
    payload:
      phase: normal
      group: [__planned__]
      activities: []
    translations:
      en:
        name: Dagger
        description: Dagger
        keywords: [dagger, weapon, attack]
      en-x-tlh:
        name: Dagger
        description: Dagger
        keywords: [dagger, nuH, jey']

  - id: greataxe
    kind: option
    tags: [attack, weapon, melee]
    requires: [greataxe]
    traits:
      weapon.heavy: true
      weapon.twoHanded: true
      weapon.mastery: cleave
    ui:
      name: rule.dnd-5e-2024.attacks.greataxe.name
      disadvantageFact: attack.str.disadvantage
      annotationLabels: [attack.any, attack.melee, attack.weapon]
      followups:
        - type: attack-line
          condition:
            fact: attack.greataxe.mastery
            operator: equals
            value: 1
          button: rule.dnd-5e-2024.attacks.greataxe-cleave.button
      primaryControl:
        type: dice-line
        ranges: { var: ranges }
        advantage: { fact: attack.str.disadvantage }
        dice:
          - expression: d20
            bonus: { var: hitBonus }
          - expression: { var: damageDie }
            bonus: { var: damageBonus }
        annotationLabels: [attack.any, attack.melee, attack.weapon]
      secondaryControl:
        type: dice-line
        enabled:
          condition:
            fact: attack.greataxe.mastery
            operator: equals
            value: 1
          button: rule.dnd-5e-2024.attacks.greataxe-cleave.button
        ranges: { var: ranges }
        dice:
          - expression: d20
            bonus: { var: hitBonus }
          - expression: { var: damageDie }
            bonus: { var: damageBonus }
    vars:
      ranges:
        default:
          array:
            - distance: 5
              type: melee
      hitBonus:
        capture: true
        default:
          fact: attack.greataxe.hitBonus
      damageDie:
        default:
          number: 12
      damageBonus:
        capture: true
        default:
          fact: attack.greataxe.damageBonus
    payload:
      phase: normal
      group: [__planned__]
      activities: []
    translations:
      en:
        name: Greataxe
        description: Greataxe
        keywords: [greataxe, weapon, attack]
      en-x-tlh:
        name: nuH jen
        description: nuH jen
        keywords: [nuH, jen, jey']

