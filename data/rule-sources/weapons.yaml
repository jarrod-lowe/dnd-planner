profiles:
  - id: use-action
    match:
      tags: [attack]
    ui:
      section: action-attack
    gating:
      legalWhen:
        - condition:
            fact: actions.remaining
            operator: greaterThan
            value: 0
          illegalDiagnostics:
            - code: rule.dnd-5e-2024.attacks.activation.no_action
              severity: error
    wrapper:
      group: [action]
      activitiesBefore:
        - type: numberIncrement
          target:
            fact: actions.remaining
          source:
            number: 1
          subtract: true
          id: action-cost
        - type: numberSet
          target:
            fact: attack.last.activation.action
          source:
            number: 1
          id: action-flag
        - type: setClear
          target:
            var: errors
          id: error-clear
        - type: setAdd
          target:
            var: errors
          source:
            string: rule.dnd-5e-2024.attacks.activation.no_action
          when:
            - fact: actions.remaining
              operator: lessThan
              value: 0
          id: error-check
    emit:
      mode: offerRule

  - id: use-reaction-weapon
    match:
      tags: [weapon]
    filterRanges: melee
    ui:
      section: reaction
    gating:
      when:
        - fact: capability.attack.reaction.weapon
          operator: equals
          value: 1
      legalWhen:
        - condition:
            fact: reactions.remaining
            operator: greaterThan
            value: 0
          illegalDiagnostics:
            - code: rule.dnd-5e-2024.attacks.activation.no_reaction
              severity: error
    wrapper:
      activitiesBefore:
        - type: numberIncrement
          target:
            fact: reactions.remaining
          source:
            number: 1
          subtract: true
          id: reaction-cost
        - type: numberSet
          target:
            fact: attack.last.activation.reaction
          source:
            number: 1
          id: reaction-flag
        - type: setClear
          target:
            var: errors
          id: error-clear
        - type: setAdd
          target:
            var: errors
          source:
            string: rule.dnd-5e-2024.attacks.activation.no_reaction
          when:
            - fact: reactions.remaining
              operator: lessThan
              value: 0
          id: error-check
    emit:
      mode: offerRule

  - id: use-bonus-followup-light
    match:
      tags: [weapon]
      traits:
        weapon.light: true
    ui:
      section: bonus-action
    gating:
      when:
        - fact: capability.attack.bonus.light
          operator: equals
          value: 1
      legalWhen:
        - condition:
            fact: bonusActions.remaining
            operator: greaterThan
            value: 0
          illegalDiagnostics:
            - code: rule.dnd-5e-2024.attacks.activation.no_bonus_action
              severity: error
    wrapper:
      activitiesBefore:
        - type: numberIncrement
          target:
            fact: bonusActions.remaining
          source:
            number: 1
          subtract: true
          id: bonus-cost
        - type: numberSet
          target:
            fact: attack.last.activation.bonus
          source:
            number: 1
          id: bonus-flag
        - type: setClear
          target:
            var: errors
          id: error-clear
        - type: setAdd
          target:
            var: errors
          source:
            string: rule.dnd-5e-2024.attacks.activation.no_bonus_action
          when:
            - fact: bonusActions.remaining
              operator: lessThan
              value: 0
          id: error-check
    emit:
      mode: offerRule

expansions:
  - id: attack-activations
    includeDefinitions:
      kind: option
      tags: [attack]
    includeProfiles:
      - use-action
      - use-reaction-weapon
      - use-bonus-followup-light
    emit:
      ruleGroupIdPattern: 'generated-$(definition.id)-activations'
      ruleIdPattern: '$(definition.id)-$(profile.id)'
      offerRuleIdPattern: '$(definition.id)-$(profile.id)-offer'
      after:
        - group: option-capabilities
      translations:
        en:
          name: '$(definition.translations.en.name)'
          description: '$(definition.translations.en.description)'
          keywords:
            - '$(definition.id)'
        en-x-tlh:
          name: '$(definition.translations.en-x-tlh.name)'
          description: '$(definition.translations.en-x-tlh.description)'
          keywords:
            - '$(definition.id)'
